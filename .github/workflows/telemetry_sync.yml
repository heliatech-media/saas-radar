name: Helia 24/7 Cloud Telemetry Synchronizer

on:
  schedule:
    # Runs every 30 minutes 24/7 in GitHub Cloud (0 human or PC needed)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

concurrency:
  group: telemetry-sync
  cancel-in-progress: true

jobs:
  sync-cloudflare-telemetry:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Telemetry Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml python-dotenv

      - name: Fetch Live Cloudflare Analytics
        id: telemetry_check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          python scripts/sync_telemetry_cloud.py
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -eq 0 ]; then
            echo "should_commit=true" >> $GITHUB_OUTPUT
          else
            echo "should_commit=false" >> $GITHUB_OUTPUT
          fi
          exit 0

      - name: Commit & Push Live Telemetry to Edge
        if: steps.telemetry_check.outputs.should_commit == 'true'
        run: |
          git config --global user.name "Helia [Sentinel Telemetry]"
          git config --global user.email "sentinel@heliatech.online"
          git add site/src/data/live_cloudflare_telemetry.json site/public/data/live_cloudflare_telemetry.json
          
          if ! git diff-index --quiet HEAD --; then
            VISITORS=$(python -c "import json; print(json.load(open('site/public/data/live_cloudflare_telemetry.json'))['total_visitors_network'])")
            git commit -m "chore(telemetry): auto-sync Cloudflare visitors ($VISITORS) [cloud-cron]"
            git pull --rebase origin main || true
            git push origin main
            echo "✓ Telemetry pushed to main. Cloudflare Pages deploy triggered."
          else
            echo "No file changes detected."
          fi
