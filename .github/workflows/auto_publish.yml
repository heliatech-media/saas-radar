name: Daily Autonomous SaaS Review Publisher

on:
  schedule:
    # Runs everyday at 05:00 UTC (100% autonomous, 0 human intervention)
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-agents-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Agent Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pydantic python-dotenv pyyaml tenacity

      - name: Run Autonomous Multi-Agent Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.5-flash-lite'
          PARTNERSTACK_API_KEY: ${{ secrets.PARTNERSTACK_API_KEY }}
        run: |
          # Runs discovery radar, auto-syncs PartnerStack links, and generates 2 fresh in-depth reviews daily
          python agents/orchestrator.py --discover 2

      - name: Commit & Push New Reviews to GitHub
        run: |
          git config --global user.name "Helia [Autonomous Ops Director]"
          git config --global user.email "helia@heliatech.online"
          git add site/src/content/reviews/ site/src/data/tools-index.json agents/config.py
          
          # Only commit if there are changes
          if ! git diff-index --quiet HEAD --; then
            git commit -m "feat(content): automated daily reviews via Director Helia [skip ci]"
            git push origin main
          else
            echo "No new reviews were generated today."
          fi
