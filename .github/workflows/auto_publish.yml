name: Helia Autonomous Daily Growth Engine

on:
  schedule:
    # Runs everyday at 05:00 UTC (100% autonomous, 0 human intervention)
    - cron: '0 5 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  run-helia-autonomous-fleet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Site Dependencies
        run: |
          cd site
          npm ci || npm install

      - name: Install Python Agent Fleet Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pydantic python-dotenv pyyaml tenacity requests

      - name: Execute Helia Autonomous Growth Cycle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-3.5-flash-lite'
          PARTNERSTACK_API_KEY: ${{ secrets.PARTNERSTACK_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: |
          # Helia runs Cybersecurity check, Auto-repair, Market Discovery, Teardowns & Masterclass production
          python agents/helia_autonomous_director.py --run-once --no-push

      - name: Commit & Push Autonomous Growth to GitHub
        run: |
          git config --global user.name "Helia [Autonomous COO]"
          git config --global user.email "helia@heliatech.online"
          git add .
          
          if ! git diff-index --quiet HEAD --; then
            git commit -m "feat(auto-growth): Helia autonomous daily expansion & masterclass publishing"
            git push origin main
          else
            echo "No new updates generated in this cycle."
          fi
