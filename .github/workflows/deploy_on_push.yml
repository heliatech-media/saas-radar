name: Deploy Site to Cloudflare Edge on Push

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'functions/**'
      - 'scripts/build.js'
      - 'wrangler.toml'
  workflow_dispatch:

concurrency:
  group: helia-deploy-on-push
  cancel-in-progress: true

jobs:
  deploy-edge:
    if: "!contains(github.event.head_commit.message, '[cloud-cron]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          cd site
          npm ci || npm install

      - name: Build & Deploy to Cloudflare Edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/build.js
          npx wrangler deploy
