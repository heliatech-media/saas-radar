name: Cloudflare D1 Remote Seed & Verification

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed-remote-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply Schema to Cloudflare D1 Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Applying governance schema to remote D1..."
          npx wrangler d1 execute heliatech-sentinel-governance --file=data/schema_sentinel_governance.sql --remote --yes

      - name: Inject 217 Seed Records to Cloudflare D1 Production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Seeding 168 contents, 32 duels, 12 deals to remote D1..."
          npx wrangler d1 execute heliatech-sentinel-governance --file=data/seed_production_d1.sql --remote --yes

      - name: Query Production D1 Verification Counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "========================================================"
          echo "RAW PRODUCTION D1 VERIFICATION RESULTS"
          echo "========================================================"
          npx wrangler d1 execute heliatech-sentinel-governance --command="SELECT 'content_inventory' AS table_name, COUNT(*) AS total_count FROM content_inventory UNION ALL SELECT 'versus_matrix' AS table_name, COUNT(*) AS total_count FROM versus_matrix UNION ALL SELECT 'deals_registry' AS table_name, COUNT(*) AS total_count FROM deals_registry;" --remote --yes
          echo "========================================================"
