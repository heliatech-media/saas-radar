name: Cloudflare D1 Remote Seed & Verification

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed-remote-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Cloudflare Token & Database Connectivity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== 1. TOKEN VERIFICATION ==="
          curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
               -H "Content-Type: application/json" | jq .

          echo "=== 2. D1 DATABASE LIST ==="
          curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
               -H "Content-Type: application/json" | jq .

      - name: Execute Seed via Wrangler or Direct API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Executing D1 commands..."
          npx wrangler d1 execute heliatech-sentinel-governance --file=data/seed_production_d1.sql --remote --yes || true

      - name: Query Production D1 Verification Counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== PRODUCTION D1 COUNT VERIFICATION ==="
          npx wrangler d1 execute heliatech-sentinel-governance --command="SELECT 'content_inventory' AS table_name, COUNT(*) AS total_count FROM content_inventory UNION ALL SELECT 'versus_matrix' AS table_name, COUNT(*) AS total_count FROM versus_matrix UNION ALL SELECT 'deals_registry' AS table_name, COUNT(*) AS total_count FROM deals_registry;" --remote --yes || true
