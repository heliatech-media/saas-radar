# Cloudflare Pages & D1 Configuration
# ============================================================================
# Connects Cloudflare Pages Functions to the Cloudflare D1 persistent database.
# In production, context.env.DB is bound to this database.

name = "heliatech-sentinel"
compatibility_date = "2026-11-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "heliatech-sentinel-governance"
database_id = "d1-heliatech-sentinel-prod-2026"
