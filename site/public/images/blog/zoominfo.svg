<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%#090d16" stop-color="#050811"/>
      <stop offset="50%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fuchsiaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>

    <!-- Line & Accent Gradients -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="violetFuchsiaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="cardHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Geometric Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03"/>
    </pattern>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#dotGrid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="300" fill="url(#cyanGlow)" filter="url(#softGlow)" />
  <circle cx="950" cy="450" r="350" fill="url(#violetGlow)" filter="url(#softGlow)" />
  <circle cx="700" cy="100" r="250" fill="url(#fuchsiaGlow)" filter="url(#softGlow)" />

  <!-- Background Decorative Vector Waves / Circuit Lines -->
  <g opacity="0.4" filter="url(#glow)">
    <path d="M-100 500 Q 300 400, 600 520 T 1300 450" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="2"/>
    <path d="M-100 150 Q 400 300, 700 180 T 1300 250" fill="none" stroke="url(#violetFuchsiaGrad)" stroke-width="1.5" stroke-dasharray="6 6"/>
  </g>

  <!-- ========================================== -->
  <!-- LEFT COLUMN: Typography & Investigation ID -->
  <!-- ========================================== -->
  <g transform="translate(80, 80)">
    <!-- Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="276" height="32" rx="16" fill="#0f172a" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="18" cy="16" r="4" fill="#06b6d4" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">HELIATECH DOSSIER</text>
    </g>

    <!-- Main Title Block -->
    <g transform="translate(0, 75)">
      <!-- Tool & Category -->
      <text x="0" y="0" fill="#8b5cf6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="3">ZOOMINFO • B2B SALES &amp; CRM INTELLIGENCE</text>
      
      <!-- Headline -->
      <text x="0" y="48" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
        <tspan x="0" dy="0">Enterprise 2026 Rate Card Leak:</tspan>
        <tspan x="0" dy="42" fill="url(#cyanBlueGrad)">The Hidden $15,000 Minimums</tspan>
        <tspan x="0" dy="42" fill="#f1f5f9">&amp; Credit Expiration Traps</tspan>
      </text>

      <!-- Subtitle/Context -->
      <text x="0" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" line-height="1.5">
        <tspan x="0" dy="0">Reverse-engineering opaque enterprise pricing tiers, data lock-in</tspan>
        <tspan x="0" dy="22">mechanisms, and undisclosed API credit burn rates.</tspan>
      </text>
    </g>

    <!-- Brand Footer / Metadata -->
    <g transform="translate(0, 390)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#334155" stroke-width="1"/>
      <text x="0" y="25" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">AUDIT REF: HT-ZI-2026-X</text>
      <text x="250" y="25" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">STATUS: VERIFIED LEAK</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT COLUMN: 3D Vector Intelligence Metaphor -->
  <!-- ========================================== -->
  <g transform="translate(630, 75)" filter="url(#cardShadow)">
    
    <!-- Holographic Container Card (Database / CRM Cube Metaphor) -->
    <rect x="0" y="0" width="490" height="480" rx="20" fill="url(#glassGrad)" stroke="#334155" stroke-width="1.5" backdrop-filter="blur(20px)"/>
    
    <!-- Card Header Glow Accent -->
    <path d="M 20 1 Q 245 25, 470 1" fill="none" stroke="url(#cardHeaderGrad)" stroke-width="3" filter="url(#glow)"/>

    <!-- CRM Intelligence Grid & Database Cube Elements -->
    <g transform="translate(45, 45)">
      
      <!-- Top Section: Metric pill indicators -->
      <rect x="0" y="0" width="125" height="36" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-opacity="0.4" />
      <text x="14" y="23" fill="#06b6d4" font-family="monospace" font-size="12" font-weight="bold">MIN: $15K</text>

      <rect x="135" y="0" width="135" height="36" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.4" />
      <text x="149" y="23" fill="#8b5cf6" font-family="monospace" font-size="12" font-weight="bold">LOCK: 12-MO</text>

      <rect x="280" y="0" width="120" height="36" rx="8" fill="#0f172a" stroke="#d946ef" stroke-opacity="0.4" />
      <text x="294" y="23" fill="#d946ef" font-family="monospace" font-size="12" font-weight="bold">BURN: HIGH</text>

      <!-- Multi-Dimensional Data Graph / Credit Expiration Trap Visualization -->
      <g transform="translate(0, 70)">
        <!-- Background Chart Box -->
        <rect x="0" y="0" width="400" height="180" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
        
        <!-- Grid lines inside chart -->
        <line x1="40" y1="30" x2="370" y2="30" stroke="#1e293b" stroke-dasharray="4 4"/>
        <line x1="40" y1="80" x2="370" y2="80" stroke="#1e293b" stroke-dasharray="4 4"/>
        <line x1="40" y1="130" x2="370" y2="130" stroke="#1e293b" stroke-dasharray="4 4"/>

        <!-- Y-Axis labels -->
        <text x="25" y="34" fill="#64748b" font-family="monospace" font-size="10" text-anchor="end">100k</text>
        <text x="25" y="84" fill="#64748b" font-family="monospace" font-size="10" text-anchor="end">50k</text>
        <text x="25" y="134" fill="#64748b" font-family="monospace" font-size="10" text-anchor="end">0k</text>

        <!-- Credit Depletion Curve (The "Trap") -->
        <path d="M 50 40 Q 150 50, 220 120 T 360 135" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="3" filter="url(#glow)"/>
        <!-- Area fill under curve -->
        <path d="M 50 40 Q 150 50, 220 120 T 360 135 L 360 150 L 50 150 Z" fill="#06b6d4" fill-opacity="0.08"/>

        <!-- Cliff / Expiration Drop Indicator Line -->
        <line x1="220" y1="20" x2="220" y2="150" stroke="#d946ef" stroke-width="1.5" stroke-dasharray="3 3"/>
        <rect x="185" y="15" width="70" height="20" rx="4" fill="#d946ef" fill-opacity="0.2"/>
        <text x="220" y="29" fill="#d946ef" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">CLIFF DROP</text>

        <!-- Data Nodes on Graph -->
        <circle cx="50" cy="40" r="4" fill="#38bdf8"/>
        <circle cx="220" cy="120" r="5" fill="#d946ef" filter="url(#glow)"/>
        <circle cx="360" cy="135" r="4" fill="#8b5cf6"/>
      </g>

      <!-- Bottom Enriched Contact / CRM Node Matrix -->
      <g transform="translate(0, 270)">
        <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">ENRICHED DATA PIPELINE METRICS</text>

        <!-- Node Item 1 -->
        <g transform="translate(0, 15)">
          <rect x="0" y="0" width="190" height="50" rx="8" fill="#090d16" stroke="#1e293b"/>
          <circle cx="20" cy="25" r="8" fill="#06b6d4" fill-opacity="0.2"/>
          <circle cx="20" cy="25" r="3" fill="#06b6d4"/>
          <text x="38" y="22" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Contact Database</text>
          <text x="38" y="38" fill="#06b6d4" font-family="monospace" font-size="11">Tier-1 Access Lock</text>
        </g>

        <!-- Node Item 2 -->
        <g transform="translate(210, 15)">
          <rect x="0" y="0" width="190" height="50" rx="8" fill="#090d16" stroke="#1e293b"/>
          <circle cx="20" cy="25" r="8" fill="#d946ef" fill-opacity="0.2"/>
          <circle cx="20" cy="25" r="3" fill="#d946ef"/>
          <text x="38" y="22" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Intent Data API</text>
          <text x="38" y="38" fill="#d946ef" font-family="monospace" font-size="11">+35% Overcharge</text>
        </g>
      </g>

    </g>

    <!-- Corner Decorative Accents -->
    <path d="M 0 15 L 0 5 L 10 5" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <path d="M 490 15 L 490 5 L 480 5" fill="none" stroke="#06b6d4" stroke-width="2"/>
    <path d="M 0 465 L 0 475 L 10 475" fill="none" stroke="#d946ef" stroke-width="2"/>
    <path d="M 490 465 L 490 475 L 480 475" fill="none" stroke="#d946ef" stroke-width="2"/>

  </g>

</svg>