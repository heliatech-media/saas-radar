<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="fuchsia-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="glass-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>

    <!-- Hexagon Pattern Overlay -->
    <pattern id="hex-pattern" width="60" height="104" patternUnits="userSpaceOnUse">
      <path d="M30 0 L60 17.32 L60 51.96 L30 69.28 L0 51.96 L0 17.32 Z" fill="none" stroke="#8b5cf6" stroke-width="0.5" stroke-opacity="0.05" />
      <path d="M30 52 L60 69.32 L60 103.96 L30 121.28 L0 103.96 L0 69.32 Z" fill="none" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />
  <rect width="1200" height="630" fill="url(#cyber-grid)" />
  <rect width="1200" height="630" fill="url(#hex-pattern)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="200" r="250" fill="#06b6d4" opacity="0.12" filter="url(#glow-heavy)" />
  <circle cx="850" cy="450" r="200" fill="#8b5cf6" opacity="0.1" filter="url(#glow-heavy)" />
  <circle cx="200" cy="500" r="220" fill="#d946ef" opacity="0.07" filter="url(#glow-heavy)" />

  <!-- ==================== 3D VECTOR ILLUSTRATION (RIGHT SIDE) ==================== -->
  <g transform="translate(680, 80)">
    <!-- Holographic Platform / Timeline Base -->
    <g transform="translate(0, 360)">
      <ellipse cx="220" cy="40" rx="200" ry="60" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.3" filter="url(#glow-subtle)" />
      <ellipse cx="220" cy="40" rx="160" ry="45" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.2" />
      <ellipse cx="220" cy="40" rx="100" ry="25" fill="url(#cyan-violet)" opacity="0.1" />
    </g>

    <!-- Synthetic Neural Audio/Video Waveform Rings (3D Perspective) -->
    <g transform="translate(220, 260)">
      <!-- Ring 1 -->
      <path d="M -180,0 C -180,60 -90,90 0,90 C 90,90 180,60 180,0 C 180,-60 90,-90 0,-90 C -90,-90 -180,-60 -180,0 Z" 
            fill="none" stroke="url(#cyan-violet)" stroke-width="2" opacity="0.5" filter="url(#glow-subtle)" />
      
      <!-- Ring 2 (Rotated/Scaled) -->
      <path d="M -220,20 C -220,90 -110,120 0,120 C 110,120 220,90 220,20 C 220,-20 110,-50 0,-50 C -110,-50 -220,-20 -220,20 Z" 
            fill="none" stroke="#d946ef" stroke-width="1.5" opacity="0.4" stroke-dasharray="6 4" />

      <!-- Ring 3 (Inner Core) -->
      <path d="M -120,-30 C -120,20 -60,40 0,40 C 60,40 120,20 120,-30 C 120,-80 60,-100 0,-100 C -60,-100 -120,-80 -120,-30 Z" 
            fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.7" filter="url(#glow-heavy)" />
    </g>

    <!-- Central Holographic Node Matrix / Avatar Face Wireframe Metaphor -->
    <g transform="translate(220, 220)">
      <!-- Outer Hexagon Frame -->
      <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55" fill="url(#glass-panel)" stroke="url(#cyan-violet)" stroke-width="2" filter="url(#glow-subtle)" />
      
      <!-- Inner Geometric Facial / Avatar Blueprint Nodes -->
      <g stroke="#38bdf8" stroke-width="1.5" opacity="0.8">
        <line x1="0" y1="-70" x2="0" y2="70" stroke-dasharray="4 4" />
        <line x1="-60" y1="-20" x2="60" y2="-20" stroke-dasharray="4 4" />
        <line x1="-40" y1="30" x2="40" y2="30" />
        
        <!-- Nodes -->
        <circle cx="0" cy="-40" r="6" fill="#06b6d4" filter="url(#glow-heavy)" />
        <circle cx="-35" cy="-20" r="4" fill="#8b5cf6" />
        <circle cx="35" cy="-20" r="4" fill="#8b5cf6" />
        <circle cx="0" cy="10" r="8" fill="#d946ef" filter="url(#glow-heavy)" />
        <circle cx="-25" cy="45" r="4" fill="#06b6d4" />
        <circle cx="25" cy="45" r="4" fill="#06b6d4" />

        <!-- Connecting Vector Lines -->
        <polyline points="-35,-20 0,-40 35,-20 0,10 -25,45 0,70 25,45 0,10" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
      </g>

      <!-- Floating Data Particles -->
      <circle cx="-70" cy="-70" r="3" fill="#38bdf8" filter="url(#glow-subtle)" />
      <circle cx="80" cy="-60" r="2" fill="#d946ef" />
      <circle cx="-85" cy="40" r="2.5" fill="#06b6d4" />
      <circle cx="75" cy="60" r="3" fill="#8b5cf6" filter="url(#glow-subtle)" />
    </g>

    <!-- Floating UI Data Panels (Enterprise Scaling Metric Widgets) -->
    <!-- Panel 1: Hyper-Realistic Stream -->
    <g transform="translate(10, 60)" filter="url(#glow-subtle)">
      <rect width="160" height="64" rx="8" fill="url(#glass-panel)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6" />
      <path d="M 12 24 L 35 24 L 45 16 L 55 36 L 65 24 L 85 24" fill="none" stroke="#38bdf8" stroke-width="2" />
      <text x="16" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1">SYNTHETIC STREAM</text>
      <text x="16" y="16" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ACTIVE 4K 60FPS</text>
    </g>

    <!-- Panel 2: Enterprise Scale Indicator -->
    <g transform="translate(270, 320)" filter="url(#glow-subtle)">
      <rect width="170" height="64" rx="8" fill="url(#glass-panel)" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="24" cy="32" r="12" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="24" y="36" text-anchor="middle" fill="#d946ef" font-family="system-ui, sans-serif" font-size="10" font-weight="800">AI</text>
      <text x="48" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SCALE: 99.8%</text>
      <text x="48" y="46" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">AVATAR FIDELITY</text>
    </g>

    <!-- Connecting Energy Vectors -->
    <path d="M 90,124 L 140,160" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
    <path d="M 320,320 L 280,290" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
  </g>

  <!-- ==================== TYPOGRAPHY & BRANDING (LEFT SIDE) ==================== -->
  <g transform="translate(80, 90)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="310" height="32" rx="16" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5" filter="url(#glow-subtle)" />
      <circle cx="18" cy="16" r="4" fill="#06b6d4" filter="url(#glow-heavy)" />
      <text x="36" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Tool Title: HEYGEN -->
    <g transform="translate(0, 85)">
      <text x="0" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-size="76" font-weight="900" letter-spacing="4" filter="url(#glow-subtle)">HEYGEN</text>
      <!-- Decorative Accent Underline -->
      <path d="M 0,15 L 340,15" fill="none" stroke="url(#cyan-violet)" stroke-width="4" stroke-linecap="round" />
      <circle cx="355" cy="15" r="3" fill="#d946ef" filter="url(#glow-heavy)" />
    </g>

    <!-- Category Subtitle -->
    <g transform="translate(0, 135)">
      <text x="0" y="0" fill="#d946ef" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3">AI VIDEO &amp; CONTENT CREATION</text>
    </g>

    <!-- Investigation Headline -->
    <g transform="translate(0, 185)">
      <text x="0" y="0" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5" line-height="1.2">
        <tspan x="0" dy="0">The Evolution of Synthetic Video</tspan>
        <tspan x="0" dy="36">Creation and the Enterprise Blueprint</tspan>
        <tspan x="0" dy="36">for Hyper-Realistic Scaling in 2026</tspan>
      </text>
    </g>

    <!-- Architectural Metadata / Footer Stats inside Left Column -->
    <g transform="translate(0, 350)">
      <!-- Divider Line -->
      <line x1="0" y1="0" x2="520" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
      
      <!-- Meta Item 1 -->
      <g transform="translate(0, 20)">
        <text x="0" y="0" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">CORE ENGINE</text>
        <text x="0" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Neural Avatar V4.2</text>
      </g>

      <!-- Meta Item 2 -->
      <g transform="translate(180, 20)">
        <text x="0" y="0" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">DEPLOYMENT</text>
        <text x="0" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Global Enterprise Cloud</text>
      </g>

      <!-- Meta Item 3 -->
      <g transform="translate(380, 20)">
        <text x="0" y="0" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">SECURITY</text>
        <text x="0" y="18" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">SOC2 Type II Certified</text>
      </g>
    </g>
  </g>

  <!-- Frame Border / Cyber Aesthetic Accents -->
  <rect x="20" y="20" width="1160" height="590" rx="12" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" />
  <circle cx="20" cy="20" r="3" fill="#06b6d4" />
  <circle cx="1180" cy="20" r="3" fill="#06b6d4" />
  <circle cx="20" cy="610" r="3" fill="#8b5cf6" />
  <circle cx="1180" cy="610" r="3" fill="#8b5cf6" />
</svg>