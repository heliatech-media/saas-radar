<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#030712; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <!-- DEFINITIONS -->
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow1" cx="20%" cy="20%" r="60%" fx="20%" fy="20%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgGlow2" cx="85% end" cy="80%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="fuchsiaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5"/>
      <circle cx="40" cy="40" r="1" fill="#334155" fill-opacity="0.8"/>
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="630" fill="#030712"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#bgGlow1)"/>
  <rect width="1200" height="630" fill="url(#bgGlow2)"/>

  <!-- ARCHITECTURAL DOSSIER BADGE -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="272" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="4" fill="#06b6d4" filter="url(#glow-subtle)"/>
    <text x="36" y="22" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- TYPOGRAPHY / TITLE SECTION -->
  <g transform="translate(80, 150)">
    <!-- Main Title -->
    <text x="0" y="0" fill="#ffffff" font-size="64" font-weight="900" letter-spacing="-1">
      N<tspan fill="url(#primaryGrad)">8</tspan>N
    </text>
    <text x="135" y="0" fill="#ffffff" font-size="64" font-weight="300" letter-spacing="-1">AI</text>

    <!-- Subtitle Category -->
    <text x="0" y="42" fill="url(#fuchsiaGrad)" font-size="18" font-weight="700" letter-spacing="2">
      AI AUTOMATION &amp; NO-CODE ORCHESTRATION
    </text>

    <!-- Investigation Headline -->
    <text x="0" y="90" fill="#94a3b8" font-size="16" font-weight="400" width="600">
      <tspan x="0" dy="0">The Rise of AI-Powered Workflow Orchestration and</tspan>
      <tspan x="0" dy="24">the Hands-on Guide to Enterprise Scale Architecture.</tspan>
    </text>
  </g>

  <!-- METRICS / STATS BAR -->
  <g transform="translate(80, 500)">
    <line x1="0" y1="0" x2="520" y2="0" stroke="url(#lineGrad)" stroke-width="1"/>
    
    <g transform="translate(0, 20)">
      <text x="0" y="0" fill="#06b6d4" font-size="22" font-weight="800">99.99%</text>
      <text x="0" y="18" fill="#64748b" font-size="11" font-weight="600" letter-spacing="0.5">UPTIME SLA</text>
    </g>

    <g transform="translate(180, 20)">
      <text x="0" y="0" fill="#8b5cf6" font-size="22" font-weight="800">10X</text>
      <text x="0" y="18" fill="#64748b" font-size="11" font-weight="600" letter-spacing="0.5">EXECUTION SPEED</text>
    </g>

    <g transform="translate(360, 20)">
      <text x="0" y="0" fill="#d946ef" font-size="22" font-weight="800">AES-256</text>
      <text x="0" y="18" fill="#64748b" font-size="11" font-weight="600" letter-spacing="0.5">ENCRYPTED STATE</text>
    </g>
  </g>

  <!-- 3D VECTOR ILLUSTRATION: WORKFLOW &amp; AI ORCHESTRATION ENGINE -->
  <g transform="translate(640, 75)">
    
    <!-- Ambient Node Glow Background -->
    <circle cx="240" cy="240" r="180" fill="url(#nodeGlow)" opacity="0.15" filter="url(#glow)"/>

    <!-- Connecting Logic Pathways (Bezier Curves) -->
    <g fill="none" stroke-width="2.5">
      <!-- Path 1: Trigger to AI Node -->
      <path d="M 120 160 C 180 160, 180 260, 240 260" stroke="url(#primaryGrad)" filter="url(#glow-subtle)"/>
      <!-- Path 2: AI Node to Transform -->
      <path d="M 240 260 C 300 260, 300 140, 360 140" stroke="url(#primaryGrad)" filter="url(#glow-subtle)"/>
      <!-- Path 3: Transform to Output -->
      <path d="M 360 140 C 420 140, 420 280, 480 280" stroke="url(#fuchsiaGrad)" filter="url(#glow-subtle)"/>
      <!-- Secondary branching path -->
      <path d="M 240 260 C 240 340, 360 340, 360 380" stroke="#8b5cf6" stroke-dasharray="6 4" opacity="0.7"/>
    </g>

    <!-- Data Packets / Pulses -->
    <circle cx="190" cy="210" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="310" cy="190" r="4" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="435" cy="220" r="4" fill="#d946ef" filter="url(#glow)"/>

    <!-- NODE 1: Webhook Trigger (Top Left) -->
    <g transform="translate(60, 110)">
      <rect width="120" height="90" rx="12" fill="url(#cardBg)" stroke="#06b6d4" stroke-width="1.5" filter="url(#glow-subtle)"/>
      <path d="M 15 25 L 35 25 M 15 35 L 45 35" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="95" cy="30" r="8" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5"/>
      <circle cx="95" cy="30" r="3" fill="#38bdf8"/>
      <text x="15" y="65" fill="#ffffff" font-size="12" font-weight="700">Webhook</text>
      <text x="15" y="80" fill="#64748b" font-size="10">HTTP Trigger</text>
    </g>

    <!-- NODE 2: AI Agent Core (Center) - Hero Element -->
    <g transform="translate(170, 200)">
      <rect width="140" height="110" rx="14" fill="url(#cardBg)" stroke="url(#primaryGrad)" stroke-width="2" filter="url(#glow)"/>
      
      <!-- AI Neural Spark Icon -->
      <path d="M 25 35 L 35 20 L 45 35 L 60 45 L 45 55 L 35 70 L 25 55 L 10 45 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="35" cy="45" r="4" fill="#8b5cf6"/>

      <text x="20" y="85" fill="#ffffff" font-size="14" font-weight="800">Advanced AI</text>
      <text x="20" y="100" fill="#38bdf8" font-size="10" font-weight="600">LLM Orchestrator</text>

      <!-- Status Pill -->
      <rect x="75" y="15" width="50" height="18" rx="9" fill="#06b6d4" fill-opacity="0.2"/>
      <text x="85" y="27" fill="#06b6d4" font-size="9" font-weight="700">ACTIVE</text>
    </g>

    <!-- NODE 3: Data Transformer (Top Right) -->
    <g transform="translate(300, 90)">
      <rect width="120" height="90" rx="12" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#glow-subtle)"/>
      <path d="M 15 25 L 45 25 M 15 35 L 30 35" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
      <circle cx="95" cy="30" r="8" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1.5"/>
      <circle cx="95" cy="30" r="3" fill="#d946ef"/>
      <text x="15" y="65" fill="#ffffff" font-size="12" font-weight="700">Transform</text>
      <text x="15" y="80" fill="#64748b" font-size="10">JSON / Vector AST</text>
    </g>

    <!-- NODE 4: Enterprise Output (Bottom Right) -->
    <g transform="translate(420, 220)">
      <rect width="120" height="100" rx="12" fill="url(#cardBg)" stroke="#d946ef" stroke-width="1.5" filter="url(#glow-subtle)"/>
      <path d="M 15 25 L 30 40 L 45 20" stroke="#d946ef" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="95" cy="30" r="8" fill="#d946ef" fill-opacity="0.2" stroke="#d946ef" stroke-width="1.5"/>
      <circle cx="95" cy="30" r="3" fill="#d946ef"/>
      <text x="15" y="70" fill="#ffffff" font-size="12" font-weight="700">Sync &amp; Action</text>
      <text x="15" y="86" fill="#64748b" font-size="10">Enterprise CRM</text>
    </g>

    <!-- Floating Security / Encryption Badge -->
    <g transform="translate(260, 350)">
      <rect width="200" height="50" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1" opacity="0.9"/>
      <circle cx="25" cy="25" r="10" fill="#06b6d4" fill-opacity="0.2"/>
      <path d="M 21 25 L 24 28 L 29 22" stroke="#06b6d4" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <text x="45" y="22" fill="#ffffff" font-size="11" font-weight="700">Self-Hosted Security</text>
      <text x="45" y="37" fill="#64748b" font-size="9">Enterprise Node Isolation</text>
    </g>
  </g>

  <!-- BRAND WATERMARK / CORNER ACCENTS -->
  <g transform="translate(1120, 30)">
    <text x="0" y="0" fill="#334155" font-size="10" font-weight="800" letter-spacing="2" text-anchor="end">HELIATECH.ONLINE</text>
  </g>

  <!-- Subtle corner aesthetic framing lines -->
  <path d="M 30 30 L 50 30 M 30 30 L 30 50" stroke="#1e293b" stroke-width="2" fill="none"/>
  <path d="M 1170 30 L 1150 30 M 1170 30 L 1170 50" stroke="#1e293b" stroke-width="2" fill="none"/>
  <path d="M 30 600 L 50 600 M 30 600 L 30 580" stroke="#1e293b" stroke-width="2" fill="none"/>
  <path d="M 1170 600 L 1150 600 M 1170 600 L 1170 580" stroke="#1e293b" stroke-width="2" fill="none"/>

</svg>