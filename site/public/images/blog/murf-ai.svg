<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="fuchsia-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#d946ef" stop-opacity="1" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.1" />
      <stop offset="25%" stop-color="#d946ef" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="1" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#334155" />
    </pattern>

    <!-- Hexagon Pattern Overlay -->
    <pattern id="hex-pattern" width="60" height="104" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
      <path d="M30 0 L60 17.32 L60 51.96 L30 69.28 L0 51.96 L0 17.32 Z M30 104 L60 121.32 L60 155.96 L30 173.28 L0 155.96 L0 121.32 Z" fill="none" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- 1. Background Layer -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />
  <rect width="1200" height="630" fill="url(#grid-pattern)" />
  <rect width="1200" height="630" fill="url(#hex-pattern)" opacity="0.6" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="150" r="220" fill="#8b5cf6" opacity="0.12" filter="url(#glow-heavy)" />
  <circle cx="200" cy="500" r="280" fill="#06b6d4" opacity="0.1" filter="url(#glow-heavy)" />
  <circle cx="600" cy="315" r="180" fill="#d946ef" opacity="0.08" filter="url(#glow-heavy)" />

  <!-- 2. Isometric Holographic Audio Core & Neural Vectors -->
  <g transform="translate(680, 280)">
    <!-- Floor Grid Projection (Perspective) -->
    <g transform="translate(0, 100) scale(1, 0.4)" opacity="0.4">
      <ellipse cx="0" cy="0" rx="220" ry="110" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8 4" />
      <ellipse cx="0" cy="0" rx="160" ry="80" fill="none" stroke="#8b5cf6" stroke-width="1.5" />
      <ellipse cx="0" cy="0" rx="100" ry="50" fill="none" stroke="#d946ef" stroke-width="1" />
    </g>

    <!-- Central Neural Audio Nodes -->
    <g filter="url(#glow-subtle)">
      <!-- Connecting Energy Lines -->
      <path d="M-120,-40 L0,-90 L120,-40 L80,40 L0,70 L-80,40 Z" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
      <line x1="0" y1="-90" x2="0" y2="20" stroke="#d946ef" stroke-width="1.5" stroke-dasharray="4 4" />
      <line x1="-120" y1="-40" x2="0" y2="20" stroke="#06b6d4" stroke-width="1.5" />
      <line x1="120" y1="-40" x2="0" y2="20" stroke="#8b5cf6" stroke-width="1.5" />
      <line x1="-80" y1="40" x2="0" y2="20" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="80" y1="40" x2="0" y2="20" stroke="#d946ef" stroke-width="1.5" />

      <!-- Floating Holographic Rings / Sound Envelopes -->
      <g transform="translate(0, 0)">
        <ellipse cx="0" cy="0" rx="140" ry="45" fill="none" stroke="url(#cyan-violet)" stroke-width="2" stroke-dasharray="10 5" opacity="0.8" />
        <ellipse cx="0" cy="-30" rx="110" ry="35" fill="none" stroke="url(#fuchsia-cyan)" stroke-width="1.5" opacity="0.6" />
        <ellipse cx="0" cy="-60" rx="70" ry="22" fill="none" stroke="#38bdf8" stroke-width="2" filter="url(#glow-subtle)" />
      </g>

      <!-- Central Sound Sphere / AI Core -->
      <circle cx="0" cy="-20" r="25" fill="url(#cyan-violet)" filter="url(#glow-heavy)" opacity="0.9" />
      <circle cx="0" cy="-20" r="12" fill="#ffffff" filter="url(#glow-subtle)" />
      <circle cx="0" cy="-20" r="35" fill="none" stroke="#d946ef" stroke-width="1" stroke-dasharray="3 3" />
    </g>

    <!-- 3D Vertical Frequency Bars / Vector Neural Render -->
    <g transform="translate(0, -20)" filter="url(#glow-subtle)">
      <!-- Bar Element Left 2 -->
      <path d="M-90,-10 L-90,-50 L-80,-60 L-80,-20 Z" fill="#06b6d4" opacity="0.7" />
      <path d="M-90,-50 L-80,-60 L-80,-50 L-90,-40 Z" fill="#38bdf8" opacity="0.9" />
      
      <!-- Bar Element Left 1 -->
      <path d="M-50,0 L-50,-70 L-40,-80 L-40,-10 Z" fill="url(#cyan-violet)" opacity="0.8" />
      <path d="M-50,-70 L-40,-80 L-40,-70 L-50,-60 Z" fill="#d946ef" />

      <!-- Center-Left Major Frequency Tower -->
      <path d="M-20,20 L-20,-110 L-10,-120 L-10,10 Z" fill="url(#fuchsia-cyan)" opacity="0.9" />
      <path d="M-20,-110 L-10,-120 L-10,-110 L-20,-100 Z" fill="#ffffff" />

      <!-- Center-Right Major Frequency Tower -->
      <path d="M10,10 L10,-130 L20,-140 L20,0 Z" fill="url(#cyan-violet)" opacity="0.9" />
      <path d="M10,-130 L20,-140 L20,-130 L10,-120 Z" fill="#38bdf8" />

      <!-- Bar Element Right 1 -->
      <path d="M40,-10 L40,-80 L50,-90 L50,-20 Z" fill="#8b5cf6" opacity="0.8" />
      <path d="M40,-80 L50,-90 L50,-80 L40,-70 Z" fill="#d946ef" />

      <!-- Bar Element Right 2 -->
      <path d="M80,20 L80,-50 L90,-60 L90,10 Z" fill="#06b6d4" opacity="0.7" />
      <path d="M80,-50 L90,-60 L90,-50 L80,-40 Z" fill="#38bdf8" opacity="0.9" />
    </g>

    <!-- Floating Node Points / Data Particles -->
    <g fill="#38bdf8">
      <circle cx="-120" cy="-40" r="4" filter="url(#glow-subtle)" />
      <circle cx="120" cy="-40" r="3" filter="url(#glow-subtle)" />
      <circle cx="0" cy="-90" r="5" fill="#d946ef" filter="url(#glow-subtle)" />
      <circle cx="-80" cy="40" r="3.5" />
      <circle cx="80" cy="40" r="4" fill="#06b6d4" filter="url(#glow-subtle)" />
    </g>
  </g>

  <!-- 3. Dynamic Foreground Audio Waveforms (Amplitude Lines) -->
  <g transform="translate(60, 480)">
    <!-- Ambient Background Wave -->
    <path d="M 0,-40 Q 150,-90 300,-30 T 600,-40 T 900,-20 T 1100,-60" fill="none" stroke="#1e293b" stroke-width="3" opacity="0.6" />
    
    <!-- Primary High-Energy Audio Vector Waveform -->
    <path d="M 0,-30 
             C 80,-30 100,-120 180,-120 
             C 260,-120 280,10 360,10 
             C 440,10 480,-150 560,-150 
             C 640,-150 680,-20 760,-20 
             C 840,-20 880,-100 960,-100 
             C 1040,-100 1060,-40 1120,-40" 
          fill="none" stroke="url(#wave-grad-1)" stroke-width="4" filter="url(#glow-heavy)" />

    <!-- Secondary Intersecting Crystalline Wave -->
    <path d="M 0,-20 
             C 90,-20 120,40 210,40 
             C 300,40 330,-80 420,-80 
             C 510,-80 550,60 640,60 
             C 730,60 770,-50 860,-50 
             C 950,-50 990,-10 1120,-20" 
          fill="none" stroke="url(#wave-grad-2)" stroke-width="2" stroke-dasharray="6 3" opacity="0.8" filter="url(#glow-subtle)" />

    <!-- Amplitude Marker Nodes -->
    <g fill="#06b6d4" filter="url(#glow-subtle)">
      <circle cx="180" cy="-120" r="5" />
      <circle cx="360" cy="10" r="4" fill="#8b5cf6" />
      <circle cx="560" cy="-150" r="6" fill="#d946ef" />
      <circle cx="760" cy="-20" r="4" />
      <circle cx="960" cy="-100" r="5" fill="#38bdf8" />
    </g>
  </g>

  <!-- 4. Typography, Badges & Enterprise Dossier Headers -->
  <g transform="translate(80, 100)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <!-- Glowing dot -->
      <circle cx="20" cy="17" r="5" fill="#06b6d4" filter="url(#glow-subtle)" />
      <circle cx="20" cy="17" r="2" fill="#ffffff" />
      <text x="38" y="22" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Tool Title: MURF.AI -->
    <g transform="translate(0, 95)">
      <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="900" fill="#ffffff" letter-spacing="4" filter="url(#glow-subtle)">MURF.AI</text>
      <!-- Decorative Accent Line under Title -->
      <rect x="2" y="16" width="280" height="4" rx="2" fill="url(#cyan-violet)" filter="url(#glow-subtle)" />
      <rect x="292" y="16" width="30" height="4" rx="2" fill="#d946ef" />
      <rect x="330" y="16" width="10" height="4" rx="2" fill="#38bdf8" />
    </g>

    <!-- Category Subtitle -->
    <g transform="translate(2, 145)">
      <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#06b6d4" letter-spacing="3">AI AUDIO &amp; VOICEOVER</text>
    </g>

    <!-- Investigation Title (Multiline Wrapped) -->
    <g transform="translate(2, 195)">
      <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#f8fafc" letter-spacing="0.5">
        <tspan x="0" dy="0">The Audio Revolution and</tspan>
        <tspan x="0" dy="42">Enterprise Blueprint for</tspan>
        <tspan x="0" dy="42">Studio-Quality Voiceovers in 2026</tspan>
      </text>
    </g>
  </g>

  <!-- 5. Technical UI Accents & Corner Framing Framework -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.6" fill="none">
    <!-- Top Left Corner Marker -->
    <path d="M 30,50 L 30,30 L 50,30" />
    <!-- Top Right Corner Marker -->
    <path d="M 1170,50 L 1170,30 L 1150,30" />
    <!-- Bottom Left Corner Marker -->
    <path d="M 30,580 L 30,600 L 50,600" />
    <!-- Bottom Right Corner Marker -->
    <path d="M 1170,580 L 1170,600 L 1150,600" />
  </g>

  <!-- Coordinate & System Readouts (Tech Details) -->
  <g transform="translate(80, 580)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#64748b" letter-spacing="1">
    <text x="0" y="0">SYS.VER: 2026.4.8 // TARGET: MURF.AI_NEURAL_SYNTHESIS // STATUS: VERIFIED_FLAGSHIP</text>
  </g>
  <g transform="translate(1000, 580)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#06b6d4" letter-spacing="1" text-anchor="end">
    <text x="0" y="0">SEC.ID // HT-8890-AUDIO</text>
  </g>

  <!-- Vertical Accent Grid Bar on Left Edge -->
  <g transform="translate(45, 100)">
    <line x1="0" y1="0" x2="0" y2="430" stroke="#1e293b" stroke-width="2" />
    <line x1="0" y1="0" x2="0" y2="120" stroke="url(#cyan-violet)" stroke-width="3" filter="url(#glow-subtle)" />
    <circle cx="0" cy="120" r="3" fill="#d946ef" filter="url(#glow-subtle)" />
    <circle cx="0" cy="300" r="2" fill="#38bdf8" />
  </g>
</svg>