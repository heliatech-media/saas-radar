<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bgGlow" cx="60%" cy="30%" r="70%" fx="60%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#060913" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.08" />
    </linearGradient>

    <!-- UI & Accent Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="violetFuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Patterns -->
    <pattern id="hexGrid" width="40" height="69.282" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M 40 0 L 20 11.547 L 0 0 L 0 23.094 L 20 34.641 L 40 23.094 Z M 0 34.641 L 20 46.188 L 40 34.641 L 40 57.735 L 20 69.282 L 0 57.735 Z" fill="none" stroke="url(#gridGrad)" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#hexGrid)" opacity="0.7" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="150" r="220" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" />
  <circle cx="750" cy="450" r="280" fill="#06b6d4" opacity="0.10" filter="url(#glow)" />
  <circle cx="200" cy="500" r="180" fill="#d946ef" opacity="0.08" filter="url(#glow)" />

  <!-- Background Decorative Grid Lines & Flow Paths -->
  <g opacity="0.4">
    <path d="M 50,150 H 350 L 450,250 H 1150" fill="none" stroke="url(#cyanBlue)" stroke-width="1.5" stroke-dasharray="6 6" />
    <path d="M 100,500 H 300 L 400,400 H 650" fill="none" stroke="url(#violetFuchsia)" stroke-width="1.5" />
    <circle cx="450" cy="250" r="4" fill="#38bdf8" filter="url(#glow-sm)" />
    <circle cx="400" cy="400" r="4" fill="#8b5cf6" filter="url(#glow-sm)" />
  </g>

  <!-- ========================================== -->
  <!-- LEFT COLUMN: Typography & Dossier Meta     -->
  <!-- ========================================== -->
  <g transform="translate(80, 80)">
    
    <!-- Top Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="270" height="32" rx="16" fill="#0f172a" stroke="url(#glassBorder)" stroke-width="1.5" filter="url(#dropShadow)" />
      <circle cx="20" cy="16" r="4" fill="#06b6d4" filter="url(#glow-sm)" />
      <text x="36" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">HELIATECH DOSSIER</text>
    </g>

    <!-- Main Title & Subtitle -->
    <g transform="translate(0, 75)">
      <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="3">B2B SALES &amp; GTM INTELLIGENCE</text>
      
      <!-- Smartlead Branding Header -->
      <text x="0" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
        SMARTLEAD
      </text>
      
      <!-- Comparative Subtitle -->
      <text x="0" y="105" fill="url(#cyanBlue)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.5">
        vs Instantly: Deliverability Breakdown
      </text>

      <!-- Description Paragraph -->
      <text x="0" y="150" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" line-height="1.5">
        <tspan x="0" dy="0">Deep architectural analysis of multi-channel sequencing,</tspan>
        <tspan x="0" dy="22">warmup infrastructure, and high-velocity inbox rotation.</tspan>
      </text>
    </g>

    <!-- Key Metrics / Specs Badges -->
    <g transform="translate(0, 310)">
      <!-- Metric Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="64" rx="10" fill="url(#cardBg)" stroke="url(#glassBorder)" stroke-width="1" />
        <text x="16" y="26" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">99.2%</text>
        <text x="16" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">INBOX PLACEMENT</text>
      </g>
      <!-- Metric Card 2 -->
      <g transform="translate(185, 0)">
        <rect width="165" height="64" rx="10" fill="url(#cardBg)" stroke="url(#glassBorder)" stroke-width="1" />
        <text x="16" y="26" fill="#d946ef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800">Unlimited</text>
        <text x="16" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">SCALE &amp; ROTATION</text>
      </g>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT COLUMN: 3D Isometric CRM/Sales Metaphor -->
  <!-- ========================================== -->
  <g transform="translate(680, 70)" filter="url(#dropShadow)">
    
    <!-- Central Data Cube / Workflow Engine Canvas -->
    <g transform="translate(50, 20)">
      
      <!-- Back connecting glowing lines -->
      <path d="M 120,120 L 260,60 L 400,120" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />
      <path d="M 260,60 L 260,220" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.3" />

      <!-- Node 1 (Top Left: Enriched Contact Graph) -->
      <g transform="translate(30, 80)">
        <rect width="160" height="90" rx="12" fill="url(#cardBg)" stroke="url(#glassBorder)" stroke-width="1.5" />
        <!-- Inner glow accent -->
        <path d="M 15 25 H 85" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
        <circle cx="130" cy="30" r="12" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5" />
        <text x="130" y="34" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">API</text>
        <!-- Data lines -->
        <rect x="15" y="45" width="110" height="6" rx="3" fill="#334155" />
        <rect x="15" y="60" width="80" height="6" rx="3" fill="#1e293b" />
        <circle cx="140" cy="75" r="4" fill="#38bdf8" filter="url(#glow-sm)" />
      </g>

      <!-- Node 2 (Top Right: High-Velocity Rotation Engine) -->
      <g transform="translate(230, 20)">
        <rect width="180" height="100" rx="12" fill="url(#cardBg)" stroke="url(#cyanBlue)" stroke-width="2" filter="url(#dropShadow)" />
        <path d="M 15 25 H 100" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
        <!-- Animated / Glowing status pill -->
        <rect x="110" y="18" width="55" height="16" rx="8" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1" />
        <text x="137" y="29" fill="#d946ef" font-family="-apple-system, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ACTIVE</text>
        <!-- Revenue Bar Chart Graphic inside node -->
        <rect x="15" y="55" width="22" height="30" rx="4" fill="url(#cyanBlue)" />
        <rect x="47" y="40" width="22" height="45" rx="4" fill="url(#violetFuchsia)" />
        <rect x="79" y="30" width="22" height="55" rx="4" fill="url(#cyanBlue)" />
        <rect x="111" y="20" width="22" height="65" rx="4" fill="url(#violetFuchsia)" filter="url(#glow-sm)" />
      </g>

      <!-- Connecting data stream beam -->
      <path d="M 190,140 Q 250,180 270,120" fill="none" stroke="url(#violetFuchsia)" stroke-width="3" filter="url(#glow)" />
      <circle cx="230" cy="162" r="5" fill="#d946ef" filter="url(#glow-sm)" />

      <!-- Node 3 (Bottom Center: Multi-Dimensional Deliverability Mesh) -->
      <g transform="translate(110, 190)">
        <rect width="240" height="110" rx="14" fill="url(#cardBg)" stroke="url(#violetFuchsia)" stroke-width="2" />
        <path d="M 20 25 H 130" stroke="#d946ef" stroke-width="3" stroke-linecap="round" />
        <circle cx="210" cy="27" r="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
        
        <!-- Network Nodes Graphic -->
        <g transform="translate(20, 45)">
          <line x1="10" y1="20" x2="80" y2="20" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />
          <line x1="80" y1="20" x2="150" y2="10" stroke="#8b5cf6" stroke-width="1.5" />
          <line x1="80" y1="20" x2="140" y2="35" stroke="#06b6d4" stroke-width="1.5" />
          
          <circle cx="10" cy="20" r="6" fill="#38bdf8" filter="url(#glow-sm)" />
          <circle cx="80" cy="20" r="8" fill="#8b5cf6" filter="url(#glow-sm)" />
          <circle cx="150" cy="10" r="5" fill="#06b6d4" />
          <circle cx="140" cy="35" r="6" fill="#d946ef" />
        </g>
      </g>

      <!-- Floating Holographic Badge: Smartlead Core -->
      <g transform="translate(10, 330)" filter="url(#dropShadow)">
        <rect width="340" height="50" rx="25" fill="#090d16" stroke="url(#cyanBlue)" stroke-width="1.5" />
        <circle cx="30" cy="25" r="10" fill="#06b6d4" fill-opacity="0.3" />
        <circle cx="30" cy="25" r="4" fill="#38bdf8" filter="url(#glow-sm)" />
        <text x="55" y="29" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">UNIFIED INBOX ROTATION ENGINE</text>
      </g>

    </g>
  </g>

  <!-- Bottom Accent Rule -->
  <line x1="80" y1="580" x2="1120" y2="580" stroke="url(#glassBorder)" stroke-width="1" opacity="0.5" />
  
  <!-- Footer Branding / Copyright -->
  <text x="80" y="605" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" letter-spacing="1">
    HELIATECH.ONLINE <tspan fill="#334155">•</tspan> ENTERPRISE SOFTWARE INVESTIGATION DOSSIER 2026
  </text>
</svg>