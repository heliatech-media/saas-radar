<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070913" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="fuchsia-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow & Lighting Filters -->
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(6, 182, 212, 0.15)" />
    </pattern>

    <!-- Hexagon Mask / Shapes -->
    <g id="hex-node">
      <polygon points="0,-18 15.5,-9 15.5,9 0,18 -15.5,9 -15.5,-9" fill="#090d16" stroke="#06b6d4" stroke-width="2" />
      <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    </g>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />
  <rect width="1200" height="630" fill="url(#grid-pattern)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="180" r="220" fill="#8b5cf6" opacity="0.12" filter="url(#glow-heavy)" />
  <circle cx="850" cy="450" r="250" fill="#06b6d4" opacity="0.10" filter="url(#glow-heavy)" />
  <circle cx="200" cy="500" r="180" fill="#d946ef" opacity="0.08" filter="url(#glow-heavy)" />

  <!-- ========================================== -->
  <!-- RIGHT SIDE: 3D ANSWER ENGINE METAPHOR      -->
  <!-- ========================================== -->
  <g transform="translate(680, 80)">
    <!-- Connecting Vector Web / Knowledge Graph -->
    <g opacity="0.6">
      <path d="M 80,80 L 220,140 L 160,280 L 40,220 Z" fill="none" stroke="url(#cyan-violet)" stroke-dasharray="4,4" stroke-width="1.5" />
      <path d="M 220,140 L 340,80 L 400,200 L 160,280" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.4" />
      <path d="M 160,280 L 260,380 L 400,200" fill="none" stroke="#d946ef" stroke-width="1.5" opacity="0.5" />
    </g>

    <!-- Central Floating Neural Core (Isometric Cube / Vector Cluster) -->
    <g transform="translate(230, 200)">
      <!-- Outer Pulsing Rings -->
      <ellipse cx="0" cy="20" rx="140" ry="60" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.3" stroke-dasharray="6 6" />
      <ellipse cx="0" cy="20" rx="180" ry="80" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.2" />

      <!-- 3D Isometric Engine Structure -->
      <!-- Bottom Plate -->
      <path d="M -90,40 L 0,80 L 90,40 L 0,0 Z" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
      
      <!-- Pillars -->
      <path d="M -90,40 L -90,0 M 90,40 L 90,0 M 0,80 L 0,40" stroke="#06b6d4" stroke-width="1.5" opacity="0.6" />

      <!-- Top Plate / Answer Hub -->
      <path d="M -90,0 L 0,40 L 90,0 L 0,-40 Z" fill="#0f172a" stroke="url(#cyan-violet)" stroke-width="2" filter="url(#glow-subtle)" />
      
      <!-- Inner Glowing Core Diamond -->
      <path d="M 0,-20 L 35,0 L 0,20 L -35,0 Z" fill="url(#fuchsia-cyan)" opacity="0.9" filter="url(#glow-heavy)" />
      <path d="M 0,-35 L 50,0 L 0,35 L -50,0 Z" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.8" />

      <!-- Floating Data Nodes / Answer Syntheses -->
      <g transform="translate(-110, -60)">
        <rect x="0" y="0" width="80" height="30" rx="6" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" />
        <text x="12" y="19" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">SYNTHESIS</text>
        <circle cx="70" cy="15" r="3" fill="#06b6d4" filter="url(#glow-subtle)" />
      </g>

      <g transform="translate(70, -80)">
        <rect x="0" y="0" width="90" height="30" rx="6" fill="#090d16" stroke="#d946ef" stroke-width="1.5" />
        <text x="10" y="19" fill="#d946ef" font-family="monospace" font-size="11" font-weight="bold">VERIFIED.AI</text>
        <circle cx="15" cy="15" r="3" fill="#d946ef" filter="url(#glow-subtle)" />
      </g>

      <g transform="translate(60, 90)">
        <rect x="0" y="0" width="110" height="30" rx="6" fill="#090d16" stroke="#8b5cf6" stroke-width="1.5" />
        <text x="10" y="19" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold">ENTERPRISE SECURE</text>
      </g>
    </g>

    <!-- Floating Knowledge Particles -->
    <use href="#hex-node" x="100" y="120" />
    <use href="#hex-node" x="380" y="100" />
    <use href="#hex-node" x="320" y="380" />
    <use href="#hex-node" x="120" y="320" />
  </g>

  <!-- ========================================== -->
  <!-- LEFT SIDE: TYPOGRAPHY & BRANDING           -->
  <!-- ========================================== -->
  <g transform="translate(80, 80)">
    <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="34" rx="17" fill="#0b1329" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
      <!-- Glowing Dot -->
      <circle cx="20" cy="17" r="5" fill="#06b6d4" filter="url(#glow-subtle)" />
      <circle cx="20" cy="17" r="2" fill="#ffffff" />
      <!-- Badge Text -->
      <text x="38" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Title & Category -->
    <g transform="translate(0, 80)">
      <!-- Category Subtitle -->
      <text x="0" y="0" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="3">AI RESEARCH &amp; PRODUCTIVITY</text>

      <!-- Tool Title: PERPLEXITY ENTERPRISE -->
      <text x="0" y="62" fill="url(#text-grad)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
        PERPLEXITY
      </text>
      <text x="0" y="116" fill="url(#cyan-violet)" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#glow-subtle)">
        ENTERPRISE
      </text>

      <!-- Investigation Headline -->
      <text x="0" y="170" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" letter-spacing="0.5">
        The End of Search and the Dawn of the
      </text>
      <text x="0" y="196" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" letter-spacing="0.5">
        Answer Engine for High-Stakes Teams
      </text>
    </g>

    <!-- Architectural Metadata Footer inside Graphic -->
    <g transform="translate(0, 360)">
      <line x1="0" y1="0" x2="440" y2="0" stroke="#1e293b" stroke-width="1" />
      <text x="0" y="25" fill="#64748b" font-family="monospace" font-size="11" letter-spacing="1">INVESTIGATION CODE: HT-AI-2024-PX</text>
      <text x="340" y="25" fill="#38bdf8" font-family="monospace" font-size="11" letter-spacing="1">STATUS: VERIFIED</text>
    </g>
  </g>

  <!-- Decorative Corner Accents -->
  <path d="M 20,20 L 50,20 M 20,20 L 20,50" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6" />
  <path d="M 1180,20 L 1150,20 M 1180,20 L 1180,50" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6" />
  <path d="M 20,610 L 50,610 M 20,610 L 20,580" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6" />
  <path d="M 1180,610 L 1150,610 M 1180,610 L 1180,580" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6" />
</svg>