<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="violet-fuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <linearGradient id="node-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow & Lighting Filters -->
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur1"/>
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Patterns -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.04"/>
    </pattern>
    
    <pattern id="dot-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="630" fill="url(#bg-glow)"/>
  <rect width="1200" height="630" fill="url(#grid-pattern)"/>

  <!-- AMBIENT LIGHTING ORBS -->
  <circle cx="950" cy="150" r="250" fill="#8b5cf6" opacity="0.12" filter="url(#glow-heavy)"/>
  <circle cx="200" cy="500" r="300" fill="#06b6d4" opacity="0.08" filter="url(#glow-heavy)"/>
  <circle cx="700" cy="450" r="200" fill="#d946ef" opacity="0.07" filter="url(#glow-heavy)"/>

  <!-- ABSTRACT ARCHITECTURAL GRID LINES (Background Vector Layer) -->
  <g opacity="0.4">
    <path d="M 0 100 L 1200 100" stroke="url(#node-line)" stroke-dasharray="4 8" stroke-width="1"/>
    <path d="M 0 530 L 1200 530" stroke="url(#node-line)" stroke-dasharray="4 8" stroke-width="1"/>
    <path d="M 150 0 L 150 630" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
    <path d="M 1050 0 L 1050 630" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT SIDE: 3D NO-CODE ARCHITECTURE ENGINE -->
  <!-- ========================================== -->
  <g transform="translate(640, 70)" filter="url(#drop-shadow)">
    
    <!-- Connection lines radiating from core -->
    <path d="M 220 200 L 50 100" stroke="url(#cyan-blue)" stroke-width="2" opacity="0.6"/>
    <path d="M 220 200 L 380 80" stroke="url(#violet-fuchsia)" stroke-width="2" opacity="0.6"/>
    <path d="M 220 200 L 80 340" stroke="url(#cyan-blue)" stroke-width="2" opacity="0.4"/>
    <path d="M 220 200 L 350 320" stroke="url(#violet-fuchsia)" stroke-width="2" opacity="0.6"/>
    <path d="M 380 80 L 350 320" stroke="#38bdf8" stroke-dasharray="5 5" stroke-width="1.5" opacity="0.4"/>
    <path d="M 50 100 L 80 340" stroke="#8b5cf6" stroke-dasharray="5 5" stroke-width="1.5" opacity="0.4"/>

    <!-- Central Isometric Node (Canvas/Visual Engine) -->
    <g transform="translate(220, 200)">
      <!-- Outer Hexagon Glow -->
      <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55" fill="#090d16" stroke="url(#cyan-blue)" stroke-width="3" filter="url(#glow-subtle)"/>
      <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="#0f172a" opacity="0.9"/>
      
      <!-- Inner Webflow-inspired abstract 'W' geometric construct -->
      <path d="M -45 -25 L -20 35 L 0 5 L 20 35 L 45 -25" fill="none" stroke="url(#cyan-blue)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-subtle)"/>
      <path d="M -25 -45 L -10 -15 L 0 -30 L 10 -15 L 25 -45" fill="none" stroke="url(#violet-fuchsia)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
      
      <!-- Data points on core -->
      <circle cx="0" cy="-65" r="4" fill="#38bdf8" filter="url(#glow-subtle)"/>
      <circle cx="65" cy="20" r="4" fill="#d946ef" filter="url(#glow-subtle)"/>
      <circle cx="-65" cy="20" r="4" fill="#8b5cf6" filter="url(#glow-subtle)"/>
    </g>

    <!-- Satellite Node 1: Visual DOM Tree -->
    <g transform="translate(50, 100)">
      <rect x="-60" y="-35" width="120" height="70" rx="10" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" opacity="0.95"/>
      <rect x="-60" y="-35" width="120" height="70" rx="10" fill="url(#glass-grad)"/>
      <!-- Icon/Lines inside card -->
      <circle cx="-40" cy="-15" r="6" fill="#06b6d4"/>
      <rect x="-25" y="-18" width="50" height="6" rx="3" fill="#38bdf8" opacity="0.7"/>
      <rect x="-40" y="2" width="70" height="4" rx="2" fill="#ffffff" opacity="0.3"/>
      <rect x="-40" y="12" width="50" height="4" rx="2" fill="#ffffff" opacity="0.2"/>
    </g>

    <!-- Satellite Node 2: CMS Architecture -->
    <g transform="translate(380, 80)">
      <rect x="-70" y="-40" width="140" height="80" rx="10" fill="#090d16" stroke="#8b5cf6" stroke-width="1.5" opacity="0.95"/>
      <rect x="-70" y="-40" width="140" height="80" rx="10" fill="url(#glass-grad)"/>
      <path d="M -50 -15 L -30 -15 M -50 0 L -10 0 M -50 15 L -20 15" stroke="#d946ef" stroke-width="3" stroke-linecap="round"/>
      <circle cx="40" cy="-15" r="8" fill="#8b5cf6" opacity="0.5"/>
      <circle cx="40" cy="15" r="8" fill="#38bdf8" opacity="0.5"/>
    </g>

    <!-- Satellite Node 3: Interactions & Logic -->
    <g transform="translate(80, 340)">
      <rect x="-65" y="-35" width="130" height="70" rx="10" fill="#090d16" stroke="#d946ef" stroke-width="1.5" opacity="0.95"/>
      <rect x="-65" y="-35" width="130" height="70" rx="10" fill="url(#glass-grad)"/>
      <path d="M -40 0 L -15 -15 L -15 15 Z" fill="#38bdf8"/>
      <path d="M -5 0 L 35 0" stroke="#d946ef" stroke-width="4" stroke-linecap="round"/>
      <circle cx="45" cy="0" r="5" fill="#06b6d4"/>
    </g>

    <!-- Satellite Node 4: Enterprise Hosting & Scale -->
    <g transform="translate(350, 320)">
      <rect x="-60" y="-35" width="120" height="70" rx="10" fill="#090d16" stroke="#06b6d4" stroke-width="1.5" opacity="0.95"/>
      <rect x="-60" y="-35" width="120" height="70" rx="10" fill="url(#glass-grad)"/>
      <!-- Server rack visual -->
      <rect x="-40" y="-20" width="80" height="10" rx="3" fill="#06b6d4" opacity="0.3"/>
      <rect x="-40" y="-5" width="80" height="10" rx="3" fill="#8b5cf6" opacity="0.3"/>
      <rect x="-40" y="10" width="80" height="10" rx="3" fill="#38bdf8" opacity="0.3"/>
      <circle cx="30" cy="-15" r="2" fill="#38bdf8"/>
      <circle cx="30" cy="0" r="2" fill="#d946ef"/>
      <circle cx="30" cy="15" r="2" fill="#06b6d4"/>
    </g>

    <!-- Floating Code / AST Particles -->
    <g opacity="0.7">
      <text x="-30" y="30" fill="#38bdf8" font-family="monospace" font-size="11">&lt;/div&gt;</text>
      <text x="320" y="200" fill="#d946ef" font-family="monospace" font-size="11">flex: 1 0 auto;</text>
      <text x="250" y="0" fill="#06b6d4" font-family="monospace" font-size="11">var(--breakpoint);</text>
    </g>

  </g>


  <!-- ========================================== -->
  <!-- LEFT SIDE: TYPOGRAPHY & BRANDING           -->
  <!-- ========================================== -->
  <g transform="translate(80, 80)">
    
    <!-- TOP PILL BADGE -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="0" y="0" width="310" height="32" rx="16" fill="url(#glass-grad)"/>
      <!-- Glowing dot -->
      <circle cx="18" cy="16" r="5" fill="#06b6d4" filter="url(#glow-subtle)"/>
      <circle cx="18" cy="16" r="2.5" fill="#ffffff"/>
      <!-- Badge Text -->
      <text x="36" y="20.5" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- MAIN TOOL TITLE -->
    <g transform="translate(0, 85)">
      <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="900" letter-spacing="-1">WEBFLOW</text>
      <!-- Subtle reflection/glow under title -->
      <text x="0" y="0" fill="none" stroke="url(#cyan-blue)" stroke-width="2" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="900" letter-spacing="-1" opacity="0.3" filter="url(#glow-subtle)">WEBFLOW</text>
    </g>

    <!-- CATEGORY SUBTITLE -->
    <g transform="translate(0, 125)">
      <text x="0" y="0" fill="url(#cyan-blue)" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="3">NO-CODE WEB &amp; CMS ARCHITECTURE</text>
    </g>

    <!-- INVESTIGATION TITLE (Headline) -->
    <g transform="translate(0, 185)">
      <text x="0" y="0" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">The Evolution of Visual Web Architecture</text>
      <text x="0" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="500">and the Enterprise Blueprint for 2026</text>
    </g>

    <!-- METADATA FOOTER (Author / Date / Security) -->
    <g transform="translate(0, 310)" opacity="0.8">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#1e293b" stroke-width="1.5"/>
      
      <g transform="translate(0, 20)">
        <!-- Publisher -->
        <text x="0" y="0" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="1">RESEARCHED &amp; PUBLISHED BY</text>
        <text x="0" y="16" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">HELIA TECH INTELLIGENCE</text>
        
        <!-- Divider dot -->
        <circle cx="175" cy="11" r="2.5" fill="#475569"/>

        <!-- Target Date -->
        <text x="195" y="0" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="1">TARGET HORIZON</text>
        <text x="195" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Q1/2026</text>

        <!-- Divider dot -->
        <circle cx="285" cy="11" r="2.5" fill="#475569"/>

        <!-- Security Level -->
        <text x="305" y="0" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="1">CLEARANCE</text>
        <text x="305" y="16" fill="#d946ef" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">ENTERPRISE LEVEL-5</text>
      </g>
    </g>

  </g>

  <!-- SUBTLE CORNER ACCENTS (Cyberpunk frame markers) -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.5">
    <!-- Top Left -->
    <path d="M 20 40 L 20 20 L 40 20"/>
    <!-- Top Right -->
    <path d="M 1180 40 L 1180 20 L 1160 20"/>
    <!-- Bottom Left -->
    <path d="M 20 590 L 20 610 L 40 610"/>
    <!-- Bottom Right -->
    <path d="M 1180 590 L 1180 610 L 1160 610"/>
  </g>
</svg>