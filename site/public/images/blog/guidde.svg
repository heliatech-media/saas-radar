<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradient" cx="60%" cy="30%" r="80%" fx="60%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Glow & Lighting Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glass-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <!-- Color Gradients for UI & Vectors -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="violetFuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <linearGradient id="borderGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03" />
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.1" />
    </pattern>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#dots)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="150" r="250" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" />
  <circle cx="750" cy="450" r="300" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
  <circle cx="200" cy="500" r="200" fill="#d946ef" opacity="0.08" filter="url(#glow)" />

  <!-- ================= TOP BRANDING / BADGE ================= -->
  <g transform="translate(80, 60)">
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#0b1329" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="18" cy="17" r="4" fill="#38bdf8" filter="url(#glow)" />
    <text x="36" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- ================= TYPOGRAPHY & HEADINGS ================= -->
  <g transform="translate(80, 130)">
    <!-- Category Subtitle -->
    <text x="0" y="0" fill="#d946ef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" filter="url(#glow-subtle)">AI VIDEO &amp; DOCUMENTATION</text>
    
    <!-- Main Title -->
    <text x="0" y="55" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
      GUIDDE: <tspan fill="url(#cyanBlue)">THE END OF THE</tspan>
    </text>
    <text x="0" y="105" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5">
      MANUAL <tspan fill="url(#violetFuchsia)">HOW-TO</tspan>
    </text>

    <!-- Descriptive Paragraph -->
    <text x="0" y="155" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      <tspan x="0" dy="0">Investigating the velocity of AI-driven capture engines transforming</tspan>
      <tspan x="0" dy="24">complex workflows into instant, multi-format enterprise documentation.</tspan>
    </text>
  </g>

  <!-- ================= DOMAIN METAPHOR: 3D AI MEDIA / WORKFLOW ENGINE ================= -->
  <!-- Right side technical composition representing Guidde's video capture + AI documentation -->
  <g transform="translate(640, 95)">
    
    <!-- Glassmorphism Main Background Panel -->
    <rect x="0" y="0" width="480" height="460" rx="24" fill="url(#cardGlass)" stroke="url(#borderGlass)" stroke-width="1.5" filter="url(#glass-blur)" />
    <rect x="0" y="0" width="480" height="460" rx="24" fill="#090d16" fill-opacity="0.6" stroke="url(#borderGlass)" stroke-width="1.5" />

    <!-- Top Window Controls -->
    <circle cx="30" cy="30" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="50" cy="30" r="6" fill="#f59e0b" opacity="0.8" />
    <circle cx="70" cy="30" r="6" fill="#10b981" opacity="0.8" />
    <text x="95" y="34" fill="#64748b" font-family="monospace" font-size="11" letter-spacing="1">GUIDDE_NEURAL_ENGINE_V4.9</text>

    <!-- Holographic 3D Timeline / Waveform Box -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="420" height="150" rx="12" fill="#030712" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.2" />
      
      <!-- Grid lines inside timeline -->
      <line x1="0" y1="37" x2="420" y2="37" stroke="#ffffff" stroke-opacity="0.05" />
      <line x1="0" y1="75" x2="420" y2="75" stroke="#ffffff" stroke-opacity="0.05" />
      <line x1="0" y1="112" x2="420" y2="112" stroke="#ffffff" stroke-opacity="0.05" />

      <!-- Video Timeline Playhead & Frame Markers -->
      <rect x="60" y="15" width="80" height="120" rx="4" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.4" />
      <rect x="150" y="15" width="110" height="120" rx="4" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-opacity="0.4" />
      <rect x="270" y="15" width="90" height="120" rx="4" fill="#d946ef" fill-opacity="0.1" stroke="#d946ef" stroke-opacity="0.4" />

      <!-- Vector Neural Render Audio/Action Waveform -->
      <path d="M 20 75 Q 40 30, 60 75 T 100 75 T 140 20 T 180 100 T 220 75 T 260 40 T 300 110 T 340 75 T 380 50" fill="none" stroke="url(#cyanBlue)" stroke-width="2.5" filter="url(#glow-subtle)" />
      
      <!-- Playhead Line -->
      <line x1="210" y1="0" x2="210" y2="150" stroke="#d946ef" stroke-width="2" filter="url(#glow)" />
      <circle cx="210" cy="75" r="5" fill="#d946ef" filter="url(#glow)" />
    </g>

    <!-- Interconnected Logic Nodes (AI Documentation Generation) -->
    <g transform="translate(30, 230)">
      <!-- Node 1: Browser Capture -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="120" height="70" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
        <circle cx="20" cy="25" r="6" fill="#06b6d4" />
        <text x="35" y="29" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Capture</text>
        <text x="20" y="50" fill="#64748b" font-family="monospace" font-size="9">DOM / Click</text>
      </g>

      <!-- Connector Line 1 -->
      <path d="M 120 35 L 150 35" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 2" />

      <!-- Node 2: AI Processing -->
      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="120" height="70" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
        <circle cx="20" cy="25" r="6" fill="#8b5cf6" />
        <text x="35" y="29" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">AI Synthesize</text>
        <text x="20" y="50" fill="#64748b" font-family="monospace" font-size="9">Steps + Voice</text>
      </g>

      <!-- Connector Line 2 -->
      <path d="M 270 35 L 300 35" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 2" />

      <!-- Node 3: Instant Doc -->
      <g transform="translate(300, 0)">
        <rect x="0" y="0" width="120" height="70" rx="10" fill="#0f172a" stroke="#d946ef" stroke-width="1.5" />
        <circle cx="20" cy="25" r="6" fill="#d946ef" filter="url(#glow)" />
        <text x="35" y="29" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">Publish</text>
        <text x="20" y="50" fill="#64748b" font-family="monospace" font-size="9">Velocity 10x</text>
      </g>
    </g>

    <!-- Bottom Metric Bar -->
    <g transform="translate(30, 330)">
      <rect x="0" y="0" width="420" height="85" rx="12" fill="#030712" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.05" />
      
      <!-- Metric 1 -->
      <g transform="translate(25, 18)">
        <text x="0" y="0" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="1">DOCUMENTATION SPEED</text>
        <text x="0" y="32" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">10<tspan font-size="20" fill="#d946ef">×</tspan> <tspan font-size="14" fill="#94a3b8" font-weight="400">Faster</tspan></text>
      </g>

      <!-- Divider -->
      <line x1="210" y1="15" x2="210" y2="70" stroke="#ffffff" stroke-opacity="0.1" />

      <!-- Metric 2 -->
      <g transform="translate(240, 18)">
        <text x="0" y="0" fill="#64748b" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="1">MANUAL EFFORT</text>
        <text x="0" y="32" fill="#d946ef" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">-85<tspan font-size="20" fill="#38bdf8">%</tspan> <tspan font-size="14" fill="#94a3b8" font-weight="400">Reduction</tspan></text>
      </g>
    </g>

  </g>

  <!-- ================= FOOTER / BRAND SIGNATURE ================= -->
  <g transform="translate(80, 560)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="0" y="25" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      HELIA TECH ENTERPRISE INTELLIGENCE <tspan fill="#38bdf8">•</tspan> HELIATECH.ONLINE
    </text>
    <text x="1040" y="25" fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">
      DOSSIER_ID: GD-2025-AI
    </text>
  </g>
</svg>