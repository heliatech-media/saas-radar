<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bgGlow" cx="60%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="cyberGrid" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Brand & Accent Gradients -->
    <linearGradient id="cyanToBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="violetToFuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Waveform Pattern -->
    <pattern id="dotGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#dotGrid)" />

  <!-- Perspective Grid Floor / Horizon Lines -->
  <g opacity="0.4">
    <path d="M-200 500 L1400 500" stroke="url(#cyanToBlue)" stroke-width="1" stroke-dasharray="4 8" opacity="0.3" />
    <path d="M-100 560 L1300 560" stroke="#8b5cf6" stroke-width="1.5" opacity="0.2" />
    <path d="M 400 100 L 200 500" stroke="#38bdf8" stroke-width="0.5" opacity="0.15" />
    <path d="M 600 100 L 650 500" stroke="#38bdf8" stroke-width="0.5" opacity="0.15" />
    <path d="M 800 100 L 1100 500" stroke="#38bdf8" stroke-width="0.5" opacity="0.15" />
  </g>

  <!-- Ambient Lighting Orbs -->
  <circle cx="950" cy="200" r="180" fill="#8b5cf6" opacity="0.12" filter="url(#coreGlow)" />
  <circle cx="750" cy="350" r="220" fill="#06b6d4" opacity="0.10" filter="url(#coreGlow)" />

  <!-- ================================================================= -->
  <!-- RIGHT SIDE: 3D HOLOGRAPHIC VECTOR NEURAL RENDER TIMELINE (AI VIDEO) -->
  <!-- ================================================================= -->
  <g transform="translate(640, 90)" filter="url(#dropShadow)">
    
    <!-- Holographic Container Base Plate -->
    <polygon points="0,80 260,0 500,80 500,420 260,500 0,420" fill="#090d16" fill-opacity="0.8" stroke="#1e293b" stroke-width="2" />
    <polygon points="10,95 260,20 510,95 510,405 260,480 10,405" fill="none" stroke="url(#cyanToBlue)" stroke-width="1" opacity="0.4" />

    <!-- 3D Isometric Floating Video Frame Node -->
    <g transform="translate(80, 40)">
      <!-- Frame Backing -->
      <path d="M40 20 L300 20 L340 90 L80 90 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.6" />
      
      <!-- Main Display Monitor Screen -->
      <rect x="40" y="80" width="300" height="180" rx="8" fill="#030712" stroke="url(#cyanToBlue)" stroke-width="2" />
      
      <!-- Video Timeline UI Inside Screen -->
      <rect x="60" y="215" width="260" height="25" rx="4" fill="#0f172a" opacity="0.8" />
      <rect x="70" y="224" width="120" height="7" rx="3" fill="url(#cyanToBlue)" />
      <circle cx="190" cy="227" r="5" fill="#ffffff" filter="url(#subtleGlow)" />
      
      <!-- AI Audio/Video Waveform Graphic inside screen -->
      <g transform="translate(60, 110)">
        <path d="M 0 35 Q 35 5, 70 35 T 140 35 T 210 35 T 260 35" fill="none" stroke="#d946ef" stroke-width="3" filter="url(#subtleGlow)" opacity="0.8"/>
        <path d="M 0 35 Q 35 65, 70 35 T 140 35 T 210 35 T 260 35" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
        <!-- Dynamic vertical frequency bars -->
        <line x1="40" y1="15" x2="40" y2="55" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
        <line x1="80" y1="5" x2="80" y2="65" stroke="#d946ef" stroke-width="3" stroke-linecap="round" />
        <line x1="120" y1="20" x2="120" y2="50" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
        <line x1="160" y1="10" x2="160" y2="60" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
        <line x1="200" y1="25" x2="200" y2="45" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      </g>

      <!-- Floating AI Captions Overlays (The Core Feature) -->
      <rect x="90" y="130" width="200" height="32" rx="6" fill="#000000" fill-opacity="0.75" stroke="#d946ef" stroke-width="1.5" filter="url(#subtleGlow)" />
      <text x="190" y="151" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="13" letter-spacing="1.5" text-anchor="middle">SCALING CONTENT</text>

      <!-- Neural Render Nodes & Connection Rays -->
      <circle cx="20" cy="170" r="6" fill="#8b5cf6" filter="url(#coreGlow)" />
      <path d="M26 170 L40 170" stroke="#8b5cf6" stroke-width="2" />

      <circle cx="360" cy="140" r="6" fill="#06b6d4" filter="url(#coreGlow)" />
      <path d="M340 140 L360 140" stroke="#06b6d4" stroke-width="2" />
    </g>

    <!-- Secondary Holographic Timeline Track (Bottom Layer) -->
    <g transform="translate(50, 320)">
      <rect x="0" y="0" width="400" height="60" rx="8" fill="#090d16" stroke="#8b5cf6" stroke-width="1" opacity="0.8" />
      
      <!-- Progress Nodes -->
      <circle cx="40" cy="30" r="16" fill="#0f172a" stroke="#06b6d4" stroke-width="2" />
      <text x="40" y="34" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">01</text>
      <line x1="56" y1="30" x2="110" y2="30" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4" />

      <circle cx="130" cy="30" r="16" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" />
      <text x="130" y="34" fill="#8b5cf6" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">02</text>
      <line x1="146" y1="30" x2="200" y2="30" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 4" />

      <circle cx="220" cy="30" r="16" fill="#0f172a" stroke="#d946ef" stroke-width="2" />
      <text x="220" y="34" fill="#d946ef" font-family="system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle">03</text>
      <line x1="236" y1="30" x2="290" y2="30" stroke="#d946ef" stroke-width="2" />

      <!-- Active Status Badge -->
      <rect x="310" y="18" width="76" height="24" rx="12" fill="url(#violetToFuchsia)" />
      <text x="348" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="10" letter-spacing="1" text-anchor="middle">ACTIVE</text>
    </g>

    <!-- Floating Cyber Particles -->
    <circle cx="420" cy="100" r="3" fill="#38bdf8" filter="url(#coreGlow)" />
    <circle cx="100" cy="280" r="2" fill="#d946ef" filter="url(#coreGlow)" />
    <circle cx="450" cy="380" r="4" fill="#06b6d4" filter="url(#coreGlow)" />
  </g>

  <!-- ================================================================= -->
  <!-- LEFT SIDE: TYPOGRAPHY, BRANDING & DOSSIER METADATA               -->
  <!-- ================================================================= -->
  <g transform="translate(80, 85)">
    
    <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
    <g transform="translate(0, 0)" filter="url(#subtleGlow)">
      <rect x="0" y="0" width="315" height="34" rx="17" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
      <circle cx="18" cy="17" r="5" fill="#06b6d4" />
      <circle cx="18" cy="17" r="8" fill="#06b6d4" opacity="0.3" filter="url(#coreGlow)" />
      <text x="38" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" letter-spacing="2.5">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Category Subtitle -->
    <g transform="translate(0, 75)">
      <text x="0" y="0" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" letter-spacing="4">AI VIDEO INTELLIGENCE</text>
    </g>

    <!-- Main Tool Title: CAPTIONS -->
    <g transform="translate(0, 135)">
      <text x="0" y="0" fill="url(#textGradient)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="68" letter-spacing="3" filter="url(#dropShadow)">CAPTIONS</text>
    </g>

    <!-- Investigation Headline & Subtext -->
    <g transform="translate(0, 205)">
      <text x="0" y="0" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" letter-spacing="0.5">The AI Video Revolution, Enterprise Workflows,</text>
      <text x="0" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="20" letter-spacing="0.5">and the Masterclass Guide to Scaling Content.</text>
    </g>

    <!-- Architectural Metadata / Stats Footer -->
    <g transform="translate(0, 335)">
      <!-- Divider Line -->
      <line x1="0" y1="0" x2="500" y2="0" stroke="#1e293b" stroke-width="2" />
      
      <!-- Stat 1 -->
      <g transform="translate(0, 25)">
        <text x="0" y="0" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24">10x</text>
        <text x="0" y="20" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="1">VELOCITY GAIN</text>
      </g>

      <!-- Stat 2 -->
      <g transform="translate(130, 25)">
        <text x="0" y="0" fill="#8b5cf6" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24">NEURAL</text>
        <text x="0" y="20" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="1">RENDER ENGINE</text>
      </g>

      <!-- Stat 3 -->
      <g transform="translate(280, 25)">
        <text x="0" y="0" fill="#d946ef" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24">ISO/ENT</text>
        <text x="0" y="20" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="1">GRADE SECURITY</text>
      </g>
    </g>

  </g>

  <!-- Corner Tech Accent Marks -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4" fill="none">
    <!-- Top Left -->
    <path d="M 20 40 L 20 20 L 40 20" />
    <!-- Bottom Left -->
    <path d="M 20 590 L 20 610 L 40 610" />
    <!-- Top Right -->
    <path d="M 1180 40 L 1180 20 L 1160 20" />
    <!-- Bottom Right -->
    <path d="M 1180 590 L 1180 610 L 1160 610" />
  </g>

  <!-- Publisher Watermark / Domain Tag -->
  <text x="1160" y="605" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" letter-spacing="2" text-anchor="end">HELIATECH.ONLINE</text>
</svg>