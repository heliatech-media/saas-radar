<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background &amp; Grid Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#070c1b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <radialGradient id="ambientGlow1" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientGlow2" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- UI &amp; Panel Gradients -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="panelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Waveform &amp; Accent Gradients -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowDeep" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Geometric Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4"/>
    </pattern>

    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Ambient Lighting Orbs -->
  <circle cx="950" cy="150" r="300" fill="url(#ambientGlow1)"/>
  <circle cx="200" cy="500" r="350" fill="url(#ambientGlow2)"/>

  <!-- HELIA TECH Brand Watermark / Geometric Accent -->
  <g transform="translate(60, 60)" opacity="0.4">
    <polygon points="0,15 25,0 50,15 50,45 25,60 0,45" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="25,12 40,21 40,39 25,48 10,39 10,21" fill="none" stroke="#8b5cf6" stroke-width="1"/>
    <circle cx="25" cy="30" r="4" fill="#d946ef" filter="url(#glow)"/>
  </g>

  <!-- Top Pill Badge -->
  <g transform="translate(130, 52)">
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="18" cy="16" r="4" fill="#06b6d4" filter="url(#glow)"/>
    <text x="35" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- Typography &amp; Headings -->
  <g transform="translate(80, 140)">
    <!-- Category Subtitle -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#d946ef" letter-spacing="3">GENERATIVE AI &amp; MEDIA • 2026 STRATEGIC REPORT</text>
    
    <!-- Main Title Line 1 -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">ElevenLabs: The Hyper-Realistic</text>
    
    <!-- Main Title Line 2 -->
    <text x="0" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="url(#waveGrad)" filter="url(#glow)" letter-spacing="-0.5">AI Voice Revolution</text>
  </g>

  <!-- Holographic Audio Waveform &amp; 3D Neural Render Interface (Right/Center Focus) -->
  <g transform="translate(640, 130)">
    <!-- Outer Terminal/Holo Panel -->
    <rect x="0" y="0" width="480" height="420" rx="16" fill="url(#panelGrad)" stroke="url(#panelBorder)" stroke-width="1.5"/>
    
    <!-- Panel Header -->
    <line x1="0" y1="45" x2="480" y2="45" stroke="#1e293b" stroke-width="1"/>
    <circle cx="25" cy="22" r="5" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="43" cy="22" r="5" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="61" cy="22" r="5" fill="#10b981" fill-opacity="0.8"/>
    
    <text x="90" y="27" font-family="Courier New, monospace" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">NEURAL_VOICE_SYNTHESIS_V3.2.OS</text>
    <text x="390" y="27" font-family="Courier New, monospace" font-size="11" font-weight="700" fill="#06b6d4">ACTIVE</text>

    <!-- Floating Metric Overlays inside Panel -->
    <g transform="translate(25, 75)">
      <rect x="0" y="0" width="130" height="55" rx="8" fill="#030712" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">LATENCY</text>
      <text x="12" y="42" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#38bdf8">74ms</text>
    </g>

    <g transform="translate(165, 75)">
      <rect x="0" y="0" width="130" height="55" rx="8" fill="#030712" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">CLARITY INDEX</text>
      <text x="12" y="42" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#d946ef">99.8%</text>
    </g>

    <g transform="translate(305, 75)">
      <rect x="0" y="0" width="150" height="55" rx="8" fill="#030712" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#94a3b8">EMOTIONAL DEPTH</text>
      <text x="12" y="42" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#06b6d4">DYNAMIC</text>
    </g>

    <!-- Central 3D Vector Audio Waveform Matrix -->
    <g transform="translate(40, 160)">
      <!-- Grid lines behind waveform -->
      <line x1="0" y1="50" x2="400" y2="50" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="0" y1="100" x2="400" y2="100" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="0" y1="150" x2="400" y2="150" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

      <!-- Ambient Glow Behind Waveform -->
      <path d="M 0 100 Q 50 20, 100 100 T 200 100 T 300 100 T 400 100" fill="none" stroke="#8b5cf6" stroke-width="12" filter="url(#glowDeep)" opacity="0.4"/>

      <!-- Secondary Complex Wave Layer -->
      <path d="M 0 100 Q 30 40, 60 100 T 120 100 T 180 20 T 240 180 T 300 100 T 360 60 T 400 100" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.6"/>

      <!-- Primary High-Frequency Audio Waveform -->
      <path d="M 0 100 
               C 20 100, 30 20, 50 100 
               C 70 180, 80 40, 100 100 
               C 120 100, 130 5, 150 100 
               C 170 195, 180 10, 200 100 
               C 220 100, 230 30, 250 100 
               C 270 170, 280 60, 300 100 
               C 320 100, 330 15, 350 100 
               C 370 185, 380 70, 400 100" 
            fill="none" stroke="url(#waveGrad)" stroke-width="4" filter="url(#glow)"/>

      <!-- Nodes / Sound Energy Envelopes -->
      <circle cx="150" cy="100" r="6" fill="#38bdf8" filter="url(#glow)"/>
      <circle cx="200" cy="100" r="8" fill="#d946ef" filter="url(#glow)"/>
      <circle cx="350" cy="100" r="6" fill="#06b6d4" filter="url(#glow)"/>
      
      <!-- Interactive Scanline -->
      <line x1="200" y1="0" x2="200" y2="200" stroke="#d946ef" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8"/>
      <polygon points="195,0 205,0 200,8" fill="#d946ef" opacity="0.8"/>
    </g>

    <!-- Bottom Audio Timeline / Frequency Spectrum Bars -->
    <g transform="translate(40, 375)">
      <rect x="0" y="0" width="8" height="15" rx="2" fill="#38bdf8" opacity="0.4"/>
      <rect x="12" y="-10" width="8" height="25" rx="2" fill="#38bdf8" opacity="0.7"/>
      <rect x="24" y="-22" width="8" height="37" rx="2" fill="#06b6d4" filter="url(#glow)"/>
      <rect x="36" y="-5" width="8" height="20" rx="2" fill="#06b6d4" opacity="0.5"/>
      <rect x="48" y="-18" width="8" height="33" rx="2" fill="#8b5cf6" opacity="0.8"/>
      <rect x="60" y="-30" width="8" height="45" rx="2" fill="#8b5cf6" filter="url(#glow)"/>
      <rect x="72" y="-15" width="8" height="30" rx="2" fill="#d946ef" opacity="0.6"/>
      <rect x="84" y="-38" width="8" height="53" rx="2" fill="#d946ef" filter="url(#glow)"/>
      <rect x="96" y="-25" width="8" height="40" rx="2" fill="#38bdf8" opacity="0.9"/>
      <rect x="108" y="-12" width="8" height="27" rx="2" fill="#38bdf8" opacity="0.5"/>
      <rect x="120" y="-20" width="8" height="35" rx="2" fill="#06b6d4" opacity="0.7"/>
      <rect x="132" y="-35" width="8" height="50" rx="2" fill="#06b6d4" filter="url(#glow)"/>
      <rect x="144" y="-18" width="8" height="33" rx="2" fill="#8b5cf6" opacity="0.6"/>
      <rect x="156" y="-8" width="8" height="23" rx="2" fill="#8b5cf6" opacity="0.4"/>
      
      <!-- Timeline text status -->
      <text x="180" y="5" font-family="Courier New, monospace" font-size="11" fill="#94a3b8">STREAMING_BUFFER: 99.9%</text>
    </g>
  </g>

  <!-- Feature Callout Cards (Bottom Left) -->
  <g transform="translate(80, 310)">
    <!-- Card 1: Industrialize Media -->
    <rect x="0" y="0" width="255" height="110" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <path d="M 20 30 L 40 30 M 30 20 L 30 40" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Enterprise Scale</text>
    <text x="60" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Automated pipeline</text>
    <text x="60" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">for 2026 workflows.</text>
    <path d="M 20 85 L 235 85" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="101" font-family="Courier New, monospace" font-size="10" fill="#38bdf8">API_READY // v3.0</text>

    <!-- Card 2: Voice Cloning -->
    <g transform="translate(275, 0)">
      <rect x="0" y="0" width="255" height="110" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
      <circle cx="30" cy="30" r="10" fill="none" stroke="#d946ef" stroke-width="2"/>
      <circle cx="30" cy="30" r="3" fill="#d946ef" filter="url(#glow)"/>
      <text x="60" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Voice Cloning</text>
      <text x="60" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Zero-shot emotional</text>
      <text x="60" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">speech generation.</text>
      <path d="M 20 85 L 235 85" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="101" font-family="Courier New, monospace" font-size="10" fill="#d946ef">NEURAL_CLONE_ACTIVE</text>
    </g>
  </g>

  <!-- Footer Brand Signature -->
  <g transform="translate(80, 560)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.5">INVESTIGATION BY HELIATECH.ONLINE</text>
    <circle cx="235" cy="-4" r="3" fill="#06b6d4" filter="url(#glow)"/>
    <text x="250" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#475569">PUBLISHED Q1 2026</text>
  </g>
</svg>