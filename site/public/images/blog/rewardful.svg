<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background &amp; Base Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#070b19"/>
      <stop offset="100%" stop-color="#0f0c1b"/>
    </linearGradient>

    <!-- Glowing Orbs &amp; Ambient Lighting -->
    <radialGradient id="ambientCyan" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientViolet" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientFuchsia" cx="70%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic &amp; Glass Gradients -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="nodeActiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="stripeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowSubtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Patterns -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Ambient Lighting Orbs -->
  <rect width="1200" height="630" fill="url(#ambientCyan)"/>
  <rect width="1200" height="630" fill="url(#ambientViolet)"/>
  <rect width="1200" height="630" fill="url(#ambientFuchsia)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- ==========================================
       TOP BADGE &amp; BRANDING
       ========================================== -->
  <g transform="translate(80, 60)">
    <!-- Pill Background -->
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="url(#glassBorder)" stroke-width="1.5" filter="url(#shadow)"/>
    <!-- Glowing Status Dot -->
    <circle cx="20" cy="17" r="5" fill="#06b6d4" filter="url(#glowSubtle)"/>
    <circle cx="20" cy="17" r="2.5" fill="#ffffff"/>
    <!-- Badge Text -->
    <text x="38" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- ==========================================
       TYPOGRAPHY &amp; HEADINGS (Left Column)
       ========================================== -->
  <g transform="translate(80, 130)">
    <!-- Category &amp; Tool Title -->
    <text x="0" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#a855f7" letter-spacing="3">SAAS INFRASTRUCTURE &amp; GROWTH</text>
    
    <!-- Main Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
      REWARDFUL <tspan fill="url(#nodeActiveGrad)">2026</tspan>
    </text>
    
    <!-- Subtitle / Investigation Statement -->
    <text x="0" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Architectural Teardown: How Modern SaaS Founders Build
    </text>
    <text x="0" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      a <tspan fill="#38bdf8" font-weight="700">$50k/mo</tspan> Recurring Affiliate Engine with Stripe
    </text>

    <!-- Key Metrics Badges -->
    <g transform="translate(0, 195)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="160" height="50" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">WEBHOOK LATENCY</text>
      <text x="16" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#06b6d4">&lt; 42ms</text>

      <!-- Metric 2 -->
      <rect x="175" y="0" width="160" height="50" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="191" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">ATTRIBUTION SYNC</text>
      <text x="191" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#a855f7">100% Native</text>
      
      <!-- Metric 3 -->
      <rect x="350" y="0" width="145" height="50" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="366" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">ENGINEERING</text>
      <text x="366" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#38bdf8">Tier-1 SaaS</text>
    </g>
  </g>

  <!-- ==========================================
       ISOMETRIC VECTOR WORKFLOW ILLUSTRATION (Right)
       Domain Metaphor: Interconnected Workflow Logic, 
       Stripe API Pipelines &amp; Real-time Revenue Streams
       ========================================== -->
  <g transform="translate(680, 80)" filter="url(#shadow)">
    
    <!-- Background Glass Panel for Engine -->
    <rect x="-30" y="0" width="480" height="500" rx="24" fill="url(#glassGrad)" stroke="url(#glassBorder)" stroke-width="1.5" backdrop-filter="blur(20px)"/>
    
    <!-- Decorative Header inside Panel -->
    <circle cx="10" cy="24" r="5" fill="#f43f5e" opacity="0.8"/>
    <circle cx="28" cy="24" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="46" cy="24" r="5" fill="#10b981" opacity="0.8"/>
    <text x="70" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">REWARDFUL_PIPELINE_ENGINE.TS</text>
    <line x1="-30" y1="45" x2="450" y2="45" stroke="#1e293b" stroke-width="1"/>

    <!-- ================= CONNECTIONS / FLOW LINES ================= -->
    <g fill="none" stroke-width="2.5">
      <!-- Path: Stripe to Core Engine -->
      <path d="M 80 140 L 210 140" stroke="url(#stripeGrad)" stroke-dasharray="6 4" filter="url(#glowSubtle)"/>
      <!-- Path: Core Engine to Commissions -->
      <path d="M 210 180 L 210 240 L 110 280" stroke="url(#nodeActiveGrad)" filter="url(#glowSubtle)"/>
      <!-- Path: Core Engine to Payouts -->
      <path d="M 210 180 L 210 240 L 310 280" stroke="#d946ef" filter="url(#glowSubtle)"/>
      <!-- Path: Feedback loop -->
      <path d="M 110 330 C 110 400, 310 400, 310 330" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="4 4"/>
    </g>

    <!-- Animated Pulse Dots on Pathways -->
    <circle cx="145" cy="140" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="160" cy="260" r="4" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="260" cy="260" r="4" fill="#d946ef" filter="url(#glow)"/>

    <!-- ================= NODE 1: STRIPE GATEWAY ================= -->
    <g transform="translate(30, 95)" filter="url(#shadow)">
      <rect width="100" height="90" rx="14" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
      <!-- Icon/Symbol -->
      <path d="M 35 30 C 35 22, 65 22, 65 30 C 65 40, 35 40, 35 50 C 35 58, 65 58, 65 50" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/>
      <text x="50" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Stripe API</text>
    </g>

    <!-- ================= NODE 2: REWARDFUL CORE ROUTER ================= -->
    <g transform="translate(150, 80)" filter="url(#shadow)">
      <rect width="120" height="100" rx="16" fill="#0f172a" stroke="url(#nodeActiveGrad)" stroke-width="2"/>
      <circle cx="60" cy="38" r="16" fill="#06b6d4" fill-opacity="0.15"/>
      <!-- Core Icon (Hub) -->
      <circle cx="60" cy="38" r="6" fill="#06b6d4"/>
      <circle cx="60" cy="38" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="60" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Rewardful</text>
    </g>

    <!-- ================= NODE 3: ATTRIBUTION ENGINE ================= -->
    <g transform="translate(45, 275)" filter="url(#shadow)">
      <rect width="130" height="85" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="16" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">ATTRIBUTION</text>
      <!-- Mini Chart -->
      <path d="M 16 65 L 40 45 L 65 55 L 90 30 L 114 50" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="90" cy="30" r="3" fill="#ffffff"/>
    </g>

    <!-- ================= NODE 4: PAYOUT AUTOMATION ================= -->
    <g transform="translate(245, 275)" filter="url(#shadow)">
      <rect width="130" height="85" rx="14" fill="#0f172a" stroke="#d946ef" stroke-width="1.5"/>
      <text x="16" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#d946ef" letter-spacing="1">RECURRING MRR</text>
      <text x="16" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff">+$50,240</text>
    </g>

    <!-- ================= FLOATING CODE / METRIC CHIP ================= -->
    <g transform="translate(130, 400)" filter="url(#shadow)">
      <rect width="160" height="46" rx="10" fill="#090d16" stroke="#8b5cf6" stroke-width="1.5"/>
      <circle cx="20" cy="23" r="4" fill="#10b981"/>
      <text x="35" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#94a3b8">WEBHOOK LISTENER</text>
      <text x="35" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#a855f7">customer.subscription.created</text>
    </g>

    <!-- Corner Accents on Main Panel -->
    <path d="M -30 20 L -30 -10 L 0 -10" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M 420 490 L 450 490 L 450 460" fill="none" stroke="#d946ef" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- ==========================================
       FOOTER BRANDING / METADATA
       ========================================== -->
  <g transform="translate(80, 560)">
    <line x1="0" y1="0" x2="570" y2="0" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1">
      PUBLISHED BY <tspan fill="#38bdf8">HELIA TECH</tspan> — ENTERPRISE SOFTWARE INTELLIGENCE
    </text>
    <text x="570" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="end">
      heliatech.online
    </text>
  </g>
</svg>