<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#060913" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="grid-fade" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="grad-cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="grad-violet-fuchsia" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="glass-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <linearGradient id="timeline-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#d946ef" stop-opacity="1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Patterns -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>

    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8b5cf6" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- 1. Deep Background -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />
  <rect width="1200" height="630" fill="url(#cyber-grid)" />
  <rect width="1200" height="630" fill="url(#dot-grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="180" r="220" fill="#8b5cf6" opacity="0.15" filter="url(#glow-heavy)" />
  <circle cx="250" cy="500" r="250" fill="#06b6d4" opacity="0.1" filter="url(#glow-heavy)" />

  <!-- Diagonal Tech Accent Lines -->
  <path d="M-100 200 L500 -100" stroke="url(#grad-cyan-blue)" stroke-width="1.5" opacity="0.2" />
  <path d="M700 730 L1300 230" stroke="url(#grad-violet-fuchsia)" stroke-width="1.5" opacity="0.2" />

  <!-- ==================== HEADER & BADGE ==================== -->
  <g transform="translate(80, 70)">
    <!-- Top Pill Badge -->
    <g filter="url(#glow-subtle)">
      <rect x="0" y="0" width="310" height="34" rx="17" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
      <circle cx="20" cy="17" r="5" fill="#06b6d4" />
      <circle cx="20" cy="17" r="8" fill="#06b6d4" opacity="0.3" filter="url(#glow-subtle)" />
      <text x="38" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Title & Subtitle -->
    <text x="0" y="95" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1" filter="url(#drop-shadow)">
      PERIPETY
    </text>
    
    <text x="245" y="95" fill="#d946ef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1" filter="url(#glow-heavy)">
      .
    </text>

    <text x="0" y="132" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="0.5">
      AI VIDEO <tspan fill="#38bdf8">•</tspan> 2026 CINEMATIC ENTERPRISE SCALE GUIDE
    </text>
  </g>


  <!-- ==================== 3D VECTOR ILLUSTRATION (AI VIDEO DOMAIN METAPHOR) ==================== -->
  <g transform="translate(620, 95)" filter="url(#drop-shadow)">
    
    <!-- Holographic Base Platform (Isometric Grid Plane) -->
    <path d="M 50 380 L 260 460 L 520 360 L 310 280 Z" fill="#0b1329" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 120 405 L 330 485 L 450 435 L 240 355 Z" fill="url(#glass-surface)" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3" />

    <!-- Isometric Video Render Node Cubes / Neural Processors -->
    <!-- Cube 1 (Back Left) -->
    <g transform="translate(140, 180)">
      <path d="M 0 -40 L 50 -65 L 100 -40 L 50 -15 Z" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5" />
      <path d="M 0 -40 L 0 20 L 50 45 L 50 -15 Z" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
      <path d="M 100 -40 L 100 20 L 50 45 L 50 -15 Z" fill="#172038" stroke="#8b5cf6" stroke-width="1" />
      <circle cx="50" cy="15" r="8" fill="#d946ef" filter="url(#glow-subtle)" />
    </g>

    <!-- Cube 2 (Center Core - Main AI Engine) -->
    <g transform="translate(260, 120)">
      <path d="M 0 -50 L 60 -80 L 120 -50 L 60 -20 Z" fill="#172554" stroke="#38bdf8" stroke-width="2" />
      <path d="M 0 -50 L 0 30 L 60 60 L 60 -20 Z" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" />
      <path d="M 120 -50 L 120 30 L 60 60 L 60 -20 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Inner glowing core representation -->
      <path d="M 60 -10 L 80 0 L 60 10 L 40 0 Z" fill="#06b6d4" filter="url(#glow-heavy)" />
      <path d="M 60 -45 L 60 -25" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Cube 3 (Front Right - Vector Output) -->
    <g transform="translate(330, 240)">
      <path d="M 0 -35 L 45 -55 L 90 -35 L 45 -15 Z" fill="#311042" stroke="#d946ef" stroke-width="1.5" />
      <path d="M 0 -35 L 0 15 L 45 35 L 45 -15 Z" fill="#13071c" stroke="#d946ef" stroke-width="1" />
      <path d="M 90 -35 L 90 15 L 45 35 L 45 -15 Z" fill="#1e0c2e" stroke="#d946ef" stroke-width="1" />
      <circle cx="45" cy="10" r="6" fill="#38bdf8" filter="url(#glow-subtle)" />
    </g>

    <!-- Connecting Neural Energy Beams -->
    <path d="M 190 155 L 320 100" stroke="url(#grad-cyan-blue)" stroke-width="2" stroke-dasharray="6,4" filter="url(#glow-subtle)" />
    <path d="M 320 150 L 375 235" stroke="url(#grad-violet-fuchsia)" stroke-width="2" filter="url(#glow-subtle)" />

    <!-- Floating Holographic Video Timeline & Sound Waveforms -->
    <g transform="translate(40, 20)">
      <!-- Main Timeline Panel Frame -->
      <rect x="0" y="0" width="420" height="150" rx="12" fill="#090d16" fill-opacity="0.85" stroke="url(#grad-cyan-blue)" stroke-width="1.5" filter="url(#drop-shadow)" />
      
      <!-- Window Controls -->
      <circle cx="20" cy="20" r="4" fill="#ef4444" opacity="0.8"/>
      <circle cx="35" cy="20" r="4" fill="#f59e0b" opacity="0.8"/>
      <circle cx="50" cy="20" r="4" fill="#10b981" opacity="0.8"/>
      
      <text x="75" y="24" fill="#64748b" font-family="monospace" font-size="10" font-weight="600">PERIPETY_AUTONOMOUS_RENDER_v4.2</text>
      
      <!-- Audio/Video Frequency Waveform tracks -->
      <g transform="translate(25, 45)">
        <!-- Track 1 (Cyan Video Stream) -->
        <rect x="0" y="0" width="370" height="24" rx="4" fill="#0b1329" stroke="#38bdf8" stroke-opacity="0.3"/>
        <path d="M 10 12 Q 30 2, 50 12 T 90 12 T 130 12 T 170 2, 210 12 T 250 12 T 290 2, 330 12 T 360 12" fill="none" stroke="#06b6d4" stroke-width="2" filter="url(#glow-subtle)" />
        
        <!-- Track 2 (Fuchsia Audio Envelope) -->
        <rect x="0" y="34" width="370" height="24" rx="4" fill="#13071c" stroke="#d946ef" stroke-opacity="0.3"/>
        <path d="M 10 46 L 25 38 L 40 52 L 55 42 L 70 50 L 85 38 L 100 48 L 115 42 L 130 54 L 145 38 L 160 46 L 175 40 L 190 50 L 205 44 L 220 52 L 235 38 L 250 48 L 265 42 L 280 50 L 295 38 L 310 46 L 325 40 L 340 50 L 355 46" fill="none" stroke="#d946ef" stroke-width="1.5" />

        <!-- Track 3 (Neural Latent Space Vector Graph) -->
        <rect x="0" y="68" width="370" height="24" rx="4" fill="#0b1329" stroke="#8b5cf6" stroke-opacity="0.3"/>
        <polyline points="10,88 35,78 60,84 85,74 110,82 135,76 160,86 185,72 210,80 235,78 260,84 285,74 310,82 335,76 360,80" fill="none" stroke="#38bdf8" stroke-width="1.5" />
      </g>

      <!-- Active Playhead Laser Line -->
      <line x1="240" y1="35" x2="240" y2="145" stroke="url(#timeline-laser)" stroke-width="2" filter="url(#glow-heavy)" />
      <polygon points="236,35 244,35 240,40" fill="#d946ef" />

      <!-- Floating Holographic Metric Badges -->
      <g transform="translate(30, 145)" filter="url(#glow-subtle)">
        <rect x="0" y="0" width="110" height="22" rx="4" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
        <text x="10" y="15" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">FPS: 120.0 UHD</text>
      </g>

      <g transform="translate(150, 145)" filter="url(#glow-subtle)">
        <rect x="0" y="0" width="130" height="22" rx="4" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
        <text x="10" y="15" fill="#d946ef" font-family="monospace" font-size="10" font-weight="700">LATENCY: 4.2ms</text>
      </g>
    </g>

    <!-- Floating Nodes and Sparkles -->
    <circle cx="30" cy="180" r="4" fill="#38bdf8" filter="url(#glow-heavy)" />
    <circle cx="480" cy="100" r="5" fill="#d946ef" filter="url(#glow-heavy)" />
    <circle cx="430" cy="320" r="3" fill="#06b6d4" filter="url(#glow-heavy)" />
    <circle cx="100" cy="350" r="4" fill="#8b5cf6" filter="url(#glow-heavy)" />

    <!-- Vector Particle Connections -->
    <path d="M 30 180 L 140 180" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3,3" />
    <path d="M 480 100 L 380 120" stroke="#d946ef" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3,3" />
  </g>


  <!-- ==================== BOTTOM FEATURE TAGS / METRICS ==================== -->
  <g transform="translate(80, 545)">
    <!-- Feature Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="175" height="38" rx="8" fill="#090d16" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="20" cy="19" r="4" fill="#06b6d4" />
      <text x="35" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Autonomous Neural</text>
    </g>

    <!-- Feature Pill 2 -->
    <g transform="translate(195, 0)">
      <rect x="0" y="0" width="165" height="38" rx="8" fill="#090d16" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="20" cy="19" r="4" fill="#8b5cf6" />
      <text x="35" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Cinematic Scale</text>
    </g>

    <!-- Feature Pill 3 -->
    <g transform="translate(380, 0)">
      <rect x="0" y="0" width="165" height="38" rx="8" fill="#090d16" stroke="#d946ef" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="20" cy="19" r="4" fill="#d946ef" />
      <text x="35" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Real-Time Synthesis</text>
    </g>
  </g>

  <!-- HELIATECH Watermark / Brand Signature -->
  <g transform="translate(1040, 575)">
    <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="3" text-anchor="end">HELIATECH.ONLINE</text>
  </g>
</svg>