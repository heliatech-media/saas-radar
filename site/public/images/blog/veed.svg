<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-gradient" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0e1628"/>
      <stop offset="50%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-fuchsia" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients for UI & Vectors -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="cyan-blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="panel-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow-intense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <pattern id="dots-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>
  <rect width="1200" height="630" fill="url(#grid-pattern)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="950" cy="150" r="300" fill="url(#glow-cyan)"/>
  <circle cx="200" cy="500" r="350" fill="url(#glow-fuchsia)"/>
  <circle cx="600" cy="300" r="250" fill="url(#glow-violet)"/>

  <!-- Geometric Accent Lines & Circuitry -->
  <g opacity="0.4">
    <path d="M 50 100 L 250 100 L 300 150 L 500 150" fill="none" stroke="url(#cyan-blue-grad)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <path d="M 900 500 L 1050 500 L 1150 400" fill="none" stroke="#d946ef" stroke-width="1.5"/>
    <circle cx="300" cy="150" r="3" fill="#38bdf8"/>
    <circle cx="1050" cy="500" r="3" fill="#d946ef"/>
  </g>

  <!-- TOP BADGE: HELIATECH ARCHITECTURAL DOSSIER -->
  <g transform="translate(80, 60)">
    <!-- Pill Background -->
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#090d16" stroke="url(#border-grad)" stroke-width="1.5"/>
    <!-- Glowing Status Dot -->
    <circle cx="20" cy="17" r="4" fill="#06b6d4" filter="url(#glow-subtle)"/>
    <circle cx="20" cy="17" r="2" fill="#ffffff"/>
    <!-- Badge Text -->
    <text x="38" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- MAIN HEADINGS & METADATA -->
  <g transform="translate(80, 130)">
    <!-- Category Subtitle -->
    <text x="0" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#d946ef" letter-spacing="3" filter="url(#glow-subtle)">AI VIDEO • ENTERPRISE INTELLIGENCE</text>
    
    <!-- Tool Title: VEED -->
    <text x="0" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="2">
      VEED<tspan fill="#06b6d4">.</tspan>
    </text>

    <!-- Investigation Title -->
    <text x="0" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">The Browser-Based AI Revolution and the Modern</text>
    <text x="0" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">Blueprint for High-Velocity Video Teams</text>
  </g>

  <!-- 3D DOMAIN METAPHOR: HOLOGRAPHIC AI VIDEO & TIMELINE ENGINE -->
  <g transform="translate(680, 80)">
    <!-- Main Floating Holographic Container -->
    <rect x="0" y="0" width="440" height="470" rx="20" fill="url(#panel-glass)" stroke="url(#border-grad)" stroke-width="2" filter="url(#glow-subtle)" backdrop-filter="blur(20px)"/>
    
    <!-- Window Header Controls -->
    <circle cx="30" cy="30" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="50" cy="30" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="70" cy="30" r="5" fill="#10b981" opacity="0.8"/>
    <text x="360" y="34" font-family="monospace" font-size="11" fill="#38bdf8" opacity="0.6">NEURAL.RENDER</text>
    <line x1="20" y1="50" x2="420" y2="50" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- 3D Isometric Video Frame Preview Box -->
    <g transform="translate(35, 75)">
      <!-- Outer Frame -->
      <rect x="0" y="0" width="370" height="180" rx="10" fill="#030712" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
      
      <!-- Grid Inside Preview -->
      <rect x="10" y="10" width="350" height="160" rx="6" fill="url(#dots-pattern)"/>

      <!-- Simulated AI Video Output Graphics (Vector Neural Waves & Nodes) -->
      <path d="M 40 90 Q 110 30, 185 90 T 330 90" fill="none" stroke="url(#primary-grad)" stroke-width="4" filter="url(#glow-intense)"/>
      <path d="M 40 110 Q 120 150, 200 90 T 330 70" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.7"/>

      <!-- Floating HUD Elements over Video -->
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="95" height="24" rx="6" fill="#060913" fill-opacity="0.8" stroke="#06b6d4" stroke-width="1"/>
        <circle cx="12" cy="12" r="3" fill="#06b6d4" filter="url(#glow-subtle)"/>
        <text x="25" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#06b6d4">AI TRANSCRIBE</text>
      </g>

      <g transform="translate(255, 20)">
        <rect x="0" y="0" width="95" height="24" rx="6" fill="#060913" fill-opacity="0.8" stroke="#d946ef" stroke-width="1"/>
        <circle cx="12" cy="12" r="3" fill="#d946ef" filter="url(#glow-subtle)"/>
        <text x="25" y="16" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#d946ef">4K NEURAL FX</text>
      </g>

      <!-- Center AI Target Reticle -->
      <g transform="translate(185, 90)">
        <circle cx="0" cy="0" r="25" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-dasharray="4 2"/>
        <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#glow-subtle)"/>
        <line x1="-35" y1="0" x2="-10" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
        <line x1="10" y1="0" x2="35" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
        <line x1="0" y1="-35" x2="0" y2="-10" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
        <line x1="0" y1="10" x2="0" y2="35" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
      </g>
    </g>

    <!-- Multi-Track Audio & Video Timeline UI -->
    <g transform="translate(35, 275)">
      <!-- Track 1: Video/AI Nodes -->
      <rect x="0" y="0" width="370" height="38" rx="6" fill="#030712" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="15" y="9" width="80" height="20" rx="4" fill="#06b6d4" fill-opacity="0.3" stroke="#06b6d4" stroke-width="1"/>
      <text x="25" y="23" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">CLIP_01.MP4</text>
      
      <rect x="110" y="9" width="140" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="1"/>
      <text x="120" y="23" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#d8b4fe">AI_MAGIC_CUT</text>

      <rect x="265" y="9" width="90" height="20" rx="4" fill="#d946ef" fill-opacity="0.3" stroke="#d946ef" stroke-width="1"/>
      <text x="275" y="23" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#f5d0fe">AUTO_SUB</text>

      <!-- Track 2: Audio Waveform -->
      <rect x="0" y="46" width="370" height="38" rx="6" fill="#030712" stroke="#ffffff" stroke-opacity="0.08"/>
      <!-- Waveform Bars -->
      <g transform="translate(20, 56)" fill="#38bdf8" opacity="0.7">
        <rect x="0" y="4" width="3" height="10" rx="1.5"/>
        <rect x="6" y="1" width="3" height="16" rx="1.5"/>
        <rect x="12" y="6" width="3" height="6" rx="1.5"/>
        <rect x="18" y="0" width="3" height="18" rx="1.5"/>
        <rect x="24" y="3" width="3" height="12" rx="1.5"/>
        <rect x="30" y="7" width="3" height="4" rx="1.5"/>
        <rect x="36" y="2" width="3" height="14" rx="1.5"/>
        <rect x="42" y="5" width="3" height="8" rx="1.5"/>
        <rect x="48" y="1" width="3" height="16" rx="1.5"/>
        <rect x="54" y="4" width="3" height="10" rx="1.5"/>
      </g>
      <g transform="translate(85, 56)" fill="#d946ef" opacity="0.7">
        <rect x="0" y="2" width="3" height="14" rx="1.5"/>
        <rect x="6" y="5" width="3" height="8" rx="1.5"/>
        <rect x="12" y="0" width="3" height="18" rx="1.5"/>
        <rect x="18" y="4" width="3" height="10" rx="1.5"/>
        <rect x="24" y="6" width="3" height="6" rx="1.5"/>
        <rect x="30" y="2" width="3" height="14" rx="1.5"/>
      </g>
      <text x="280" y="70" font-family="monospace" font-size="10" fill="#d946ef">VO_SYNTH.WAV</text>

      <!-- Playhead Line -->
      <line x1="185" y1="-210" x2="185" y2="120" stroke="#d946ef" stroke-width="2" filter="url(#glow-subtle)"/>
      <polygon points="180,-210 190,-210 185,-200" fill="#d946ef"/>
    </g>

    <!-- Bottom Status Metrics inside Panel -->
    <g transform="translate(35, 400)">
      <line x1="0" y1="0" x2="370" y2="0" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="0" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">LATENCY: <tspan fill="#38bdf8" font-weight="700">12ms</tspan></text>
      <text x="140" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">CLOUD RENDER: <tspan fill="#06b6d4" font-weight="700">60 FPS</tspan></text>
      <text x="295" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#10b981" font-weight="700">ONLINE</text>
    </g>
  </g>

  <!-- HELIATECH BRANDING WATERMARK / FOOTER -->
  <g transform="translate(80, 570)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" opacity="0.4" letter-spacing="2">HELIA TECH</text>
    <text x="105" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#38bdf8" opacity="0.4" letter-spacing="1">/// heliatech.online</text>
  </g>
</svg>