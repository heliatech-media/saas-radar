<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="60%" cy="40%" r="70%" fx="60%" fy="40%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    
    <!-- Neon Glow Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glassBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <!-- Linear Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="violetFuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.6)"/>
      <stop offset="50%" stop-color="rgba(139, 92, 246, 0.2)"/>
      <stop offset="100%" stop-color="rgba(217, 70, 239, 0.5)"/>
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.75)"/>
      <stop offset="100%" stop-color="rgba(7, 10, 20, 0.85)"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.04)" stroke-width="1"/>
    </pattern>

    <!-- Dot Pattern -->
    <pattern id="dotMatrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(139, 92, 246, 0.15)" />
    </pattern>
  </defs>

  <!-- 1. BACKGROUND & AMBIENT LIGHTING -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#cyberGrid)" />
  <rect width="1200" height="630" fill="url(#dotMatrix)" opacity="0.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="950" cy="180" r="220" fill="#8b5cf6" opacity="0.12" filter="url(#glassBlur)" />
  <circle cx="750" cy="450" r="260" fill="#06b6d4" opacity="0.1" filter="url(#glassBlur)" />
  <circle cx="200" cy="100" r="180" fill="#38bdf8" opacity="0.08" filter="url(#glassBlur)" />

  <!-- 2. BACKGROUND ARCHITECTURAL VECTOR LINES -->
  <g opacity="0.3">
    <path d="M 0 500 L 400 500 L 550 630" fill="none" stroke="url(#cyanBlue)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <path d="M 1200 150 L 900 150 L 750 20" fill="none" stroke="url(#violetFuchsia)" stroke-width="1.5"/>
    <circle cx="400" cy="500" r="4" fill="#38bdf8" />
    <circle cx="900" cy="150" r="4" fill="#8b5cf6" />
  </g>

  <!-- 3. TOP PILL BADGE -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="280" height="32" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="url(#glassStroke)" stroke-width="1.5" />
    <circle cx="20" cy="16" r="4" fill="#06b6d4" filter="url(#softGlow)" />
    <text x="36" y="21" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- 4. TYPOGRAPHY & HEADINGS -->
  <g transform="translate(80, 145)">
    <!-- Category Subtitle -->
    <text x="0" y="0" fill="#8b5cf6" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="3.5" filter="url(#softGlow)">B2B SALES &amp; CRM INTELLIGENCE</text>
    
    <!-- Main Title: CLOSE CRM -->
    <text x="0" y="55" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="1">CLOSE CRM</text>

    <!-- Subtitle / Hook -->
    <text x="0" y="95" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      <tspan x="0" dy="0">The Anatomy of High-Velocity Sales and the</tspan>
      <tspan x="0" dy="24">Blueprint for Outpacing the Competition.</tspan>
    </text>
  </g>

  <!-- 5. DOMAIN METAPHOR: 3D DATA / CRM INTELLIGENCE ENGINE -->
  <g transform="translate(620, 90)">
    <!-- Glassmorphic Container Backdrop -->
    <rect x="0" y="0" width="500" height="470" rx="24" fill="url(#cardBg)" stroke="url(#glassStroke)" stroke-width="1.5" filter="url(#softGlow)" />
    
    <!-- Top Bar of Holographic Terminal -->
    <path d="M 24 0 L 476 0 A 24 24 0 0 1 500 24 L 500 50 L 0 50 L 0 24 A 24 24 0 0 1 24 0 Z" fill="rgba(255, 255, 255, 0.03)" />
    <circle cx="36" cy="25" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="56" cy="25" r="6" fill="#f59e0b" opacity="0.8" />
    <circle cx="76" cy="25" r="6" fill="#10b981" opacity="0.8" />
    <text x="104" y="29" fill="#64748b" font-family="monospace" font-size="11" letter-spacing="1.5">SYS.DIAGNOSTIC // PIPELINE_VELOCITY.V4</text>
    <line x1="0" y1="50" x2="500" y2="50" stroke="rgba(255,255,255,0.06)" />

    <!-- Isometric CRM Nodes & High-Velocity Data Flow -->
    <g transform="translate(50, 80)">
      
      <!-- Connection Web Lines -->
      <path d="M 70 120 L 200 70 L 330 140 L 250 260 L 100 230 Z" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" stroke-dasharray="4 4"/>
      <path d="M 200 70 L 250 260" fill="none" stroke="url(#violetFuchsia)" stroke-width="2" opacity="0.6"/>
      <path d="M 70 120 L 330 140" fill="none" stroke="url(#cyanBlue)" stroke-width="2" opacity="0.5"/>

      <!-- Node 1: Contact Enriched Graph (Top Left) -->
      <g transform="translate(20, 60)" filter="url(#softGlow)">
        <polygon points="50,0 100,25 100,75 50,100 0,75 0,25" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
        <circle cx="50" cy="50" r="16" fill="url(#cyanBlue)" />
        <!-- Inner icon: User/Contact -->
        <path d="M 43 54 C 43 49 46 47 50 47 C 54 47 57 49 57 54 Z M 50 45 C 47.5 45 45.5 43 45.5 40.5 C 45.5 38 47.5 36 50 36 C 52.5 36 54.5 38 54.5 40.5 C 54.5 43 52.5 45 50 45 Z" fill="#030712" />
        <text x="25" y="125" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">CONTACT GRAPH</text>
      </g>

      <!-- Node 2: Multi-Dimensional Database Cube (Top Right) -->
      <g transform="translate(260, 40)" filter="url(#softGlow)">
        <polygon points="45,0 90,22 90,68 45,90 0,68 0,22" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" />
        <circle cx="45" cy="45" r="16" fill="url(#violetFuchsia)" />
        <!-- Inner icon: Database / Cube -->
        <path d="M 40 40 L 50 35 L 60 40 L 50 45 Z M 40 43 L 50 48 L 50 55 L 40 50 Z M 60 43 L 50 48 L 50 55 L 60 50 Z" fill="#030712" />
        <text x="12" y="115" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">DATA CUBE</text>
      </g>

      <!-- Node 3: High-Velocity Revenue Chart (Bottom Center) -->
      <g transform="translate(140, 190)" filter="url(#softGlow)">
        <polygon points="50,0 100,25 100,75 50,100 0,75 0,25" fill="#0f172a" stroke="#d946ef" stroke-width="2" />
        <circle cx="50" cy="50" r="16" fill="url(#violetFuchsia)" />
        <!-- Inner icon: Trending Up / Revenue -->
        <path d="M 40 55 L 46 47 L 52 51 L 60 40 M 60 40 L 55 40 M 60 40 L 60 45" fill="none" stroke="#030712" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <text x="4" y="125" fill="#e879f9" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">REVENUE VELOCITY</text>
      </g>

      <!-- Floating Holographic Data Particles -->
      <circle cx="160" cy="110" r="3" fill="#38bdf8" filter="url(#softGlow)" />
      <circle cx="280" cy="150" r="4" fill="#d946ef" filter="url(#softGlow)" />
      <circle cx="110" cy="200" r="3" fill="#8b5cf6" filter="url(#softGlow)" />
    </g>

    <!-- Mini Real-time Performance Metrics Overlay inside Card -->
    <g transform="translate(30, 360)">
      <rect x="0" y="0" width="440" height="64" rx="12" fill="rgba(3, 7, 18, 0.6)" stroke="rgba(255,255,255,0.06)" />
      
      <!-- Metric 1 -->
      <g transform="translate(20, 14)">
        <text x="0" y="14" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">CONVERSION LIFT</text>
        <text x="0" y="36" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="800">+342%</text>
      </g>
      
      <!-- Divider -->
      <line x1="150" y1="12" x2="150" y2="52" stroke="rgba(255,255,255,0.1)" />

      <!-- Metric 2 -->
      <g transform="translate(175, 14)">
        <text x="0" y="14" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">PIPELINE SPEED</text>
        <text x="0" y="36" fill="#c084fc" font-family="system-ui, sans-serif" font-size="20" font-weight="800">4.8X</text>
      </g>

      <!-- Divider -->
      <line x1="300" y1="12" x2="300" y2="52" stroke="rgba(255,255,255,0.1)" />

      <!-- Metric 3 -->
      <g transform="translate(325, 14)">
        <text x="0" y="14" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">AUTOMATION</text>
        <text x="0" y="36" fill="#e879f9" font-family="system-ui, sans-serif" font-size="20" font-weight="800">99.9%</text>
      </g>
    </g>
  </g>

  <!-- 6. BOTTOM METADATA & BRANDING FOOTER -->
  <g transform="translate(80, 560)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="rgba(255, 255, 255, 0.08)" />
    
    <!-- Left Brand Signoff -->
    <text x="0" y="25" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2">
      EXPLORE THE FULL DOSSIER AT <tspan fill="#38bdf8">HELIATECH.ONLINE</tspan>
    </text>

    <!-- Right Security / Verification Tag -->
    <g transform="translate(850, 12)">
      <rect x="0" y="0" width="190" height="24" rx="12" fill="rgba(139, 92, 246, 0.1)" stroke="rgba(139, 92, 246, 0.3)" />
      <circle cx="12" cy="12" r="3" fill="#c084fc" filter="url(#softGlow)" />
      <text x="26" y="16" fill="#c084fc" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1">VERIFIED INTEL</text>
    </g>
  </g>
</svg>