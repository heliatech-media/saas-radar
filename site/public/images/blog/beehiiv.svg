<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="cyber-grid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <!-- Brand Color Gradients -->
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="grad-fuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="glass-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow & Lighting Filters -->
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Hexagon Pattern Definition -->
    <pattern id="hex-pattern" width="40" height="69.282" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M 40 0 L 20 11.547 L 0 0 L 0 23.094 L 20 34.641 L 40 23.094 Z M 0 34.641 L 20 46.188 L 40 34.641 L 40 57.735 L 20 69.282 L 0 57.735 Z" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08" fill="none" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />
  <rect width="1200" height="630" fill="url(#hex-pattern)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="100" r="250" fill="#8b5cf6" opacity="0.12" filter="url(#glow-heavy)" />
  <circle cx="950" cy="500" r="300" fill="#06b6d4" opacity="0.1" filter="url(#glow-heavy)" />
  <circle cx="650" cy="200" r="200" fill="#d946ef" opacity="0.08" filter="url(#glow-heavy)" />

  <!-- Background Geometric Grid Lines -->
  <g opacity="0.3">
    <line x1="0" y1="126" x2="1200" y2="126" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="4 8" />
    <line x1="0" y1="504" x2="1200" y2="504" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="4 8" />
    <line x1="300" y1="0" x2="300" y2="630" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="4 8" />
    <line x1="900" y1="0" x2="900" y2="630" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="4 8" />
  </g>

  <!-- ==========================================
       RIGHT SIDE: 3D VECTOR BEEHIVE / NETWORK MATRIX
       ========================================== -->
  <g transform="translate(700, 315)">
    <!-- Central Network Core Glow -->
    <circle cx="0" cy="0" r="120" fill="url(#grad-cyan)" opacity="0.15" filter="url(#glow-heavy)" />
    
    <!-- Concentric Orbital Rings -->
    <ellipse cx="0" cy="0" rx="180" ry="90" fill="none" stroke="url(#grad-cyan)" stroke-width="1.5" stroke-opacity="0.4" transform="rotate(-25)" />
    <ellipse cx="0" cy="0" rx="220" ry="110" fill="none" stroke="url(#grad-fuchsia)" stroke-width="1" stroke-opacity="0.3" transform="rotate(35)" stroke-dasharray="8 4" />
    <ellipse cx="0" cy="0" rx="140" ry="70" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" transform="rotate(15)" />

    <!-- 3D Hexagonal Network Nodes (Beehive Metaphor for Modern Media Scaling) -->
    <!-- Node 1: Top -->
    <g transform="translate(0, -110)" filter="url(#glow-subtle)">
      <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9" fill="url(#glass-panel)" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#38bdf8" />
      <path d="M0,18 L0,35" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    </g>

    <!-- Node 2: Top Right -->
    <g transform="translate(95, -55)" filter="url(#glow-subtle)">
      <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9" fill="url(#glass-panel)" stroke="#06b6d4" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#06b6d4" />
      <path d="M-15,9 L-40,20" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6" />
    </g>

    <!-- Node 3: Bottom Right -->
    <g transform="translate(95, 55)" filter="url(#glow-subtle)">
      <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9" fill="url(#glass-panel)" stroke="url(#grad-fuchsia)" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#d946ef" />
      <path d="M-15,-9 L-40,-20" stroke="#d946ef" stroke-width="1" stroke-opacity="0.6" />
    </g>

    <!-- Node 4: Bottom -->
    <g transform="translate(0, 110)" filter="url(#glow-subtle)">
      <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9" fill="url(#glass-panel)" stroke="#8b5cf6" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#8b5cf6" />
      <path d="M0,-18 L0,-35" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.6" />
    </g>

    <!-- Node 5: Bottom Left -->
    <g transform="translate(-95, 55)" filter="url(#glow-subtle)">
      <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9" fill="url(#glass-panel)" stroke="url(#grad-amber)" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#f59e0b" />
      <path d="M15,-9 L40,-20" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6" />
    </g>

    <!-- Node 6: Top Left -->
    <g transform="translate(-95, -55)" filter="url(#glow-subtle)">
      <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9" fill="url(#glass-panel)" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="4" fill="#38bdf8" />
      <path d="M15,9 L40,20" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    </g>

    <!-- Interconnecting Data Flow Lines -->
    <path d="M0,-92 L82,-45 L82,45 L0,92 L-82,45 L-82,-45 Z" fill="none" stroke="url(#cyber-grid)" stroke-width="2" stroke-dasharray="6 3" />

    <!-- Center Master Hexagon (The Beehiiv Engine) -->
    <g filter="url(#glow-heavy)">
      <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="#090d16" stroke="url(#grad-cyan)" stroke-width="3" />
      <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="url(#glass-panel)" />
      <!-- Inner Glowing Pulse Dot -->
      <circle cx="0" cy="0" r="8" fill="#38bdf8" />
    </g>

    <!-- Floating Metric Particle Nodes (Growth & Scaling indicators) -->
    <g transform="translate(0, 0)">
      <!-- Pulsing Data rings radiating outwards -->
      <circle cx="0" cy="0" r="160" fill="none" stroke="#38bdf8" stroke-width="0.75" opacity="0.3">
        <animate attributeName="r" values="140;190;140" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.4;0;0.4" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="200" fill="none" stroke="#d946ef" stroke-width="0.75" opacity="0.2">
        <animate attributeName="r" values="180;240;180" dur="6s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.3;0;0.3" dur="6s" repeatCount="indefinite" />
      </circle>
    </g>
    
    <!-- Floating Data Micro-Badges -->
    <g transform="translate(140, -130)" filter="url(#glow-subtle)">
      <rect x="-45" y="-15" width="90" height="30" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1" />
      <text x="0" y="4" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">SCALE 10X</text>
    </g>

    <g transform="translate(-150, 130)" filter="url(#glow-subtle)">
      <rect x="-55" y="-15" width="110" height="30" rx="6" fill="#0f172a" stroke="#d946ef" stroke-width="1" />
      <text x="0" y="4" fill="#d946ef" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">B2B EMPIRE</text>
    </g>
  </g>

  <!-- ==========================================
       LEFT SIDE: TYPOGRAPHY & ARCHITECTURAL DOSSIER
       ========================================== -->
  <g transform="translate(80, 0)">
    
    <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
    <g transform="translate(0, 95)" filter="url(#glow-subtle)">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <!-- Glowing Status Dot -->
      <circle cx="20" cy="16" r="4" fill="#06b6d4" filter="url(#glow-heavy)">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="38" y="21" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Title Section: BEEHIIV -->
    <g transform="translate(0, 195)">
      <!-- Category Subtitle -->
      <text x="0" y="0" fill="#8b5cf6" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="4">MARKETING &amp; MEDIA INFRASTRUCTURE</text>
      
      <!-- Tool Title -->
      <text x="0" y="72" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" letter-spacing="3" filter="url(#glow-subtle)">BEEHIIV</text>
      
      <!-- Accent Line under Title -->
      <rect x="0" y="92" width="180" height="3" rx="1.5" fill="url(#grad-cyan)" />
    </g><!-- Investigation Headline -->
    <g transform="translate(0, 340)">
      <text x="0" y="0" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5">
        <tspan x="0" dy="0">The Newsletter Platform Scaling</tspan>
        <tspan x="0" dy="38">Modern Media Empires &amp; B2B Brands</tspan>
      </text>
    </g>

    <!-- Metadata Footer / Author Tag -->
    <g transform="translate(0, 485)">
      <line x1="0" y1="0" x2="520" y2="0" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" />
      
      <g transform="translate(0, 20)">
        <!-- Author / Director Avatar Ring -->
        <circle cx="16" cy="16" r="16" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
        <path d="M10,22 C10,18 13,16 16,16 C19,16 22,18 22,22" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
        <circle cx="16" cy="11" r="4" fill="#38bdf8" />

        <text x="44" y="14" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">INVESTIGATION BY</text>
        <text x="44" y="28" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">Principal Creative Director &amp; 3D Team</text>
      </g>

      <g transform="translate(400, 20)">
        <rect x="0" y="0" width="120" height="28" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5" />
        <text x="60" y="18" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">heliatech.online</text>
      </g>
    </g>

  </g>

</svg>