<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradient" cx="60%" cy="30%" r="80%" fx="60%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Glow & Lighting Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-fuchsia" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-violet" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradients for UI & Vectors -->
    <linearGradient id="cyanToBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="violetToFuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="glassPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="stripeGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.4" />
    </pattern>

    <!-- Audio Waveform Segment -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="1" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)" />
  <rect width="1200" height="630" fill="url(#cyberGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="180" r="220" fill="#8b5cf6" opacity="0.15" filter="url(#glow-fuchsia)" />
  <circle cx="300" cy="450" r="250" fill="#06b6d4" opacity="0.12" filter="url(#glow-cyan)" />

  <!-- ==================== HEADER / BADGE ==================== -->
  <g transform="translate(80, 70)">
    <!-- Pill Badge Background -->
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <!-- Pulsing Cyan Dot -->
    <circle cx="20" cy="17" r="5" fill="#06b6d4" filter="url(#glow-cyan)" />
    <circle cx="20" cy="17" r="2.5" fill="#ffffff" />
    <!-- Badge Text -->
    <text x="38" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- ==================== TYPOGRAPHY ==================== -->
  <g transform="translate(80, 150)">
    <!-- Category Subtitle -->
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#d946ef" letter-spacing="3" filter="url(#glow-violet)">VIRAL CREATOR &amp; STRIPE SAAS</text>
    
    <!-- Main Title -->
    <text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Transistor<tspan fill="#38bdf8">.fm</tspan> Enterprise
    </text>
    <text x="0" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Podcast Hosting <tspan fill="url(#violetToFuchsia)">Analytics</tspan>
    </text>

    <!-- Brief Description -->
    <text x="0" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
      Dissecting multi-show architecture, subscriber telemetry, and Stripe monetized distribution pipelines.
    </text>
  </g>


  <!-- ==================== 3D VECTOR ILLUSTRATION (Right Side) ==================== -->
  <g transform="translate(640, 80)">
    
    <!-- Connecting Data Network Lines (Background of Graphic) -->
    <path d="M 50 250 L 200 150 L 380 180" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
    <path d="M 120 380 L 280 300 L 420 350" fill="none" stroke="#d946ef" stroke-width="1.5" opacity="0.3"/>

    <!-- Holographic 3D Audio Waveform Container (Backplate) -->
    <rect x="40" y="60" width="440" height="320" rx="16" fill="url(#glassPanel)" stroke="#334155" stroke-width="1.5" filter="url(#glow-violet)" />
    
    <!-- Window Controls -->
    <circle cx="70" cy="85" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="88" cy="85" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="106" cy="85" r="5" fill="#10b981" opacity="0.8"/>
    <text x="130" y="89" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1">GLOBAL_FEED_TELEMETRY.ts</text>

    <!-- 3D Isometric Audio Waves -->
    <g transform="translate(70, 130)">
      <!-- Wave Bars -->
      <rect x="0" y="40" width="12" height="120" rx="6" fill="url(#waveGrad)" opacity="0.6"/>
      <rect x="20" y="20" width="12" height="140" rx="6" fill="url(#waveGrad)" opacity="0.8" filter="url(#glow-cyan)"/>
      <rect x="40" y="60" width="12" height="100" rx="6" fill="url(#waveGrad)" opacity="0.5"/>
      <rect x="60" y="10" width="12" height="150" rx="6" fill="url(#waveGrad)" opacity="1" filter="url(#glow-fuchsia)"/>
      <rect x="80" y="45" width="12" height="115" rx="6" fill="url(#waveGrad)" opacity="0.7"/>
      <rect x="100" y="70" width="12" height="90" rx="6" fill="url(#waveGrad)" opacity="0.5"/>
      <rect x="120" y="30" width="12" height="130" rx="6" fill="url(#waveGrad)" opacity="0.9"/>
      <rect x="140" y="15" width="12" height="145" rx="6" fill="url(#waveGrad)" opacity="1" filter="url(#glow-cyan)"/>
      <rect x="160" y="50" width="12" height="110" rx="6" fill="url(#waveGrad)" opacity="0.6"/>
      <rect x="180" y="80" width="12" height="80" rx="6" fill="url(#waveGrad)" opacity="0.4"/>
      <rect x="200" y="25" width="12" height="135" rx="6" fill="url(#waveGrad)" opacity="0.8"/>
      <rect x="220" y="5" width="12" height="155" rx="6" fill="url(#waveGrad)" opacity="1" filter="url(#glow-fuchsia)"/>
      <rect x="240" y="35" width="12" height="125" rx="6" fill="url(#waveGrad)" opacity="0.7"/>
      <rect x="260" y="65" width="12" height="95" rx="6" fill="url(#waveGrad)" opacity="0.5"/>
      <rect x="280" y="20" width="12" height="140" rx="6" fill="url(#waveGrad)" opacity="0.9"/>
      <rect x="300" y="50" width="12" height="110" rx="6" fill="url(#waveGrad)" opacity="0.6"/>
      <rect x="320" y="75" width="12" height="85" rx="6" fill="url(#waveGrad)" opacity="0.4"/>
    </g>

    <!-- Glowing Baseline for Waveform -->
    <line x1="70" y1="250" x2="410" y2="250" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8" filter="url(#glow-cyan)" />

    <!-- ==================== FLOATING STRIPE / CREATOR METRICS CARD ==================== -->
    <g transform="translate(140, 240)" filter="url(#glow-cyan)">
      <rect x="0" y="0" width="280" height="110" rx="12" fill="#090d16" stroke="#06b6d4" stroke-width="1.5" opacity="0.95" />
      
      <!-- Card Header -->
      <circle cx="25" cy="25" r="10" fill="url(#stripeGreen)" />
      <path d="M 21 25 L 24 28 L 30 21" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      
      <text x="45" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="0.5">STRIPE SAAS REVENUE</text>
      <text x="45" y="40" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff">$48,250.<tspan font-size="12" fill="#10b981">90</tspan><tspan font-size="10" fill="#64748b"> /mo</tspan></text>

      <!-- Mini Sparkline Graph -->
      <path d="M 20 85 Q 60 70 100 75 T 180 55 T 260 45" fill="none" stroke="#10b981" stroke-width="2.5" />
      <path d="M 20 85 Q 60 70 100 75 T 180 55 T 260 45 L 260 95 L 20 95 Z" fill="url(#stripeGreen)" opacity="0.15" />
    </g>

    <!-- ==================== FLOATING SUBSCRIBER NODE ==================== -->
    <g transform="translate(20, 160)" filter="url(#glow-fuchsia)">
      <rect x="0" y="0" width="130" height="60" rx="10" fill="#090d16" stroke="#d946ef" stroke-width="1.5" />
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#d946ef" letter-spacing="1">DOWNLOADS</text>
      <text x="15" y="45" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff">1.24<tspan fill="#38bdf8" font-size="12">M/mo</tspan></text>
    </g>

    <!-- Decorative Nodes & Pulse Rings -->
    <g transform="translate(430, 100)">
      <circle cx="0" cy="0" r="15" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#d946ef" filter="url(#glow-fuchsia)" />
    </g>
    <g transform="translate(25, 340)">
      <circle cx="0" cy="0" r="12" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="2" />
      <circle cx="0" cy="0" r="4" fill="#38bdf8" filter="url(#glow-cyan)" />
    </g>

  </g>

  <!-- ==================== FOOTER METADATA BAR ==================== -->
  <g transform="translate(80, 560)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
    
    <text x="0" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1.5">
      SECURE PROTOCOL: <tspan fill="#06b6d4">ACTIVE</tspan>
    </text>

    <text x="300" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1.5">
      NODE DEPLOYMENT: <tspan fill="#38bdf8">GLOBAL EDGE</tspan>
    </text>

    <text x="880" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#d946ef" letter-spacing="1">
      HELIATECH.ONLINE
    </text>
  </g>

</svg>