<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bg-radial" cx="60%" cy="40%" r="70%" fx="60%" fy="40%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fuchsia-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic & Neon Linear Gradients -->
    <linearGradient id="cyan-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="violet-fuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="glass-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="heavy-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg-radial)"/>
  <rect width="1200" height="630" fill="url(#cyber-grid)" opacity="0.8"/>

  <!-- Ambient Lighting Orbs -->
  <circle cx="150" cy="150" r="300" fill="url(#cyan-glow)" filter="url(#heavy-glow)"/>
  <circle cx="1000" cy="450" r="350" fill="url(#violet-glow)" filter="url(#heavy-glow)"/>
  <circle cx="850" cy="120" r="250" fill="url(#fuchsia-glow)" filter="url(#heavy-glow)"/>

  <!-- Decorative Background Vector Elements -->
  <g opacity="0.25">
    <path d="M 0 315 L 1200 315" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="4 8"/>
    <path d="M 600 0 L 600 630" stroke="#8b5cf6" stroke-width="0.5" stroke-dasharray="4 8"/>
    <circle cx="600" cy="315" r="280" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="10 20"/>
    <circle cx="600" cy="315" r="420" fill="none" stroke="#8b5cf6" stroke-width="0.75" stroke-dasharray="5 15"/>
  </g>

  <!-- ==================== RIGHT SIDE: 3D VECTOR AUDIO/VIDEO METAPHOR ==================== -->
  <g transform="translate(680, 80)">
    <!-- Central Holographic Platform / Isometric Grid Base -->
    <path d="M 0 250 L 220 370 L 440 250 L 220 130 Z" fill="url(#glass-panel)" stroke="url(#card-border)" stroke-width="1.5" filter="url(#glow-subtle)"/>
    <path d="M 0 280 L 220 400 L 440 280" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
    <path d="M 220 130 L 220 370" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.4"/>

    <!-- Floating 3D Vector Neural Nodes & Connection Lines -->
    <g filter="url(#glow)">
      <line x1="110" y1="210" x2="220" y2="160" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4"/>
      <line x1="330" y1="210" x2="220" y2="160" stroke="#d946ef" stroke-width="2"/>
      <line x1="220" y1="160" x2="220" y2="70" stroke="#8b5cf6" stroke-width="3"/>
      <line x1="110" y1="210" x2="220" y2="280" stroke="#06b6d4" stroke-width="2"/>
      <line x1="330" y1="210" x2="220" y2="280" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4"/>
    </g>

    <!-- Holographic Audio Waveform Rings & Peaks -->
    <g transform="translate(220, 160)">
      <!-- Waveform Circle Rings -->
      <ellipse cx="0" cy="0" rx="140" ry="60" fill="none" stroke="url(#cyan-sky)" stroke-width="1.5" opacity="0.7"/>
      <ellipse cx="0" cy="0" rx="100" ry="42" fill="none" stroke="url(#violet-fuchsia)" stroke-width="2" stroke-dasharray="8 4" opacity="0.8"/>
      
      <!-- Vertical Sound Energy Bars (3D Local-Sync Metaphor) -->
      <g fill="url(#cyan-sky)" filter="url(#glow-subtle)">
        <rect x="-90" y="-45" width="6" height="90" rx="3" opacity="0.9"/>
        <rect x="-70" y="-70" width="6" height="140" rx="3" opacity="1"/>
        <rect x="-50" y="-30" width="6" height="60" rx="3" opacity="0.7"/>
        <rect x="-30" y="-85" width="6" height="170" rx="3" opacity="1"/>
        <rect x="-10" y="-110" width="6" height="220" rx="3" fill="url(#violet-fuchsia)" opacity="1"/>
        <rect x="10" y="-95" width="6" height="190" rx="3" fill="url(#violet-fuchsia)" opacity="1"/>
        <rect x="30" y="-60" width="6" height="120" rx="3" opacity="0.8"/>
        <rect x="50" y="-75" width="6" height="150" rx="3" opacity="0.9"/>
        <rect x="70" y="-40" width="6" height="80" rx="3" opacity="0.6"/>
        <rect x="90" y="-20" width="6" height="40" rx="3" opacity="0.4"/>
      </g>
    </g>

    <!-- Floating Node Orbs / Sync Indicators -->
    <circle cx="110" cy="210" r="8" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="330" cy="210" r="8" fill="#d946ef" filter="url(#glow)"/>
    <circle cx="220" cy="70" r="12" fill="#8b5cf6" filter="url(#glow)"/>
    <circle cx="220" cy="280" r="10" fill="#06b6d4" filter="url(#glow)"/>

    <!-- Micro UI Badge: Local-Sync Active -->
    <g transform="translate(100, 330)" filter="url(#glow-subtle)">
      <rect width="240" height="36" rx="18" fill="#090d16" stroke="#06b6d4" stroke-width="1.5" opacity="0.9"/>
      <circle cx="24" cy="18" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="40" y="23" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">LOCAL-SYNC ACTIVE</text>
    </g>
  </g>

  <!-- ==================== LEFT SIDE: TYPOGRAPHY & DOSSIER CONTENT ==================== -->
  <g transform="translate(80, 80)">
    
    <!-- Top Pill Badge -->
    <g filter="url(#glow-subtle)">
      <rect width="320" height="34" rx="17" fill="url(#glass-panel)" stroke="url(#card-border)" stroke-width="1"/>
      <circle cx="20" cy="17" r="4" fill="#06b6d4">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="2.5">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Title & Category -->
    <g transform="translate(0, 70)">
      <!-- Category Subtitle -->
      <text x="0" y="0" fill="#d946ef" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="4" filter="url(#glow-subtle)">VIDEO AUTOMATION &amp; RECORDING ENGINE</text>

      <!-- Tool Title: RIVERSIDE.FM -->
      <text x="0" y="65" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" letter-spacing="1" filter="url(#glow-subtle)">
        RIVERSIDE<tspan fill="#38bdf8">.FM</tspan>
      </text>

      <!-- Investigation Headline / Sub-heading -->
      <text x="0" y="115" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">The Genesis of Local-Sync Remote Recording</text>
      <text x="0" y="142" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="500">and the Hands-on Guide to Studio-Quality Video Automation.</text>
    </g>

    <!-- Architectural Spec Callouts / Footer Meta -->
    <g transform="translate(0, 310)">
      <!-- Divider Line -->
      <path d="M 0 0 L 520 0" stroke="url(#cyan-sky)" stroke-width="1" opacity="0.4"/>

      <!-- Spec items -->
      <g transform="translate(0, 20)">
        <!-- Spec 1 -->
        <g transform="translate(0, 0)">
          <text x="0" y="0" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ARCHITECTURE</text>
          <text x="0" y="18" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Dual-Track Uncompressed</text>
        </g>
        <!-- Spec 2 -->
        <g transform="translate(180, 0)">
          <text x="0" y="0" fill="#8b5cf6" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">RESOLUTION</text>
          <text x="0" y="18" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Native 4K ISO Streams</text>
        </g>
        <!-- Spec 3 -->
        <g transform="translate(360, 0)">
          <text x="0" y="0" fill="#d946ef" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">AUTOMATION</text>
          <text x="0" y="18" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">AI Script &amp; Edit Engine</text>
        </g>
      </g>
    </g>

  </g>

  <!-- Frame Border Accent -->
  <rect x="15" y="15" width="1170" height="600" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>
  <rect x="23" y="23" width="1154" height="584" rx="8" fill="none" stroke="url(#cyan-sky)" stroke-width="0.75" opacity="0.2"/>

  <!-- Corner Reticle Accents -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 35 50 L 35 35 L 50 35"/>
    <path d="M 1165 50 L 1165 35 L 1150 35"/>
    <path d="M 35 580 L 35 595 L 50 595"/>
    <path d="M 1165 580 L 1165 595 L 1150 595"/>
  </g>
</svg>