<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bgGlow" cx="60%" cy="40%" r="70%" fx="60%" fy="40%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="fuchsiaViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="waveformGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="waveformGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- UI Window Glassmorphism -->
    <linearGradient id="glassBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.4">
    <path d="M 0,105 L 1200,105 M 0,210 L 1200,210 M 0,315 L 1200,315 M 0,420 L 1200,420 M 0,525 L 1200,525" stroke="url(#gridGrad)" stroke-width="0.5"/>
    <path d="M 150,0 L 150,630 M 300,0 L 300,630 M 450,0 L 450,630 M 600,0 L 600,630 M 750,0 L 750,630 M 900,0 L 900,630 M 1050,0 L 1050,630" stroke="url(#gridGrad)" stroke-width="0.5"/>
  </g>

  <!-- Ambient Lighting Orbs -->
  <circle cx="950" cy="200" r="220" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>
  <circle cx="800" cy="450" r="180" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>
  <circle cx="300" cy="300" r="250" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>

  <!-- Connecting Data/Audio Vector Lines in Background -->
  <g opacity="0.3" fill="none">
    <path d="M 100,500 Q 300,400 450,520 T 800,480" stroke="url(#cyanPurple)" stroke-width="2" filter="url(#glow-subtle)"/>
    <path d="M 50,150 Q 250,250 400,120 T 700,200" stroke="url(#fuchsiaViolet)" stroke-width="1.5"/>
    <path d="M 750,100 Q 950,300 1150,150" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- ==================== UI & HOLOGRAPHIC 3D AUDIO ENGINE ==================== -->
  
  <!-- Main Holographic Terminal/Studio Window -->
  <g transform="translate(620, 90)" filter="url(#cardShadow)">
    <!-- Window Outer Glow Frame -->
    <rect x="0" y="0" width="530" height="470" rx="16" fill="url(#glassBg)" stroke="url(#glassBorder)" stroke-width="1.5"/>
    
    <!-- Top Window Bar -->
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 514 0 A 16 16 0 0 1 530 16 L 530 45 L 0 45 Z" fill="#0b1329" fill-opacity="0.8"/>
    <line x1="0" y1="45" x2="530" y2="45" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1"/>
    
    <!-- Window Controls & Title -->
    <circle cx="24" cy="22" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="44" cy="22" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="64" cy="22" r="6" fill="#10b981" opacity="0.8"/>
    
    <text x="90" y="27" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">RIVERSIDE.FM // LOCAL-RECORD CORE</text>

    <!-- LIVE Sync Indicator Badge inside UI -->
    <rect x="420" y="14" width="86" height="16" rx="8" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.8"/>
    <circle cx="431" cy="22" r="3.5" fill="#06b6d4" filter="url(#glow-subtle)"/>
    <text x="441" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="0.5">SYNC 4K 60FPS</text>

    <!-- Studio Grid & Interface Elements inside the app -->
    <!-- Track 1: Host Audio (Cyan/Blue Waveform) -->
    <g transform="translate(25, 75)">
      <rect x="0" y="0" width="480" height="85" rx="8" fill="#030712" fill-opacity="0.6" stroke="#38bdf8" stroke-opacity="0.2"/>
      <circle cx="25" cy="25" r="10" fill="#38bdf8" fill-opacity="0.2"/>
      <path d="M 21 21 L 29 21 M 25 21 L 25 29" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <text x="45" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">TRACK 01: LOCAL 4K RAW [HOST]</text>
      <text x="410" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">48kHz / 24-bit</text>
      
      <!-- Dynamic Waveform Path 1 -->
      <path d="M 20 60 
               L 40 60 L 45 40 L 50 75 L 55 50 L 60 60 
               L 80 60 L 85 30 L 90 85 L 95 45 L 100 60
               L 130 60 L 135 20 L 140 90 L 145 35 L 150 60
               L 180 60 L 185 45 L 190 70 L 195 50 L 200 60
               L 230 60 L 235 15 L 240 95 L 245 25 L 250 60
               L 280 60 L 285 35 L 290 80 L 295 40 L 300 60
               L 330 60 L 335 10 L 340 100 L 345 20 L 350 60
               L 380 60 L 385 40 L 390 75 L 395 55 L 400 60
               L 430 60 L 435 30 L 440 90 L 445 45 L 450 60 L 460 60" 
            fill="none" stroke="url(#waveformGrad1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Track 2: Guest Audio (Fuchsia/Violet Waveform) -->
    <g transform="translate(25, 175)">
      <rect x="0" y="0" width="480" height="85" rx="8" fill="#030712" fill-opacity="0.6" stroke="#8b5cf6" stroke-opacity="0.2"/>
      <circle cx="25" cy="25" r="10" fill="#8b5cf6" fill-opacity="0.2"/>
      <path d="M 21 25 L 29 25" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
      <text x="45" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">TRACK 02: REMOTE MULTI-ISO [GUEST]</text>
      <text x="410" y="28" fill="#d946ef" font-family="system-ui, sans-serif" font-size="10" font-weight="600">ZERO LOSS</text>
      
      <!-- Dynamic Waveform Path 2 -->
      <path d="M 20 60 
               L 50 60 L 55 35 L 60 80 L 65 45 L 70 60 
               L 100 60 L 105 15 L 110 95 L 115 30 L 120 60
               L 150 60 L 155 50 L 160 70 L 165 40 L 170 60
               L 200 60 L 205 25 L 210 90 L 215 35 L 220 60
               L 250 60 L 255 10 L 260 100 L 265 20 L 270 60
               L 300 60 L 305 40 L 310 75 L 315 45 L 320 60
               L 350 60 L 355 20 L 360 85 L 365 30 L 370 60
               L 400 60 L 405 30 L 410 90 L 415 50 L 420 60 L 460 60" 
            fill="none" stroke="url(#waveformGrad2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Architecture Metrics Panel inside UI -->
    <g transform="translate(25, 275)">
      <rect x="0" y="0" width="480" height="165" rx="8" fill="#030712" fill-opacity="0.8" stroke="url(#cyanPurple)" stroke-opacity="0.3"/>
      
      <!-- Section Header -->
      <text x="20" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">LOCAL RECORD ENGINE METRICS</text>
      <line x1="20" y1="42" x2="460" y2="42" stroke="#ffffff" stroke-opacity="0.1"/>

      <!-- Metric 1: Buffer Health -->
      <text x="20" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Buffer Resiliency</text>
      <text x="160" y="70" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="11" font-weight="700">100% Local</text>
      <rect x="20" y="80" width="210" height="6" rx="3" fill="#1e293b"/>
      <rect x="20" y="80" width="210" height="6" rx="3" fill="url(#cyanPurple)" filter="url(#glow-subtle)"/>

      <!-- Metric 2: Cloud Sync -->
      <text x="260" y="70" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Progressive Backup</text>
      <text x="400" y="70" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Active (Chunk)</text>
      <rect x="260" y="80" width="200" height="6" rx="3" fill="#1e293b"/>
      <rect x="260" y="80" width="170" height="6" rx="3" fill="url(#cyanPurple)"/>

      <!-- Architecture Flow Nodes Mini Diagram -->
      <g transform="translate(20, 110)">
        <rect x="0" y="0" width="130" height="35" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4"/>
        <text x="65" y="21" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Local Browser RAM</text>

        <path d="M 135 17.5 L 155 17.5" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
        
        <rect x="160" y="0" width="130" height="35" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.4"/>
        <text x="225" y="21" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Isolated Tracks</text>

        <path d="M 295 17.5 L 315 17.5" stroke="#d946ef" stroke-width="2"/>

        <rect x="320" y="0" width="120" height="35" rx="6" fill="#0f172a" stroke="#d946ef" stroke-opacity="0.4"/>
        <text x="380" y="21" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Master Cloud ISO</text>
      </g>
    </g>
  </g>

  <!-- ==================== LEFT CONTENT & TYPOGRAPHY ==================== -->
  <g transform="translate(70, 0)">
    
    <!-- Top Pill Badge -->
    <g transform="translate(0, 85)" filter="url(#glow-subtle)">
      <rect x="0" y="0" width="315" height="32" rx="16" fill="#0f172a" stroke="url(#cyanPurple)" stroke-width="1.2"/>
      <circle cx="18" cy="16" r="4" fill="#06b6d4" />
      <text x="34" y="21" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Title: RIVERSIDE.FM -->
    <g transform="translate(0, 165)">
      <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">RIVERSIDE.FM</text>
      <!-- Glowing Reflection / Underline effect -->
      <path d="M 0 15 L 480 15" stroke="url(#cyanPurple)" stroke-width="3" filter="url(#glow)"/>
    </g>

    <!-- Category Subtitle -->
    <g transform="translate(0, 205)">
      <text x="0" y="0" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" letter-spacing="4">AUDIO / PODCASTING ENTERPRISE ENGINE</text>
    </g>

    <!-- Investigation Headline Title -->
    <g transform="translate(0, 260)">
      <text x="0" y="0" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" line-height="1.2">The Genesis of Local-Record</text>
      <text x="0" y="36" fill="url(#cyanPurple)" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800">Architecture &amp; Remote Masterclass</text>
    </g>

    <!-- Bullet Points / Core Investigation Focus -->
    <g transform="translate(0, 335)">
      <!-- Point 1 -->
      <g transform="translate(0, 0)">
        <circle cx="8" cy="8" r="4" fill="#06b6d4" filter="url(#glow-subtle)"/>
        <text x="24" y="12" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Uncompressed 4K video and WAV multi-track isolation</text>
      </g>
      <!-- Point 2 -->
      <g transform="translate(0, 32)">
        <circle cx="8" cy="8" r="4" fill="#8b5cf6" filter="url(#glow-subtle)"/>
        <text x="24" y="12" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Resilient local buffering immune to internet jitter</text>
      </g>
      <!-- Point 3 -->
      <g transform="translate(0, 64)">
        <circle cx="8" cy="8" r="4" fill="#d946ef" filter="url(#glow-subtle)"/>
        <text x="24" y="12" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Seamless cloud sync engineered for broadcast studios</text>
      </g>
    </g>

    <!-- Footer Meta / Branding Stamp -->
    <g transform="translate(0, 465)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#334155" stroke-width="1"/>
      
      <text x="0" y="30" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">INVESTIGATION REF: HT-REV-2025-RS</text>
      
      <!-- HELIATECH Brand Signature -->
      <g transform="translate(380, 15)">
        <text x="0" y="0" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="900" letter-spacing="2">HELIA<tspan fill="#06b6d4">TECH</tspan></text>
        <text x="0" y="14" fill="#64748b" font-family="system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="1">heliatech.online</text>
      </g>
    </g>

  </g>

  <!-- Decorative Corner Accents (Cyberpunk Technical Frame) -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 20 40 L 20 20 L 40 20" />
    <path d="M 1180 40 L 1180 20 L 1160 20" />
    <path d="M 20 590 L 20 610 L 40 610" />
    <path d="M 1180 590 L 1180 610 L 1160 610" />
  </g>

</svg>