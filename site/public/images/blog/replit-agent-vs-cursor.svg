  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <circle cx="280" cy="315" r="160" fill="#ea580c" opacity="0.12" filter="blur(40px)" />
  <circle cx="920" cy="315" r="160" fill="#6366f1" opacity="0.12" filter="blur(40px)" />

  <!-- Grid overlay -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4" />
  <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4" />

  <!-- Left Card: Replit Agent -->
  <rect x="120" y="160" width="380" height="310" rx="20" fill="#1c1108" stroke="#f97316" stroke-width="2" stroke-opacity="0.6" />
