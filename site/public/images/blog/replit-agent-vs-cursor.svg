  <text x="310" y="325" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="18" text-anchor="middle">Full Stack Cloud Execution</text>
  <rect x="160" y="370" width="300" height="42" rx="10" fill="#ea580c" fill-opacity="0.15" stroke="#f97316" stroke-width="1" />
  <text x="310" y="397" fill="#fb923c" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">Zero Setup • Self-Healing Loop</text>

  <!-- VS Badge -->
  <circle cx="600" cy="315" r="48" fill="#1e293b" stroke="#f59e0b" stroke-width="3" />
  <text x="600" y="325" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="900" font-size="28" text-anchor="middle">VS</text>

  <!-- Right Card: Cursor Composer -->
  <rect x="700" y="160" width="380" height="310" rx="20" fill="#11112b" stroke="#818cf8" stroke-width="2" stroke-opacity="0.6" />
  <text x="890" y="240" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" text-anchor="middle">⚡ Cursor Composer</text>
  <text x="890" y="280" fill="#94a3b8" font-family="monospace" font-size="16" text-anchor="middle">Local IDE Multi-File Agent</text>
  <text x="890" y="325" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="18" text-anchor="middle">Production Git &amp; Model Power</text>
  <rect x="740" y="370" width="300" height="42" rx="10" fill="#6366f1" fill-opacity="0.15" stroke="#818cf8" stroke-width="1" />
  <text x="890" y="397" fill="#a5b4fc" font-family="monospace" font-weight="bold" font-size="14" text-anchor="middle">Claude 3.7 • Repo-Aware Diff</text>

