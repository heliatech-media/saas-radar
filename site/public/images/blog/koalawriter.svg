<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="fuchsiaCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <linearGradient id="codeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowSubtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur1" />
      <feGaussianBlur stdDeviation="60" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Lighting Orbs -->
  <circle cx="950" cy="150" r="250" fill="#8b5cf6" opacity="0.15" filter="url(#heavyGlow)" />
  <circle cx="850" cy="450" r="200" fill="#06b6d4" opacity="0.12" filter="url(#heavyGlow)" />
  <circle cx="200" cy="500" r="300" fill="#d946ef" opacity="0.08" filter="url(#heavyGlow)" />

  <!-- ================================================================= -->
  <!-- RIGHT SIDE: 3D VECTOR ILLUSTRATION (SERP Dominance & AI IDE Nodes) -->
  <!-- ================================================================= -->
  <g transform="translate(640, 70)">
    <!-- Holographic Platform Ellipse -->
    <ellipse cx="240" cy="400" rx="220" ry="80" fill="none" stroke="url(#cyanPurple)" stroke-width="1.5" opacity="0.3" />
    <ellipse cx="240" cy="400" rx="160" ry="55" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2" stroke-dasharray="6 4" />

    <!-- Isometric Vector Nodes / AST Syntax Tree -->
    <g filter="url(#glowSubtle)">
      <!-- Connecting Flow Lines -->
      <path d="M 80 320 L 160 260 L 280 290 L 360 210" fill="none" stroke="url(#cyanPurple)" stroke-width="2" opacity="0.6" />
      <path d="M 160 260 L 200 350 L 280 290" fill="none" stroke="#d946ef" stroke-width="1.5" opacity="0.5" />
      <path d="M 280 290 L 320 380 L 400 320" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />

      <!-- Floating Data Nodes -->
      <g transform="translate(80, 320)">
        <polygon points="0,-15 15,0 0,15 -15,0" fill="#06b6d4" opacity="0.8" />
        <circle cx="0" cy="0" r="20" fill="none" stroke="#38bdf8" stroke-width="1" />
      </g>
      <g transform="translate(160, 260)">
        <polygon points="0,-18 18,0 0,18 -18,0" fill="#8b5cf6" opacity="0.8" />
        <circle cx="0" cy="0" r="24" fill="none" stroke="#d946ef" stroke-width="1.5" />
      </g>
      <g transform="translate(280, 290)">
        <polygon points="0,-22 22,0 0,22 -22,0" fill="#d946ef" opacity="0.9" />
        <circle cx="0" cy="0" r="30" fill="none" stroke="#06b6d4" stroke-width="2" />
      </g>
      <g transform="translate(360, 210)">
        <polygon points="0,-15 15,0 0,15 -15,0" fill="#38bdf8" opacity="0.9" />
        <circle cx="0" cy="0" r="22" fill="none" stroke="#fff" stroke-width="1.5" />
      </g>
      <g transform="translate(200, 350)">
        <circle cx="0" cy="0" r="12" fill="#06b6d4" opacity="0.7" />
      </g>
      <g transform="translate(320, 380)">
        <circle cx="0" cy="0" r="14" fill="#8b5cf6" opacity="0.8" />
      </g>
    </g>

    <!-- Central Floating IDE / Neural Rendering Window (Isometric) -->
    <g transform="translate(90, 80)" filter="url(#glow)">
      <!-- Glass Panel Background -->
      <polygon points="0,60 160,0 340,60 180,120" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
      <polygon points="0,60 180,120 180,300 0,240" fill="#090d16" fill-opacity="0.85" stroke="#06b6d4" stroke-width="1.5" opacity="0.9" />
      <polygon points="180,120 340,60 340,240 180,300" fill="#050811" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1.5" opacity="0.9" />

      <!-- Top Header / Window controls -->
      <g transform="translate(20, 75)">
        <circle cx="0" cy="0" r="4" fill="#d946ef" />
        <circle cx="12" cy="0" r="4" fill="#38bdf8" />
        <circle cx="24" cy="0" r="4" fill="#06b6d4" />
        <!-- Miniature code lines in header -->
        <line x1="50" y1="0" x2="120" y2="0" stroke="#38bdf8" stroke-width="2" opacity="0.5" />
      </g>

      <!-- Code / Vector Syntax Lines Inside Left Panel -->
      <g transform="translate(20, 110)">
        <line x1="0" y1="0" x2="90" y2="0" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
        <line x1="0" y1="15" x2="130" y2="15" stroke="url(#codeGlow)" stroke-width="2" stroke-linecap="round" />
        <line x1="0" y1="30" x2="70" y2="30" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
        <line x1="0" y1="45" x2="110" y2="45" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
        <line x1="0" y1="60" x2="50" y2="60" stroke="#d946ef" stroke-width="2" stroke-linecap="round" />
        
        <!-- Animated / Glowing Data Bars -->
        <rect x="0" y="80" width="130" height="25" rx="4" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
        <text x="12" y="97" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">SERP_RANK: #1</text>
      </g>

      <!-- Right Panel Vector Embeddings / Metrics -->
      <g transform="translate(200, 110)">
        <line x1="0" y1="0" x2="110" y2="0" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
        <line x1="0" y1="15" x2="80" y2="15" stroke="#d946ef" stroke-width="2" stroke-linecap="round" />
        <line x1="0" y1="30" x2="100" y2="30" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

        <!-- Mini Sparkline Graph -->
        <path d="M 0 90 L 25 70 L 50 75 L 75 45 L 100 50 L 125 20" fill="none" stroke="#d946ef" stroke-width="2" filter="url(#glowSubtle)" />
        <circle cx="125" cy="20" r="4" fill="#fff" filter="url(#glow)" />
      </g>
    </g>

    <!-- Floating Metric Badges -->
    <g transform="translate(30, 390)" filter="url(#glowSubtle)">
      <rect width="140" height="42" rx="8" fill="#090d16" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1.5" />
      <circle cx="21" cy="21" r="5" fill="#06b6d4" />
      <text x="36" y="20" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">DOMINANCE</text>
      <text x="36" y="34" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">99.8% AI INDEX</text>
    </g>

    <g transform="translate(320, 340)" filter="url(#glowSubtle)">
      <rect width="155" height="42" rx="8" fill="#090d16" fill-opacity="0.9" stroke="#d946ef" stroke-width="1.5" />
      <circle cx="21" cy="21" r="5" fill="#d946ef" />
      <text x="36" y="20" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">CONTENT SCALE</text>
      <text x="36" y="34" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">10X AUTOMATION</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- LEFT SIDE: TYPOGRAPHY & DOSSIER METADATA                          -->
  <!-- ================================================================= -->
  <g transform="translate(80, 80)">
    
    <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
    <g transform="translate(0, 0)">
      <rect width="320" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="18" cy="16" r="4" fill="#06b6d4" filter="url(#glow)" />
      <text x="36" y="21" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Tool Title: KOALAWRITER -->
    <g transform="translate(0, 85)">
      <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" letter-spacing="3" filter="url(#glow)">KOALAWRITER</text>
      <!-- Sub-category -->
      <text x="0" y="36" fill="url(#cyanPurple)" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="4">AI SEO &amp; COPYWRITING</text>
    </g>

    <!-- Investigation Headline -->
    <g transform="translate(0, 180)">
      <text x="0" y="0" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="0.5">The Evolution of SERP Dominance</text>
      <text x="0" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">and the Hands-on Guide to AI Content Scale in 2026</text>
    </g>

    <!-- Technical Spec Metaline / Author Info -->
    <g transform="translate(0, 310)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" />
      <g transform="translate(0, 20)">
        <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1.5">SYSTEM ID: HT-2026-KW</text>
        <text x="240" y="0" fill="#64748b" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1.5">STATUS: VERIFIED</text>
        <circle cx="225" cy="-4" r="3" fill="#06b6d4" />
      </g>
    </g>

  </g>

  <!-- Decorative Border Accents -->
  <rect x="0" y="0" width="1200" height="630" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.1" pointer-events="none" />
  <rect x="15" y="15" width="1170" height="600" fill="none" stroke="#8b5cf6" stroke-width="0.5" stroke-opacity="0.15" pointer-events="none" stroke-dasharray="4 4" />
</svg>