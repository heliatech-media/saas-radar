<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%TH" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Glowing Node Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="fuchsia-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <!-- Glow &amp; Shadow Filters -->
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.15">
    <path d="M0 630 L1200 0 M0 0 L1200 630" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="8 8"/>
    <path d="M0 150 L1200 150 M0 315 L1200 315 M0 480 L1200 480" stroke="#8b5cf6" stroke-width="0.5"/>
    <path d="M300 0 L300 630 M600 0 L600 630 M900 0 L900 630" stroke="#8b5cf6" stroke-width="0.5"/>
    <!-- Tech intersecting grid dots -->
    <circle cx="300" cy="150" r="3" fill="#06b6d4"/>
    <circle cx="900" cy="150" r="3" fill="#d946ef"/>
    <circle cx="300" cy="480" r="3" fill="#d946ef"/>
    <circle cx="900" cy="480" r="3" fill="#06b6d4"/>
  </g>

  <!-- Ambient Lighting Orbs -->
  <circle cx="1050" cy="100" r="220" fill="#06b6d4" opacity="0.12" filter="url(#glow-heavy)"/>
  <circle cx="150" cy="530" r="280" fill="#8b5cf6" opacity="0.12" filter="url(#glow-heavy)"/>
  <circle cx="600" cy="315" r="180" fill="#d946ef" opacity="0.08" filter="url(#glow-heavy)"/>

  <!-- ========================================== -->
  <!-- CENTRAL METAPHOR: E-Commerce Catalog Nodes -->
  <!-- ========================================== -->
  <g id="decentralized-network" transform="translate(680, 315)">
    <!-- Connection Pathways / Web -->
    <g opacity="0.4" stroke-width="1.5">
      <line x1="0" y1="0" x2="-220" y2="-120" stroke="url(#cyan-glow)" stroke-dasharray="4 4"/>
      <line x1="0" y1="0" x2="200" y2="-140" stroke="url(#fuchsia-glow)"/>
      <line x1="0" y1="0" x2="-180" y2="140" stroke="url(#fuchsia-glow)"/>
      <line x1="0" y1="0" x2="220" y2="120" stroke="url(#cyan-glow)" stroke-dasharray="4 4"/>
      <line x1="-220" y1="-120" x2="-340" y2="0" stroke="#38bdf8"/>
      <line x1="200" y1="-140" x2="320" y2="-30" stroke="#d946ef"/>
      <line x1="-180" y1="140" x2="-80" y2="240" stroke="#8b5cf6"/>
      <line x1="220" y1="120" x2="140" y2="240" stroke="#06b6d4"/>
    </g>

    <!-- Floating Holographic Data Nodes (Sub-Catalogues) -->
    <!-- Node 1: Global Fulfillment -->
    <g transform="translate(-220, -120)" filter="url(#drop-shadow)">
      <polygon points="0,-35 30,-15 30,25 0,45 -30,25 -30,-15" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="0" cy="5" r="8" fill="#06b6d4" filter="url(#glow-subtle)"/>
      <text x="0" y="65" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle" letter-spacing="1">GLOBAL_NODE_01</text>
    </g>

    <!-- Node 2: API Stream -->
    <g transform="translate(200, -140)" filter="url(#drop-shadow)">
      <polygon points="0,-35 30,-15 30,25 0,45 -30,25 -30,-15" fill="url(#card-grad)" stroke="#d946ef" stroke-width="1.5"/>
      <circle cx="0" cy="5" r="8" fill="#d946ef" filter="url(#glow-subtle)"/>
      <text x="0" y="65" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle" letter-spacing="1">SYNC_WEBHOOK</text>
    </g>

    <!-- Node 3: On-Demand Print Engine -->
    <g transform="translate(-180, 140)" filter="url(#drop-shadow)">
      <polygon points="0,-35 30,-15 30,25 0,45 -30,25 -30,-15" fill="url(#card-grad)" stroke="#8b5cf6" stroke-width="1.5"/>
      <circle cx="0" cy="5" r="8" fill="#8b5cf6" filter="url(#glow-subtle)"/>
      <text x="0" y="65" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle" letter-spacing="1">POD_ENGINE</text>
    </g>

    <!-- Node 4: Dynamic Mockup Generator -->
    <g transform="translate(220, 120)" filter="url(#drop-shadow)">
      <polygon points="0,-35 30,-15 30,25 0,45 -30,25 -30,-15" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="0" cy="5" r="8" fill="#38bdf8" filter="url(#glow-subtle)"/>
      <text x="0" y="65" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle" letter-spacing="1">RENDER_VECTOR</text>
    </g>

    <!-- Central Core Nexus -->
    <g filter="url(#drop-shadow)">
      <!-- Outer rotating ring effect -->
      <circle cx="0" cy="0" r="75" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="10 6" opacity="0.6"/>
      <circle cx="0" cy="0" r="60" fill="url(#card-grad)" stroke="url(#cyan-glow)" stroke-width="2"/>
      
      <!-- Inner geometric core -->
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#030712" stroke="#38bdf8" stroke-width="1.5"/>
      
      <!-- Central Core Pulse Icon (Abstract Server/Cube) -->
      <path d="M0 -15 L13 -7.5 L13 7.5 L0 15 L-13 7.5 L-13 -7.5 Z" fill="url(#cyan-glow)" opacity="0.8"/>
      <path d="M0 0 L13 7.5 L0 15 L-13 7.5 Z" fill="#d946ef" opacity="0.6"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff" filter="url(#glow-heavy)"/>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- TYPOGRAPHY &amp; BRANDING SECTION             -->
  <!-- ========================================== -->
  
  <g transform="translate(80, 130)">
    <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
    <g filter="url(#drop-shadow)">
      <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <circle cx="20" cy="17" r="4" fill="#06b6d4" filter="url(#glow-subtle)"/>
      <text x="36" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#38bdf8" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Title: PRINTIFY -->
    <text x="0" y="165" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="84" fill="#ffffff" letter-spacing="-1" filter="url(#drop-shadow)">PRINTIFY</text>

    <!-- Category Subtitle / Investigation Title -->
    <g transform="translate(0, 205)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="url(#text-gradient)" letter-spacing="0.5">The Infrastructure of Decentralized Commerce</text>
      <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="16" fill="#94a3b8" letter-spacing="0.5">And the Masterclass in Print-on-Demand Scaling</text>
    </g>

    <!-- Metadata Readouts / Tech Specs Bar -->
    <g transform="translate(0, 290)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#1e293b" stroke-width="2"/>
      
      <!-- Spec 1 -->
      <g transform="translate(0, 20)">
        <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" letter-spacing="1">DOMAIN</text>
        <text x="0" y="16" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#cbd5e1">Print on Demand</text>
      </g>

      <!-- Spec 2 -->
      <g transform="translate(160, 20)">
        <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" letter-spacing="1">ARCHITECTURE</text>
        <text x="0" y="16" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#cbd5e1">Distributed API</text>
      </g>

      <!-- Spec 3 -->
      <g transform="translate(340, 20)">
        <text x="0" y="0" font-family="monospace" font-size="10" fill="#64748b" letter-spacing="1">CLASSIFICATION</text>
        <text x="0" y="16" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#cbd5e1">Enterprise Scale</text>
      </g>
    </g>
  </g>

  <!-- Bottom-Right Brand Watermark -->
  <g transform="translate(1040, 590)" opacity="0.5">
    <text x="0" y="0" font-family="monospace" font-size="11" fill="#38bdf8" letter-spacing="2" text-anchor="end">HELIATECH.ONLINE</text>
  </g>
</svg>