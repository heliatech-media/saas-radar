<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="cyber-grid" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="grad-fuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="grad-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>

    <pattern id="dot-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />
  <rect width="1200" height="630" fill="url(#grid-pattern)" />
  <rect width="1200" height="630" fill="url(#dot-pattern)" />

  <!-- Atmospheric Glow Orbs -->
  <circle cx="850" cy="250" r="280" fill="#06b6d4" opacity="0.12" filter="url(#glow-heavy)" />
  <circle cx="950" cy="400" r="200" fill="#d946ef" opacity="0.08" filter="url(#glow-heavy)" />
  <circle cx="300" cy="500" r="220" fill="#8b5cf6" opacity="0.08" filter="url(#glow-heavy)" />

  <!-- Diagonal Cyber Accent Line -->
  <path d="M -100 100 L 1300 530" stroke="url(#grad-cyan)" stroke-width="1" stroke-opacity="0.15" />
  <path d="M -100 140 L 1300 570" stroke="url(#grad-fuchsia)" stroke-width="1" stroke-opacity="0.1" />

  <!-- ==========================================
       RIGHT SIDE: 3D AUTOMATION WORKFLOW METAPHOR
       ========================================== -->
  <g transform="translate(680, 80)">
    <!-- Connecting Infrastructure Beams / Flow Pathways -->
    <path d="M 60 120 C 140 120, 140 260, 220 260" fill="none" stroke="url(#grad-cyan)" stroke-width="3" filter="url(#glow-subtle)" />
    <path d="M 220 260 C 300 260, 300 100, 380 100" fill="none" stroke="url(#grad-fuchsia)" stroke-width="3" filter="url(#glow-subtle)" />
    <path d="M 220 260 C 300 260, 300 380, 380 380" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />

    <!-- Pulsing Data Packets on Pathways -->
    <circle cx="140" cy="190" r="4" fill="#38bdf8" filter="url(#glow-heavy)" />
    <circle cx="300" cy="160" r="4" fill="#d946ef" filter="url(#glow-heavy)" />

    <!-- Node 3: Target Output (Right) -->
    <g transform="translate(350, 40)">
      <polygon points="60,0 120,35 120,105 60,140 0,105 0,35" fill="url(#grad-node)" stroke="#d946ef" stroke-width="2" filter="url(#glow-subtle)" />
      <!-- Inner Icon: Sync / API Check -->
      <path d="M 45 65 L 55 75 L 75 50" fill="none" stroke="#d946ef" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <text x="60" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1" text-anchor="middle">WEBHOOK DISPATCH</text>
    </g>

    <!-- Node 1: Trigger / Source (Left) -->
    <g transform="translate(0, 60)">
      <polygon points="60,0 120,35 120,105 60,140 0,105 0,35" fill="url(#grad-node)" stroke="#38bdf8" stroke-width="2" filter="url(#glow-subtle)" />
      <!-- Inner Icon: Calendar / Time -->
      <rect x="42" y="52" width="36" height="36" rx="6" fill="none" stroke="#38bdf8" stroke-width="3" />
      <line x1="42" y1="64" x2="78" y2="64" stroke="#38bdf8" stroke-width="3" />
      <line x1="54" y1="44" x2="54" y2="52" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <line x1="66" y1="44" x2="66" y2="52" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <text x="60" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1" text-anchor="middle">SCHEDULE EVENT</text>
    </g>

    <!-- Node 2: Core Processing Engine (Center High) -->
    <g transform="translate(160, 190)">
      <polygon points="60,0 120,35 120,105 60,140 0,105 0,35" fill="url(#grad-node)" stroke="#06b6d4" stroke-width="3" filter="url(#glow-heavy)" />
      <!-- Inner Icon: Neural/Automation Core Matrix -->
      <circle cx="60" cy="70" r="16" fill="none" stroke="#06b6d4" stroke-width="3" />
      <circle cx="60" cy="70" r="6" fill="#38bdf8" />
      <line x1="60" y1="38" x2="60" y2="54" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
      <line x1="60" y1="86" x2="60" y2="102" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
      <text x="60" y="170" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5" text-anchor="middle">CAL.COM CORE</text>
    </g>

    <!-- Node 4: Secondary Subsystem (Bottom) -->
    <g transform="translate(320, 320)">
      <polygon points="60,0 120,35 120,105 60,140 0,105 0,35" fill="url(#grad-node)" stroke="#8b5cf6" stroke-width="2" />
      <!-- Inner Icon: Routing / Flow -->
      <circle cx="60" cy="70" r="12" fill="none" stroke="#8b5cf6" stroke-width="3" />
      <path d="M 45 70 L 30 70" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
      <path d="M 75 70 L 90 70" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
      <text x="60" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1" text-anchor="middle">ROUTER ENGINE</text>
    </g>
  </g>

  <!-- ==========================================
       LEFT SIDE: TYPOGRAPHY & BRANDING
       ========================================== -->
  <g transform="translate(80, 85)">
    <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
      <circle cx="18" cy="17" r="5" fill="#38bdf8" filter="url(#glow-heavy)" />
      <text x="36" y="21.5" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Title & Category -->
    <g transform="translate(0, 80)">
      <!-- Category Subtitle -->
      <text x="0" y="0" fill="#d946ef" font-family="system-ui, sans-serif" font-weight="800" font-size="14" letter-spacing="4">ENTERPRISE AUTOMATION</text>
      
      <!-- Tool Title: CAL.COM -->
      <text x="0" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="72" letter-spacing="-1" filter="url(#glow-subtle)">CAL.COM</text>

      <!-- Subtitle Description -->
      <text x="0" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="400" font-size="18" letter-spacing="0.5">The Open-Source Scheduling Infrastructure and</text>
      <text x="0" y="152" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="400" font-size="18" letter-spacing="0.5">Enterprise Automation Blueprint.</text>
    </g>

    <!-- Architectural Metadata Badges / Tech Specs -->
    <g transform="translate(0, 310)">
      <!-- Spec Pill 1 -->
      <rect x="0" y="0" width="130" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="65" y="23" fill="#38bdf8" font-family="ui-monospace, monospace" font-weight="600" font-size="12" text-anchor="middle">API_INFRA</text>

      <!-- Spec Pill 2 -->
      <rect x="145" y="0" width="130" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="210" y="23" fill="#d946ef" font-family="ui-monospace, monospace" font-weight="600" font-size="12" text-anchor="middle">WEBHOOKS_v2</text>

      <!-- Spec Pill 3 -->
      <rect x="290" y="0" width="130" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="355" y="23" fill="#06b6d4" font-family="ui-monospace, monospace" font-weight="600" font-size="12" text-anchor="middle">OPEN_SOURCE</text>
    </g>
  </g>

  <!-- Bottom Framing Border -->
  <line x1="80" y1="585" x2="1120" y2="585" stroke="#334155" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="80" cy="585" r="2" fill="#38bdf8" />
  <circle cx="1120" cy="585" r="2" fill="#d946ef" />

  <!-- Watermark / Brand Signature -->
  <text x="1120" y="605" fill="#64748b" font-family="ui-monospace, monospace" font-weight="600" font-size="10" letter-spacing="1.5" text-anchor="end">HELIATECH.ONLINE // SECURITY &amp; CODE INTELLIGENCE</text>
</svg>