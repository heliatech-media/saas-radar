<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070913" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="grid-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </linearGradient>

    <!-- Brand Color Gradients -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="violet-fuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="gold-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="glass-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow & Lighting Filters -->
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8b5cf6" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />
  <rect width="1200" height="630" fill="url(#cyber-grid)" />
  <rect width="1200" height="630" fill="url(#dot-grid)" mask="url(#fade-mask)" />
  <rect width="1200" height="630" fill="url(#grid-fade)" />

  <!-- AMBIENT GLOW ORBS -->
  <circle cx="150" cy="150" r="250" fill="#06b6d4" opacity="0.12" filter="url(#glow-heavy)" />
  <circle cx="950" cy="450" r="300" fill="#8b5cf6" opacity="0.15" filter="url(#glow-heavy)" />
  <circle cx="600" cy="300" r="200" fill="#d946ef" opacity="0.08" filter="url(#glow-heavy)" />

  <!-- GRAPHIC LAYER: AI VIDEO REPURPOSING METAPHOR (RIGHT SIDE) -->
  <g transform="translate(620, 80)">
    <!-- Central Holographic 3D Timeline & Neural Render Canvas -->
    
    <!-- Isometric Base Grid Floor -->
    <path d="M 0,350 L 250,450 L 520,330 L 270,230 Z" fill="#0f172a" fill-opacity="0.4" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
    
    <!-- Floating Vector Nodes & Connections -->
    <g filter="url(#glow-subtle)">
      <line x1="80" y1="280" x2="220" y2="180" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
      <line x1="220" y1="180" x2="380" y2="240" stroke="#8b5cf6" stroke-width="1.5" opacity="0.6"/>
      <line x1="380" y1="240" x2="440" y2="120" stroke="#d946ef" stroke-width="2" />
    </g>

    <!-- Holographic Waveform Blocks (Video Clips Extracted) -->
    <!-- Clip 1: Long Form Source -->
    <g transform="translate(40, 220)">
      <rect x="0" y="0" width="110" height="80" rx="8" fill="url(#glass-panel)" stroke="#38bdf8" stroke-width="1" opacity="0.7"/>
      <path d="M15,40 Q30,10 45,40 T75,40 T100,20" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
      <circle cx="20" cy="20" r="4" fill="#38bdf8" />
      <text x="20" y="65" fill="#94a3b8" font-family="monospace" font-size="10">SOURCE.MP4</text>
    </g>

    <!-- Processing Beams / AI Transfer -->
    <path d="M 155,250 C 180,250 190,180 220,180 C 250,180 260,280 290,280" fill="none" stroke="url(#cyan-blue)" stroke-width="3" filter="url(#neon-glow)" />
    <circle cx="220" cy="180" r="6" fill="#06b6d4" filter="url(#neon-glow)" />
    <circle cx="255" cy="235" r="4" fill="#8b5cf6" />
    
    <!-- AI Neural Ring (Centerpiece) -->
    <g transform="translate(290, 150)">
      <ellipse cx="60" cy="60" rx="55" ry="35" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.5" transform="rotate(-15)" />
      <ellipse cx="60" cy="60" rx="70" ry="45" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.7" transform="rotate(25)" filter="url(#neon-glow)" />
      <circle cx="60" cy="60" r="25" fill="#090d16" stroke="url(#violet-fuchsia)" stroke-width="2" />
      <!-- AI Core Icon / Sparkle -->
      <path d="M60,40 L64,52 L76,56 L64,60 L60,72 L56,60 L44,56 L56,52 Z" fill="#d946ef" filter="url(#neon-glow)" />
    </g>

    <!-- Output Viral Clips (Shorts / Reels) -->
    <!-- Clip 2 (Top Right - Viral Spike) -->
    <g transform="translate(390, 60)" filter="url(#glow-subtle)">
      <rect x="0" y="0" width="100" height="130" rx="12" fill="url(#glass-panel)" stroke="#d946ef" stroke-width="2" />
      <!-- Audio/Video Bars inside Clip -->
      <rect x="15" y="20" width="70" height="45" rx="6" fill="#030712" opacity="0.8"/>
      <path d="M25,50 L35,30 L45,45 L55,25 L65,40 L75,20" fill="none" stroke="#d946ef" stroke-width="2.5" />
      <circle cx="80" cy="30" r="4" fill="#38bdf8" />
      <!-- Viral Tag -->
      <rect x="15" y="78" width="70" height="18" rx="9" fill="#d946ef" fill-opacity="0.2" />
      <text x="50" y="91" fill="#f472b6" font-family="system-ui, sans-serif" font-weight="800" font-size="9" text-anchor="middle">99.4 VIRAL</text>
      <text x="50" y="115" fill="#e2e8f0" font-family="monospace" font-weight="bold" font-size="11" text-anchor="middle">SHRT_01.MP4</text>
    </g>

    <!-- Clip 3 (Bottom Right) -->
    <g transform="translate(350, 250)">
      <rect x="0" y="0" width="110" height="90" rx="10" fill="url(#glass-panel)" stroke="#06b6d4" stroke-width="1.5" />
      <rect x="12" y="12" width="86" height="45" rx="4" fill="#030712" />
      <!-- Mini waveform -->
      <rect x="20" y="32" width="6" height="15" rx="3" fill="#38bdf8" />
      <rect x="30" y="24" width="6" height="23" rx="3" fill="#06b6d4" />
      <rect x="40" y="20" width="6" height="27" rx="3" fill="#8b5cf6" />
      <rect x="50" y="28" width="6" height="19" rx="3" fill="#d946ef" />
      <rect x="60" y="22" width="6" height="25" rx="3" fill="#38bdf8" />
      <text x="55" y="76" fill="#38bdf8" font-family="monospace" font-weight="bold" font-size="10" text-anchor="middle">HOOK_OPTIMIZED</text>
    </g>

    <!-- Floating Metric Badges -->
    <g transform="translate(40, 60)" filter="url(#glow-subtle)">
      <rect x="0" y="0" width="130" height="40" rx="20" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="20" cy="20" r="6" fill="#06b6d4" filter="url(#neon-glow)" />
      <text x="38" y="25" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">10x VELOCITY</text>
    </g>
  </g>

  <!-- BRAND & TYPOGRAPHY LAYER (LEFT SIDE) -->
  <g transform="translate(80, 80)">
    
    <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="18" cy="17" r="4" fill="#06b6d4" filter="url(#neon-glow)" />
      <text x="36" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="800" font-size="11" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Title: MINVO -->
    <g transform="translate(0, 85)">
      <text x="0" y="0" fill="url(#cyan-blue)" font-family="system-ui, sans-serif" font-weight="900" font-size="76" letter-spacing="4" filter="url(#neon-glow)">MINVO</text>
      <!-- Category Subtitle -->
      <text x="245" y="-12" fill="#d946ef" font-family="system-ui, sans-serif" font-weight="700" font-size="18" letter-spacing="3">AI VIDEO</text>
    </g>

    <!-- Investigation Headline -->
    <g transform="translate(0, 140)">
      <text x="0" y="0" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="800" font-size="32" letter-spacing="0.5">The Genesis of AI Video Repurposing</text>
      <text x="0" y="40" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="400" font-size="20">and the Hands-on Guide to Viral Velocity in 2026</text>
    </g>

    <!-- Metadata Footer / Author & Date -->
    <g transform="translate(0, 260)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
      
      <!-- Publisher Info -->
      <text x="0" y="30" fill="#64748b" font-family="system-ui, sans-serif" font-weight="600" font-size="11" letter-spacing="2">INVESTIGATION ID: HT-2026-MIN</text>
      <text x="380" y="30" fill="#06b6d4" font-family="system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1">HELIATECH.ONLINE</text>
      
      <!-- Status Badge -->
      <rect x="0" y="48" width="110" height="24" rx="6" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1" />
      <text x="55" y="64" fill="#c084fc" font-family="system-ui, sans-serif" font-weight="700" font-size="10" text-anchor="middle" letter-spacing="1">FLAGSHIP</text>
    </g>

  </g>

  <!-- CORNER ACCENTS & TECH FRAMEWORK -->
  <g stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <!-- Top Left -->
    <path d="M 30,50 L 30,30 L 50,30" />
    <!-- Top Right -->
    <path d="M 1170,50 L 1170,30 L 1150,30" />
    <!-- Bottom Left -->
    <path d="M 30,580 L 30,600 L 50,600" />
    <!-- Bottom Right -->
    <path d="M 1170,580 L 1170,600 L 1150,600" />
  </g>

  <!-- Subtle Grid Coordinates / Tech Decals -->
  <g fill="#38bdf8" fill-opacity="0.3" font-family="monospace" font-size="9">
    <text x="45" y="22">[SYS_LOC: 37.7749° N, 122.4194° W]</text>
    <text x="1050" y="22">SECURE_VECTOR_RENDER</text>
    <text x="45" y="615">HELIA TECH // ENTERPRISE AI INTELLIGENCE</text>
    <text x="1025" y="615">BUILD v4.8.2026</text>
  </g>

</svg>