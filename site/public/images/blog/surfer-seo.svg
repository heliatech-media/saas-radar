<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    
    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="fuchsiaOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0" />
    </radialGradient>

    <!-- UI Panel Gradients -->
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="panelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cyanToViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="violetToFuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <!-- Dot Matrix Pattern -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64748b" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="100" r="300" fill="url(#cyanOrb)" />
  <circle cx="1050" cy="500" r="350" fill="url(#fuchsiaOrb)" />

  <!-- ==================== HEADER / BRANDING ==================== -->
  <g transform="translate(80, 60)">
    <!-- Architectural Dossier Badge -->
    <g filter="url(#glow)">
      <rect x="0" y="0" width="280" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    </g>
    <circle cx="18" cy="16" r="4" fill="#06b6d4">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" letter-spacing="-0.5">SURFER SEO</text>
    
    <!-- Category Subtitle -->
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="155" height="22" rx="4" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1" />
      <text x="10" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#c084fc" letter-spacing="1">AI SEO &amp; COPYWRITING</text>
    </g>

    <!-- Investigation Headline -->
    <text x="0" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="-0.2">The Genesis of Data-Driven Content Architecture</text>
    <text x="0" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">and the Masterclass Guide to SERP Dominance</text>
  </g>

  <!-- ==================== 3D VECTOR ILLUSTRATION / METAPHOR ==================== -->
  <!-- Central Data Analytics / NLP Matrix Visualisation -->
  <g transform="translate(680, 80)">
    
    <!-- Background Depth Card -->
    <rect x="-20" y="-10" width="460" height="490" rx="20" fill="url(#panelBg)" stroke="url(#panelBorder)" stroke-width="1.5" filter="url(#glow)" />
    
    <!-- Holographic UI Top Bar -->
    <g transform="translate(10, 15)">
      <circle cx="15" cy="15" r="6" fill="#ef4444" fill-opacity="0.8" />
      <circle cx="35" cy="15" r="6" fill="#f59e0b" fill-opacity="0.8" />
      <circle cx="55" cy="15" r="6" fill="#10b981" fill-opacity="0.8" />
      <rect x="80" y="8" width="310" height="14" rx="4" fill="#020617" />
      <text x="95" y="19" font-family="monospace" font-size="9" fill="#38bdf8" letter-spacing="0.5">surfer.engine://serp-matrix-v4.ai</text>
    </g>

    <!-- Content Score Radial Gauge (Hero Element) -->
    <g transform="translate(210, 140)">
      <!-- Outer Pulsing Ring -->
      <circle cx="0" cy="0" r="75" fill="none" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="10 5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite" />
      </circle>
      
      <!-- Inner Track -->
      <circle cx="0" cy="0" r="60" fill="none" stroke="#1e293b" stroke-width="8" />
      
      <!-- Progress Arc (Simulated via stroke-dasharray) -->
      <circle cx="0" cy="0" r="60" fill="none" stroke="url(#cyanToViolet)" stroke-width="8" stroke-dasharray="377" stroke-dashoffset="45" stroke-linecap="round" filter="url(#intenseGlow)" transform="rotate(-90)" />
      
      <!-- Score Display -->
      <text x="0" y="-5" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle">98</text>
      <text x="0" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2">CONTENT SCORE</text>
    </g>

    <!-- Floating Metric Nodes (Top Left & Right) -->
    <g transform="translate(30, 80)">
      <rect x="0" y="0" width="110" height="50" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8" font-weight="600">NLP TERMS</text>
      <text x="12" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#38bdf8" font-weight="800">42 / 45</text>
      <circle cx="95" cy="25" r="3" fill="#10b981" filter="url(#glow)" />
    </g>

    <g transform="translate(290, 80)">
      <rect x="0" y="0" width="110" height="50" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#d946ef" stroke-opacity="0.4" stroke-width="1" />
      <text x="12" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8" font-weight="600">WORD COUNT</text>
      <text x="12" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#d946ef" font-weight="800">2,450</text>
      <circle cx="95" cy="25" r="3" fill="#d946ef" filter="url(#glow)" />
    </g>

    <!-- Bottom Data Visualisation: SERP Entity Graph / Vector Embeddings -->
    <g transform="translate(20, 240)">
      <rect x="0" y="0" width="380" height="200" rx="12" fill="#030712" fill-opacity="0.6" stroke="#1e293b" stroke-width="1" />
      
      <text x="15" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1">SERP COMPETITOR CORRELATION</text>

      <!-- Connecting Lines & Nodes (Neural Network style) -->
      <g stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5">
        <line x1="60" y1="120" x2="140" y2="80" />
        <line x1="140" y1="80" x2="220" y2="130" />
        <line x1="220" y1="130" x2="300" y2="70" />
        <line x1="140" y1="80" x2="190" y2="160" />
        <line x1="220" y1="130" x2="320" y2="150" />
      </g>

      <!-- Data Trend Chart Path -->
      <path d="M 40 160 Q 90 100, 140 110 T 220 80 T 300 60 T 360 40" fill="none" stroke="url(#violetToFuchsia)" stroke-width="3" filter="url(#glow)" />
      
      <path d="M 40 160 Q 90 100, 140 110 T 220 80 T 300 60 T 360 40 L 360 180 L 40 180 Z" fill="url(#violetToFuchsia)" fill-opacity="0.08" />

      <!-- Interactive Nodes -->
      <g>
        <circle cx="60" cy="120" r="4" fill="#38bdf8" filter="url(#glow)" />
        <circle cx="140" cy="80" r="6" fill="#06b6d4" filter="url(#intenseGlow)" />
        <circle cx="220" cy="130" r="5" fill="#8b5cf6" filter="url(#glow)" />
        <circle cx="300" cy="70" r="6" fill="#d946ef" filter="url(#intenseGlow)" />
        <circle cx="360" cy="40" r="5" fill="#38bdf8" filter="url(#glow)" />
      </g>

      <!-- Mini Badges inside Graph -->
      <g transform="translate(15, 155)">
        <rect x="0" y="0" width="75" height="20" rx="4" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="0.5" />
        <text x="8" y="13" font-family="monospace" font-size="9" fill="#06b6d4">RANK #1</text>
      </g>

      <g transform="translate(98, 155)">
        <rect x="0" y="0" width="75" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="0.5" />
        <text x="8" y="13" font-family="monospace" font-size="9" fill="#c084fc">TOP 3 AVG</text>
      </g>
    </g>

  </g>

  <!-- ==================== FOOTER / METADATA ==================== -->
  <g transform="translate(80, 560)">
    <!-- Divider Line -->
    <line x1="0" y1="0" width="1040" x2="1040" y2="0" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Left Metadata -->
    <text x="0" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="1">AUTHORITY ENGINE v4.8</text>
    <text x="160" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#475569">|</text>
    <text x="175" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#94a3b8">NLP Entity Extraction &amp; TF-IDF Analysis</text>

    <!-- Right Brand Stamp -->
    <g transform="translate(900, 10)">
      <rect x="0" y="0" width="140" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
      <text x="70" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">HELIATECH.ONLINE</text>
    </g>
  </g>
</svg>