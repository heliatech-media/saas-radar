<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="mcpGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid mesh -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#1e293b" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="#1e293b" stroke-width="1" stroke-opacity="0.3"/>

  <!-- News Radar Pill -->
  <rect x="420" y="45" width="360" height="38" rx="19" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="445" cy="64" r="6" fill="#10b981"/>
  <text x="605" y="69" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="2">BREAKING TECH INTELLIGENCE</text>

  <!-- Central Title -->
  <text x="600" y="145" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" text-anchor="middle">
    The Model Context Protocol (MCP)
  </text>
  <text x="600" y="185" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    Why Anthropic &amp; Supabase Just Changed Enterprise AI Integration Forever
  </text>

  <!-- Diagram: Client -> MCP -> Servers -->
  <!-- Left Box: AI Agents -->
  <g transform="translate(140, 240)">
    <rect width="260" height="230" rx="16" fill="#0f172a" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <text x="130" y="50" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle">AI CLIENTS / AGENTS</text>
    <rect x="30" y="80" width="200" height="36" rx="8" fill="#1e293b"/>
    <text x="130" y="103" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Cursor AI (IDE)</text>
    <rect x="30" y="125" width="200" height="36" rx="8" fill="#1e293b"/>
    <text x="130" y="148" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Claude 3.5 Desktop</text>
    <rect x="30" y="170" width="200" height="36" rx="8" fill="#1e293b"/>
    <text x="130" y="193" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Autonomous Dev Fleets</text>
  </g>

  <!-- Center Hub: MCP Standard -->
  <g transform="translate(460, 280)">
    <rect width="280" height="150" rx="20" fill="#042f2e" stroke="#14b8a6" stroke-width="2.5" filter="url(#shadow)"/>
    <circle cx="140" cy="50" r="24" fill="#0d9488" fill-opacity="0.3" stroke="#2dd4bf" stroke-width="2"/>
    <text x="140" y="56" fill="#2dd4bf" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" text-anchor="middle">MCP</text>
    <text x="140" y="100" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" text-anchor="middle">Standardized JSON-RPC</text>
    <text x="140" y="125" fill="#99f6e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Universal Tool &amp; Context Bus</text>
  </g>

  <!-- Right Box: Enterprise Infrastructure -->
  <g transform="translate(800, 240)">
    <rect width="260" height="230" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
    <text x="130" y="50" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" text-anchor="middle">DATA &amp; INFRASTRUCTURE</text>
    <rect x="30" y="80" width="200" height="36" rx="8" fill="#1e293b"/>
    <text x="130" y="103" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Supabase Postgres</text>
    <rect x="30" y="125" width="200" height="36" rx="8" fill="#1e293b"/>
    <text x="130" y="148" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">GitHub &amp; GitLab Repos</text>
    <rect x="30" y="170" width="200" height="36" rx="8" fill="#1e293b"/>
    <text x="130" y="193" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" text-anchor="middle">SaaS APIs (Slack / Linear)</text>
  </g>

  <!-- Connection Arrows -->
  <path d="M400 355 L460 355" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M740 355 L800 355" stroke="#34d399" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Footer Tagline -->
  <text x="600" y="550" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    HeliaTech Architectural Teardown | Published November 2026 | heliatech.online
  </text>
</svg>
