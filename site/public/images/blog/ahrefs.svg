<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#070b19"/>
      <stop offset="100%" stop-color="#0f0c1b"/>
    </linearGradient>

    <!-- Glowing Orbs & Highlights -->
    <radialGradient id="ambientCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientFuchsia" cx="85%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for Neon Bloom -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="matrixGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>

    <!-- Gradients for Code & Nodes -->
    <linearGradient id="cyanToBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="violetToFuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Isometric Cube Template -->
    <g id="isoNode">
      <path d="M 0 -24 L 21 -12 L 21 12 L 0 24 L -21 12 L -21 -12 Z" fill="#090d16" stroke="url(#cyanToBlue)" stroke-width="1.5" filter="url(#subtleGlow)"/>
      <path d="M 0 -24 L 21 -12 L 0 0 L -21 -12 Z" fill="#06b6d4" fill-opacity="0.3"/>
      <path d="M 0 0 L 21 12 L 0 24 L -21 12 Z" fill="#8b5cf6" fill-opacity="0.2"/>
      <circle cx="0" cy="0" r="4" fill="#38bdf8" filter="url(#glow)"/>
    </g>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#matrixGrid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="400" fill="url(#ambientCyan)"/>
  <circle cx="1000" cy="500" r="450" fill="url(#ambientFuchsia)"/>

  <!-- ABSTRACT DOMAIN METAPHOR: Search Architecture & Neural Data Streams (Right Side) -->
  <g transform="translate(680, 80)">
    <!-- Connecting Logic Pathways / Vector Embeddings -->
    <g fill="none" stroke-width="1.5">
      <path d="M 50 80 Q 150 20, 260 120 T 400 220" stroke="url(#cyanToBlue)" stroke-opacity="0.4" filter="url(#subtleGlow)"/>
      <path d="M 80 320 Q 200 380, 280 250 T 380 90" stroke="url(#violetToFuchsia)" stroke-opacity="0.4" filter="url(#subtleGlow)"/>
      <path d="M 20 200 L 420 200" stroke="#38bdf8" stroke-opacity="0.15" stroke-dasharray="4 4"/>
      <path d="M 220 20 L 220 400" stroke="#d946ef" stroke-opacity="0.15" stroke-dasharray="4 4"/>
    </g>

    <!-- Holographic 3D IDE / Analytics Terminal Window -->
    <g transform="translate(20, 40)">
      <!-- Window Base -->
      <rect x="0" y="0" width="420" height="340" rx="12" fill="url(#glassGrad)" stroke="url(#glassBorder)" stroke-width="1.5" backdrop-filter="blur(20px)"/>
      
      <!-- Window Header Bar -->
      <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 408 0 C 414.63 0 420 5.37 420 12 L 420 40 L 0 40 Z" fill="#090d16" fill-opacity="0.8"/>
      <circle cx="20" cy="20" r="5" fill="#ef4444" fill-opacity="0.8"/>
      <circle cx="38" cy="20" r="5" fill="#f59e0b" fill-opacity="0.8"/>
      <circle cx="56" cy="20" r="5" fill="#10b981" fill-opacity="0.8"/>
      <text x="80" y="24" fill="#38bdf8" font-family="monospace" font-size="11" letter-spacing="1">AHREFS_CORE_AST_ANALYZER.rs</text>

      <!-- Code & Syntax Lines inside Terminal -->
      <g transform="translate(24, 60)" font-family="monospace" font-size="12">
        <text x="0" y="0" fill="#8b5cf6"><tspan fill="#d946ef">fn</tspan> <tspan fill="#38bdf8">crawl_organic_graph</tspan>(domain: &amp;str) -&gt; Result&lt;DominanceMap&gt; &#123;</text>
        <text x="0" y="22" fill="#94a3b8">    <tspan fill="#06b6d4">let</tspan> site_metrics = Index::fetch(domain).await?;</text>
        <text x="0" y="44" fill="#94a3b8">    <tspan fill="#06b6d4">let</tspan> ai_intent = NeuralRank::eval(&amp;site_metrics.keywords);</text>
        <text x="0" y="66" fill="#94a3b8">    <tspan fill="#d946ef">match</tspan> ai_intent.vector_score() &#123;</text>
        <text x="0" y="88" fill="#94a3b8">        Score::Elite(val) =&gt; optimize_enterprise_growth(val),</text>
        <text x="0" y="110" fill="#94a3b8">        _ =&gt; reconstruct_backlink_profile(),</text>
        <text x="0" y="132" fill="#94a3b8">    &#125;</text>
        <text x="0" y="154" fill="#8b5cf6">&#125;</text>
      </g>

      <!-- Mini Live Metric Chart Overlay inside IDE -->
      <g transform="translate(24, 230)">
        <rect x="0" y="0" width="372" height="76" rx="6" fill="#030712" fill-opacity="0.6" stroke="#38bdf8" stroke-opacity="0.2"/>
        <polyline points="20,56 70,40 120,48 170,24 220,32 270,16 320,20 350,10" fill="none" stroke="url(#cyanToBlue)" stroke-width="2.5" filter="url(#subtleGlow)"/>
        <circle cx="270" cy="16" r="4" fill="#d946ef" filter="url(#glow)"/>
        <circle cx="350" cy="10" r="4" fill="#38bdf8" filter="url(#glow)"/>
        <text x="20" y="22" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="10" letter-spacing="1.5">ORGANIC TRAFFIC VELOCITY</text>
        <text x="315" y="62" fill="#38bdf8" font-family="monospace" font-size="11">+342.8%</text>
      </g>
    </g>

    <!-- Floating Isometric Data Nodes -->
    <use href="#isoNode" x="80" y="60"/>
    <use href="#isoNode" x="380" y="120"/>
    <use href="#isoNode" x="140" y="380"/>
    <use href="#isoNode" x="340" y="320"/>

    <!-- Additional Decorative Floating Particles -->
    <circle cx="240" cy="10" r="3" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="440" cy="180" r="2" fill="#d946ef" filter="url(#glow)"/>
    <circle cx="10" cy="280" r="2.5" fill="#06b6d4" filter="url(#glow)"/>
  </g>

  <!-- TYPOGRAPHY & BRANDING SECTION (Left Side) -->
  <g transform="translate(80, 110)">
    
    <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="290" height="32" rx="16" fill="#090d16" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" filter="url(#subtleGlow)"/>
      <circle cx="18" cy="16" r="4" fill="#06b6d4" filter="url(#glow)"/>
      <text x="34" y="21" fill="#38bdf8" font-family="sans-serif" font-weight="800" font-size="10" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Tool Title: AHREFS -->
    <g transform="translate(0, 75)">
      <text x="0" y="0" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="68" letter-spacing="4" filter="url(#subtleGlow)">AHREFS</text>
      <!-- Decorative underline glow bar -->
      <rect x="0" y="15" width="240" height="4" rx="2" fill="url(#cyanToBlue)" filter="url(#glow)"/>
    </g>

    <!-- Category Subtitle -->
    <g transform="translate(0, 135)">
      <text x="0" y="0" fill="#d946ef" font-family="sans-serif" font-weight="700" font-size="16" letter-spacing="3">AI SEO &amp; COPYWRITING</text>
    </g>

    <!-- Investigation Title -->
    <g transform="translate(0, 180)">
      <text x="0" y="0" fill="#f1f5f9" font-family="sans-serif" font-weight="700" font-size="28" letter-spacing="0.5">
        <tspan x="0" dy="0">The Architecture of Search</tspan>
        <tspan x="0" dy="38">Dominance and the Hands-On</tspan>
        <tspan x="0" dy="38">Blueprint for Enterprise Organic Growth</tspan>
      </text>
    </g>

    <!-- Metadata Footer / Publisher Stamp -->
    <g transform="translate(0, 335)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1"/>
      <text x="0" y="25" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="1.5">PUBLISHED BY HELIATECH.ONLINE</text>
      <text x="380" y="25" fill="#06b6d4" font-family="monospace" font-size="11" letter-spacing="1.5">EDITION 2025.4</text>
    </g>
  </g>
</svg>