<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bg-radial" cx="50%" cy="30%" r="70%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="grid-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Brand & Accent Gradients -->
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="fuchsia-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="glass-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="glass-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="1200" height="630" fill="url(#bg-radial)" />
  <rect width="1200" height="630" fill="url(#cyber-grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="150" r="250" fill="#8b5cf6" opacity="0.15" filter="url(#glow-heavy)" />
  <circle cx="800" cy="450" r="200" fill="#06b6d4" opacity="0.12" filter="url(#glow-heavy)" />
  <circle cx="200" cy="500" r="180" fill="#d946ef" opacity="0.08" filter="url(#glow-heavy)" />

  <!-- Top Fade Grid Line -->
  <rect x="0" y="0" width="1200" height="150" fill="url(#grid-fade)" pointer-events="none" />

  <!-- ================= LEFT COLUMN: TYPOGRAPHY & DOSSIER ================= -->
  <g transform="translate(80, 90)">
    
    <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="url(#cyan-violet)" stroke-width="1.5" filter="url(#glow-subtle)" />
      <circle cx="20" cy="17" r="5" fill="#06b6d4" filter="url(#glow-subtle)">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="38" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Title: JULIUS AI -->
    <text x="0" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="-1" filter="url(#glow-subtle)">
      JULIUS <tspan fill="url(#cyan-violet)">AI</tspan>
    </text>

    <!-- Category Subtitle -->
    <g transform="translate(2, 145)">
      <rect x="0" y="0" width="180" height="24" rx="4" fill="#8b5cf6" fill-opacity="0.2" />
      <text x="10" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#c084fc" letter-spacing="2">AI DATA ANALYSIS</text>
    </g>

    <!-- Investigation Title (Multi-line) -->
    <text x="0" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9" letter-spacing="-0.3">
      The Genesis of Conversational Data Analysis
    </text>
    <text x="0" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#94a3b8" letter-spacing="-0.3">
      and the Hands-on Guide to Enterprise Velocity
    </text>

    <!-- Accent Metadata Footer -->
    <g transform="translate(0, 310)">
      <line x1="0" y1="0" x2="400" y2="0" stroke="#334155" stroke-width="1" />
      <circle cx="5" cy="0" r="2" fill="#06b6d4" />
      <text x="20" y="20" font-family="monospace" font-size="11" fill="#64748b" letter-spacing="1">SYSTEM V.4.8 // SECURE VECTOR PIPELINE</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: 3D VECTOR ILLUSTRATION (JULIUS AI METAPHOR) ================= -->
  <!-- Domain: Multi-dimensional database cubes, enriched contact graphs, high-velocity revenue charts & AI IDE integration -->
  <g transform="translate(620, 70)">

    <!-- Ambient Back Glow for Central Illustration -->
    <rect x="30" y="30" width="480" height="440" rx="24" fill="#06b6d4" opacity="0.05" filter="url(#glow-heavy)" />

    <!-- Main Glass Container (IDE / Data Workspace) -->
    <rect x="20" y="20" width="500" height="460" rx="16" fill="url(#glass-panel)" stroke="url(#glass-edge)" stroke-width="2" filter="url(#glow-heavy)" backdrop-filter="blur(20px)" />

    <!-- Window Header -->
    <g transform="translate(20, 20)">
      <path d="M 0 0 L 500 0 L 500 40 L 0 40 Z" fill="#090d16" fill-opacity="0.8" />
      <!-- Window Controls -->
      <circle cx="25" cy="20" r="6" fill="#ef4444" opacity="0.8" />
      <circle cx="45" cy="20" r="6" fill="#f59e0b" opacity="0.8" />
      <circle cx="65" cy="20" r="6" fill="#10b981" opacity="0.8" />
      <!-- File/Workspace Title -->
      <text x="90" y="24" font-family="monospace" font-size="12" fill="#94a3b8" letter-spacing="0.5">julius_core_analytics.py — Enterprise Node</text>
      <line x1="0" y1="40" x2="500" y2="40" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
    </g>

    <!-- ================= INNER GRAPHICS: 3D DATA & AI NODES ================= -->
    <g transform="translate(20, 80)">

      <!-- Connection Lines / Data Flow Web -->
      <path d="M 60 80 L 180 140 L 320 80 L 420 180" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 4" />
      <path d="M 180 140 L 220 260 L 360 280 L 420 180" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.5" />
      <path d="M 100 280 L 180 140" fill="none" stroke="#d946ef" stroke-width="1.5" stroke-opacity="0.3" />

      <!-- Isometric Analytics Chart (Floating 3D Bar Graph) -->
      <g transform="translate(40, 20)">
        <!-- Base Grid Plane -->
        <polygon points="0,60 120,0 240,60 120,120" fill="#1e293b" fill-opacity="0.5" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.3" />
        
        <!-- Bar 1 (Violet) -->
        <g transform="translate(60, 20)">
          <path d="M 0 0 L 30 -15 L 30 -55 L 0 -40 Z" fill="#8b5cf6" opacity="0.8" />
          <path d="M 30 -15 L 60 0 L 60 -40 L 30 -55 Z" fill="#7c3aed" opacity="0.9" />
          <polygon points="0,-40 30,-55 60,-40 30,-25" fill="#a78bfa" />
        </g>

        <!-- Bar 2 (Cyan - Highest Velocity) -->
        <g transform="translate(130, 55)">
          <path d="M 0 0 L 30 -15 L 30 -95 L 0 -80 Z" fill="#06b6d4" opacity="0.8" />
          <path d="M 30 -15 L 60 0 L 60 -80 L 30 -95 Z" fill="#0891b2" opacity="0.9" />
          <polygon points="0,-80 30,-95 60,-80 30,-65" fill="#22d3ee" filter="url(#glow-subtle)" />
        </g>
      </g>

      <!-- Holographic AI Vector Sphere / Core Node -->
      <g transform="translate(360, 110)">
        <circle cx="0" cy="0" r="45" fill="url(#cyan-violet)" opacity="0.15" filter="url(#glow-heavy)" />
        <circle cx="0" cy="0" r="35" fill="#090d16" stroke="url(#cyan-violet)" stroke-width="2" />
        <ellipse cx="0" cy="0" rx="35" ry="12" fill="none" stroke="#38bdf8" stroke-width="1.5" transform="rotate(30)" />
        <ellipse cx="0" cy="0" rx="35" ry="12" fill="none" stroke="#d946ef" stroke-width="1.5" transform="rotate(-30)" />
        <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#glow-heavy)" />
      </g>

      <!-- Conversational Prompt UI Overlay (Glassmorphism Pill inside IDE) -->
      <g transform="translate(30, 290)">
        <rect x="0" y="0" width="440" height="70" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" filter="url(#glow-subtle)" />
        
        <!-- Prompt Icon -->
        <circle cx="25" cy="35" r="14" fill="url(#fuchsia-cyan)" opacity="0.2" />
        <text x="18" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#06b6d4">AI</text>

        <!-- Conversational Query Text -->
        <text x="55" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">"Analyze Q3 enterprise revenue velocity &amp; project churn"</text>
        
        <!-- Typing Cursor -->
        <rect x="375" y="20" width="2" height="16" fill="#38bdf8">
          <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
        </rect>

        <!-- Status Tag -->
        <g transform="translate(55, 45)">
          <rect x="0" y="0" width="115" height="16" rx="4" fill="#10b981" fill-opacity="0.2" />
          <text x="8" y="12" font-family="monospace" font-size="9" font-weight="700" fill="#34d399">STATUS: 99.8% ACCURACY</text>
        </g>
      </g>

      <!-- Floating Syntax / Code Floating Elements -->
      <g transform="translate(30, 190)">
        <rect x="0" y="0" width="180" height="75" rx="8" fill="#090d16" fill-opacity="0.7" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3" />
        <text x="12" y="20" font-family="monospace" font-size="10" fill="#c084fc"># Vector Embeddings</text>
        <text x="12" y="38" font-family="monospace" font-size="11" fill="#38bdf8">df.clean_outliers()</text>
        <text x="12" y="55" font-family="monospace" font-size="11" fill="#34d399">model.predict_roi()</text>
      </g>

      <!-- Glowing Nodes on the Web -->
      <circle cx="60" cy="80" r="4" fill="#06b6d4" filter="url(#glow-subtle)" />
      <circle cx="180" cy="140" r="5" fill="#8b5cf6" filter="url(#glow-subtle)" />
      <circle cx="320" cy="80" r="4" fill="#38bdf8" filter="url(#glow-subtle)" />
      <circle cx="220" cy="260" r="5" fill="#d946ef" filter="url(#glow-subtle)" />
      <circle cx="420" cy="180" r="6" fill="#06b6d4" filter="url(#glow-heavy)" />

    </g>
  </g>
</svg>