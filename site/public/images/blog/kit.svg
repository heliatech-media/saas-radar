<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bgGlow" cx="75%" cy="30%" r="70%" fx="75%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#070b16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="fuchsiaOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <linearGradient id="cyanToViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="fuchsiaToCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="nodeCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glassBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="150" r="350" fill="url(#cyanOrb)" />
  <circle cx="800" cy="480" r="300" fill="url(#fuchsiaOrb)" />

  <!-- Isometric/Perspective Grid Overlay -->
  <g opacity="0.4">
    <path d="M0,100 L1200,100 M0,200 L1200,200 M0,300 L1200,300 M0,400 L1200,400 M0,500 L1200,500 M0,600 L1200,600" stroke="url(#gridFade)" stroke-width="1" />
    <path d="M200,0 L200,630 M400,0 L400,630 M600,0 L600,630 M800,0 L800,630 M1000,0 L1000,630" stroke="url(#gridFade)" stroke-width="1" />
    
    <!-- Diagonal architectural lines -->
    <line x1="0" y1="0" x2="1200" y2="630" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.1" />
    <line x1="1200" y1="0" x2="0" y2="630" stroke="#8b5cf6" stroke-width="0.5" stroke-opacity="0.1" />
  </g>

  <!-- ================= 3D VECTOR ILLUSTRATION (Automation & Creator Network Metaphor) ================= -->
  <g transform="translate(680, 80)">
    <!-- Central Isometric Platform Base -->
    <g transform="translate(0, 80)">
      <!-- Outer glow plane -->
      <polygon points="0,150 250,280 500,150 250,20" fill="#090d16" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" filter="url(#glow)" />
      <!-- Inner dark plane -->
      <polygon points="0,150 250,280 500,150 250,20" fill="#030712" fill-opacity="0.9" stroke="url(#cyanToViolet)" stroke-width="2" />
      
      <!-- Grid lines inside platform -->
      <path d="M125,85 L375,215 M250,52 L125,215 M250,52 L375,215" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.2" />
    </g>

    <!-- Floating Workflow & Subscriber Nodes (Kit Automation Metaphor) -->
    <!-- Connection Paths -->
    <path d="M140,140 Q200,80 320,110 T410,180" fill="none" stroke="url(#fuchsiaToCyan)" stroke-width="3" stroke-dasharray="6,4" filter="url(#glowSubtle)" />
    <path d="M170,260 Q260,320 350,230" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />

    <!-- Node 1: Trigger / Opt-in Source -->
    <g transform="translate(110, 100)" filter="url(#glowSubtle)">
      <polygon points="0,30 30,0 60,30 30,60" fill="#090d16" stroke="#06b6d4" stroke-width="2" />
      <circle cx="30" cy="30" r="8" fill="#06b6d4" />
      <text x="30" y="85" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#38bdf8" text-anchor="middle" letter-spacing="1">INGRESS</text>
    </g>

    <!-- Node 2: Core Engine (Kit Hub) -->
    <g transform="translate(220, 60)" filter="url(#glow)">
      <polygon points="0,40 40,0 80,40 40,80" fill="#090d16" stroke="#d946ef" stroke-width="3" />
      <circle cx="40" cy="40" r="12" fill="url(#fuchsiaToCyan)" />
      <!-- Inner vector pulse rings -->
      <circle cx="40" cy="40" r="22" fill="none" stroke="#d946ef" stroke-width="1" stroke-opacity="0.6" />
      <text x="40" y="105" font-family="system-ui, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="2">KIT ENGINE</text>
    </g>

    <!-- Node 3: Broadcast / Newsletter Vector -->
    <g transform="translate(380, 130)" filter="url(#glowSubtle)">
      <polygon points="0,30 30,0 60,30 30,60" fill="#090d16" stroke="#8b5cf6" stroke-width="2" />
      <path d="M20,30 L40,30 M30,20 L30,40" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" />
      <text x="30" y="85" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#c084fc" text-anchor="middle" letter-spacing="1">BROADCAST</text>
    </g>

    <!-- Node 4: Revenue & Growth Node -->
    <g transform="translate(280, 220)" filter="url(#glowSubtle)">
      <polygon points="0,25 25,0 50,25 25,50" fill="#090d16" stroke="#38bdf8" stroke-width="2" />
      <circle cx="25" cy="25" r="6" fill="#38bdf8" />
      <text x="25" y="75" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#38bdf8" text-anchor="middle" letter-spacing="1">SCALE</text>
    </g>

    <!-- Floating Data Particles / Sparks -->
    <circle cx="180" cy="120" r="3" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="330" cy="90" r="4" fill="#d946ef" filter="url(#glow)" />
    <circle cx="260" cy="180" r="2" fill="#ffffff" filter="url(#glow)" />
    <circle cx="390" cy="220" r="3.5" fill="#06b6d4" filter="url(#glow)" />
  </g>

  <!-- ================= TYPOGRAPHY & BRANDING ================= -->

  <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
  <g transform="translate(80, 75)">
    <!-- Glassmorphism Background Pill -->
    <rect x="0" y="0" width="315" height="34" rx="17" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <!-- Glowing Status Dot -->
    <circle cx="20" cy="17" r="4" fill="#06b6d4" filter="url(#glow)" />
    <!-- Badge Label -->
    <text x="38" y="22" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#38bdf8" letter-spacing="2.5">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- Main Article Title & Subtitle Section -->
  <g transform="translate(80, 160)">
    <!-- Category Subtitle -->
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#d946ef" letter-spacing="4" filter="url(#glowSubtle)">CREATOR SAAS &amp; NEWSLETTERS</text>

    <!-- Main Tool Title: 'Kit' -->
    <text x="0" y="75" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="76" fill="url(#textGrad)" letter-spacing="1">Kit</text>

    <!-- Subtitle / Headline Description -->
    <g transform="translate(0, 125)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#ffffff" letter-spacing="0.5">The Evolution of Creator-First Email</text>
      <text x="0" y="36" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="url(#cyanToViolet)" letter-spacing="0.5">Infrastructure &amp; Newsletter Scaling</text>
    </g>

    <!-- Architectural Metadata / Footer Stats inside Graphic -->
    <g transform="translate(0, 230)">
      <!-- Divider Line -->
      <line x1="0" y1="0" x2="520" y2="0" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
      
      <!-- Meta Item 1 -->
      <g transform="translate(0, 20)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="500" font-size="10" fill="#94a3b8" letter-spacing="1.5">STACK ANALYSIS</text>
        <text x="0" y="18" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#f8fafc" letter-spacing="0.5">Advanced Visual Automations</text>
      </g>

      <!-- Meta Item 2 -->
      <g transform="translate(200, 20)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="500" font-size="10" fill="#94a3b8" letter-spacing="1.5">INFRASTRUCTURE</text>
        <text x="0" y="18" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#f8fafc" letter-spacing="0.5">Deliverability &amp; Segments</text>
      </g>

      <!-- Meta Item 3 -->
      <g transform="translate(420, 20)">
        <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="500" font-size="10" fill="#94a3b8" letter-spacing="1.5">STATUS</text>
        <text x="0" y="18" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#06b6d4" letter-spacing="0.5">Enterprise Grade</text>
      </g>
    </g>
  </g>

  <!-- ================= BRAND WATERMARK / CORNER ACCENTS ================= -->
  <!-- Bottom Left Domain Tag -->
  <g transform="translate(80, 580)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#64748b" letter-spacing="2">HELIATECH.ONLINE // INVESTIGATION #KIT-09</text>
  </g>

  <!-- Minimalist Corner Accents -->
  <path d="M40,40 L40,70 M40,40 L70,40" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4" />
  <path d="M1160,40 L1160,70 M1160,40 L1130,40" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4" />
  <path d="M40,590 L40,560 M40,590 L70,590" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4" />
  <path d="M1160,590 L1160,560 M1160,590 L1130,590" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4" />
</svg>