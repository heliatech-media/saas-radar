<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bgGlow" cx="60%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="cyberGrid" x1="0" y1="0" x2="0" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="fuchsiaViolet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="50%" stop-color="#d946ef" stop-opacity="1" />
      <stop offset="75%" stop-color="#8b5cf6" stop-opacity="1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="glassPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow & Lighting Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern Grid -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.07" />
      <circle cx="40" cy="40" r="1" fill="#8b5cf6" fill-opacity="0.3" />
    </pattern>

    <pattern id="dotMatrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#gridPattern)" />
  <rect width="1200" height="630" fill="url(#cyberGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="180" r="220" fill="#8b5cf6" opacity="0.15" filter="url(#intenseGlow)" />
  <circle cx="850" cy="450" r="260" fill="#06b6d4" opacity="0.1" filter="url(#intenseGlow)" />
  <circle cx="300" cy="500" r="200" fill="#d946ef" opacity="0.08" filter="url(#intenseGlow)" />

  <!-- Geometric Decorative Cyber Lines & Nodes -->
  <g opacity="0.4">
    <path d="M0,100 L400,100 L480,180 L1200,180" fill="none" stroke="url(#cyanPurple)" stroke-width="1" stroke-dasharray="4 4" />
    <path d="M120,0 L120,250 L200,330 L200,630" fill="none" stroke="url(#cyanPurple)" stroke-width="0.75" opacity="0.5" />
    <path d="M850,630 L850,480 L930,400 L1200,400" fill="none" stroke="url(#fuchsiaViolet)" stroke-width="1" />
    
    <!-- Tech Node Circles -->
    <circle cx="480" cy="180" r="4" fill="#38bdf8" filter="url(#subtleGlow)" />
    <circle cx="200" cy="330" r="4" fill="#8b5cf6" filter="url(#subtleGlow)" />
    <circle cx="930" cy="400" r="4" fill="#d946ef" filter="url(#subtleGlow)" />
  </g>

  <!-- ==========================================
        TOP BADGE & BRANDING 
       ========================================== -->
  <g transform="translate(80, 70)">
    <!-- Pill Background -->
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#0f172a" stroke="url(#borderGrad)" stroke-width="1.5" />
    <!-- Glowing Status Dot -->
    <circle cx="20" cy="16" r="4" fill="#06b6d4" filter="url(#subtleGlow)" />
    <!-- Badge Text -->
    <text x="36" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- ==========================================
        TYPOGRAPHY / ARTICLE TITLE
       ========================================== -->
  <g transform="translate(80, 135)">
    <!-- Category Subtitle -->
    <text x="0" y="20" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#06b6d4" letter-spacing="3" text-transform="uppercase">Audio / Podcasting • Enterprise AI Studio</text>
    
    <!-- Main Tool Title: PODCASTLE -->
    <text x="0" y="85" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="2" filter="url(#subtleGlow)">PODCASTLE</text>
    
    <!-- Investigation Headline - Line 1 -->
    <text x="0" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#f8fafc" letter-spacing="0.5">The AI Studio Revolution &amp; The Enterprise</text>
    
    <!-- Investigation Headline - Line 2 -->
    <text x="0" y="165" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="url(#cyanPurple)" letter-spacing="0.5">Guide to Scalable Audio Production</text>
  </g>

  <!-- ==========================================
        3D DOMAIN METAPHOR: HOLOGRAPHIC 3D AUDIO WAVEFORM & NEURAL STUDIO
       ========================================== -->
  <g transform="translate(740, 150)">
    <!-- Central Isometric Holographic Container -->
    <g transform="translate(0, 30)">
      
      <!-- Back Ambient Glow -->
      <ellipse cx="180" cy="200" rx="150" ry="80" fill="#8b5cf6" opacity="0.2" filter="url(#intenseGlow)" />

      <!-- Isometric Base Grid Platform -->
      <path d="M 180,60 L 360,150 L 180,240 L 0,150 Z" fill="url(#glassPanel)" stroke="url(#borderGrad)" stroke-width="1.5" />
      <path d="M 180,60 L 360,150 L 180,240 L 0,150 Z" fill="url(#dotMatrix)" />

      <!-- Vertical Holographic Projection Pillars -->
      <line x1="90" y1="105" x2="90" y2="25" stroke="#06b6d4" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
      <line x1="180" y1="60" x2="180" y2="-20" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
      <line x1="270" y1="105" x2="270" y2="25" stroke="#d946ef" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />

      <!-- Neural Nodes on Platform -->
      <circle cx="90" cy="105" r="4" fill="#06b6d4" filter="url(#subtleGlow)" />
      <circle cx="180" cy="60" r="6" fill="#38bdf8" filter="url(#intenseGlow)" />
      <circle cx="270" cy="105" r="4" fill="#d946ef" filter="url(#subtleGlow)" />
      <circle cx="180" cy="150" r="5" fill="#8b5cf6" filter="url(#subtleGlow)" />

      <path d="M90,105 L180,60 L270,105 L180,150 Z" fill="none" stroke="#38bdf8" stroke-width="0.75" opacity="0.4" />

      <!-- Floating 3D Sound Energy Envelopes & Waveforms -->
      <!-- Back Wave Layer (Purple) -->
      <path d="M 30,120 Q 90,50 180,80 T 330,120" fill="none" stroke="#8b5cf6" stroke-width="3" opacity="0.5" filter="url(#glow)" />
      
      <!-- Mid Wave Layer (Cyan) -->
      <path d="M 30,100 Q 100,10 180,45 T 330,100" fill="none" stroke="#06b6d4" stroke-width="2.5" opacity="0.8" />

      <!-- Primary Complex 3D Audio Frequency Spectrums (Vertical Bars / Vectors) -->
      <g transform="translate(0, -30)">
        <!-- Center high-amplitude vector bars -->
        <line x1="110" y1="110" x2="110" y2="50" stroke="url(#waveGrad)" stroke-width="4" stroke-linecap="round" filter="url(#subtleGlow)" />
        <line x1="130" y1="120" x2="130" y2="30" stroke="url(#waveGrad)" stroke-width="4" stroke-linecap="round" filter="url(#intenseGlow)" />
        <line x1="150" y1="115" x2="150" y2="65" stroke="url(#waveGrad)" stroke-width="4" stroke-linecap="round" />
        <line x1="170" y1="125" x2="170" y2="15" stroke="url(#waveGrad)" stroke-width="5" stroke-linecap="round" filter="url(#intenseGlow)" />
        <line x1="190" y1="130" x2="190" y2="40" stroke="url(#waveGrad)" stroke-width="5" stroke-linecap="round" filter="url(#intenseGlow)" />
        <line x1="210" y1="115" x2="210" y2="70" stroke="url(#waveGrad)" stroke-width="4" stroke-linecap="round" />
        <line x1="230" y1="120" x2="230" y2="45" stroke="url(#waveGrad)" stroke-width="4" stroke-linecap="round" filter="url(#subtleGlow)" />
        <line x1="250" y1="110" x2="250" y2="85" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round" />
      </g>

      <!-- Floating Holographic Ring / Audio Vector Orb -->
      <ellipse cx="180" cy="30" rx="60" ry="20" fill="none" stroke="url(#cyanPurple)" stroke-width="1.5" stroke-dasharray="6 3" filter="url(#subtleGlow)" />
      <circle cx="180" cy="10" r="3" fill="#ffffff" filter="url(#intenseGlow)" />

      <!-- Floating UI Floating Glass Metric Card -->
      <g transform="translate(240, -10)">
        <rect x="0" y="0" width="110" height="50" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1" />
        <text x="12" y="20" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="1">AI ENHANCE</text>
        <text x="12" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#06b6d4">99.8%</text>
        <circle cx="92" cy="25" r="3" fill="#10b981" filter="url(#subtleGlow)" />
      </g>

      <!-- Floating UI Metric Card 2 -->
      <g transform="translate(-50, 140)">
        <rect x="0" y="0" width="120" height="50" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#8b5cf6" stroke-width="1" />
        <text x="12" y="20" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="1">STUDIO LATENCY</text>
        <text x="12" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#d946ef">12ms <tspan font-size="10" fill="#38bdf8" font-weight="400">REALTIME</tspan></text>
      </g>

    </g>
  </g>

  <!-- ==========================================
        BOTTOM ENTERPRISE METADATA BAR
       ========================================== -->
  <g transform="translate(80, 550)">
    <!-- Divider Line -->
    <line x1="0" y1="0" x2="1040" y2="0" stroke="url(#cyanPurple)" stroke-width="1" opacity="0.3" />
    
    <!-- Metadata Items -->
    <g transform="translate(0, 20)">
      <!-- Item 1 -->
      <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1.5">ARCHITECTURE</text>
      <text x="0" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">NEURAL MULTI-TRACK</text>
    </g>

    <g transform="translate(260, 20)">
      <!-- Item 2 -->
      <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1.5">SCALE METRIC</text>
      <text x="0" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">4K STUDIO GRADE</text>
    </g>

    <g transform="translate(520, 20)">
      <!-- Item 3 -->
      <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="1.5">SECURITY AUDIT</text>
      <text x="0" y="18" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">SOC2 COMPLIANT</text>
    </g>

    <!-- Publisher Brand Watermark / Tag -->
    <g transform="translate(870, 10)">
      <rect x="0" y="-2" width="170" height="28" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="0.5" opacity="0.8" />
      <text x="12" y="16" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="2">HELIATECH<tspan fill="#d946ef">.ONLINE</tspan></text>
    </g>
  </g>
</svg>