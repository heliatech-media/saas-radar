<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background &amp; Base Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f071e"/>
    </linearGradient>

    <!-- Glowing Orbs Radial Gradients -->
    <radialGradient id="glow-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-fuchsia" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Gradients for UI &amp; Vectors -->
    <linearGradient id="line-cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="line-violet-fuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#475569" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="100" r="300" fill="url(#glow-cyan)"/>
  <circle cx="950" cy="500" r="350" fill="url(#glow-violet)"/>
  <circle cx="650" cy="200" r="250" fill="url(#glow-fuchsia)"/>

  <!-- Geometric Accent Lines &amp; Overlay -->
  <g opacity="0.3">
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#06b6d4" stroke-width="0.5" stroke-dasharray="4 8"/>
    <line x1="0" y1="480" x2="1200" y2="480" stroke="#8b5cf6" stroke-width="0.5" stroke-dasharray="4 8"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#38bdf8" stroke-width="0.5" stroke-dasharray="4 8"/>
  </g>

  <!-- ================= DYNAMIC ECOSYSTEM NETWORK (RIGHT SIDE) ================= -->
  <!-- Connecting Pathways / Web -->
  <g filter="url(#glow-subtle)">
    <!-- Central Hub to Nodes -->
    <path d="M 850 315 L 680 210" fill="none" stroke="url(#line-cyan-blue)" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="M 850 315 L 1040 200" fill="none" stroke="url(#line-violet-fuchsia)" stroke-width="2"/>
    <path d="M 850 315 L 700 440" fill="none" stroke="url(#line-violet-fuchsia)" stroke-width="2"/>
    <path d="M 850 315 L 1020 460" fill="none" stroke="url(#line-cyan-blue)" stroke-width="2" stroke-dasharray="6 4"/>
    
    <!-- Secondary Interconnections -->
    <path d="M 680 210 L 560 300" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M 1040 200 L 1110 320" fill="none" stroke="#d946ef" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M 700 440 L 880 530" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M 1020 460 L 1110 320" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M 680 210 L 700 440" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.4"/>
    <path d="M 1040 200 L 1020 460" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.4"/>
  </g>

  <!-- Node Elements (Ecosystem Partners, Affiliates, Resellers) -->
  <!-- Node Top-Left (Affiliates) -->
  <g transform="translate(680, 210)">
    <circle r="36" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow-subtle)"/>
    <circle r="24" fill="#090d16" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <path d="M-8 -4 L0 -12 L8 -4 M0 -12 L0 8" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="52" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">AFFILIATES</text>
  </g>

  <!-- Node Top-Right (Resellers) -->
  <g transform="translate(1040, 200)">
    <circle r="42" fill="url(#card-grad)" stroke="#d946ef" stroke-width="2" filter="url(#glow-subtle)"/>
    <circle r="30" fill="#090d16" stroke="#d946ef" stroke-opacity="0.4" stroke-width="1"/>
    <path d="M-10 4 L0 -6 L10 4 M-6 0 L6 0 M-8 10 L8 10" fill="none" stroke="#d946ef" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="58" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">RESELLERS</text>
  </g>

  <!-- Node Bottom-Left (Influencers) -->
  <g transform="translate(700, 440)">
    <circle r="38" fill="url(#card-grad)" stroke="#8b5cf6" stroke-width="2" filter="url(#glow-subtle)"/>
    <circle r="26" fill="#090d16" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="0" cy="-3" r="5" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M-10 10 C-10 4 -4 2 0 2 C4 2 10 4 10 10" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
    <text x="0" y="54" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">INFLUENCERS</text>
  </g>

  <!-- Node Bottom-Right (Strategic Alliances) -->
  <g transform="translate(1020, 460)">
    <circle r="36" fill="url(#card-grad)" stroke="#06b6d4" stroke-width="2" filter="url(#glow-subtle)"/>
    <circle r="24" fill="#090d16" stroke="#06b6d4" stroke-opacity="0.4" stroke-width="1"/>
    <rect x="-6" y="-6" width="12" height="12" fill="none" stroke="#06b6d4" stroke-width="2" rx="2"/>
    <text x="0" y="52" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">ALLIANCES</text>
  </g>

  <!-- Outer Micro Nodes -->
  <g transform="translate(560, 300)">
    <circle r="16" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
  </g>
  <g transform="translate(1110, 320)">
    <circle r="18" fill="#3b0764" stroke="#d946ef" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#d946ef"/>
  </g>
  <g transform="translate(880, 530)">
    <circle r="16" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#8b5cf6"/>
  </g>

  <!-- CENTRAL COMMAND / PARTNERSTACK HUB -->
  <g transform="translate(850, 315)">
    <!-- Outer Pulsing Rings -->
    <circle r="75" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8 4"/>
    <circle r="62" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5"/>
    
    <!-- Hub Base -->
    <circle r="52" fill="url(#card-grad)" stroke="url(#line-cyan-blue)" stroke-width="3" filter="url(#glow-heavy)"/>
    
    <!-- Core Icon: Multi-layered Stack/Network symbol -->
    <g transform="translate(0, -4)">
      <path d="M0 -22 L18 -12 L0 -2 L-18 -12 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-18 0 L0 10 L18 0" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M-18 11 L0 21 L18 11" fill="none" stroke="#d946ef" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
    
    <!-- Hub Label -->
    <text x="0" y="74" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2" filter="url(#glow-subtle)">MASTER HUB</text>
  </g>


  <!-- ================= LEFT SIDE: TYPOGRAPHY &amp; DOSSIER ================= -->

  <!-- Top Pill Badge -->
  <g transform="translate(80, 75)">
    <rect x="0" y="0" width="310" height="34" rx="17" fill="url(#badge-grad)" stroke="#1e293b" stroke-width="1.5" filter="url(#glow-subtle)"/>
    <!-- Glowing Dot -->
    <circle cx="20" cy="17" r="4" fill="#06b6d4" filter="url(#glow-heavy)"/>
    <circle cx="20" cy="17" r="2" fill="#ffffff"/>
    <text x="38" y="21" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- Main Title &amp; Subtitle Group -->
  <g transform="translate(80, 150)">
    <!-- Tool Category Subtitle -->
    <text x="0" y="20" fill="#a855f7" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="4" filter="url(#glow-subtle)">B2B PARTNER ECOSYSTEM</text>
    
    <!-- Main Tool Title: PARTNERSTACK -->
    <text x="0" y="85" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="64" font-weight="900" letter-spacing="3" filter="url(#glow-subtle)">
      PARTNER<tspan fill="#06b6d4">STACK</tspan>
    </text>

    <!-- Investigation Article Title -->
    <text x="0" y="130" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="0.5">
      Scaling B2B SaaS Ecosystems and the
    </text>
    <text x="0" y="162" fill="url(#line-cyan-blue)" font-family="system-ui, sans-serif" font-size="22" font-weight="800" letter-spacing="0.5" filter="url(#glow-subtle)">
      Masterclass to Multi-Channel Revenue
    </text>

    <!-- Divider Line with Gradient -->
    <rect x="0" y="190" width="460" height="2" rx="1" fill="url(#line-cyan-blue)"/>
    <circle cx="460" cy="191" r="3" fill="#38bdf8"/>
  </g>


  <!-- ================= BOTTOM METRICS / BADGES ================= -->
  <g transform="translate(80, 430)">
    <!-- Metric Card 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="145" height="110" rx="12" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.5"/>
      <path d="M 0 12 C 0 5 5 0 12 0 L 133 0 C 140 0 145 5 145 12 L 145 24 L 0 24 Z" fill="#111827" opacity="0.8"/>
      <text x="16" y="16" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">REVENUE CHANNELS</text>
      <text x="16" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="32" font-weight="800">3x</text>
      <text x="16" y="92" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Multi-tier expansion</text>
      <!-- Mini graph accent -->
      <path d="M 110 75 L 120 65 L 128 70 L 135 50" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Metric Card 2 -->
    <g transform="translate(165, 0)">
      <rect x="0" y="0" width="145" height="110" rx="12" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.5"/>
      <path d="M 0 12 C 0 5 5 0 12 0 L 133 0 C 140 0 145 5 145 12 L 145 24 L 0 24 Z" fill="#111827" opacity="0.8"/>
      <text x="16" y="16" fill="#a855f7" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">ECOSYSTEM SYNC</text>
      <text x="16" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="32" font-weight="800">100%</text>
      <text x="16" y="92" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Automated payout</text>
      <!-- Mini graph accent -->
      <path d="M 110 65 L 120 70 L 128 55 L 135 60" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Metric Card 3 -->
    <g transform="translate(330, 0)">
      <rect x="0" y="0" width="130" height="110" rx="12" fill="url(#card-grad)" stroke="#1e293b" stroke-width="1.5"/>
      <path d="M 0 12 C 0 5 5 0 12 0 L 118 0 C 125 0 130 5 130 12 L 130 24 L 0 24 Z" fill="#111827" opacity="0.8"/>
      <text x="16" y="16" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">STACK ENGINE</text>
      <text x="16" y="70" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="32" font-weight="800">V4.2</text>
      <text x="16" y="92" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Enterprise Ready</text>
      <!-- Circular status indicator -->
      <circle cx="105" cy="65" r="10" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="15 5"/>
    </g>
  </g>

  <!-- Watermark / Brand Signature -->
  <text x="1120" y="595" text-anchor="end" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="3" opacity="0.6">HELIATECH.ONLINE</text>
</svg>