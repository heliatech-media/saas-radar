<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="600" cy="315" r="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1628"/>
      <stop offset="50%" stop-color="#070a13"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Ambient Glow Orbs -->
    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fuchsiaOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Node & Line Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="violetFuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#334155" fill-opacity="0.5"/>
    </pattern>

    <!-- Hexagon Def -->
    <polygon id="hex" points="30,0 90,0 120,52 90,104 30,104 0,52"/>
  </defs>

  <!-- 1. Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- 2. Ambient Lighting / Orbs -->
  <circle cx="950" cy="180" r="350" fill="url(#cyanOrb)"/>
  <circle cx="850" cy="480" r="300" fill="url(#fuchsiaOrb)"/>
  <circle cx="200" cy="350" r="280" flair="none" fill="url(#violetOrb)"/>

  <!-- 3. Isometric Automation & Data Flow Engine (Loops Domain Metaphor) -->
  <g transform="translate(620, 80)">
    <!-- Connecting Workflow Pathways (Loops/Triggers) -->
    <g fill="none" stroke-width="2.5" filter="url(#softGlow)">
      <!-- Main Infinite Loop Path -->
      <path d="M 50 250 C 50 120, 200 80, 280 180 C 360 280, 480 240, 480 130" stroke="url(#violetFuchsia)" stroke-dasharray="8 4"/>
      <path d="M 480 130 C 480 40, 320 20, 240 100 C 160 180, 50 200, 50 320 C 50 420, 220 460, 310 370 C 370 310, 430 310, 480 350" stroke="url(#cyanBlue)"/>
      
      <!-- Webhook Pulses / Branches -->
      <path d="M 180 145 L 260 220 L 380 180" stroke="#38bdf8" stroke-opacity="0.6"/>
      <path d="M 280 280 L 350 350 L 440 280" stroke="#d946ef" stroke-opacity="0.6"/>
    </g>

    <!-- Floating Data Nodes / Isometric Cards -->
    <!-- Node 1: Trigger Event -->
    <g transform="translate(30, 200)">
      <polygon points="40,0 80,20 40,40 0,20" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="40" y="24" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">TRIGGER</text>
      <circle cx="40" cy="20" r="3" fill="#06b6d4" filter="url(#glow)"/>
    </g>

    <!-- Node 2: API Event Stream -->
    <g transform="translate(180, 110)">
      <rect x="0" y="0" width="110" height="50" rx="8" fill="#090d16" stroke="#8b5cf6" stroke-width="1.5" opacity="0.9"/>
      <line x1="15" y1="18" x2="65" y2="18" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
      <line x1="15" y1="32" x2="85" y2="32" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <circle cx="92" cy="25" r="4" fill="#d946ef" filter="url(#glow)"/>
    </g>

    <!-- Node 3: Segmentation Logic (Loops Core Feature) -->
    <g transform="translate(350, 70)">
      <polygon points="50,0 100,25 50,50 0,25" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
      <text x="50" y="29" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">SEGMENT</text>
    </g>

    <!-- Node 4: Dynamic Email Dispatch (The Loop) -->
    <g transform="translate(420, 220)">
      <rect x="0" y="0" width="130" height="70" rx="10" fill="#0b1329" stroke="#d946ef" stroke-width="2" filter="url(#glow)"/>
      <path d="M 15 25 L 65 50 L 115 25" fill="none" stroke="#f472b6" stroke-width="2"/>
      <rect x="15" y="20" width="100" height="40" rx="4" fill="none" stroke="#f472b6" stroke-width="1.5"/>
      <text x="65" y="45" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">LOOP.SEND()</text>
    </g>

    <!-- Node 5: Analytics / PLG Growth Metric -->
    <g transform="translate(260, 330)">
      <rect x="0" y="0" width="100" height="60" rx="8" fill="#070a13" stroke="#06b6d4" stroke-width="1.5"/>
      <polyline points="15,45 35,30 55,38 85,15" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="85" cy="15" r="4" fill="#38bdf8" filter="url(#glow)"/>
    </g>

    <!-- Floating Micro Particles -->
    <circle cx="120" cy="80" r="3" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="230" cy="220" r="2" fill="#d946ef" />
    <circle cx="410" cy="160" r="3" fill="#8b5cf6" filter="url(#glow)"/>
    <circle cx="340" cy="420" r="2.5" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="150" cy="380" r="2" fill="#f472b6"/>
  </g>

  <!-- 4. Typography & Branding Layout -->
  <g transform="translate(80, 110)">
    
    <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
    <g transform="translate(0, 0)" filter="url(#softGlow)">
      <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <!-- Glowing Live Indicator Dot -->
      <circle cx="20" cy="17" r="5" fill="#06b6d4" filter="url(#glow)"/>
      <circle cx="20" cy="17" r="2" fill="#ffffff"/>
      <!-- Badge Text -->
      <text x="38" y="22" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Tool Title: LOOPS -->
    <text x="0" y="130" fill="url(#textGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="88" letter-spacing="4">LOOPS</text>
    
    <!-- Category Subtitle -->
    <g transform="translate(3, 165)">
      <rect x="0" y="0" width="160" height="26" rx="4" fill="#06b6d4" fill-opacity="0.15"/>
      <text x="12" y="17" fill="#06b6d4" font-family="monospace" font-weight="bold" font-size="12" letter-spacing="2">EMAIL MARKETING</text>
    </g>

    <!-- Investigation Title (Multi-line) -->
    <text x="0" y="235" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="28" letter-spacing="0.5">
      <tspan x="0" dy="0">The Modern Email Engine for SaaS</tspan>
      <tspan x="0" dy="38">and the Blueprint for Product-Led Growth</tspan>
    </text>

    <!-- Analytical Metadata Footer -->
    <g transform="translate(0, 340)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#1e293b" stroke-width="1.5"/>
      <text x="0" y="25" fill="#64748b" font-family="monospace" font-size="11" letter-spacing="1">ARCHITECTURAL AUDIT</text>
      <text x="180" y="25" fill="#38bdf8" font-family="monospace" font-size="11" letter-spacing="1">/// STATUS: VERIFIED</text>
      <text x="360" y="25" fill="#64748b" font-family="monospace" font-size="11" letter-spacing="1">SEC-202X</text>
    </g>
  </g>

  <!-- 5. Decorative Framing Elements -->
  <g stroke="#334155" stroke-opacity="0.4" fill="none">
    <!-- Top-Left Corner Accent -->
    <path d="M 30 50 L 30 30 L 50 30" stroke-width="2"/>
    <!-- Bottom-Left Corner Accent -->
    <path d="M 30 580 L 30 600 L 50 600" stroke-width="2"/>
    <!-- Top-Right Corner Accent -->
    <path d="M 1170 50 L 1170 30 L 1150 30" stroke-width="2"/>
    <!-- Bottom-Right Corner Accent -->
    <path d="M 1170 580 L 1170 600 L 1150 600" stroke-width="2"/>
  </g>
</svg>