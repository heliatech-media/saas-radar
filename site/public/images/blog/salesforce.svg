<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bgGlow" cx="60%" cy="40%" r="70%" fx="60%" fy="40%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Electric Salesforce & Cyber Neon Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="violetFuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="warningGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop Shadow for 3D elements -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#cyberGrid)"/>

  <!-- Ambient Background Light Orbs -->
  <circle cx="950" cy="150" r="250" fill="#06b6d4" opacity="0.1" filter="url(#intenseGlow)"/>
  <circle cx="850" cy="450" r="300" fill="#8b5cf6" opacity="0.1" filter="url(#intenseGlow)"/>
  <circle cx="200" cy="500" r="200" fill="#38bdf8" opacity="0.05" filter="url(#intenseGlow)"/>

  <!-- ================= HEADER / BRANDING ================= -->
  <!-- Top Pill Badge -->
  <g transform="translate(80, 50)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="18" cy="16" r="4" fill="#06b6d4" filter="url(#glow)"/>
    <text x="36" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- Tool & Category Titles -->
  <text x="80" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="4">B2B SALES &amp; CRM INTELLIGENCE</text>
  
  <text x="80" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
    SALES<tspan fill="url(#cyanBlue)">FORCE</tspan>
  </text>

  <!-- Investigation Title Subtext -->
  <text x="80" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">
    Salesforce Sales Cloud 2026 Hidden Rate Card:
  </text>
  <text x="80" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="url(#warningGlow)" filter="url(#glow)">
    Einstein 1 AI Costs &amp; Storage Overage Leaks
  </text>

  <!-- ================= 3D VECTOR ILLUSTRATION (CRM DATA METAPHOR) ================= -->
  <!-- Right-side Container for Complex Isometric/3D UI Metaphor -->
  <g transform="translate(620, 90)" filter="url(#dropShadow)">
    
    <!-- Base Holographic Platform / Shadow Plane -->
    <ellipse cx="250" cy="420" rx="220" ry="60" fill="#030712" opacity="0.8"/>
    <ellipse cx="250" cy="420" rx="220" ry="60" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.3" filter="url(#glow)"/>

    <!-- Floating Multi-Dimensional Database Cube Layers (CRM Architecture) -->
    <!-- Layer 3 (Top - AI Intelligence & Einstein Node) -->
    <g transform="translate(180, 40)">
      <polygon points="70,0 210,40 140,90 0,50" fill="url(#violetFuchsia)" opacity="0.9" stroke="#d946ef" stroke-width="1"/>
      <polygon points="140,90 210,40 210,100 140,150" fill="#5b21b6" opacity="0.8"/>
      <polygon points="0,50 140,90 140,150 0,110" fill="#4c1d95" opacity="0.9"/>
      <!-- Node Icon Inside Top Cube -->
      <circle cx="105" cy="70" r="12" fill="#ffffff" filter="url(#glow)"/>
      <path d="M100 70 L110 70 M105 65 L105 75" stroke="#8b5cf6" stroke-width="3"/>
    </g>

    <!-- Layer 2 (Middle - Enriched Contact Graph & Revenue Streams) -->
    <g transform="translate(100, 140)">
      <polygon points="90,0 270,50 180,110 0,60" fill="url(#cyanBlue)" opacity="0.8" stroke="#38bdf8" stroke-width="1.5"/>
      <polygon points="180,110 270,50 270,130 180,190" fill="#0369a1" opacity="0.85"/>
      <polygon points="0,60 180,110 180,190 0,140" fill="#075985" opacity="0.9"/>
      
      <!-- Vector Data Lines on Surface -->
      <path d="M 45 80 L 90 95 L 135 80 L 180 95" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" filter="url(#glow)"/>
      <circle cx="135" cy="80" r="5" fill="#f43f5e" filter="url(#glow)"/>
      <text x="145" y="75" fill="#f43f5e" font-family="monospace" font-size="12" font-weight="bold">+ $450k LEAK</text>
    </g>

    <!-- Layer 1 (Bottom - Base Infrastructure & Storage Overage Leaks) -->
    <g transform="translate(20, 240)">
      <polygon points="110,0 330,60 220,130 0,70" fill="#0f172a" opacity="0.9" stroke="#64748b" stroke-width="1"/>
      <polygon points="220,130 330,60 330,150 220,220" fill="#1e293b" opacity="0.9"/>
      <polygon points="0,70 220,130 220,220 0,160" fill="#090d16" opacity="0.95"/>
      
      <!-- Grid Lines on Base Layer -->
      <line x1="110" y1="65" x2="220" y2="130" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
      <line x1="165" y1="32" x2="55" y2="95" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
    </g>

    <!-- Interconnecting Holographic Data Streams (Beams) -->
    <g stroke="url(#cyanBlue)" stroke-width="2" opacity="0.7" fill="none">
      <path d="M280,130 L320,190" filter="url(#glow)"/>
      <path d="M200,190 L240,270" filter="url(#glow)"/>
    </g>
    <g stroke="url(#warningGlow)" stroke-width="2" opacity="0.9" fill="none">
      <path d="M350,220 L400,310" stroke-dasharray="6,4" filter="url(#glow)"/>
    </g>

    <!-- Floating Diagnostic / Cost Overage Alert Panels -->
    <!-- Panel 1: Einstein 1 AI Token Consumption Warning -->
    <g transform="translate(10, 30)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="180" height="64" rx="8" fill="url(#cardBg)" stroke="#d946ef" stroke-width="1.5"/>
      <circle cx="20" cy="32" r="6" fill="#d946ef" filter="url(#glow)"/>
      <text x="36" y="26" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="bold">EINSTEIN 1 AI</text>
      <text x="36" y="46" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">$120 / User / Mo</text>
    </g>

    <!-- Panel 2: Storage Overage Alert -->
    <g transform="translate(300, 290)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="190" height="64" rx="8" fill="url(#cardBg)" stroke="#f43f5e" stroke-width="1.5"/>
      <circle cx="20" cy="32" r="6" fill="#f43f5e" filter="url(#glow)"/>
      <text x="36" y="26" fill="#f43f5e" font-family="monospace" font-size="10" font-weight="bold">DATA STORAGE OVERAGE</text>
      <text x="36" y="46" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">+$1,000 / GB / Mo</text>
    </g>
    
    <!-- Floating Data Particle Nodes -->
    <circle cx="150" cy="180" r="3" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="380" cy="120" r="4" fill="#d946ef" filter="url(#glow)"/>
    <circle cx="280" cy="380" r="3" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="90" cy="330" r="2.5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- ================= BOTTOM METRICS / FOOTER BAR ================= -->
  <g transform="translate(80, 530)">
    <!-- Dividing Line -->
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Metric 1 -->
    <g transform="translate(0, 20)">
      <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="11" font-weight="600">AUDIT SCOPE</text>
      <text x="0" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Sales Cloud Unlimited</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(280, 20)">
      <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="11" font-weight="600">EFFECTIVE MULTIPLIER</text>
      <text x="0" y="22" fill="url(#warningGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" filter="url(#glow)">3.4x TCO Surge</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(560, 20)">
      <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="11" font-weight="600">INVESTIGATION STATUS</text>
      <text x="0" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">VERIFIED DOSSIER</text>
    </g>

    <!-- Domain Watermark / Brand -->
    <g transform="translate(860, 15)">
      <text x="180" y="20" text-anchor="end" fill="#64748b" font-family="monospace" font-size="13" font-weight="700" letter-spacing="1">heliatech.online</text>
    </g>
  </g>
</svg>