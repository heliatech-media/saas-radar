<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Metallic & Neon Gradients -->
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="fuchsia-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="glass-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="code-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Geometric Grid Pattern -->
    <pattern id="isometric-grid" width="60" height="52" patternUnits="userSpaceOnUse">
      <path d="M30 0 L60 17.32 L60 51.96 L30 69.28 L0 51.96 L0 17.32 Z" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08" />
      <path d="M30 0 L30 34.64 M60 17.32 L0 17.32 M0 51.96 L30 34.64 M60 51.96 L30 34.64" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />
  <rect width="1200" height="630" fill="url(#isometric-grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="150" r="250" fill="#8b5cf6" opacity="0.15" filter="url(#glow-heavy)" />
  <circle cx="200" cy="500" r="300" fill="#06b6d4" opacity="0.1" filter="url(#glow-heavy)" />
  <circle cx="750" cy="450" r="200" fill="#d946ef" opacity="0.08" filter="url(#glow-heavy)" />

  <!-- Abstract Global Deployment Lines / Network Vectors -->
  <g opacity="0.4" filter="url(#glow-subtle)">
    <path d="M 600,120 L 850,200 L 1050,350" fill="none" stroke="url(#cyan-violet)" stroke-width="2" stroke-dasharray="6 4" />
    <path d="M 600,120 L 350,220 L 150,380" fill="none" stroke="url(#cyan-violet)" stroke-width="2" />
    <path d="M 850,200 L 900,320 L 1100,480" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 350,220 L 250,350 L 100,450" fill="none" stroke="#d946ef" stroke-width="1.5" stroke-dasharray="4 4" />
    <!-- Network Nodes -->
    <circle cx="600" cy="120" r="5" fill="#38bdf8" />
    <circle cx="850" cy="200" r="4" fill="#8b5cf6" />
    <circle cx="350" cy="220" r="4" fill="#06b6d4" />
    <circle cx="900" cy="320" r="3" fill="#d946ef" />
    <circle cx="250" cy="350" r="3" fill="#38bdf8" />
  </g>

  <!-- HELIATECH ARCHITECTURAL DOSSIER (Top Pill Badge) -->
  <g transform="translate(80, 60)" filter="url(#drop-shadow)">
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="18" cy="17" r="4" fill="#06b6d4" filter="url(#glow-subtle)" />
    <text x="36" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- Typography & Category Section -->
  <g transform="translate(80, 140)">
    <!-- Category Subtitle -->
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="4" text-transform="uppercase">
      DevTools <tspan fill="#38bdf8" dx="8">•</tspan> <tspan fill="#c084fc" dx="8">Enterprise Software Investigation</tspan>
    </text>

    <!-- Main Tool Title: VERCEL -->
    <text x="0" y="75" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" letter-spacing="-1" filter="url(#glow-subtle)">
      VERCEL
    </text>
    <text x="0" y="75" fill="none" stroke="url(#cyan-violet)" stroke-width="1.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" letter-spacing="-1">
      VERCEL
    </text>

    <!-- Sub-headline / Narrative -->
    <text x="0" y="125" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" letter-spacing="-0.3">
      The Frontend Cloud Revolution and the Masterclass
    </text>
    <text x="0" y="155" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      in Modern Web Deployment Velocity
    </text>
  </g>

  <!-- Metrics / Key Highlights Bar at Bottom -->
  <g transform="translate(80, 520)">
    <!-- Metric 1 -->
    <g transform="translate(0, 0)">
      <rect width="160" height="50" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" />
      <text x="16" y="21" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">GLOBAL EDGE</text>
      <text x="16" y="38" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Sub-10ms Latency</text>
    </g>
    <!-- Metric 2 -->
    <g transform="translate(180, 0)">
      <rect width="160" height="50" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" />
      <text x="16" y="21" fill="#c084fc" font-family="monospace" font-size="14" font-weight="700">CI/CD PIPELINE</text>
      <text x="16" y="38" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Instant Previews</text>
    </g>
    <!-- Metric 3 -->
    <g transform="translate(360, 0)">
      <rect width="160" height="50" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" />
      <text x="16" y="21" fill="#f43f5e" font-family="monospace" font-size="14" font-weight="700">SCALABILITY</text>
      <text x="16" y="38" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Infinite Serverless</text>
    </g>
  </g>

  <!-- 3D Vector Domain Metaphor: Isometric IDE & Code Deployment Engine -->
  <g transform="translate(620, 80)" filter="url(#drop-shadow)">
    
    <!-- Main Floating Window (IDE Interface) -->
    <g transform="translate(40, 40)">
      <!-- Window Base -->
      <rect x="0" y="0" width="460" height="380" rx="14" fill="url(#glass-panel)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
      
      <!-- Window Header -->
      <path d="M 0 14 C 0 6.268 6.268 0 14 0 L 446 0 C 453.732 0 460 6.268 460 14 L 460 40 L 0 40 Z" fill="#090d16" />
      <!-- Traffic Light Dots -->
      <circle cx="20" cy="20" r="6" fill="#f43f5e" opacity="0.8" />
      <circle cx="40" cy="20" r="6" fill="#eab308" opacity="0.8" />
      <circle cx="60" cy="20" r="6" fill="#22c55e" opacity="0.8" />
      <!-- Window Title -->
      <text x="230" y="24" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">vercel.json — deployment.ts</text>

      <!-- Code Syntax Editor Content -->
      <g transform="translate(25, 65)" font-family="monospace" font-size="13">
        <text x="0" y="0" fill="#64748b">01</text>
        <text x="35" y="0" fill="#c084fc">import</text>
        <text x="85" y="0" fill="#e2e8f0">{</text>
        <text x="95" y="0" fill="#38bdf8">deploy</text>
        <text x="145" y="0" fill="#e2e8f0">}</text>
        <text x="160" y="0" fill="#c084fc">from</text>
        <text x="195" y="0" fill="#34d399">'@vercel/cloud'</text>

        <text x="0" y="25" fill="#64748b">02</text>
        <text x="35" y="25" fill="#c084fc">export</text>
        <text x="85" y="25" fill="#c084fc">default</text>
        <text x="135" y="25" fill="#f472b6">async</text>
        <text x="175" y="25" fill="#38bdf8">handler</text>
        <text x="225" y="25" fill="#e2e8f0">(req, res) =&gt; {</text>

        <text x="0" y="50" fill="#64748b">03</text>
        <text x="55" y="50" fill="#e2e8f0">const</text>
        <text x="95" y="50" fill="#38bdf8">velocity</text>
        <text x="160" y="50" fill="#f43f5e">=</text>
        <text x="175" y="50" fill="#c084fc">await</text>
        <text x="215" y="50" fill="#38bdf8">deploy</text>
        <text x="260" y="50" fill="#e2e8f0">({</text>

        <text x="0" y="75" fill="#64748b">04</text>
        <text x="75" y="75" fill="#94a3b8">edge:</text>
        <text x="115" y="75" fill="#34d399">true</text>
        <text x="150" y="75" fill="#e2e8f0">,</text>

        <text x="0" y="100" fill="#64748b">05</text>
        <text x="75" y="100" fill="#94a3b8">regions:</text>
        <text x="135" y="100" fill="#e2e8f0">[</text>
        <text x="145" y="100" fill="#34d399">'sfo1'</text>
        <text x="190" y="100" fill="#e2e8f0">,</text>
        <text x="200" y="100" fill="#34d399">'iad1'</text>
        <text x="245" y="100" fill="#e2e8f0">,</text>
        <text x="255" y="100" fill="#34d399">'cdg1'</text>
        <text x="300" y="100" fill="#e2e8f0">],</text>

        <text x="0" y="125" fill="#64748b">06</text>
        <text x="75" y="125" fill="#94a3b8">framework:</text>
        <text x="160" y="125" fill="#34d399">'nextjs'</text>

        <text x="0" y="150" fill="#64748b">07</text>
        <text x="55" y="150" fill="#e2e8f0">});</text>

        <text x="0" y="175" fill="#64748b">08</text>
        <text x="35" y="175" fill="#c084fc">return</text>
        <text x="75" y="175" fill="#38bdf8">res</text>
        <text x="100" y="175" fill="#e2e8f0">.</text>
        <text x="105" y="175" fill="#38bdf8">status</text>
        <text x="145" y="175" fill="#e2e8f0">(</text>
        <text x="150" y="175" fill="#f43f5e">200</text>
        <text x="175" y="175" fill="#e2e8f0">).</text>
        <text x="180" y="175" fill="#38bdf8">json</text>
        <text x="210" y="175" fill="#e2e8f0">({</text>
        <text x="225" y="175" fill="#38bdf8">velocity</text>
        <text x="285" y="175" fill="#e2e8f0">});</text>

        <text x="0" y="200" fill="#64748b">09</text>
        <text x="35" y="200" fill="#e2e8f0">};</text>
      </g>

      <!-- IDE Active Glow Elements / Line Highlight -->
      <rect x="20" y="130" width="420" height="24" rx="4" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
    </g>

    <!-- Floating Holographic Badge (Deployment Success) -->
    <g transform="translate(0, 310)" filter="url(#glow-subtle)">
      <rect x="0" y="0" width="220" height="70" rx="12" fill="#090d16" fill-opacity="0.9" stroke="url(#cyan-violet)" stroke-width="2" />
      
      <!-- Success Icon -->
      <circle cx="35" cy="35" r="18" fill="#06b6d4" fill-opacity="0.2" />
      <path d="M 27 35 L 33 41 L 45 29" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Text -->
      <text x="65" y="28" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Production Ready</text>
      <text x="65" y="48" fill="#34d399" font-family="monospace" font-size="11" font-weight="600">✓ Built in 1.2s</text>
    </g>

    <!-- Floating Global Node Metric Badge -->
    <g transform="translate(320, 0)" filter="url(#glow-subtle)">
      <rect x="0" y="0" width="180" height="60" rx="10" fill="#090d16" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1.5" />
      <circle cx="25" cy="30" r="6" fill="#8b5cf6" />
      <text x="45" y="25" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="1">GLOBAL EDGES</text>
      <text x="45" y="44" fill="#ffffff" font-family="monospace" font-size="14" font-weight="700">100+ Regions</text>
    </g>

  </g>

  <!-- Vercel Delta Geometric Brand Accent in the Background Corner -->
  <g transform="translate(1080, 50)" opacity="0.15" filter="url(#glow-heavy)">
    <polygon points="50,0 100,86 0,86" fill="url(#cyan-violet)" />
  </g>
</svg>