<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bgGrad" cx="600" cy="315" r="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#060913" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    
    <linearGradient id="gridGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.08" />
    </linearGradient>

    <!-- Core Brand & Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="fuchsiaViolet" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow & Lighting Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="hexGrid" width="40" height="69.28" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M 40 0 L 20 11.547 L 0 0 L 0 23.094 L 20 34.641 L 40 23.094 Z M 0 34.641 L 20 46.188 L 40 34.641 L 40 57.735 L 20 69.282 L 0 57.735 Z" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <!-- 1. Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#hexGrid)" />
  <rect width="1200" height="630" fill="url(#gridGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="100" r="250" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="500" r="300" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" />
  <circle cx="650" cy="300" r="200" fill="#d946ef" opacity="0.08" filter="url(#glow)" />

  <!-- 2. Isometric AI Canvas / Workspace Metaphor (Right Side) -->
  <g transform="translate(620, 75)" filter="url(#dropShadow)">
    <!-- Base Holographic Platform Plane -->
    <path d="M 50 380 L 280 460 L 530 360 L 300 280 Z" fill="#090d16" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <path d="M 50 380 L 280 460 L 530 360 L 300 280 Z" fill="url(#cyanPurple)" opacity="0.05" />

    <!-- Connection Rays from Platform to Floating Cards -->
    <line x1="280" y1="370" x2="280" y2="230" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
    <line x1="160" y1="325" x2="120" y2="160" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
    <line x1="410" y1="320" x2="450" y2="140" stroke="#d946ef" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

    <!-- Floating Card 1: The Blank Slide Transformation (Left) -->
    <g transform="translate(40, 80)">
      <rect width="180" height="130" rx="12" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#dropShadow)" />
      <!-- Card Header -->
      <circle cx="20" cy="20" r="6" fill="#06b6d4" />
      <rect x="35" y="17" width="80" height="6" rx="3" fill="#38bdf8" opacity="0.8" />
      <!-- Skeleton UI Elements -->
      <rect x="20" y="45" width="140" height="40" rx="6" fill="#1e293b" opacity="0.7" />
      <circle cx="40" cy="65" r="12" fill="#8b5cf6" opacity="0.5" />
      <rect x="65" y="57" width="75" height="6" rx="3" fill="#cbd5e1" opacity="0.6" />
      <rect x="65" y="70" width="50" height="5" rx="2.5" fill="#64748b" opacity="0.6" />
      <rect x="20" y="100" width="90" height="8" rx="4" fill="#06b6d4" opacity="0.4" />
    </g>

    <!-- Floating Card 2: AI Velocity Vector (Right) -->
    <g transform="translate(320, 60)">
      <rect width="190" height="140" rx="12" fill="url(#cardBg)" stroke="#d946ef" stroke-width="1.5" filter="url(#dropShadow)" />
      <!-- Card Header -->
      <circle cx="20" cy="20" r="6" fill="#d946ef" />
      <rect x="35" y="17" width="90" height="6" rx="3" fill="#f472b6" opacity="0.8" />
      
      <!-- Vector Flow Chart Line -->
      <path d="M 20 100 Q 60 40 100 80 T 170 30" fill="none" stroke="url(#fuchsiaViolet)" stroke-width="3" filter="url(#intenseGlow)" />
      <path d="M 20 100 Q 60 40 100 80 T 170 30" fill="none" stroke="#ffffff" stroke-width="1" />
      
      <!-- Data Points -->
      <circle cx="20" cy="100" r="4" fill="#d946ef" />
      <circle cx="100" cy="80" r="4" fill="#38bdf8" />
      <circle cx="170" cy="30" r="5" fill="#06b6d4" filter="url(#glow)" />
    </g>

    <!-- Central Hero Document / Presentation Deck (Main Center Node) -->
    <g transform="translate(170, 150)" filter="url(#dropShadow)">
      <rect width="240" height="170" rx="16" fill="url(#cardBg)" stroke="url(#cyanPurple)" stroke-width="2" />
      
      <!-- Top Navigation bar of UI -->
      <rect x="15" y="15" width="210" height="24" rx="6" fill="#090d16" />
      <circle cx="27" cy="27" r="4" fill="#ef4444" />
      <circle cx="40" cy="27" r="4" fill="#f59e0b" />
      <circle cx="53" cy="27" r="4" fill="#10b981" />
      <rect x="75" y="24" width="90" height="6" rx="3" fill="#38bdf8" opacity="0.5" />

      <!-- Slide Content Preview: Modern Grid Layout -->
      <!-- Left side image block placeholder -->
      <rect x="20" y="55" width="90" height="95" rx="8" fill="#1e293b" opacity="0.8" />
      <path d="M 35 110 L 55 90 L 75 115 L 95 100 L 105 125 L 25 125 Z" fill="#06b6d4" opacity="0.3" />
      <circle cx="50" cy="75" r="8" fill="#38bdf8" opacity="0.6" />

      <!-- Right side typographic blocks -->
      <rect x="125" y="55" width="95" height="12" rx="4" fill="#ffffff" opacity="0.9" />
      <rect x="125" y="75" width="80" height="8" rx="3" fill="#94a3b8" opacity="0.7" />
      <rect x="125" y="90" width="85" height="8" rx="3" fill="#64748b" opacity="0.6" />
      
      <!-- AI Generation Sparkle Badge -->
      <g transform="translate(175, 115)">
        <circle cx="15" cy="15" r="20" fill="url(#cyanPurple)" opacity="0.2" filter="url(#glow)" />
        <circle cx="15" cy="15" r="16" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
        <path d="M 15 7 L 17.5 12.5 L 23 15 L 17.5 17.5 L 15 23 L 12.5 17.5 L 7 15 L 12.5 12.5 Z" fill="#38bdf8" />
      </g>
    </g>

    <!-- Floating Neural Nodes / Sparkles around the 3D Composition -->
    <circle cx="230" cy="120" r="4" fill="#38bdf8" filter="url(#intenseGlow)" />
    <circle cx="390" cy="100" r="3" fill="#d946ef" filter="url(#intenseGlow)" />
    <circle cx="100" cy="270" r="5" fill="#06b6d4" filter="url(#intenseGlow)" />
    <circle cx="450" cy="280" r="4" fill="#8b5cf6" filter="url(#intenseGlow)" />
  </g>

  <!-- 3. Typography & UI Badges (Left Side) -->
  <g transform="translate(80, 85)">
    <!-- Top Pill Badge -->
    <g filter="url(#dropShadow)">
      <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
      <circle cx="20" cy="17" r="5" fill="#06b6d4" filter="url(#intenseGlow)" />
      <text x="38" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Tool Title: GAMMA -->
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="900" fill="#ffffff" letter-spacing="4" filter="url(#dropShadow)">GAMMA</text>
    
    <!-- Category Subtitle -->
    <text x="4" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#06b6d4" letter-spacing="3">AI PRESENTATION &amp; DOCUMENT CREATOR</text>

    <!-- Headline: The Death of the Blank Slide -->
    <g transform="translate(0, 225)">
      <!-- Gradient-masked or crisp high-contrast layout -->
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="0.5">
        The Death of the Blank Slide
      </text>
      <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#cyanPurple)" letter-spacing="0.5" filter="url(#intenseGlow)">
        and the Blueprint for AI-Powered
      </text>
      <text x="0" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#fuchsiaViolet)" letter-spacing="0.5">
        Presentation Velocity
      </text>
    </g>

    <!-- Investigation Metadata / Footer Tag -->
    <g transform="translate(0, 370)">
      <line x1="0" y1="0" x2="420" y2="0" stroke="#334155" stroke-width="1" />
      <circle cx="6" cy="18" r="3" fill="#10b981" />
      <text x="18" y="22" font-family="Courier New, monospace" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="1.5">INVESTIGATION REF: HT-2025-GAMMA</text>
      <text x="310" y="22" font-family="Courier New, monospace" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1">heliatech.online</text>
    </g>
  </g>
</svg>