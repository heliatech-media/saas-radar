<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background &amp; Base Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#070b19"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <!-- Brand Color Gradients -->
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="fuchsia-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="glass-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="node-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="axis-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow &amp; Blur Filters -->
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.07"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>

    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8b5cf6" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#grid-pattern)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="150" r="280" fill="#8b5cf6" opacity="0.12" filter="url(#glow-heavy)"/>
  <circle cx="750" cy="450" r="250" fill="#06b6d4" opacity="0.10" filter="url(#glow-heavy)"/>
  <circle cx="200" cy="300" r="200" fill="#38bdf8" opacity="0.08" filter="url(#glow-heavy)"/>

  <!-- ================= TECHNICAL DECORATIONS &amp; AXIS ================= -->
  <g opacity="0.4">
    <!-- Vertical coordinate markers -->
    <line x1="60" y1="80" x2="60" y2="550" stroke="url(#axis-grad)" stroke-width="1"/>
    <text x="45" y="100" fill="#06b6d4" font-family="monospace" font-size="10">01 // VELOCITY</text>
    <text x="45" y="300" fill="#06b6d4" font-family="monospace" font-size="10">02 // TRACKING</text>
    <text x="45" y="500" fill="#06b6d4" font-family="monospace" font-size="10">03 // SCALE</text>

    <!-- Horizontal grid indicators -->
    <line x1="100" y1="580" x2="1100" y2="580" stroke="url(#axis-grad)" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- ================= 3D VECTOR ILLUSTRATION (RIGHT SIDE) ================= -->
  <!-- Isometric DevTools / Issue Tracking Engine Metaphor -->
  <g transform="translate(620, 60)" filter="url(#drop-shadow)">
    <!-- Base Isometric Grid Platform -->
    <path d="M 260 40 L 500 160 L 260 280 L 20 160 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <path d="M 260 40 L 500 160 L 500 420 L 260 300 Z" fill="#090d16" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5"/>
    <path d="M 260 300 L 260 560 L 20 440 L 20 160 Z" fill="#0b1329" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Connecting Workflow / Velocity Vector Lines -->
    <g fill="none">
      <!-- Path 1: High Velocity Stream -->
      <path d="M 100 280 Q 200 220 300 290 T 420 340" stroke="url(#cyan-violet)" stroke-width="3" filter="url(#glow-subtle)"/>
      <path d="M 100 280 Q 200 220 300 290 T 420 340" stroke="#ffffff" stroke-width="1" stroke-dasharray="6 6"/>

      <!-- Path 2: Auxiliary Sub-system Pipeline -->
      <path d="M 140 380 L 240 330 L 380 400" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- Floating 3D Node Cubes / Issue Tracking Modules -->
    <!-- Node A: Backlog / Intake -->
    <g transform="translate(80, 200)">
      <polygon points="0,0 40,-20 80,0 40,20" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <polygon points="0,0 0,30 40,50 40,20" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <polygon points="40,20 40,50 80,30 80,0" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="40" cy="15" r="4" fill="#06b6d4" filter="url(#glow-subtle)"/>
    </g>

    <!-- Node B: Active Sprint Cycle (Central Hub) -->
    <g transform="translate(260, 250)">
      <polygon points="0,0 50,-25 100,0 50,25" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
      <polygon points="0,0 0,40 50,65 50,25" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/>
      <polygon points="50,25 50,65 100,40 100,0" fill="#171932" stroke="#8b5cf6" stroke-width="2"/>
      <!-- Glowing Core Indicator -->
      <circle cx="50" cy="20" r="7" fill="#d946ef" filter="url(#glow-heavy)"/>
      <circle cx="50" cy="20" r="3" fill="#ffffff"/>
    </g>

    <!-- Node C: Production Velocity / Shipped -->
    <g transform="translate(360, 160)">
      <polygon points="0,0 35,-17 70,0 35,17" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
      <polygon points="0,0 0,25 35,42 35,17" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
      <polygon points="35,17 35,42 70,25 70,0" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="35" cy="12" r="4" fill="#34d399" filter="url(#glow-subtle)"/>
    </g>

    <!-- Holographic UI Glass Panel Floating Above -->
    <g transform="translate(110, 60)" filter="url(#drop-shadow)">
      <rect width="280" height="110" rx="12" fill="url(#glass-panel)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
      <!-- Window Controls -->
      <circle cx="20" cy="20" r="4" fill="#f43f5e" opacity="0.8"/>
      <circle cx="35" cy="20" r="4" fill="#fbbf24" opacity="0.8"/>
      <circle cx="50" cy="20" r="4" fill="#34d399" opacity="0.8"/>
      <text x="70" y="24" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="600">linear.app/engine/v3</text>
      
      <!-- Live Code/Metrics Simulation inside Glass -->
      <line x1="20" y1="45" x2="260" y2="45" stroke="#334155" stroke-width="1"/>
      <text x="20" y="70" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">ISSUE-4091: REFACTOR_CORE_ENGINE</text>
      <!-- Progress Bar -->
      <rect x="20" y="85" width="240" height="6" rx="3" fill="#0f172a"/>
      <rect x="20" y="85" width="190" height="6" rx="3" fill="url(#cyan-violet)" filter="url(#glow-subtle)"/>
      <text x="225" y="91" fill="#a855f7" font-family="monospace" font-size="10" font-weight="bold">92%</text>
    </g>

    <!-- Floating Micro Tags / Status Badges -->
    <g transform="translate(380, 310)">
      <rect width="90" height="26" rx="13" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
      <circle cx="15" cy="13" r="3" fill="#d946ef"/>
      <text x="28" y="17" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="bold">CYCLES</text>
    </g>
  </g>

  <!-- ================= TYPOGRAPHY &amp; HEADER SECTION (LEFT SIDE) ================= -->
  <g transform="translate(80, 0)">
    
    <!-- Top Pill Badge -->
    <g transform="translate(0, 85)">
      <rect width="320" height="32" rx="16" fill="#1e1b4b" fill-opacity="0.7" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="18" cy="16" r="5" fill="#06b6d4" filter="url(#glow-subtle)"/>
      <!-- Pulsing ring behind dot -->
      <circle cx="18" cy="16" r="9" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.6"/>
      <text x="35" y="21" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Tool Title: LINEAR -->
    <g transform="translate(0, 195)">
      <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="900" letter-spacing="-1" filter="url(#drop-shadow)">LINEAR</text>
      <!-- Subtle offset glowing duplicate for depth -->
      <text x="2" y="0" fill="url(#cyan-violet)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="900" letter-spacing="-1" opacity="0.3" filter="url(#glow-heavy)">LINEAR</text>
    </g>

    <!-- Category Subtitle -->
    <g transform="translate(0, 235)">
      <text x="0" y="0" fill="#8b5cf6" font-family="monospace" font-size="14" font-weight="700" letter-spacing="4">DEVTOOLS // ENTERPRISE INVESTIGATION</text>
    </g>

    <!-- Article Heading / Focus Statement -->
    <g transform="translate(0, 290)">
      <text x="0" y="0" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" line-height="1.3">
        <tspan x="0" dy="0">The Engineering Masterclass in</tspan>
        <tspan x="0" dy="38">Blazing-Fast Velocity &amp; Issue Tracking</tspan>
      </text>
    </g>

    <!-- Description Paragraph -->
    <g transform="translate(0, 395)">
      <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
        <tspan x="0" dy="0">A deep-dive technical assessment into how Linear redefines</tspan>
        <tspan x="0" dy="22">modern software development workflows with uncompromising</tspan>
        <tspan x="0" dy="22">speed, keyboard-first navigation, and real-time synchronization.</tspan>
      </text>
    </g>

    <!-- Metadata Footer / Author Branding -->
    <g transform="translate(0, 495)">
      <!-- Divider Line -->
      <line x1="0" y1="0" x2="480" y2="0" stroke="#1e293b" stroke-width="1.5"/>
      
      <g transform="translate(0, 20)">
        <!-- Publisher Tag -->
        <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">PUBLISHED BY HELIATECH.ONLINE</text>
        
        <!-- Tech Stack Badges -->
        <g transform="translate(0, 25)">
          <rect width="70" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
          <text x="10" y="15" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">REACT</text>

          <rect width="80" height="22" rx="4" x="78" fill="#0f172a" stroke="#334155" stroke-width="1"/>
          <text x="88" y="15" fill="#d946ef" font-family="monospace" font-size="10" font-weight="bold">GRAPHQL</text>

          <rect width="90" height="22" rx="4" x="166" fill="#0f172a" stroke="#334155" stroke-width="1"/>
          <text x="176" y="15" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold">SUB-100MS</text>
        </g>
      </g>
    </g>

  </g>

  <!-- ================= FRAME BORDER / ACCENTS ================= -->
  <!-- Subtle cyber frame border -->
  <rect x="15" y="15" width="1170" height="600" rx="8" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15"/>
  <!-- Corner Tech Accents -->
  <path d="M 15 35 L 15 15 L 35 15" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M 1185 35 L 1185 15 L 1165 15" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M 15 595 L 15 615 L 35 615" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.6"/>
  <path d="M 1185 595 L 1185 615 L 1165 615" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.6"/>

</svg>