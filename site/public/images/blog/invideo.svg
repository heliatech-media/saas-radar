<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Glowing Orb Gradients -->
    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="fuchsia-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violet-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for UI Elements & Neon lines -->
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="neon-fuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="card-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="timeline-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Hexagon Pattern Overlay -->
    <pattern id="hex-grid" width="60" height="103.92" patternUnits="userSpaceOnUse">
      <path d="M30 0 L60 17.32 L60 51.96 L30 69.28 L0 51.96 L0 17.32 Z M30 103.92 L60 86.6 L60 51.96 L30 69.28 L0 51.96 L0 86.6 Z" fill="none" stroke="#8b5cf6" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#grid-pattern)" />
  <rect width="1200" height="630" fill="url(#hex-grid)" opacity="0.5" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="150" cy="150" r="300" fill="url(#cyan-glow)" />
  <circle cx="1050" cy="450" r="350" fill="url(#fuchsia-glow)" />
  <circle cx="650" cy="200" r="250" fill="url(#violet-glow)" />

  <!-- ================= BACKGROUND GRAPHICS / METAPHORS ================= -->
  <!-- Holographic Neural Render Timelines & Audio Waveforms (Right Side) -->
  <g transform="translate(680, 100)" opacity="0.85">
    <!-- Isometric Platform Grid -->
    <path d="M 0 200 L 220 90 L 440 200 L 220 310 Z" fill="#0f172a" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 0 260 L 220 150 L 440 260 L 220 370 Z" fill="#0f172a" fill-opacity="0.4" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3" />

    <!-- Connection Nodes & Vectors -->
    <g filter="url(#glow-subtle)">
      <line x1="220" y1="90" x2="220" y2="20" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 4" />
      <circle cx="220" cy="20" r="6" fill="#38bdf8" />
      
      <line x1="110" y1="145" x2="80" y2="80" stroke="#d946ef" stroke-width="1.5" />
      <circle cx="80" cy="80" r="4" fill="#d946ef" />

      <line x1="330" y1="145" x2="380" y2="70" stroke="#8b5cf6" stroke-width="1.5" />
      <circle cx="380" cy="70" r="5" fill="#8b5cf6" />
    </g>

    <!-- Floating 3D Audio Waveform Bars (Vector Neural Render) -->
    <g transform="translate(60, 110)">
      <rect x="0" y="30" width="8" height="60" rx="4" fill="url(#neon-cyan)" />
      <rect x="15" y="10" width="8" height="100" rx="4" fill="url(#neon-fuchsia)" />
      <rect x="30" y="45" width="8" height="30" rx="4" fill="url(#neon-cyan)" />
      <rect x="45" y="5" width="8" height="110" rx="4" fill="#38bdf8" filter="url(#glow-heavy)" />
      <rect x="60" y="25" width="8" height="70" rx="4" fill="url(#neon-fuchsia)" />
      <rect x="75" y="40" width="8" height="40" rx="4" fill="#8b5cf6" />
      <rect x="90" y="15" width="8" height="90" rx="4" fill="url(#neon-cyan)" />
      <rect x="105" y="35" width="8" height="50" rx="4" fill="#d946ef" />
      <rect x="120" y="20" width="8" height="80" rx="4" fill="url(#neon-fuchsia)" filter="url(#glow-heavy)" />
      <rect x="135" y="50" width="8" height="20" rx="4" fill="#38bdf8" />
      <rect x="150" y="10" width="8" height="100" rx="4" fill="url(#neon-cyan)" />
      <rect x="165" y="30" width="8" height="60" rx="4" fill="#8b5cf6" />
      <rect x="180" y="15" width="8" height="90" rx="4" fill="url(#neon-fuchsia)" />
      <rect x="195" y="40" width="8" height="40" rx="4" fill="#06b6d4" />
    </g>

    <!-- Floating UI Video Canvas Frame -->
    <g transform="translate(40, -30)" filter="url(#glow-heavy)">
      <rect x="0" y="0" width="340" height="200" rx="12" fill="url(#card-glass)" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Window Header -->
      <circle cx="20" cy="15" r="3" fill="#ef4444" />
      <circle cx="32" cy="15" r="3" fill="#f59e0b" />
      <circle cx="44" cy="15" r="3" fill="#10b981" />
      <text x="65" y="19" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="600">INVIDEO_AI_RENDER_V2.6.NODE</text>
      <line x1="0" y1="30" x2="340" y2="30" stroke="#334155" stroke-width="1" />
      
      <!-- Video Timeline Scrub Bar inside preview -->
      <rect x="20" y="165" width="300" height="6" rx="3" fill="#0f172a" />
      <rect x="20" y="165" width="180" height="6" rx="3" fill="url(#neon-cyan)" />
      <circle cx="200" cy="168" r="5" fill="#ffffff" filter="url(#glow-subtle)" />
      
      <!-- Playhead / Prompt Node Overlay -->
      <rect x="120" y="60" width="100" height="30" rx="6" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1" />
      <text x="132" y="79" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">PROMPT_GEN</text>
    </g>
  </g>

  <!-- ================= TYPOGRAPHY & FOREGROUND CONTENT ================= -->

  <!-- Top Pill Badge -->
  <g transform="translate(80, 85)" filter="url(#glow-subtle)">
    <rect x="0" y="0" width="275" height="32" rx="16" fill="#0f172a" stroke="url(#neon-cyan)" stroke-width="1.5" />
    <circle cx="18" cy="16" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="21" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- Main Title: INVIDEO -->
  <g transform="translate(80, 185)">
    <!-- Shadow/Glow text layer -->
    <text x="0" y="0" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" letter-spacing="4" filter="url(#glow-heavy)" opacity="0.6">INVIDEO</text>
    <!-- Crisp Foreground text -->
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" letter-spacing="4">INVIDEO</text>
  </g>

  <!-- Subtitle Category & Title -->
  <g transform="translate(84, 235)">
    <text x="0" y="0" fill="url(#neon-fuchsia)" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="3">AI VIDEO • ENTERPRISE SCALE 2026</text>
  </g>

  <!-- Investigation Heading Block -->
  <g transform="translate(80, 290)">
    <text x="0" y="0" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" letter-spacing="0.5">The Genesis of Prompt-to-Video Production</text>
    <text x="0" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">And the Hands-on Guide to Enterprise Scale in 2026.</text>
  </g>

  <!-- ================= METRICS & ARCHITECTURAL TAGS ================= -->
  <g transform="translate(80, 430)">
    <!-- Metric Card 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="95" rx="10" fill="url(#card-glass)" stroke="#334155" stroke-width="1" />
      <path d="M 0 10 A 10 10 0 0 1 10 0 L 30 0 L 30 5 L 10 5 A 5 5 0 0 0 5 10 L 5 20 L 0 20 Z" fill="#06b6d4" />
      <text x="18" y="38" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="28" font-weight="900">0.4s</text>
      <text x="18" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">LATENCY TOKEN</text>
      <text x="18" y="76" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Neural Render</text>
    </g>

    <!-- Metric Card 2 -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="160" height="95" rx="10" fill="url(#card-glass)" stroke="#334155" stroke-width="1" />
      <path d="M 0 10 A 10 10 0 0 1 10 0 L 30 0 L 30 5 L 10 5 A 5 5 0 0 0 5 10 L 5 20 L 0 20 Z" fill="#8b5cf6" />
      <text x="18" y="38" fill="#c084fc" font-family="system-ui, sans-serif" font-size="28" font-weight="900">10M+</text>
      <text x="18" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">ASSETS STREAM</text>
      <text x="18" y="76" fill="#d946ef" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Global Scale</text>
    </g>

    <!-- Metric Card 3 -->
    <g transform="translate(360, 0)">
      <rect x="0" y="0" width="160" height="95" rx="10" fill="url(#card-glass)" stroke="#334155" stroke-width="1" />
      <path d="M 0 10 A 10 10 0 0 1 10 0 L 30 0 L 30 5 L 10 5 A 5 5 0 0 0 5 10 L 5 20 L 0 20 Z" fill="#38bdf8" />
      <text x="18" y="38" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="28" font-weight="900">99.9%</text>
      <text x="18" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">SYNCHRONY</text>
      <text x="18" y="76" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Vector Voice</text>
    </g>
  </g>

  <!-- ================= BRAND WATERMARK / FOOTER ================= -->
  <g transform="translate(80, 570)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#1e293b" stroke-width="1.5" />
    <text x="0" y="25" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">HELIA TECH RESEARCH DIVISION</text>
    <text x="1040" y="25" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="end" letter-spacing="1.5">HELIATECH.ONLINE</text>
  </g>
</svg>