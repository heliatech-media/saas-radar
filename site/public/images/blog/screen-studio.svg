<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070a13" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Ambient Glow Orbs -->
    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="fuchsiaOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- UI & Panel Gradients -->
    <linearGradient id="panelGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="panelBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="timelineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#cyberGrid)" />

  <!-- Ambient Lighting Orbs -->
  <circle cx="200" cy="150" r="350" fill="url(#cyanOrb)" />
  <circle cx="950" cy="450" r="400" fill="url(#fuchsiaOrb)" />

  <!-- Background Vector Waves & AI Neural Nodes (Video/Audio Domain Metaphor) -->
  <g opacity="0.4" filter="url(#glow)">
    <path d="M 50 380 Q 250 200, 450 380 T 850 380 T 1150 250" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.3" />
    <path d="M 50 420 Q 300 250, 550 420 T 1050 320" fill="none" stroke="#d946ef" stroke-width="1.5" stroke-opacity="0.3" />
  </g>

  <!-- Architectural Dossier Pill Badge -->
  <g transform="translate(80, 70)" filter="url(#glowSubtle)">
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="url(#panelBorder)" stroke-width="1.5" />
    <circle cx="20" cy="17" r="4" fill="#06b6d4">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2">HELIA TECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- Main Typography Section -->
  <g transform="translate(80, 140)">
    <!-- Category Subtitle -->
    <text x="0" y="0" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="3">AI VIDEO &amp; SCREEN RECORDING</text>
    
    <!-- Main Title -->
    <text x="0" y="52" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#dropShadow)">
      SCREEN STUDIO
    </text>
    <text x="0" y="94" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500">
      The Cinematic AI Screen Recorder Redefining Product Demos
    </text>
  </g>

  <!-- 3D Cinematic Vector Illustration: Holographic AI Video Editor & Timeline Workspace -->
  <g transform="translate(80, 275)" filter="url(#dropShadow)">
    <!-- Main Window Frame -->
    <rect x="0" y="0" width="1040" height="280" rx="16" fill="url(#panelGlass)" stroke="url(#panelBorder)" stroke-width="2" />
    
    <!-- Window Header / Controls -->
    <g transform="translate(20, 20)">
      <circle cx="8" cy="8" r="6" fill="#ef4444" opacity="0.8" />
      <circle cx="28" cy="8" r="6" fill="#f59e0b" opacity="0.8" />
      <circle cx="48" cy="8" r="6" fill="#10b981" opacity="0.8" />
      
      <!-- Project Name Badge inside UI -->
      <rect x="380" y="-4" width="280" height="24" rx="12" fill="#030712" stroke="#334155" stroke-width="1" />
      <text x="520" y="11" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">project-demo-v4-final.mp4</text>
      
      <text x="980" y="12" fill="#06b6d4" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="end">60 FPS • 4K AI ZOOM</text>
    </g>

    <!-- Divider Line -->
    <line x1="0" y1="48" x2="1040" y2="48" stroke="#334155" stroke-width="1" opacity="0.6" />

    <!-- Simulated UI Content: Video Preview Canvas (Left) & AI Vector Timeline (Right) -->
    
    <!-- Canvas Viewport Mockup -->
    <g transform="translate(30, 75)">
      <rect x="0" y="0" width="380" height="175" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1" />
      <!-- Animated Mock UI inside Canvas -->
      <rect x="30" y="25" width="320" height="100" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="0.5" opacity="0.8" />
      <circle cx="55" cy="50" r="12" fill="#8b5cf6" />
      <rect x="80" y="42" width="140" height="8" rx="4" fill="#38bdf8" opacity="0.8" />
      <rect x="80" y="58" width="90" height="6" rx="3" fill="#64748b" opacity="0.6" />
      
      <!-- Interactive Zoom Cursor / AI Focus Ring -->
      <g transform="translate(180, 75)" filter="url(#glow)">
        <circle cx="0" cy="0" r="35" fill="none" stroke="#d946ef" stroke-width="2" stroke-dasharray="6 4" />
        <circle cx="0" cy="0" r="42" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.5" />
        <!-- Cursor pointer -->
        <polygon points="0,0 12,12 6,18 -2,14" fill="#ffffff" stroke="#000000" stroke-width="1" />
      </g>

      <text x="25" y="155" fill="#38bdf8" font-family="monospace" font-size="10">AI Auto-Zoom: Active (2.5x)</text>
    </g>

    <!-- Timeline & Waveform Editor (Right) -->
    <g transform="translate(435, 75)">
      <rect x="0" y="0" width="575" height="175" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1" />
      
      <!-- Timeline Grid Markers -->
      <g stroke="#1e293b" stroke-width="1" opacity="0.5">
        <line x1="50" y1="0" x2="50" y2="175" />
        <line x1="150" y1="0" x2="150" y2="175" />
        <line x1="250" y1="0" x2="250" y2="175" />
        <line x1="350" y1="0" x2="350" y2="175" />
        <line x1="450" y1="0" x2="450" y2="175" />
        <line x1="550" y1="0" x2="550" y2="175" />
      </g>

      <!-- Track 1: Video / Motion Path -->
      <text x="15" y="25" fill="#64748b" font-family="monospace" font-size="10">TRACK 01 : KINETIC ZOOM</text>
      <rect x="15" y="35" width="180" height="26" rx="4" fill="#8b5cf6" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="1" />
      <rect x="220" y="35" width="240" height="26" rx="4" fill="#06b6d4" fill-opacity="0.3" stroke="#06b6d4" stroke-width="1" />

      <!-- Track 2: Audio & Neural Voice Synthesis Waveform -->
      <text x="15" y="85" fill="#64748b" font-family="monospace" font-size="10">TRACK 02 : AUDIO ENVELOPE</text>
      <g transform="translate(15, 95)" filter="url(#glowSubtle)">
        <path d="M 0 15 L 20 15 L 30 5 L 40 25 L 50 10 L 60 20 L 80 15 L 100 2 L 120 28 L 140 15 L 180 15 L 200 8 L 220 22 L 240 15 L 300 15 L 320 0 L 340 30 L 360 15 L 420 15 L 440 10 L 460 20 L 500 15 L 540 15" fill="none" stroke="url(#timelineGrad)" stroke-width="2" />
      </g>

      <!-- Playhead Needle -->
      <g transform="translate(260, 0)">
        <line x1="0" y1="0" x2="0" y2="175" stroke="#f43f5e" stroke-width="2" filter="url(#glow)" />
        <polygon points="-5,0 5,0 0,6" fill="#f43f5e" />
      </g>

      <!-- Bottom Status Bar inside Timeline -->
      <rect x="0" y="145" width="575" height="30" fill="#090d16" rx="0 0 8 8" />
      <circle cx="25" cy="160" r="4" fill="#10b981" />
      <text x="38" y="164" fill="#94a3b8" font-family="monospace" font-size="10">AI Smart Background Cleaned • 60fps Render Ready</text>
    </g>
  </g>

  <!-- Floating HUD Elements & Accents -->
  <g transform="translate(1000, 110)" filter="url(#glow)">
    <polygon points="0,20 20,0 60,0 80,20 60,40 20,40" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
    <text x="40" y="25" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">v3.2</text>
  </g>

  <!-- Decorative Corner Brackets for High-Tech Enterprise Feel -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 30 30 L 50 30 M 30 30 L 30 50" />
    <path d="M 1170 30 L 1150 30 M 1170 30 L 1170 50" />
    <path d="M 30 600 L 50 600 M 30 600 L 30 580" />
    <path d="M 1170 600 L 1150 600 M 1170 600 L 1170 580" />
  </g>
</svg>