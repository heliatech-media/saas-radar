<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="60%" cy="40%" r="80%" fx="600" fy="315" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="50%" stop-color="#060913" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Glow & Lighting Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glass-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <!-- Gradients for UI Elements & Accents -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="violetFuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#dots)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="180" r="220" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
  <circle cx="800" cy="450" r="280" fill="#8b5cf6" opacity="0.10" filter="url(#glow)" />
  <circle cx="200" cy="500" r="250" fill="#38bdf8" opacity="0.08" filter="url(#glow)" />

  <!-- ==================== BACKGROUND ARTWORK / METAPHOR ==================== -->
  <g transform="translate(560, 80)">
    <!-- Isometric Workspace Platform Grid -->
    <path d="M 300 80 L 520 180 L 300 280 L 80 180 Z" fill="#0f172a" fill-opacity="0.6" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <path d="M 300 130 L 460 200 L 300 270 L 140 200 Z" fill="#1e293b" fill-opacity="0.4" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="1" />

    <!-- Connecting Network Lines -->
    <path d="M 120 100 Q 200 40 320 70 T 500 120" fill="none" stroke="url(#cyanBlue)" stroke-width="2" opacity="0.4" filter="url(#glow-subtle)" />
    <path d="M 80 280 Q 200 350 350 290 T 520 220" fill="none" stroke="url(#violetFuchsia)" stroke-width="2" opacity="0.4" filter="url(#glow-subtle)" />

    <!-- Central Floating AI Core Node (TypingMind Workspace Metaphor) -->
    <g transform="translate(300, 150)">
      <!-- Outer Rotating Ring / Hexagon -->
      <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="none" stroke="url(#cyanBlue)" stroke-width="1.5" opacity="0.6" />
      <polygon points="0,-85 73,-42 73,42 0,85 -73,42 -73,-42" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="6 4" opacity="0.4" />
      
      <!-- Inner Core Glow -->
      <circle cx="0" cy="0" r="35" fill="#030712" stroke="url(#violetFuchsia)" stroke-width="2" filter="url(#glow)" />
      <circle cx="0" cy="0" r="15" fill="url(#cyanBlue)" filter="url(#glow)" />
      <circle cx="0" cy="0" r="6" fill="#ffffff" />
    </g>

    <!-- Floating UI Workflow & Knowledge Nodes (Enterprise Productivity) -->
    <!-- Node 1: Chat Stream / Prompt Logic -->
    <g transform="translate(130, 70)" filter="url(#glow-subtle)">
      <rect x="0" y="0" width="140" height="70" rx="8" fill="url(#glassGrad)" stroke="url(#glassBorder)" stroke-width="1.5" />
      <rect x="12" y="12" width="24" height="24" rx="6" fill="#06b6d4" fill-opacity="0.2" />
      <path d="M 18 24 L 24 24 M 24 18 L 30 24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <line x1="48" y1="18" x2="116" y2="18" stroke="#ffffff" stroke-width="3" stroke-opacity="0.8" stroke-linecap="round" />
      <line x1="48" y1="30" x2="90" y2="30" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round" />
      <!-- Pulse dot -->
      <circle cx="120" cy="50" r="4" fill="#38bdf8" filter="url(#glow)" />
    </g>

    <!-- Node 2: Multi-Model Integration -->
    <g transform="translate(410, 40)" filter="url(#glow-subtle)">
      <rect x="0" y="0" width="150" height="80" rx="8" fill="url(#glassGrad)" stroke="url(#glassBorder)" stroke-width="1.5" />
      <circle cx="26" cy="26" r="12" fill="#8b5cf6" fill-opacity="0.3" />
      <path d="M 20 26 L 32 26 M 26 20 L 26 32" stroke="#d946ef" stroke-width="2" />
      <text x="48" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="12">GPT-4o / Claude</text>
      <text x="48" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Unified Gateway</text>
      <line x1="16" y1="58" x2="134" y2="58" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="58" r="3" fill="#10b981" />
      <text x="30" y="61" fill="#34d399" font-family="monospace" font-size="9">ACTIVE SYNC</text>
    </g>

    <!-- Node 3: Enterprise Workspace Analytics -->
    <g transform="translate(420, 240)" filter="url(#glow-subtle)">
      <rect x="0" y="0" width="160" height="90" rx="8" fill="url(#glassGrad)" stroke="url(#glassBorder)" stroke-width="1.5" />
      <text x="16" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Workspace ROI</text>
      <!-- Mini Chart Bars -->
      <rect x="16" y="55" width="16" height="20" rx="2" fill="#38bdf8" opacity="0.6" />
      <rect x="40" y="40" width="16" height="35" rx="2" fill="#06b6d4" opacity="0.8" />
      <rect x="64" y="48" width="16" height="27" rx="2" fill="#8b5cf6" opacity="0.7" />
      <rect x="88" y="30" width="16" height="45" rx="2" fill="url(#violetFuchsia)" />
      <!-- Trend line -->
      <path d="M 24 50 Q 48 35 72 40 T 120 20" fill="none" stroke="#34d399" stroke-width="2" filter="url(#glow-subtle)" />
    </g>

    <!-- Node 4: Prompt Library / AI Agents -->
    <g transform="translate(100, 230)" filter="url(#glow-subtle)">
      <rect x="0" y="0" width="140" height="75" rx="8" fill="url(#glassGrad)" stroke="url(#glassBorder)" stroke-width="1.5" />
      <rect x="14" y="14" width="112" height="6" rx="3" fill="#8b5cf6" opacity="0.4" />
      <rect x="14" y="28" width="80" height="6" rx="3" fill="#334155" />
      <rect x="14" y="48" width="40" height="14" rx="4" fill="#06b6d4" fill-opacity="0.2" />
      <text x="20" y="58" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="9">CUSTOM AI</text>
    </g>

    <!-- Data streams connecting nodes -->
    <path d="M 200 140 L 250 150" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
    <path d="M 410 120 L 360 140" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
    <path d="M 240 250 L 270 210" stroke="#d946ef" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
    <path d="M 420 270 L 350 210" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
  </g>

  <!-- ==================== FOREGROUND CONTENT / TYPOGRAPHY ==================== -->
  <g transform="translate(80, 0)">
    
    <!-- Top Pill Badge -->
    <g transform="translate(0, 85)">
      <rect x="0" y="0" width="315" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <!-- Glowing dot -->
      <circle cx="18" cy="16" r="5" fill="#06b6d4" filter="url(#glow)" />
      <circle cx="18" cy="16" r="3" fill="#ffffff" />
      <text x="36" y="21" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 155)">
      <text x="0" y="0" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" letter-spacing="-1">
        TYPINGMIND
      </text>
      <!-- Subtitle category -->
      <text x="0" y="32" fill="url(#cyanBlue)" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" letter-spacing="3">
        AI PRODUCTIVITY &amp; ENTERPRISE WORKSPACE
      </text>
    </g>

    <!-- Investigation Headline Paragraph -->
    <g transform="translate(0, 245)">
      <text x="0" y="0" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="26" letter-spacing="-0.5">
        The Genesis of the Ultimate AI Workspace
      </text>
      <text x="0" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="16">
        and the Blueprint for Enterprise Productivity.
      </text>
    </g>

    <!-- Executive Summary / Abstract Box -->
    <g transform="translate(0, 335)">
      <!-- Glassmorphic panel -->
      <rect x="0" y="0" width="500" height="150" rx="12" fill="url(#glassGrad)" stroke="url(#glassBorder)" stroke-width="1" />
      <!-- Accent side bar -->
      <rect x="0" y="0" width="4" height="150" rx="2" fill="url(#cyanBlue)" />

      <!-- Content inside box -->
      <text x="24" y="34" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" letter-spacing="1">INVESTIGATION OVERVIEW</text>
      
      <text x="24" y="64" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14">
        Analyzing how TypingMind transcends standard chat interfaces to
      </text>
      <text x="24" y="86" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14">
        deliver a centralized AI command center—empowering teams with custom
      </text>
      <text x="24" y="108" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="14">
        AI agents, multi-model flexibility, and secure enterprise infrastructure.
      </text>

      <!-- Key metric pill -->
      <g transform="translate(24, 122)">
        <rect x="0" y="0" width="130" height="22" rx="4" fill="#1e293b" />
        <text x="10" y="15" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="10">ENTERPRISE READY</text>
      </g>
      <g transform="translate(164, 122)">
        <rect x="0" y="0" width="115" height="22" rx="4" fill="#1e293b" />
        <text x="10" y="15" fill="#c084fc" font-family="system-ui, sans-serif" font-weight="600" font-size="10">MULTI-LLM CORE</text>
      </g>
    </g>

    <!-- Footer Metadata / Brand Signature -->
    <g transform="translate(0, 530)">
      <line x1="0" y1="0" x2="500" y2="0" stroke="#334155" stroke-width="1" />
      
      <text x="0" y="25" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="1.5">
        HELIA TECH INTELLIGENCE
      </text>

      <!-- Domain link badge -->
      <g transform="translate(380, 10)">
        <text x="0" y="15" fill="#38bdf8" font-family="monospace" font-weight="600" font-size="12" text-anchor="end">heliatech.online</text>
      </g>
    </g>

  </g>
</svg>