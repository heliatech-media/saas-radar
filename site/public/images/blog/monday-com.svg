<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Glowing Orbs Gradients -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowFuchsia" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Element Gradients -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="fuchsiaVioletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="nodeActiveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowIntense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Pattern for Grid Overlay -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03"/>
    </pattern>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#cyberGrid)"/>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="150" r="300" fill="url(#glowCyan)"/>
  <circle cx="850" cy="480" r="250" fill="url(#glowFuchsia)"/>
  <circle cx="200" cy="500" r="300" fill="url(#glowViolet)"/>

  <!-- Background Technical Wireframes &amp; Vectors -->
  <g opacity="0.4">
    <!-- Connecting network lines in the background -->
    <path d="M 650 180 L 850 120 L 1000 250 L 900 400 L 700 350 Z" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4"/>
    <path d="M 720 220 L 930 280 L 820 480" fill="none" stroke="#d946ef" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="850" cy="120" r="4" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="1000" cy="250" r="4" fill="#d946ef" filter="url(#glow)"/>
    <circle cx="900" cy="400" r="4" fill="#8b5cf6" filter="url(#glow)"/>
    <circle cx="700" cy="350" r="4" fill="#38bdf8" filter="url(#glow)"/>
  </g>

  <!-- ==================================================== -->
  <!-- RIGHT SIDE: 3D VECTOR WORKSPACE / WORK OS METAPHOR   -->
  <!-- ==================================================== -->
  <g transform="translate(620, 70)" filter="url(#cardShadow)">
    
    <!-- Isometric Board Container Backplate -->
    <polygon points="50,40 500,90 500,450 50,400" fill="#0b0f19" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

    <!-- Workflow Automation Nodes &amp; Flow Lines -->
    <g transform="translate(80, 70)">
      <!-- Flow connection pathways -->
      <path d="M 30 60 L 140 60 L 220 160 L 320 160" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="3" filter="url(#glow)"/>
      <path d="M 140 60 L 200 260 L 320 260" fill="none" stroke="url(#fuchsiaVioletGrad)" stroke-width="3" stroke-dasharray="6 4"/>
      <path d="M 220 160 L 270 60 L 350 60" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.6"/>

      <!-- Node 1: Trigger / Status (Monday.com item card style) -->
      <g transform="translate(0, 30)">
        <rect width="130" height="60" rx="10" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="1.5"/>
        <!-- Monday status pill -->
        <rect x="15" y="15" width="50" height="16" rx="8" fill="#06b6d4" opacity="0.8"/>
        <rect x="15" y="38" width="80" height="6" rx="3" fill="#ffffff" opacity="0.3"/>
        <circle cx="110" cy="30" r="6" fill="#38bdf8" filter="url(#glow)"/>
      </g>

      <!-- Node 2: Action / Integration -->
      <g transform="translate(180, 130)">
        <rect width="140" height="60" rx="10" fill="url(#glassGrad)" stroke="#8b5cf6" stroke-width="1.5"/>
        <rect x="15" y="15" width="60" height="16" rx="8" fill="#8b5cf6" opacity="0.8"/>
        <rect x="15" y="38" width="90" height="6" rx="3" fill="#ffffff" opacity="0.3"/>
        <circle cx="120" cy="30" r="6" fill="#8b5cf6" filter="url(#glow)"/>
      </g>

      <!-- Node 3: Analytics / Velocity Waveform -->
      <g transform="translate(290, 30)">
        <rect width="150" height="70" rx="10" fill="#0d1322" stroke="#d946ef" stroke-width="1.5" filter="url(#glow)"/>
        <!-- Mini chart bars -->
        <rect x="15" y="35" width="16" height="25" rx="3" fill="#38bdf8"/>
        <rect x="38" y="25" width="16" height="35" rx="3" fill="#8b5cf6"/>
        <rect x="61" y="15" width="16" height="45" rx="3" fill="#d946ef"/>
        <path d="M 15 30 Q 40 10 70 20 T 125 10" fill="none" stroke="#ffffff" stroke-width="2"/>
        <text x="85" y="35" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="700" font-size="12">99.4%</text>
        <text x="85" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">VELOCITY</text>
      </g>

      <!-- Node 4: Enterprise Sync -->
      <g transform="translate(290, 220)">
        <rect width="140" height="60" rx="10" fill="url(#glassGrad)" stroke="#06b6d4" stroke-width="1.5"/>
        <rect x="15" y="15" width="45" height="16" rx="8" fill="#10b981" opacity="0.8"/>
        <rect x="15" y="38" width="80" height="6" rx="3" fill="#ffffff" opacity="0.3"/>
        <!-- Sync icon dots -->
        <circle cx="110" cy="30" r="4" fill="#10b981"/>
        <circle cx="125" cy="30" r="4" fill="#38bdf8"/>
      </g>

      <!-- Floating Holographic Data Badges -->
      <g transform="translate(20, 230)">
        <rect width="120" height="44" rx="8" fill="#060913" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
        <text x="15" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="800" font-size="11" letter-spacing="1">15-MIN BLUEPRINT</text>
        <text x="15" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Active Deployment</text>
      </g>
    </g>

    <!-- Front Structural Framing Overlay -->
    <path d="M 50 400 L 500 450" stroke="url(#cyanBlueGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="50" cy="400" r="6" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="500" cy="450" r="6" fill="#d946ef" filter="url(#glow)"/>
  </g>

  <!-- ==================================================== -->
  <!-- LEFT SIDE: TYPOGRAPHY, BADGE &amp; ARCHITECTURAL DOSSIER -->
  <!-- ==================================================== -->
  <g transform="translate(80, 80)">
    
    <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
    <g transform="translate(0, 0)" filter="url(#glow)">
      <rect x="0" y="0" width="315" height="34" rx="17" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
      <circle cx="18" cy="17" r="5" fill="#38bdf8"/>
      <!-- Pulse ring animation simulation -->
      <circle cx="18" cy="17" r="9" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
      <text x="36" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Title: MONDAY.COM -->
    <text x="0" y="130" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
      MONDAY<tspan fill="#d946ef">.</tspan><tspan fill="url(#cyanBlueGrad)">COM</tspan>
    </text>

    <!-- Subtitle Category: Work OS &amp; Project Management -->
    <g transform="translate(2, 165)">
      <rect x="0" y="0" width="280" height="28" rx="6" fill="#ffffff" fill-opacity="0.05"/>
      <text x="14" y="18" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="3">WORK OS &amp; PROJECT MANAGEMENT</text>
    </g>

    <!-- Investigation Headline Paragraph -->
    <g transform="translate(0, 220)">
      <text x="0" y="0" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">
        The Evolution of the Custom Work OS
      </text>
      <text x="0" y="32" fill="#d946ef" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
        and the 15-Minute Blueprint for Enterprise Velocity
      </text>
      
      <!-- Description body -->
      <text x="0" y="75" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="400" line-height="1.5">
        <tspan x="0" dy="0">Deconstructing scalable workflow architecture, high-velocity automation</tspan>
        <tspan x="0" dy="22">pipelines, and cross-departmental synchronization at enterprise scale.</tspan>
      </text>
    </g>

    <!-- Footer Meta: Author / Brand Tag -->
    <g transform="translate(0, 390)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#334155" stroke-width="1"/>
      <circle cx="6" cy="25" r="3" fill="#10b981"/>
      <text x="20" y="29" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">VERIFIED RESEARCH • HELIATECH.ONLINE</text>
      <text x="420" y="29" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1">v4.8</text>
    </g>

  </g>

  <!-- Decorative Corner Brackets / HUD elements -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6">
    <!-- Top-Left HUD -->
    <path d="M 30 50 L 30 30 L 50 30"/>
    <!-- Bottom-Left HUD -->
    <path d="M 30 580 L 30 600 L 50 600"/>
    <!-- Top-Right HUD -->
    <path d="M 1170 50 L 1170 30 L 1150 30"/>
    <!-- Bottom-Right HUD -->
    <path d="M 1170 580 L 1170 600 L 1150 600"/>
  </g>

  <!-- Glowing Accent Dots on HUD -->
  <circle cx="30" cy="30" r="2" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="1170" cy="30" r="2" fill="#d946ef" filter="url(#glow)"/>
</svg>