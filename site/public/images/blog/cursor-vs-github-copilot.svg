<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cursorGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="copilotGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4"/>
  <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="#1e293b" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Badge Top -->
  <rect x="440" y="45" width="320" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="69" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="2">HELIA TECH FORENSIC DUEL</text>

  <!-- Left Card: Cursor -->
  <g transform="translate(100, 120)">
    <rect width="450" height="380" rx="20" fill="#0f172a" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="40" width="70" height="70" rx="16" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Cursor Icon Graphic -->
    <path d="M60 55 L90 85 L78 88 L92 102 L84 106 L70 92 L60 100 Z" fill="#38bdf8"/>
    
    <text x="130" y="75" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800">Cursor AI</text>
    <text x="130" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Native AI-First IDE (Forked VS Code)</text>

    <!-- Score & Key Stats -->
    <rect x="40" y="140" width="370" height="60" rx="12" fill="#1e293b" fill-opacity="0.7"/>
    <text x="60" y="175" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">96/100</text>
    <text x="160" y="175" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Composer Multi-File Agent</text>

    <!-- Feature Checklist -->
    <text x="50" y="240" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">✓ Full-Repo Semantic Embeddings</text>
    <text x="50" y="275" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">✓ Claude 3.5 Sonnet / GPT-4o Toggle</text>
    <text x="50" y="310" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">✓ Granular .cursorrules Architecture</text>
    <text x="50" y="345" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">★ VERDICT: WINNER FOR DEVELOPER VELOCITY</text>
  </g>

  <!-- VS Emblem -->
  <circle cx="600" cy="310" r="45" fill="#0f172a" stroke="#475569" stroke-width="3" filter="url(#shadow)"/>
  <text x="600" y="320" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" text-anchor="middle">VS</text>

  <!-- Right Card: GitHub Copilot -->
  <g transform="translate(650, 120)">
    <rect width="450" height="380" rx="20" fill="#0f172a" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
    <rect x="40" y="40" width="70" height="70" rx="16" fill="#4338ca" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.5"/>
    <!-- Copilot Icon Graphic -->
    <circle cx="75" cy="75" r="18" fill="none" stroke="#a855f7" stroke-width="4"/>
    <circle cx="68" cy="73" r="3" fill="#a855f7"/>
    <circle cx="82" cy="73" r="3" fill="#a855f7"/>

    <text x="130" y="75" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800">GitHub Copilot</text>
    <text x="130" y="100" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Ecosystem Extension (VS Code / JetBrains)</text>

    <!-- Score & Key Stats -->
    <rect x="40" y="140" width="370" height="60" rx="12" fill="#1e293b" fill-opacity="0.7"/>
    <text x="60" y="175" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">88/100</text>
    <text x="160" y="175" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Enterprise Procurement Winner</text>

    <!-- Feature Checklist -->
    <text x="50" y="240" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">✓ Microsoft Azure Enterprise Licensing</text>
    <text x="50" y="275" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">✓ Pull Request &amp; GitHub Issue Context</text>
    <text x="50" y="310" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15">✓ JetBrains, Visual Studio &amp; Neovim</text>
    <text x="50" y="345" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">Limited Context on Deep Multi-File Edits</text>
  </g>

  <!-- Footer Banner -->
  <text x="600" y="560" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
    Audited on 10M+ Lines of Code &amp; Legacy Monolith Repositories | HeliaTech Media Observatory
  </text>
</svg>
