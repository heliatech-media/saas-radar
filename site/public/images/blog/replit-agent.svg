<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <radialGradient id="cyan-orb" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="fuchsia-orb" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- UI Gradients -->
    <linearGradient id="window-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.98" />
    </linearGradient>

    <linearGradient id="cyan-glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="code-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="code-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>
    
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#dots)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="150" r="350" fill="url(#cyan-orb)" />
  <circle cx="200" cy="500" r="400" fill="url(#fuchsia-orb)" />

  <!-- Abstract Vector Neural Web / Circuitry (Left Side) -->
  <g opacity="0.6" filter="url(#glow-subtle)">
    <path d="M 60 150 L 180 150 L 240 210 L 360 210" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.4" />
    <path d="M 120 280 L 200 280 L 260 340 L 400 340" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4" />
    <path d="M 80 420 L 160 420 L 220 380 L 320 380" fill="none" stroke="#d946ef" stroke-width="1.5" stroke-opacity="0.3" />
    
    <!-- Nodes -->
    <circle cx="60" cy="150" r="4" fill="#06b6d4" />
    <circle cx="180" cy="150" r="4" fill="#38bdf8" />
    <circle cx="240" cy="210" r="5" fill="#8b5cf6" />
    <circle cx="360" cy="210" r="6" fill="#06b6d4" filter="url(#glow-subtle)" />
    
    <circle cx="120" cy="280" r="3" fill="#8b5cf6" />
    <circle cx="260" cy="340" r="4" fill="#d946ef" />
    
    <circle cx="80" cy="420" r="4" fill="#d946ef" />
    <circle cx="220" cy="380" r="3" fill="#38bdf8" />
  </g>

  <!-- Floating AST Syntax / Vector Embedding Cubes (Left-Center) -->
  <g transform="translate(60, 180)" opacity="0.85">
    <!-- Isometric Cube 1 -->
    <g transform="translate(20, 60)">
      <path d="M 40 0 L 80 23 L 40 46 L 0 23 Z" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5" />
      <path d="M 0 23 L 40 46 L 40 92 L 0 69 Z" fill="#0f172a" fill-opacity="0.8" stroke="#06b6d4" stroke-width="1.5" />
      <path d="M 40 46 L 80 23 L 80 69 L 40 92 Z" fill="#1e293b" fill-opacity="0.8" stroke="#06b6d4" stroke-width="1.5" />
      <circle cx="40" cy="46" r="3" fill="#38bdf8" filter="url(#glow-subtle)" />
    </g>

    <!-- Isometric Cube 2 (Higher) -->
    <g transform="translate(90, 0)">
      <path d="M 30 0 L 60 17 L 30 35 L 0 17 Z" fill="#8b5cf6" fill-opacity="0.3" stroke="#8b5cf6" stroke-width="1.5" />
      <path d="M 0 17 L 30 35 L 30 70 L 0 52 Z" fill="#090d16" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1.5" />
      <path d="M 30 35 L 60 17 L 60 52 L 30 70 Z" fill="#1e293b" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1.5" />
      <circle cx="30" cy="35" r="3" fill="#d946ef" filter="url(#glow-subtle)" />
    </g>
    
    <!-- Connecting Vector Lines -->
    <path d="M 60 220 L 120 70" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Typography & Badges (Left/Center Top) -->
  <g transform="translate(80, 75)">
    <!-- Architectural Dossier Pill Badge -->
    <g>
      <rect x="0" y="0" width="310" height="32" rx="16" fill="url(#badge-grad)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="18" cy="16" r="4" fill="#06b6d4" filter="url(#glow-subtle)" />
      <text x="36" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Title: REPLIT AGENT -->
    <text x="0" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="url(#text-gradient)" letter-spacing="-1" filter="url(#glow-subtle)">
      REPLIT AGENT
    </text>

    <!-- Category Subtitle -->
    <text x="0" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" letter-spacing="4">
      DEVELOPER TOOLS // INVESTIGATION 2026
    </text>

    <!-- Question Subtitle -->
    <text x="0" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#e2e8f0" letter-spacing="0.5">
      Replit Agent vs Cursor Composer: Which AI Actually <tspan fill="#38bdf8" font-weight="700">Builds Production Software</tspan>?
    </text>
  </g>

  <!-- RIGHT SIDE: Isometric IDE Code Window & Autonomous Agent Architecture -->
  <g transform="translate(620, 70)">
    <!-- Window Drop Shadow -->
    <rect x="10" y="10" width="530" height="480" rx="12" fill="#000000" opacity="0.6" filter="url(#glow-heavy)" />
    
    <!-- Main IDE Window Frame -->
    <rect x="0" y="0" width="530" height="480" rx="12" fill="url(#window-bg)" stroke="#1e293b" stroke-width="1.5" />

    <!-- Window Titlebar -->
    <path d="M 0 12 C 0 5 5 0 12 0 L 518 0 C 525 0 530 5 530 12 L 530 40 L 0 40 Z" fill="#0b1329" />
    <line x1="0" y1="40" x2="530" y2="40" stroke="#1e293b" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="24" cy="20" r="6" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="44" cy="20" r="6" fill="#f59e0b" fill-opacity="0.8" />
    <circle cx="64" cy="20" r="6" fill="#10b981" fill-opacity="0.8" />

    <!-- Window Title -->
    <text x="265" y="25" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">agent-runtime-v4.2.ts — Autonomous Sandbox</text>

    <!-- Live Execution Badge inside IDE -->
    <g transform="translate(390, 12)">
      <rect x="0" y="0" width="115" height="18" rx="9" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-width="0.75" />
      <circle cx="10" cy="9" r="3" fill="#06b6d4" />
      <text x="20" y="13" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#06b6d4">PROD DEPLOYED</text>
    </g>

    <!-- IDE Code Lines & Abstract AST Visualization -->
    <g transform="translate(25, 65)" font-family="ui-monospace, monospace" font-size="13">
      <!-- Line Numbers -->
      <g fill="#334155" font-size="11">
        <text x="0" y="20">01</text>
        <text x="0" y="45">02</text>
        <text x="0" y="70">03</text>
        <text x="0" y="95">04</text>
        <text x="0" y="120">05</text>
        <text x="0" y="145">06</text>
        <text x="0" y="170">07</text>
        <text x="0" y="195">08</text>
        <text x="0" y="220">09</text>
        <text x="0" y="245">10</text>
        <text x="0" y="270">11</text>
        <text x="0" y="295">12</text>
        <text x="0" y="320">13</text>
        <text x="0" y="350">14</text>
      </g>

      <!-- Syntax Highlighting Content -->
      <g transform="translate(35, 0)">
        <!-- import statement -->
        <text y="20">
          <tspan fill="#d946ef">import</tspan> <tspan fill="#e2e8f0">{ AgentRuntime, VectorMesh }</tspan> <tspan fill="#d946ef">from</tspan> <tspan fill="#38bdf8">'@helia/core'</tspan>;
        </text>
        
        <!-- class declaration -->
        <text y="45">
          <tspan fill="#8b5cf6">async function</tspan> <tspan fill="#38bdf8">initializeProductionBuild</tspan>() &#123;
        </text>

        <!-- state init -->
        <text y="70" dx="20">
          <tspan fill="#d946ef">const</tspan> sandbox = <tspan fill="#8b5cf6">await</tspan> AgentRuntime.<tspan fill="#38bdf8">provision</tspan>(&#123;
        </text>

        <text y="95" dx="40">
          environment: <tspan fill="#38bdf8">'container-v3'</tspan>,
        </text>
        <text y="120" dx="40">
          autoRepair: <tspan fill="#d946ef">true</tspan>,
        </text>
        <text y="145" dx="40">
          vectorEmbeddings: <tspan fill="#d946ef">true</tspan>
        </text>

        <text y="170" dx="20">&#125;);</text>

        <!-- execution loop -->
        <text y="195" dx="20">
          <tspan fill="#d946ef">const</tspan> pipeline = sandbox.<tspan fill="#38bdf8">compileAST</tspan>();
        </text>

        <text y="220" dx="20">
          <tspan fill="#8b5cf6">if</tspan> (pipeline.<tspan fill="#38bdf8">verifyZeroErrors</tspan>()) &#123;
        </text>

        <text y="245" dx="40">
          <tspan fill="#64748b" font-style="italic">// Autonomous deployment sequence active</tspan>
        </text>
        
        <text y="270" dx="40">
          <tspan fill="#8b5cf6">await</tspan> pipeline.<tspan fill="#38bdf8">pushToProduction</tspan>();
        </text>

        <text y="295" dx="20">&#125;</text>
        <text y="320">&#125;</text>
      </g>
    </g>

    <!-- Floating Holographic Terminal Card / Output Stream overlay -->
    <g transform="translate(40, 320)" filter="url(#glow-subtle)">
      <rect x="0" y="0" width="450" height="120" rx="8" fill="#030712" fill-opacity="0.9" stroke="url(#cyan-glow-line)" stroke-width="1" />
      
      <!-- Terminal Header -->
      <line x1="0" y1="30" x2="450" y2="30" stroke="#1e293b" stroke-width="1" />
      <circle cx="15" cy="15" r="3" fill="#06b6d4" />
      <text x="30" y="19" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">REPLIT AGENT TELEMETRY</text>

      <!-- Telemetry Metrics -->
      <g transform="translate(20, 52)" font-family="ui-monospace, monospace" font-size="11">
        <text x="0" y="0" fill="#94a3b8">Test Suite:</text>
        <text x="100" y="0" fill="#10b981" font-weight="700">142/142 PASSED</text>

        <text x="230" y="0" fill="#94a3b8">Self-Healing:</text>
        <text x="330" y="0" fill="#38bdf8" font-weight="700">ACTIVE (3 fix)</text>

        <text x="0" y="25" fill="#94a3b8">Build Target:</text>
        <text x="100" y="25" fill="#ffffff" font-weight="600">Full-Stack App</text>

        <text x="230" y="25" fill="#94a3b8">Latency:</text>
        <text x="330" y="25" fill="#d946ef" font-weight="700">184ms / token</text>
      </g>

      <!-- Progress Bar -->
      <g transform="translate(20, 92)">
        <rect x="0" y="0" width="410" height="4" rx="2" fill="#1e293b" />
        <rect x="0" y="0" width="375" height="4" rx="2" fill="url(#code-cyan)" filter="url(#glow-subtle)" />
      </g>
    </g>
  </g>

  <!-- Decorative Border Accents & Helia Tech Branding signature -->
  <g transform="translate(80, 580)">
    <text x="0" y="0" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#64748b" letter-spacing="2">
      HELIATECH.ONLINE <tspan fill="#38bdf8">///</tspan> ENTERPRISE SOFTWARE INTELLIGENCE
    </text>
  </g>

  <!-- Corner Tech Framing Marks -->
  <g stroke="#06b6d4" stroke-width="1.5" fill="none" opacity="0.4">
    <!-- Top-Left -->
    <path d="M 30 50 L 30 30 L 50 30" />
    <!-- Top-Right -->
    <path d="M 1170 50 L 1170 30 L 1150 30" />
    <!-- Bottom-Left -->
    <path d="M 30 580 L 30 600 L 50 600" />
    <!-- Bottom-Right -->
    <path d="M 1170 580 L 1170 600 L 1150 600" />
  </g>
</svg>