        <rect x="0" y="0" width="165" height="70" rx="10" fill="url(#glassGrad)" stroke="#38bdf8" stroke-opacity="0.3"/>
        <text x="20" y="28" fill="#38bdf8" font-family="monospace" font-size="22" font-weight="bold">10x</text>
        <text x="20" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Workflow Velocity</text>
