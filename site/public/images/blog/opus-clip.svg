        <rect x="0" y="0" width="128" height="58" rx="6" fill="#1e1b4b" stroke="#d946ef" stroke-width="1"/>
        <text x="10" y="20" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Clip #3: Epic Summary</text>
        <text x="10" y="35" fill="#f472b6" font-family="monospace" font-size="9">12:30 - 13:15</text>
        <rect x="10" y="43" width="45" height="4" rx="2" fill="#d946ef"/>
      </g>
    </g>

    <!-- AI Active Captioning / Face Tracking preview block -->
    <g transform="translate(30, 315)">
      <rect x="0" y="0" width="440" height="135" rx="10" fill="#030712" stroke="#38bdf8" stroke-opacity="0.2"/>
      <text x="15" y="22" fill="#94a3b8" font-family="monospace" font-size="10" letter-spacing="1">AUTO-REFRAMING &amp; DYNAMIC CAPTIONS</text>
      
      <!-- Simulated Video Frame with Active Speaker Box -->
