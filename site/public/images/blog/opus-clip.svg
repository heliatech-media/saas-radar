    <circle cx="56" cy="30" r="6" fill="#f59e0b" fill-opacity="0.8"/>
    <circle cx="76" cy="30" r="6" fill="#10b981" fill-opacity="0.8"/>
    <text x="250" y="35" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600" letter-spacing="1.5" text-anchor="middle">OPUS_CLIP_NEURAL_ENGINE.v4</text>

    <!-- Vector Neural Render Timeline / Sound Energy Envelopes -->
    <!-- Track 1: Long-Form Ingestion Stream -->
    <g transform="translate(30, 90)">
      <rect x="0" y="0" width="440" height="60" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="15" y="22" fill="#94a3b8" font-family="monospace" font-size="10" letter-spacing="1">SOURCE_STREAM // 01:42:15.00</text>
      <!-- Waveform Bars -->
