        <line x1="0" y1="5" x2="0" y2="15" stroke="#38bdf8" opacity="0.4"/>
        <line x1="10" y1="2" x2="10" y2="18" stroke="#38bdf8" opacity="0.7"/>
        <line x1="20" y1="8" x2="20" y2="12" stroke="#38bdf8" opacity="0.5"/>
        <line x1="30" y1="0" x2="30" y2="20" stroke="#38bdf8"/>
        <line x1="40" y1="4" x2="40" y2="16" stroke="#38bdf8" opacity="0.8"/>
        <line x1="50" y1="7" x2="50" y2="13" stroke="#38bdf8" opacity="0.6"/>
        <line x1="60" y1="2" x2="60" y2="18" stroke="#38bdf8"/>
        <line x1="70" y1="5" x2="70" y2="15" stroke="#38bdf8" opacity="0.4"/>
        <line x1="80" y1="1" x2="80" y2="19" stroke="#38bdf8" opacity="0.9"/>
        <line x1="90" y1="6" x2="90" y2="14" stroke="#38bdf8" opacity="0.7"/>
        <line x1="100" y1="3" x2="100" y2="17" stroke="#38bdf8" opacity="0.5"/>
        <line x1="110" y1="8" x2="110" y2="12" stroke="#38bdf8" opacity="0.3"/>
        <line x1="120" y1="0" x2="120" y2="20" stroke="#38bdf8"/>
        <line x1="130" y1="4" x2="130" y2="16" stroke="#38bdf8" opacity="0.8"/>
        <line x1="140" y1="6" x2="140" y2="14" stroke="#38bdf8" opacity="0.6"/>
        <line x1="150" y1="2" x2="150" y2="18" stroke="#38bdf8" opacity="0.9"/>
        <line x1="160" y1="5" x2="160" y2="15" stroke="#38bdf8" opacity="0.5"/>
        <line x1="170" y1="1" x2="170" y2="19" stroke="#38bdf8"/>
        <line x1="180" y1="7" x2="180" y2="13" stroke="#38bdf8" opacity="0.4"/>
        <line x1="190" y1="3" x2="190" y2="17" stroke="#38bdf8" opacity="0.7"/>
        <line x1="200" y1="5" x2="200" y2="15" stroke="#38bdf8" opacity="0.6"/>
        <line x1="210" y1="0" x2="210" y2="20" stroke="#38bdf8" opacity="0.8"/>
        <line x1="220" y1="4" x2="220" y2="16" stroke="#38bdf8" opacity="0.5"/>
        <line x1="230" y1="6" x2="230" y2="14" stroke="#38bdf8" opacity="0.7"/>
        <line x1="240" y1="2" x2="240" y2="18" stroke="#38bdf8" opacity="0.9"/>
        <line x1="250" y1="5" x2="250" y2="15" stroke="#38bdf8" opacity="0.4"/>
        <line x1="260" y1="1" x2="260" y2="19" stroke="#38bdf8"/>
        <line x1="270" y1="7" x2="270" y2="13" stroke="#38bdf8" opacity="0.6"/>
        <line x1="280" y1="3" x2="280" y2="17" stroke="#38bdf8" opacity="0.8"/>
        <line x1="290" y1="5" x2="290" y2="15" stroke="#38bdf8" opacity="0.5"/>
        <line x1="300" y1="0" x2="300" y2="20" stroke="#38bdf8" opacity="0.7"/>
        <line x1="310" y1="4" x2="310" y2="16" stroke="#38bdf8" opacity="0.9"/>
        <line x1="320" y1="6" x2="320" y2="14" stroke="#38bdf8" opacity="0.4"/>
        <line x1="330" y1="2" x2="330" y2="18" stroke="#38bdf8" opacity="0.6"/>
        <line x1="340" y1="5" x2="340" y2="15" stroke="#38bdf8" opacity="0.8"/>
