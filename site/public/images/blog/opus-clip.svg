        <rect x="0" y="0" width="235" height="75" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.3"/>
        <text x="15" y="25" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">"AI video repurposing is</text>
        <text x="15" y="45" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">transforming enterprise</text>
        <text x="15" y="65" fill="#d946ef" font-family="sans-serif" font-size="12" font-weight="bold">growth velocity instantly."</text>
      </g>
    </g>
