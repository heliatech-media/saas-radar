        <text x="20" y="28" fill="#d946ef" font-family="monospace" font-size="22" font-weight="bold">98.4%</text>
        <text x="20" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Curation Accuracy</text>
