      <text x="0" y="0" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" line-height="1.5">
        <tspan x="0" dy="0">The genesis of AI-driven video repurposing. Analyzing</tspan>
        <tspan x="0" dy="24">neural curation models, automated virality scoring, and</tspan>
        <tspan x="0" dy="24">enterprise scaling frameworks for high-velocity content engines.</tspan>
      </text>
    </g>

    <!-- Metadata Grid / Key Attributes -->
