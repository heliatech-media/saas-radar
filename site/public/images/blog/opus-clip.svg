      <text x="35" y="22" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Title: OPUS CLIP -->
    <g transform="translate(0, 85)">
      <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">OPUS CLIP</text>
      <text x="0" y="40" fill="url(#cyanBlueGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="1">AI Video &amp; Short-Form Velocity</text>
    </g>

    <!-- Subtitle / Executive Description -->
