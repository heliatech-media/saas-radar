      <circle cx="95" cy="75" r="18" fill="#06b6d4" fill-opacity="0.2"/>
      <text x="95" y="79" fill="#06b6d4" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">AI FOCUS</text>

      <!-- Auto Caption Text Graphic -->
