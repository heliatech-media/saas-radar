<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="fuchsiaOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#334155" />
    </pattern>

    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#06b6d4" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="150" r="300" fill="url(#cyanOrb)" filter="url(#glow)" />
  <circle cx="200" cy="500" r="350" fill="url(#fuchsiaOrb)" filter="url(#glow)" />

  <!-- Abstract Background Vector Network (Neural Video Processing) -->
  <g opacity="0.3">
    <path d="M100 100 L300 200 L500 150 L700 300 L900 200 L1100 350" fill="none" stroke="#06b6d4" stroke-width="1.5" />
    <path d="M150 450 L350 350 L550 480 L750 380 L950 450 L1150 300" fill="none" stroke="#8b5cf6" stroke-width="1.5" />
    <path d="M300 200 L350 350" fill="none" stroke="#d946ef" stroke-width="1" stroke-dasharray="4 4" />
    <path d="M700 300 L750 380" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" />
    
    <!-- Nodes -->
    <circle cx="300" cy="200" r="4" fill="#06b6d4" filter="url(#glow)" />
    <circle cx="500" cy="150" r="5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="700" cy="300" r="6" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="350" cy="350" r="4" fill="#d946ef" filter="url(#glow)" />
    <circle cx="750" cy="380" r="5" fill="#06b6d4" filter="url(#glow)" />
  </g>

  <!-- HELIATECH ARCHITECTURAL DOSSIER (Top Badge) -->
  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="310" height="34" rx="17" fill="url(#glassGrad)" stroke="url(#cardBorder)" stroke-width="1" />
    <circle cx="20" cy="17" r="4" fill="#06b6d4" filter="url(#glow)" />
    <text x="38" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- Main Typography Section -->
  <g transform="translate(80, 150)">
    <!-- Category Subtitle -->
    <text x="0" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#d946ef" letter-spacing="4">AI VIDEO &amp; CONTENT CREATION</text>
    
    <!-- Tool Title -->
    <text x="0" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="1">OPUSCLIP</text>
    
    <!-- Headline description -->
    <text x="0" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
      The AI Video Repurposing Revolution &amp; the
    </text>
    <text x="0" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
      Blueprint for <tspan fill="url(#primaryGrad)" font-weight="700">Short-Form Dominance</tspan>
    </text>
  </g>

  <!-- Right Side: 3D Holographic AI Video & Waveform Metaphor -->
  <g transform="translate(680, 80)">
    <!-- Holographic Container Card -->
    <rect x="0" y="0" width="440" height="470" rx="24" fill="#090d16" fill-opacity="0.8" stroke="url(#cardBorder)" stroke-width="1.5" filter="url(#glow)" />
    <rect x="0" y="0" width="440" height="470" rx="24" fill="url(#dots)" />

    <!-- Top Window Bar -->
    <g transform="translate(24, 24)">
      <circle cx="8" cy="8" r="4" fill="#ef4444" fill-opacity="0.8" />
      <circle cx="24" cy="8" r="4" fill="#f59e0b" fill-opacity="0.8" />
      <circle cx="40" cy="8" r="4" fill="#10b981" fill-opacity="0.8" />
      <rect x="320" y="0" width="96" height="16" rx="8" fill="#1e293b" />
      <text x="368" y="11" font-family="system-ui, sans-serif" font-size="9" fill="#38bdf8" text-anchor="middle" font-weight="600">AI PIPELINE</text>
    </g>

    <!-- 3D Isometric / Holographic Timeline & Waveform Panel -->
    <g transform="translate(44, 70)">
      <!-- Central Video Canvas Mockup -->
      <rect x="0" y="0" width="352" height="180" rx="12" fill="#030712" stroke="#1e293b" stroke-width="1" />
      
      <!-- Video Grid Lines Inside Canvas -->
      <path d="M0 45 L352 45 M0 90 L352 90 M0 135 L352 135 M88 0 L88 180 M176 0 L176 180 M264 0 L264 180" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="2 2" />

      <!-- Glowing 3D Waveform Audio Analysis -->
      <path d="M 10 90 Q 50 20, 90 90 T 170 90 T 250 30 T 330 90" fill="none" stroke="url(#primaryGrad)" stroke-width="4" filter="url(#intenseGlow)" />
      <path d="M 10 90 Q 50 20, 90 90 T 170 90 T 250 30 T 330 90" fill="none" stroke="#ffffff" stroke-width="1.5" />

      <!-- AI Curation Markers (Viral Clips extraction points) -->
      <g transform="translate(0, 0)">
        <!-- Clip 1 Highlight Box -->
        <rect x="70" y="20" width="80" height="140" rx="8" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4 2" />
        <rect x="80" y="30" width="60" height="16" rx="4" fill="#06b6d4" />
        <text x="110" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#030712" text-anchor="middle" font-weight="800">VIRAL 98%</text>

        <!-- Clip 2 Highlight Box -->
        <rect x="210" y="20" width="90" height="140" rx="8" fill="#d946ef" fill-opacity="0.15" stroke="#d946ef" stroke-width="2" />
        <rect x="220" y="30" width="70" height="16" rx="4" fill="#d946ef" />
        <text x="255" y="42" font-family="system-ui, sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="800">HOOK 94%</text>
      </g>
    </g>

    <!-- Multi-Layer Vector Neural Render Output (Clips Stream) -->
    <g transform="translate(44, 275)">
      <!-- Output Card 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="105" height="130" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
        <path d="M20 40 L85 40 M20 60 L70 60 M20 80 L75 80" stroke="#334155" stroke-width="4" stroke-linecap="round" />
        <circle cx="52" cy="105" r="12" fill="#06b6d4" fill-opacity="0.2" />
        <path d="M48 98 L58 105 L48 112 Z" fill="#06b6d4" />
        <rect x="15" y="12" width="45" height="12" rx="6" fill="#06b6d4" fill-opacity="0.3" />
        <text x="37" y="21" font-family="system-ui, sans-serif" font-size="8" fill="#38bdf8" text-anchor="middle" font-weight="700">CLIP #01</text>
      </g>

      <!-- Output Card 2 (Active/Selected) -->
      <g transform="translate(123, 0)">
        <rect x="0" y="0" width="105" height="130" rx="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" filter="url(#glow)" />
        <path d="M20 40 L85 40 M20 60 L70 60 M20 80 L75 80" stroke="#4c1d95" stroke-width="4" stroke-linecap="round" />
        <circle cx="52" cy="105" r="12" fill="#8b5cf6" fill-opacity="0.4" />
        <path d="M48 98 L58 105 L48 112 Z" fill="#ffffff" />
        <rect x="15" y="12" width="45" height="12" rx="6" fill="#8b5cf6" fill-opacity="0.5" />
        <text x="37" y="21" font-family="system-ui, sans-serif" font-size="8" fill="#e2e8f0" text-anchor="middle" font-weight="700">CLIP #02</text>
      </g>

      <!-- Output Card 3 -->
      <g transform="translate(247, 0)">
        <rect x="0" y="0" width="105" height="130" rx="10" fill="#0f172a" stroke="#d946ef" stroke-width="1.5" />
        <path d="M20 40 L85 40 M20 60 L70 60 M20 80 L75 80" stroke="#334155" stroke-width="4" stroke-linecap="round" />
        <circle cx="52" cy="105" r="12" fill="#d946ef" fill-opacity="0.2" />
        <path d="M48 98 L58 105 L48 112 Z" fill="#d946ef" />
        <rect x="15" y="12" width="45" height="12" rx="6" fill="#d946ef" fill-opacity="0.3" />
        <text x="37" y="21" font-family="system-ui, sans-serif" font-size="8" fill="#f472b6" text-anchor="middle" font-weight="700">CLIP #03</text>
      </g>
    </g>

    <!-- Bottom Status Bar inside Card -->
    <g transform="translate(44, 430)">
      <circle cx="6" cy="6" r="4" fill="#10b981" filter="url(#glow)" />
      <text x="18" y="10" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" font-weight="500">Auto-Reframing &amp; AI Curation Active</text>
      <text x="352" y="10" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8" font-weight="700" text-anchor="end">10X SPEED</text>
    </g>
  </g>

  <!-- Bottom Brand Footer / Metric Pills -->
  <g transform="translate(80, 545)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="23" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" font-weight="600">ANALYSIS ENGINE</text>
    <text x="135" y="23" font-family="system-ui, sans-serif" font-size="11" fill="#06b6d4" font-weight="700" text-anchor="end">GPT-4V</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="160" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="23" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" font-weight="600">CONVERSION</text>
    <text x="135" y="23" font-family="system-ui, sans-serif" font-size="11" fill="#8b5cf6" font-weight="700" text-anchor="end">99.8%</text>

    <!-- Pill 3 -->
    <rect x="350" y="0" width="180" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="23" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" font-weight="600">PLATFORM</text>
    <text x="155" y="23" font-family="system-ui, sans-serif" font-size="11" fill="#d946ef" font-weight="700" text-anchor="end">OMNICHANNEL</text>

    <!-- HELIATECH.ONLINE Watermark -->
    <text x="1120" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#475569" letter-spacing="1.5" text-anchor="end">HELIATECH.ONLINE</text>
  </g>
</svg>