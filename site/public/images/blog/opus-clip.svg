  <!-- ================= LEFT SIDE: TYPOGRAPHY & DOSSIER ================= -->
  <g transform="translate(80, 75)">
    <!-- Architectural Pill Badge -->
    <g filter="url(#glow-subtle)">
      <rect x="0" y="0" width="310" height="34" rx="17" fill="#0b0f19" stroke="#06b6d4" stroke-width="1.5"/>
