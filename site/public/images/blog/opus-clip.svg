<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#070c1b"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Glowing Orbs & Ambient Lights -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fuchsiaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- Component Gradients -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="violetFuchsiaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#ffffff" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="150" r="300" fill="url(#cyanGlow)"/>
  <circle cx="1050" cy="450" r="350" fill="url(#fuchsiaGlow)"/>
  <circle cx="650" cy="200" r="250" fill="url(#violetGlow)"/>

  <!-- ================= BACKGROUND VECTOR INFRASTRUCTURE ================= -->
  <g opacity="0.35" transform="translate(50, 0)">
    <!-- Circuit lines connecting background -->
    <path d="M 100 500 L 250 500 L 350 400 L 550 400" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 4"/>
    <path d="M 850 150 L 950 150 L 1050 250" fill="none" stroke="#d946ef" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="250" cy="500" r="4" fill="#06b6d4" filter="url(#glow-subtle)"/>
    <circle cx="950" cy="150" r="4" fill="#d946ef" filter="url(#glow-subtle)"/>
  </g>

  <!-- ================= RIGHT SIDE: 3D AI VIDEO / WAVEFORM METAPHOR ================= -->
  <g transform="translate(640, 75)" filter="url(#drop-shadow)">
    <!-- Holographic Container Panel -->
    <rect x="0" y="0" width="500" height="480" rx="24" fill="url(#glassGrad)" stroke="url(#cardBorder)" stroke-width="1.5"/>
    
    <!-- Top Bar of Hologram -->
    <path d="M 24 0 L 476 0 A 24 24 0 0 1 500 24 L 500 60 L 0 60 L 0 24 A 24 24 0 0 1 24 0 Z" fill="#030712" fill-opacity="0.6"/>
    <line x1="0" y1="60" x2="500" y2="60" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    
    <!-- Window Controls -->
