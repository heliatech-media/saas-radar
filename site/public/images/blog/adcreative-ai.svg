<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bgGlow" cx="60%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    
    <linearGradient id="cyberGrid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Brand Color Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="violetFuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowIntense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.07"/>
    </pattern>
    
    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8b5cf6" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="180" r="220" fill="#8b5cf6" opacity="0.12" filter="url(#glowIntense)"/>
  <circle cx="750" cy="450" r="280" fill="#06b6d4" opacity="0.10" filter="url(#glowIntense)"/>
  <circle cx="200" cy="150" r="180" fill="#38bdf8" opacity="0.08" filter="url(#glowIntense)"/>

  <!-- Geometric Accent Lines -->
  <path d="M0 100 L1200 100" stroke="url(#cyberGrid)" stroke-width="1"/>
  <path d="M0 530 L1200 530" stroke="url(#cyberGrid)" stroke-width="1"/>
  <path d="M200 0 L200 630" stroke="url(#cyberGrid)" stroke-width="0.5" stroke-dasharray="4 8"/>
  <path d="M1000 0 L1000 630" stroke="url(#cyberGrid)" stroke-width="0.5" stroke-dasharray="4 8"/>

  <!-- ================= HEADER / TOP BADGE ================= -->
  <g transform="translate(80, 65)">
    <!-- Pill Background -->
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#0f172a" stroke="url(#glassStroke)" stroke-width="1.5" filter="url(#dropShadow)"/>
    <!-- Glowing Dot -->
    <circle cx="20" cy="16" r="4" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="20" cy="16" r="2" fill="#ffffff"/>
    <!-- Pill Text -->
    <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#38bdf8">HELIATECH ARCHITECTURAL</text>
  </g>

  <!-- ================= TYPOGRAPHY & TITLES ================= -->
  <!-- Category Subtitle -->
  <g transform="translate(80, 130)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="#d946ef">AI ADVERTISING INTELLIGENCE</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(80, 185)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#ffffff" letter-spacing="-0.5" filter="url(#dropShadow)">
      AdCreative<tspan fill="#38bdf8">.ai</tspan>
    </text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#94a3b8" letter-spacing="-0.2">
      Predictive Ad Generation &amp; ROAS Maximization
    </text>
  </g>

  <!-- ================= 3D VECTOR ILLUSTRATION (RIGHT SIDE) ================= -->
  <!-- Central Analytics & Neural Ad Node Composition -->
  <g transform="translate(680, 130)" filter="url(#dropShadow)">
    
    <!-- Outer Holographic Ring -->
    <circle cx="220" cy="220" r="190" fill="none" stroke="#1e293b" stroke-width="2"/>
    <circle cx="220" cy="220" r="190" fill="none" stroke="url(#cyanBlue)" stroke-width="2" stroke-dasharray="40 120 20 60" opacity="0.7" filter="url(#glow)"/>
    
    <!-- Rotating Dashed Orbit -->
    <circle cx="220" cy="220" r="150" fill="none" stroke="url(#violetFuchsia)" stroke-width="1.5" stroke-dasharray="8 16" opacity="0.5"/>
    <circle cx="220" cy="220" r="110" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 10" opacity="0.4"/>

    <!-- Background Glass Panel for Core UI -->
    <rect x="70" y="70" width="300" height="300" rx="20" fill="url(#panelGrad)" stroke="url(#glassStroke)" stroke-width="1.5" filter="url(#dropShadow)"/>
    <rect x="70" y="70" width="300" height="300" rx="20" fill="url(#dotPattern)" opacity="0.3"/>

    <!-- AI Neural Network / Predictive Flow Lines -->
    <path d="M 120 280 C 160 280, 180 180, 220 180 C 260 180, 280 120, 320 120" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
    <path d="M 120 300 C 180 300, 200 220, 250 220 C 300 220, 310 160, 330 160" fill="none" stroke="#d946ef" stroke-width="2" opacity="0.8"/>

    <!-- Data Nodes (Predictive Vectors) -->
    <g transform="translate(0, 0)">
      <!-- Node 1 -->
      <circle cx="120" cy="280" r="6" fill="#06b6d4" filter="url(#glow)"/>
      <circle cx="120" cy="280" r="3" fill="#ffffff"/>
      
      <!-- Node 2 (Center AI Engine) -->
      <circle cx="220" cy="180" r="10" fill="#8b5cf6" filter="url(#glow)"/>
      <circle cx="220" cy="180" r="5" fill="#ffffff"/>
      
      <!-- Node 3 (ROAS Peak) -->
      <circle cx="320" cy="120" r="8" fill="#38bdf8" filter="url(#glow)"/>
      <circle cx="320" cy="120" r="4" fill="#ffffff"/>
    </g>

    <!-- Floating UI Card: Performance Metric (ROAS) -->
    <g transform="translate(110, 95)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="220" height="55" rx="10" fill="#030712" fill-opacity="0.85" stroke="url(#cyanBlue)" stroke-width="1"/>
      <circle cx="25" cy="27" r="12" fill="#06b6d4" fill-opacity="0.2"/>
      <path d="M20 27 L24 31 L31 23" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="23" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" letter-spacing="1">PREDICTED ROAS</text>
      <text x="48" y="41" font-family="-apple-system, sans-serif" font-size="16" font-weight="800" fill="#ffffff">+482.<tspan fill="#38bdf8">%</tspan></text>
    </g>

    <!-- Floating UI Card: Creative Generation Status -->
    <g transform="translate(90, 245)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="240" height="65" rx="12" fill="#030712" fill-opacity="0.9" stroke="url(#violetFuchsia)" stroke-width="1"/>
      <!-- Mini Bar Chart Graph -->
      <rect x="20" y="38" width="10" height="15" rx="2" fill="#8b5cf6"/>
      <rect x="35" y="28" width="10" height="25" rx="2" fill="#d946ef"/>
      <rect x="50" y="20" width="10" height="33" rx="2" fill="#38bdf8" filter="url(#glow)"/>
      <rect x="65" y="15" width="10" height="38" rx="2" fill="#06b6d4" filter="url(#glow)"/>
      
      <text x="88" y="30" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">AI GENERATED ASSET</text>
      <text x="88" y="45" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#34d399">● High Conversion Vector</text>
    </g>

    <!-- Pulsing Radar / Target Reticle Overlay -->
    <g transform="translate(220, 220)" opacity="0.6">
      <path d="M -30 0 L -15 0 M 15 0 L 30 0 M 0 -30 L 0 -15 M 0 15 L 0 30" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="45" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 3"/>
    </g>
  </g>

  <!-- ================= BOTTOM ARCHITECTURAL METRICS ================= -->
  <g transform="translate(80, 560)">
    <!-- Metric Divider Line -->
    <path d="M0 0 L1040 0" stroke="url(#cyberGrid)" stroke-width="1"/>

    <!-- Stat 1 -->
    <g transform="translate(0, 20)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#64748b">CORE ENGINE</text>
      <text x="0" y="20" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Neural Ad Synthesis</text>
    </g>

    <!-- Stat 2 -->
    <g transform="translate(280, 20)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#64748b">OPTIMIZATION</text>
      <text x="0" y="20" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#38bdf8">Real-time Data Feedback</text>
    </g>

    <!-- Stat 3 -->
    <g transform="translate(580, 20)">
      <text x="0" y="0" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5" fill="#64748b">METRIC TARGET</text>
      <text x="0" y="20" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#d946ef">Maximum ROAS Scale</text>
    </g>

    <!-- Publisher Brand Signature / URL -->
    <g transform="translate(880, 15)">
      <rect x="0" y="0" width="160" height="30" rx="15" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
      <text x="80" y="19" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#38bdf8">HELIATECH.ONLINE</text>
    </g>
  </g>
</svg>