<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-riverside" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="river-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="orb-glow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-riverside)"/>
  <rect width="1200" height="630" fill="url(#orb-glow)"/>

  <!-- Left Content -->
  <g transform="translate(90, 120)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="1"/>
    <text x="90" y="21" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#a78bfa" text-anchor="middle" letter-spacing="1">AUDIO &amp; PODCASTING</text>

    <text x="0" y="95" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1">
      RIVERSIDE.FM
    </text>
    <text x="0" y="155" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="url(#river-cyan)" letter-spacing="-1">
      LOCAL MULTI-TRACK AUDIO
    </text>

    <text x="0" y="215" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
      Studio-Quality 4K Video &amp; 48kHz WAV Remote Production (2026)
    </text>

    <!-- Indicators -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="160" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#38bdf8">🎙️ 48kHz WAV</text>

      <rect x="175" y="0" width="160" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="195" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#a78bfa">📹 4K ProRes</text>

      <rect x="350" y="0" width="170" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="370" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#10b981">⚡ Zero Lag Drop</text>
    </g>

    <!-- Footer -->
    <g transform="translate(0, 360)">
      <line x1="0" y1="0" x2="1020" y2="0" stroke="#1e293b" stroke-width="1"/>
      <circle cx="8" cy="30" r="4" fill="#7c3aed"/>
      <text x="24" y="34" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#64748b" letter-spacing="1.5">
        HELIATECH.ONLINE • INDEPENDENT INVESTIGATION &amp; VERIFIED LAB REVIEW
      </text>
      <text x="1020" y="34" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#10b981" text-anchor="end">
        SCORE: 4.6/5.0
      </text>
    </g>
  </g>
</svg>