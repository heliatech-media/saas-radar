<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bgGlow" cx="60%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070a14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="fuchsiaPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowSubtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#334155" fill-opacity="0.8" />
    </pattern>

    <!-- Hexagon Pattern -->
    <pattern id="hexGrid" width="60" height="104" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
      <path d="M30 0 L60 17.32 L60 51.96 L30 69.28 L0 51.96 L0 17.32 Z M30 104 L60 121.32 L60 155.96 L30 173.28 L0 155.96 L0 121.32 Z" fill="none" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#hexGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="150" r="220" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" />
  <circle cx="850" cy="450" r="250" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
  <circle cx="200" cy="500" r="180" fill="#3b82f6" opacity="0.1" filter="url(#glow)" />

  <!-- ========================================== -->
  <!-- LEFT COLUMN: Typography & Enterprise Meta -->
  <!-- ========================================== -->
  
  <g transform="translate(80, 85)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="285" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <circle cx="18" cy="16" r="4" fill="#06b6d4" filter="url(#glowSubtle)" />
      <text x="36" y="20.5" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Title & Category -->
    <text x="0" y="90" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      OPUS<tspan fill="#06b6d4">CLIP</tspan>
    </text>
    
    <text x="0" y="126" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="3">
      AI VIDEO &amp; CONTENT CREATION
    </text>

    <!-- Headline Paragraph -->
    <text x="0" y="175" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
      <tspan x="0" dy="0">The Architecture of AI Video Repurposing</tspan>
      <tspan x="0" dy="28">and the Enterprise Guide to Viral Velocity.</tspan>
    </text>

    <!-- Architectural Spec Box -->
    <g transform="translate(0, 230)">
      <rect width="460" height="145" rx="12" fill="url(#glassFill)" stroke="url(#borderGrad)" stroke-width="1.5" />
      
      <!-- Spec Box Header -->
      <path d="M 16 20 L 444 20" stroke="#334155" stroke-width="1" />
      <circle cx="24" cy="20" r="3" fill="#06b6d4" />
      <text x="36" y="24" fill="#e2e8f0" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">SYSTEM METRICS // CORE PIPELINE</text>

      <!-- Spec Metrics Grid -->
      <g transform="translate(24, 45)">
        <!-- Metric 1 -->
        <text x="0" y="15" fill="#64748b" font-family="monospace" font-size="11">PROCESSING ENGINE</text>
        <text x="0" y="35" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Multi-Modal NLP &amp; CV</text>

        <!-- Metric 2 -->
        <text x="220" y="15" fill="#64748b" font-family="monospace" font-size="11">VIRAL SCORING</text>
        <text x="220" y="35" fill="#d946ef" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Predictive AI (0-100)</text>

        <!-- Metric 3 -->
        <text x="0" y="70" fill="#64748b" font-family="monospace" font-size="11">OUTPUT FORMAT</text>
        <text x="0" y="90" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Auto 9:16 Reframing</text>

        <!-- Metric 4 -->
        <text x="220" y="70" fill="#64748b" font-family="monospace" font-size="11">THROUGHPUT</text>
        <text x="220" y="90" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="600">10x Speed Multiplier</text>
      </g>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- RIGHT COLUMN: 3D Vector AI Video Metaphor -->
  <!-- ========================================== -->
  
  <g transform="translate(620, 60)">
    
    <!-- Outer Glow Frame / Holo Base -->
    <path d="M 70 420 L 260 490 L 480 410 L 290 340 Z" fill="#06b6d4" opacity="0.1" filter="url(#glow)" />
    
    <!-- Isometric Grid Platform -->
    <path d="M 70 380 L 275 450 L 480 380 L 275 310 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <path d="M 275 450 L 275 500 L 480 430 L 480 380 Z" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
    <path d="M 70 380 L 70 430 L 275 500 L 275 450 Z" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" />

    <!-- Connecting Data Streams (Input -> Neural Engine -> Output Clips) -->
    <path d="M 120 370 C 180 320, 200 250, 275 220" fill="none" stroke="url(#cyanPurple)" stroke-width="3" stroke-dasharray="6 4" filter="url(#glowSubtle)" />
    <path d="M 275 220 C 350 190, 390 140, 430 110" fill="none" stroke="url(#fuchsiaPink)" stroke-width="3" filter="url(#neonGlow)" />

    <!-- HOLOGRAPHIC WAVEFORM / AUDIO-VISUAL NODE (Center) -->
    <g transform="translate(275, 200)">
      <!-- Central Core Pillar -->
      <ellipse cx="0" cy="0" rx="60" ry="25" fill="none" stroke="#06b6d4" stroke-width="2" filter="url(#glow)" />
      <ellipse cx="0" cy="-60" rx="60" ry="25" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" />
      <path d="M -60 0 L -60 -60 M 60 0 L 60 -60" stroke="#38bdf8" stroke-width="2" />
      
      <!-- Holographic Audio Waves inside Core -->
      <path d="M -40 -30 Q -25 -60 -10 -30 T 20 -30 T 40 -30" fill="none" stroke="#d946ef" stroke-width="3" filter="url(#neonGlow)" />
      <path d="M -30 -15 Q -15 15 0 -15 T 30 -15" fill="none" stroke="#06b6d4" stroke-width="2" />

      <!-- Floating AI Node Ring -->
      <ellipse cx="0" cy="-110" rx="45" ry="18" fill="url(#glassFill)" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="-106" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">OPUS.AI</text>
    </g>

    <!-- FLOATING VECTOR TIMELINE CHUNKS (Right: Viral Short Clips Output) -->
    <g transform="translate(370, 70)">
      <!-- Clip 1 (Back) -->
      <g transform="translate(40, -20) scale(0.75)">
        <rect width="110" height="180" rx="12" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" filter="url(#glow)" />
        <rect x="12" y="15" width="86" height="110" rx="6" fill="#090d16" />
        <!-- Mock video frame element -->
        <circle cx="55" cy="70" r="18" fill="#d946ef" opacity="0.8" />
        <polygon points="50,60 50,80 68,70" fill="#ffffff" />
        <rect x="15" y="138" width="50" height="8" rx="4" fill="#38bdf8" />
        <rect x="15" y="152" width="80" height="6" rx="3" fill="#475569" />
        <!-- Viral Badge -->
        <rect x="65" y="25" width="28" height="16" rx="8" fill="#10b981" />
        <text x="79" y="36" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">98</text>
      </g>

      <!-- Clip 2 (Front - Flagship Viral Short) -->
      <g transform="translate(0, 10)">
        <rect width="130" height="210" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="2.5" filter="url(#neonGlow)" />
        <rect x="12" y="15" width="106" height="125" rx="8" fill="#030712" />
        
        <!-- Video waveform animation simulation -->
        <path d="M 25 78 L 35 50 L 45 95 L 55 40 L 65 85 L 75 60 L 85 90 L 95 65" fill="none" stroke="#38bdf8" stroke-width="2.5" />
        <circle cx="65" cy="78" r="6" fill="#d946ef" filter="url(#glow)" />

        <!-- Subtitle & UI Lines -->
        <rect x="18" y="152" width="75" height="10" rx="3" fill="#06b6d4" />
        <rect x="18" y="170" width="94" height="6" rx="3" fill="#64748b" />
        <rect x="18" y="184" width="60" height="6" rx="3" fill="#64748b" />

        <!-- Virality Score Badge -->
        <rect x="75" y="25" width="36" height="20" rx="10" fill="url(#cyanPurple)" />
        <text x="93" y="39" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">99</text>
      </g>
    </g>

    <!-- FLOATING METADATA NODES & REFRAME HUD -->
    <!-- Input Source Node (Left) -->
    <g transform="translate(40, 240)">
      <rect width="110" height="70" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
      <path d="M 12 20 L 28 20" stroke="#38bdf8" stroke-width="2" />
      <path d="M 12 32 L 45 32" stroke="#64748b" stroke-width="1.5" />
      <path d="M 12 44 L 35 44" stroke="#64748b" stroke-width="1.5" />
      <circle cx="85" cy="35" r="12" fill="#1e1b4b" stroke="#3b82f6" stroke-width="1.5" />
      <polygon points="82,29 82,41 93,35" fill="#38bdf8" />
      <text x="12" y="60" fill="#94a3b8" font-family="monospace" font-size="9">LONG-FORM.mp4</text>
    </g>

    <!-- AI Active Processing Indicator Node -->
    <g transform="translate(180, 110)">
      <rect x="0" y="0" width="130" height="38" rx="19" fill="#090d16" stroke="#8b5cf6" stroke-width="1.5" />
      <circle cx="20" cy="19" r="6" fill="#8b5cf6" filter="url(#glow)" />
      <text x="35" y="23" fill="#c084fc" font-family="monospace" font-size="11" font-weight="700">CURATION AI</text>
    </g>

    <!-- Connection Circuit Lines -->
    <path d="M 95 310 L 95 350 L 200 390" fill="none" stroke="#334155" stroke-width="1.5" />
    <path d="M 310 128 L 360 100" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Particle Sparkles / Accent Nodes -->
    <circle cx="150" cy="180" r="3" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="380" cy="310" r="4" fill="#d946ef" filter="url(#glow)" />
    <circle cx="230" cy="420" r="2" fill="#06b6d4" />
    <circle cx="430" cy="350" r="3" fill="#38bdf8" />

  </g>

  <!-- ========================================== -->
  <!-- BOTTOM FOOTER BRANDING BAR -->
  <!-- ========================================== -->
  <g transform="translate(80, 570)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="22" fill="#64748b" font-family="monospace" font-size="11" font-weight="600" letter-spacing="1">HELIA TECH INTELLIGENCE</text>
    <text x="1040" y="22" fill="#64748b" font-family="monospace" font-size="11" font-weight="600" text-anchor="end">HELIATECH.ONLINE</text>
  </g>

</svg>