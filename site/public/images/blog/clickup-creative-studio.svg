    <circle cx="45" cy="220" r="6" fill="#7B68EE"/>
    <rect x="60" y="218" width="160" height="4" rx="2" fill="#7B68EE"/>
    <rect x="220" y="218" width="120" height="4" rx="2" fill="#22283d"/>
    <text x="350" y="223" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">00:14 / 00:30</text>

    <!-- Side Panel: AI Prompt & Storyboard Prompts -->
    <rect x="405" y="55" width="235" height="185" rx="10" fill="#0a0d18" stroke="#1f253d" stroke-width="1"/>
    <text x="420" y="78" font-family="'Inter', sans-serif" font-weight="700" font-size="12" fill="#E2E8F0">Prompt to Video (Brain²)</text>
    <rect x="420" y="90" width="205" height="52" rx="6" fill="#141829" stroke="#2b3252" stroke-width="1"/>
    <text x="428" y="108" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">"Turn Task #342 (Launch</text>
    <text x="428" y="122" font-family="'Inter', sans-serif" font-size="10" fill="#94A3B8">Campaign) into a 30s teaser</text>
    <text x="428" y="136" font-family="'Inter', sans-serif" font-size="10" fill="#7B68EE">with voiceover &amp; motion UI"</text>
    
    <!-- Storyboard Keyframes Mini -->
    <text x="420" y="162" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#64748B">SHOT LIST (APPROVED)</text>
    <rect x="420" y="172" width="60" height="55" rx="4" fill="#161c33" stroke="#10B981" stroke-width="1.5"/>
    <text x="450" y="202" font-family="'Inter', sans-serif" font-size="9" fill="#10B981" text-anchor="middle">✓ Shot 1</text>
    <rect x="488" y="172" width="60" height="55" rx="4" fill="#161c33" stroke="#10B981" stroke-width="1.5"/>
    <text x="518" y="202" font-family="'Inter', sans-serif" font-size="9" fill="#10B981" text-anchor="middle">✓ Shot 2</text>
    <rect x="556" y="172" width="60" height="55" rx="4" fill="#161c33" stroke="#7B68EE" stroke-width="1.5"/>
    <text x="586" y="202" font-family="'Inter', sans-serif" font-size="9" fill="#A594F9" text-anchor="middle">⚡ Shot 3</text>

    <!-- NLE Multi-Track Timeline -->
    <rect x="20" y="250" width="620" height="75" rx="8" fill="#080a13" stroke="#1c2138" stroke-width="1"/>
    
    <!-- Track 1: Video -->
    <text x="32" y="268" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">V1</text>
    <rect x="55" y="257" width="180" height="14" rx="3" fill="url(#trackGrad1)"/>
    <rect x="240" y="257" width="140" height="14" rx="3" fill="url(#trackGrad1)"/>
    <rect x="385" y="257" width="220" height="14" rx="3" fill="url(#trackGrad1)"/>

    <!-- Track 2: Subtitles / Captions -->
    <text x="32" y="288" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">TXT</text>
    <rect x="55" y="277" width="120" height="13" rx="3" fill="url(#trackGrad2)"/>
    <rect x="180" y="277" width="170" height="13" rx="3" fill="url(#trackGrad2)"/>
    <rect x="355" y="277" width="160" height="13" rx="3" fill="url(#trackGrad2)"/>

    <!-- Track 3: Audio & Voiceover -->
    <text x="32" y="308" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748B">A1</text>
    <rect x="55" y="297" width="550" height="13" rx="3" fill="url(#trackGrad3)"/>

    <!-- Playhead Needle -->
    <line x1="280" y1="245" x2="280" y2="330" stroke="#FFFFFF" stroke-width="1.8"/>
    <polygon points="274,245 286,245 280,253" fill="#FFFFFF"/>
  </g>

  <!-- Right Module: Strategic Highlights & Comparisons -->
  <g transform="translate(770, 230)">
    <!-- Feature 1: Context Engine -->
    <rect width="350" height="100" rx="12" fill="url(#cardGrad)" stroke="#1f253d" stroke-width="1.2"/>
    <circle cx="45" cy="50" r="22" fill="#7B68EE" fill-opacity="0.15" stroke="#7B68EE" stroke-width="1.5"/>
    <text x="45" y="56" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="18" fill="#7B68EE" text-anchor="middle">🧠</text>
    <text x="80" y="42" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Brain² Context Engine</text>
    <text x="80" y="64" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">Pulls real data from tasks, docs &amp;</text>
    <text x="80" y="80" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">chats without prompt engineering.</text>

    <!-- Feature 2: Multiplayer Real-Time Collab -->
    <g transform="translate(0, 115)">
      <rect width="350" height="100" rx="12" fill="url(#cardGrad)" stroke="#1f253d" stroke-width="1.2"/>
      <circle cx="45" cy="50" r="22" fill="#FF007A" fill-opacity="0.15" stroke="#FF007A" stroke-width="1.5"/>
      <text x="45" y="56" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="18" fill="#FF007A" text-anchor="middle">👥</text>
      <text x="80" y="42" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Multiplayer Video Canvas</text>
      <text x="80" y="64" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">Frame-level comments &amp; live cursors</text>
      <text x="80" y="80" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">turning video into a team document.</text>
    </g>

    <!-- Feature 3: Market Threat Matrix -->
    <g transform="translate(0, 230)">
      <rect width="350" height="110" rx="12" fill="url(#cardGrad)" stroke="#1f253d" stroke-width="1.2"/>
      <circle cx="45" cy="55" r="22" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="1.5"/>
      <text x="45" y="61" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="18" fill="#00F0FF" text-anchor="middle">⚡</text>
      <text x="80" y="42" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Disrupting Loom &amp; Descript</text>
      <text x="80" y="64" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">Eliminates 3-app tech stacks by</text>
      <text x="80" y="80" font-family="'Inter', sans-serif" font-size="12" fill="#94A3B8">embedding NLE inside your Work OS.</text>
      <text x="80" y="96" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00F0FF">Saves ~$30-$80/seat/mo on licenses</text>
    </g>
  </g>

  <!-- Bottom Brand Footer -->
  <g transform="translate(80, 595)">
    <text x="0" y="15" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#64748B" letter-spacing="1">HELIATECH RADAR</text>
    <text x="140" y="15" font-family="'Inter', sans-serif" font-size="13" fill="#475569">· Forensic Architecture &amp; B2B SaaS Intelligence</text>
    <text x="1040" y="15" font-family="'JetBrains Mono', monospace" font-size="13" fill="#7B68EE" text-anchor="end">heliatech.online/blog</text>
  </g>
</svg>