<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="50%" stop-color="#0c0f1d"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="clickupGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B68EE"/>
      <stop offset="50%" stop-color="#FF007A"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141829" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d101c" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="trackGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B68EE" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9370DB" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="trackGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF69B4" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="trackGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00BFFF" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="280" fill="#7B68EE" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="1020" cy="220" r="240" fill="#FF007A" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="600" cy="520" r="300" fill="#00F0FF" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Subtle Studio Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="250" y1="0" x2="250" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="550" y1="0" x2="550" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="850" y1="0" x2="850" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1150" y1="0" x2="1150" y2="630"/>
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="330" x2="1200" y2="330"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="570" x2="1200" y2="570"/>
  </g>

  <!-- Top Badges & Header -->
  <g transform="translate(80, 55)">
    <!-- ClickUp Pill -->
    <rect width="180" height="34" rx="17" fill="#7B68EE" fill-opacity="0.15" stroke="#7B68EE" stroke-width="1.2"/>
    <text x="90" y="22" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#A594F9" text-anchor="middle" letter-spacing="1">BREAKING NEWS</text>

    <!-- Brain² Tag -->
    <rect x="195" width="130" height="34" rx="17" fill="#FF007A" fill-opacity="0.15" stroke="#FF007A" stroke-width="1.2"/>
    <text x="260" y="22" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#FF75B5" text-anchor="middle" letter-spacing="1">BRAIN² AI</text>

    <!-- Category -->
    <text x="345" y="23" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="14" fill="#64748B" letter-spacing="1.5">CREATIVE STUDIO DEEP DIVE</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="145" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" letter-spacing="-1">
    ClickUp Creative Studio
  </text>
  <text x="80" y="195" font-family="'Inter', sans-serif" font-weight="400" font-size="22" fill="#94A3B8">
    Turning Workspace Tasks, Docs &amp; Data Graphs into Instant AI Videos
  </text>

  <!-- Left Module: Creative Studio UI Mockup -->
  <g transform="translate(80, 230)">
    <!-- Container Window -->
    <rect width="660" height="340" rx="16" fill="url(#cardGrad)" stroke="#1e243d" stroke-width="1.5"/>
    
    <!-- Window Bar -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 644 0 C 652.84 0 660 7.16 660 16 L 660 40 L 0 40 Z" fill="#0f1322"/>
    <circle cx="20" cy="20" r="5" fill="#EF4444"/>
    <circle cx="36" cy="20" r="5" fill="#F59E0B"/>
    <circle cx="52" cy="20" r="5" fill="#10B981"/>
    <text x="80" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748B">ClickUp Creative Studio · Sprint_42_Launch_Video.mp4</text>
    <rect x="560" y="10" width="85" height="20" rx="10" fill="#7B68EE" fill-opacity="0.2"/>
    <text x="602" y="23" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#A594F9" text-anchor="middle">Brain² Active</text>

    <!-- Video Canvas Preview Area -->
    <rect x="20" y="55" width="370" height="185" rx="10" fill="#080a12" stroke="#1f253d" stroke-width="1"/>
    
    <!-- Simulated Video Scene (Graph + Product Demo) -->
    <rect x="40" y="75" width="330" height="145" rx="6" fill="#11162a"/>
    <path d="M 50 180 Q 120 120 180 150 T 310 90 T 360 110" fill="none" stroke="url(#clickupGlow)" stroke-width="3" filter="url(#neonGlow)"/>
    <text x="60" y="105" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Quarterly Velocity Surge</text>
    <text x="60" y="125" font-family="'Inter', sans-serif" font-size="11" fill="#7B68EE">+142% Delivery Speed via Brain²</text>
    
