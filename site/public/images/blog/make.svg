<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="grid-fade" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Node & Wire Gradients -->
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="fuchsia-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="glass-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="deep-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="hex-grid" width="40" height="69.282" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M 40 0 L 20 11.547 L 0 0 L 0 23.094 L 20 34.641 L 40 23.094 Z M 0 34.641 L 20 46.188 L 40 34.641 L 40 57.735 L 20 69.282 L 0 57.735 Z" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />
  <rect width="1200" height="630" fill="url(#hex-grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="180" r="220" fill="#8b5cf6" opacity="0.18" filter="url(#deep-glow)" />
  <circle cx="700" cy="400" r="280" fill="#06b6d4" opacity="0.12" filter="url(#deep-glow)" />

  <!-- Background Data Flow Wires / Automation Lines -->
  <g fill="none" stroke-width="2" opacity="0.4">
    <path d="M 100 500 Q 300 500 450 350 T 800 200 T 1100 100" stroke="url(#cyber-cyan)" stroke-dasharray="6 6" />
    <path d="M 50 150 Q 250 150 400 300 T 750 450 T 1150 350" stroke="url(#fuchsia-violet)" />
    <path d="M 600 50 L 600 250 T 900 400" stroke="url(#cyber-cyan)" opacity="0.2"/>
  </g>

  <!-- ==========================================
        AUTOMATION NODES (MAKE.COM METAPHOR)
       ========================================== -->
  <g transform="translate(680, 80)" filter="url(#card-shadow)">
    <!-- Connection Paths between Nodes -->
    <path d="M 80 120 L 210 120 L 280 220 L 410 220" fill="none" stroke="url(#cyber-cyan)" stroke-width="4" filter="url(#neon-glow)" />
    <path d="M 280 220 L 350 360 L 480 360" fill="none" stroke="url(#fuchsia-violet)" stroke-width="4" filter="url(#neon-glow)" />
    
    <!-- Pulse Particles along paths -->
    <circle cx="210" cy="120" r="5" fill="#38bdf8" filter="url(#neon-glow)" />
    <circle cx="350" cy="360" r="5" fill="#d946ef" filter="url(#neon-glow)" />

    <!-- Node 1: Trigger (Webhook / Integromat origin) -->
    <g transform="translate(20, 70)">
      <rect width="120" height="100" rx="16" fill="url(#glass-panel)" stroke="#06b6d4" stroke-width="1.5" />
      <circle cx="60" cy="50" r="24" fill="#06b6d4" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" />
      <!-- Webhook Icon -->
      <path d="M 50 45 C 50 40 55 38 60 42 C 65 38 70 40 70 45 C 70 52 50 54 50 60 L 70 60" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="60" cy="67" r="1.5" fill="#38bdf8" />
      <text x="60" y="88" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">TRIGGER</text>
    </g>

    <!-- Node 2: Router / Transformation (Make Evolution) -->
    <g transform="translate(210, 170)">
      <rect width="140" height="100" rx="16" fill="url(#glass-panel)" stroke="#8b5cf6" stroke-width="1.5" />
      <circle cx="70" cy="45" r="22" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-width="2" />
      <!-- Router Icon (Split lines) -->
      <path d="M 58 35 L 70 45 L 82 35 M 70 45 L 70 55" fill="none" stroke="#d946ef" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="70" y="88" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">SCENARIO</text>
    </g>

    <!-- Node 3: Execution / Action -->
    <g transform="translate(410, 170)">
      <rect width="130" height="100" rx="16" fill="url(#glass-panel)" stroke="#06b6d4" stroke-width="1.5" />
      <circle cx="65" cy="45" r="22" fill="#06b6d4" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" />
      <!-- Zap / Action Icon -->
      <path d="M 68 33 L 57 47 H 68 L 62 61" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="65" y="88" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">EXECUTE</text>
    </g>

    <!-- Node 4: AI Module (2026 Vision) -->
    <g transform="translate(380, 310)">
      <rect width="140" height="100" rx="16" fill="url(#glass-panel)" stroke="#d946ef" stroke-width="1.5" />
      <circle cx="70" cy="45" r="22" fill="#d946ef" fill-opacity="0.2" stroke="#f472b6" stroke-width="2" />
      <!-- AI Sparkle Icon -->
      <path d="M 70 32 L 73 42 L 83 45 L 73 48 L 70 58 L 67 48 L 57 45 L 67 42 Z" fill="url(#fuchsia-violet)" />
      <text x="70" y="88" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">AI AGENT</text>
    </g>
  </g>

  <!-- ==========================================
        TYPOGRAPHY & BRANDING SECTION
       ========================================== -->
  <g transform="translate(80, 90)">
    
    <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
    <g transform="translate(0, 0)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <circle cx="20" cy="17" r="5" fill="#06b6d4" filter="url(#neon-glow)" />
      <text x="38" y="21.5" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#38bdf8">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Title: MAKE -->
    <text x="0" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" letter-spacing="4" fill="#ffffff" filter="url(#card-shadow)">
      MAKE
    </text>
    
    <!-- Gradient Overlay on 'MAKE' for ultra-modern sheen -->
    <text x="0" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="900" letter-spacing="4" fill="url(#cyber-cyan)" opacity="0.85">
      MAKE
    </text>

    <!-- Category Subtitle -->
    <g transform="translate(3, 185)">
      <rect x="0" y="0" width="225" height="28" rx="6" fill="#1e293b" fill-opacity="0.8" />
      <text x="12" y="18.5" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#d946ef">AUTOMATION &amp; NO-CODE</text>
    </g>

    <!-- Investigation Title (Multiline) -->
    <g transform="translate(0, 245)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#f8fafc">
        From Integromat to Make:
      </text>
      <text x="0" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">
        The Evolution of Visual Automation and
      </text>
      <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">
        the Hands-on Guide for <tspan fill="#38bdf8" font-weight="600">2026</tspan>
      </text>
    </g>
  </g>

  <!-- ==========================================
        FOOTER / SYSTEM METADATA BAR
       ========================================== -->
  <g transform="translate(80, 560)">
    <!-- Divider Line -->
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />

    <!-- Metadata Items -->
    <g transform="translate(0, 20)">
      <!-- System status -->
      <circle cx="6" cy="-2" r="3" fill="#10b981" filter="url(#neon-glow)" />
      <text x="18" y="2" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">SYSTEM: ONLINE</text>

      <!-- Security / Clearance -->
      <text x="220" y="2" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1">CLASSIFICATION: ENTERPRISE</text>

      <!-- Domain URL -->
      <text x="1040" y="2" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5" text-anchor="end">HELIATECH.ONLINE</text>
    </g>
  </g>
</svg>