<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%=" stop-color="#030712"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fuchsiaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <!-- UI/Data Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="violetFuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <!-- Hexagon Def -->
    <polygon id="hex" points="30,0 90,0 120,52 90,104 30,104 0,52"/>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="150" r="300" fill="url(#cyanGlow)" filter="url(#heavyGlow)"/>
  <circle cx="800" cy="450" r="350" fill="url(#violetGlow)" filter="url(#heavyGlow)"/>
  <circle cx="200" cy="500" r="250" fill="url(#fuchsiaGlow)" filter="url(#heavyGlow)"/>

  <!-- ================= CYBERNETIC CRM GRAPHICS (RIGHT SIDE) ================= -->
  <g transform="translate(680, 75)" id="crm-intelligence-engine">
    <!-- Connecting Data Pathways (Background) -->
    <path d="M 60 100 L 180 200 L 320 120 L 400 280" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,4"/>
    <path d="M 100 350 L 220 280 L 300 380 L 420 320" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Isometric Cube 1: Data Enrichment Node -->
    <g transform="translate(40, 60)" filter="url(#subtleGlow)">
      <path d="M 60,0 L 120,30 L 120,90 L 60,120 L 0,90 L 0,30 Z" fill="url(#cardGrad)" stroke="url(#glassBorder)" stroke-width="1.5"/>
      <path d="M 60,0 L 120,30 L 60,60 L 0,30 Z" fill="#06b6d4" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1"/>
      <path d="M 60,60 L 60,120" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="60" cy="60" r="8" fill="#38bdf8" filter="url(#glow)"/>
      <circle cx="60" cy="60" r="3" fill="#ffffff"/>
    </g>

    <!-- Isometric Cube 2: Predictive Revenue Engine -->
    <g transform="translate(280, 20)" filter="url(#subtleGlow)">
      <path d="M 70,0 L 140,35 L 140,105 L 70,140 L 0,105 L 0,35 Z" fill="url(#cardGrad)" stroke="url(#glassBorder)" stroke-width="1.5"/>
      <path d="M 70,0 L 140,35 L 70,70 L 0,35 Z" fill="#8b5cf6" fill-opacity="0.2" stroke="#a78bfa" stroke-width="1"/>
      <!-- Inner graph bars -->
      <rect x="35" y="75" width="10" height="25" fill="#38bdf8" rx="2"/>
      <rect x="55" y="60" width="10" height="40" fill="#06b6d4" rx="2"/>
      <rect x="75" y="45" width="10" height="55" fill="#d946ef" rx="2"/>
    </g>

    <!-- Isometric Cube 3: Multi-Channel GTM Hub -->
    <g transform="translate(180, 220)" filter="url(#subtleGlow)">
      <path d="M 80,0 L 160,40 L 160,120 L 80,160 L 0,120 L 0,40 Z" fill="url(#cardGrad)" stroke="url(#glassBorder)" stroke-width="2"/>
      <path d="M 80,0 L 160,40 L 80,80 L 0,40 Z" fill="#d946ef" fill-opacity="0.25" stroke="#f472b6" stroke-width="1"/>
      <!-- Hub Rings -->
      <ellipse cx="80" cy="90" rx="35" ry="18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,2"/>
      <ellipse cx="80" cy="90" rx="20" ry="10" fill="none" stroke="#d946ef" stroke-width="1.5"/>
      <circle cx="80" cy="90" r="5" fill="#ffffff" filter="url(#glow)"/>
    </g>

    <!-- Floating Data Nodes & Particles -->
    <g filter="url(#glow)">
      <!-- Pulsing Data Rings -->
      <circle cx="100" cy="180" r="15" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
      <circle cx="100" cy="180" r="4" fill="#06b6d4"/>
      
      <circle cx="350" cy="220" r="18" fill="none" stroke="#d946ef" stroke-width="1.5"/>
      <circle cx="350" cy="220" r="5" fill="#d946ef"/>

      <circle cx="270" cy="110" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="270" cy="110" r="3" fill="#38bdf8"/>
    </g>

    <!-- High-Velocity Revenue Curve Overlay -->
    <path d="M 20 380 Q 150 280 250 320 T 440 180" fill="none" stroke="url(#cyanBlue)" stroke-width="4" filter="url(#glow)"/>
    <path d="M 20 380 Q 150 280 250 320 T 440 180" fill="none" stroke="#ffffff" stroke-width="1.5"/>

    <!-- Floating Connection Points -->
    <circle cx="440" cy="180" r="6" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="250" cy="320" r="5" fill="#38bdf8"/>
    <circle cx="20" cy="380" r="5" fill="#d946ef"/>
  </g>


  <!-- ================= LEFT SIDE: TYPOGRAPHY & BRANDING ================= -->
  <!-- Architectural Dossier Pill Badge -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="280" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="20" cy="17" r="4" fill="#06b6d4" filter="url(#glow)"/>
    <text x="36" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- Main Title & Subtitle Group -->
  <g transform="translate(80, 160)">
    <!-- Tool Category -->
    <text x="0" y="0" fill="#a78bfa" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="3" filter="url(#subtleGlow)">B2B SALES &amp; CRM INTELLIGENCE</text>

    <!-- Headline Part 1 -->
    <text x="0" y="65" fill="#ffffff" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">HUBSPOT</text>

    <!-- Headline Part 2 (Gradient Text simulation via layered text & clips, or precise styling) -->
    <text x="0" y="125" fill="url(#cyanBlue)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5" filter="url(#subtleGlow)">The Evolution of the</text>
    <text x="0" y="175" fill="url(#violetFuchsia)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5" filter="url(#subtleGlow)">Inbound CRM Empire</text>

    <!-- Descriptive Sub-text -->
    <text x="0" y="225" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" line-height="1.5">
      <tspan x="0" dy="0">Decoding enterprise go-to-market alignment, unified data architectures,</tspan>
      <tspan x="0" dy="24">and the scaling mechanisms of modern revenue engines.</tspan>
    </text>
  </g>

  <!-- ================= BOTTOM METADATA BAR ================= -->
  <g transform="translate(80, 535)">
    <!-- Divider Line -->
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Metadata Items -->
    <g transform="translate(0, 20)">
      <!-- Item 1 -->
      <text x="0" y="0" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">SYSTEM ARCHITECTURE</text>
      <text x="0" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Multi-Hub CRM Core</text>

      <!-- Item 2 -->
      <translateX value="280">
        <g transform="translate(260, 0)">
          <text x="0" y="0" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">ANALYSIS VECTOR</text>
          <text x="0" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">GTM Operational Scale</text>
        </g>
      </translateX>

      <!-- Item 3 -->
      <g transform="translate(560, 0)">
        <text x="0" y="0" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">SECURITY &amp; COMPLIANCE</text>
        <text x="0" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Enterprise Grade Isolation</text>
      </g>

      <!-- Brand Signature Right -->
      <g transform="translate(900, 2)">
        <rect x="0" y="-8" width="140" height="26" rx="6" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-width="0.5"/>
        <text x="70" y="8" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="2" text-anchor="middle">HELIATECH</text>
      </g>
    </g>
  </g>

</svg>