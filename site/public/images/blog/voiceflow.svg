<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background &amp; Base Gradients -->
    <radialGradient id="bgGlow" cx="60%" cy="40%" r="70%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1628" />
      <stop offset="50%" stop-color="#060913" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="violetFuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow &amp; Shadow Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Pattern definitions -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
    
    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8b5cf6" fill-opacity="0.2" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#gridPattern)" />
  <rect width="1200" height="630" fill="url(#gridFade)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="150" r="250" fill="#8b5cf6" opacity="0.12" filter="url(#glow)" />
  <circle cx="750" cy="450" r="300" fill="#06b6d4" opacity="0.08" filter="url(#glow)" />
  <circle cx="200" cy="500" r="200" fill="#38bdf8" opacity="0.06" filter="url(#glow)" />

  <!-- ==================== BACKGROUND GRAPHICS / 3D METAPHORS ==================== -->
  <!-- Abstract Conversational AI &amp; Neural Flow Networks (Right Side) -->
  <g opacity="0.85" filter="url(#panelShadow)">
    <!-- Connecting Workflow Paths / Bézier Curves -->
    <path d="M 680,240 C 750,240 760,150 840,150" fill="none" stroke="url(#cyanBlue)" stroke-width="2" stroke-dasharray="6,4" />
    <path d="M 760,150 C 820,150 850,280 930,280" fill="none" stroke="url(#violetFuchsia)" stroke-width="3" filter="url(#glowSubtle)" />
    <path d="M 840,380 C 900,380 920,280 980,280" fill="none" stroke="url(#cyanBlue)" stroke-width="2" />
    <path d="M 700,420 C 780,420 800,380 840,380" fill="none" stroke="url(#violetFuchsia)" stroke-width="2" stroke-dasharray="4,4" />
    <path d="M 620,330 C 660,330 670,420 700,420" fill="none" stroke="url(#cyanBlue)" stroke-width="3" />
    
    <!-- Audio Waveform Integration (Voice domain) -->
    <g transform="translate(930, 200)" opacity="0.4">
      <path d="M0,40 L10,20 L20,70 L30,10 L40,90 L50,40 L60,50 L70,30 L80,60 L90,40" fill="none" stroke="#d946ef" stroke-width="2" />
    </g>

    <!-- Node Card 1: Intent Recognition (Top Right) -->
    <g transform="translate(800, 100)">
      <rect width="180" height="85" rx="12" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glowSubtle)" />
      <path d="M 15 25 L 35 25" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
      <circle cx="155" cy="25" r="5" fill="#06b6d4" filter="url(#glowSubtle)" />
      <text x="20" y="50" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Intent Parser</text>
      <text x="20" y="68" fill="#94a3b8" font-family="monospace" font-size="10">nlp.detect(ctx)</text>
    </g>

    <!-- Node Card 2: Voiceflow Core Engine (Center-Right) -->
    <g transform="translate(680, 280)">
      <rect width="210" height="100" rx="14" fill="url(#nodeGrad)" stroke="#8b5cf6" stroke-width="2" filter="url(#glow)" />
      <circle cx="20" cy="20" r="6" fill="#8b5cf6" />
      <text x="35" y="24" fill="#c084fc" font-family="system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="1">AGENT RUNTIME</text>
      <text x="20" y="55" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="800" font-size="16">LLM Orchestration</text>
      <text x="20" y="75" fill="#94a3b8" font-family="monospace" font-size="11">tokens: 4k | latency: 84ms</text>
    </g>

    <!-- Node Card 3: Enterprise Webhook Action (Bottom Right) -->
    <g transform="translate(820, 390)">
      <rect width="190" height="90" rx="12" fill="url(#nodeGrad)" stroke="#d946ef" stroke-width="1.5" filter="url(#glowSubtle)" />
      <path d="M 15 25 L 35 25" stroke="#d946ef" stroke-width="3" stroke-linecap="round" />
      <circle cx="170" cy="25" r="5" fill="#d946ef" />
      <text x="20" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="13">No-Code API Trigger</text>
      <text x="20" y="70" fill="#94a3b8" font-family="monospace" font-size="10">POST /v2/workflow</text>
    </g>

    <!-- Small Floating Data Badges -->
    <g transform="translate(1010, 240)">
      <rect width="100" height="35" rx="8" fill="#090d16" stroke="#06b6d4" stroke-width="1" />
      <circle cx="15" cy="17" r="4" fill="#06b6d4" />
      <text x="28" y="21" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">200 OK</text>
    </g>
    
    <g transform="translate(630, 180)">
      <rect width="115" height="35" rx="8" fill="#090d16" stroke="#8b5cf6" stroke-width="1" />
      <circle cx="15" cy="17" r="4" fill="#8b5cf6" />
      <text x="28" y="21" font-family="monospace" font-size="11" font-weight="600" fill="#c084fc">VECTOR DB</text>
    </g>
  </g>


  <!-- ==================== FOREGROUND / TYPOGRAPHY &amp; BRANDING ==================== -->
  
  <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
  <g transform="translate(80, 80)">
    <rect width="320" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="18" r="4" fill="#06b6d4" filter="url(#glow)" />
    <text x="36" y="23" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- Main Title &amp; Subtitle Section -->
  <g transform="translate(80, 160)">
    <!-- Category Subtitle -->
    <text x="0" y="0" fill="url(#cyanBlue)" font-family="system-ui, sans-serif" font-weight="700" font-size="14" letter-spacing="4">AI AUTOMATION &amp; NO-CODE INFRASTRUCTURE</text>
    
    <!-- Tool Title: VOICEFLOW -->
    <text x="0" y="75" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="64" letter-spacing="-1" filter="url(#panelShadow)">VOICEFLOW</text>

    <!-- Article Headline Paragraph -->
    <text x="0" y="125" fill="#f1f5f9" font-family="system-ui, sans-serif" font-weight="700" font-size="28" letter-spacing="-0.5">
      The Architecture of Conversational AI
    </text>
    <text x="0" y="160" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="400" font-size="18">
      and the No-Code Blueprint for Enterprise Scale.
    </text>
  </g>

  <!-- ==================== BOTTOM METADATA BAR ==================== -->
  <g transform="translate(80, 530)">
    <!-- Divider Line -->
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.5" />
    
    <!-- Metadata Items -->
    <g transform="translate(0, 25)">
      <!-- Domain Tag -->
      <rect width="130" height="26" rx="6" fill="#1e293b" />
      <text x="12" y="17" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">SYS_ANALYSIS</text>

      <text x="155" y="17" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">|</text>

      <!-- Read Time / Specs -->
      <text x="180" y="17" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="500" font-size="13">Deep-Dive Technical Investigation</text>

      <!-- URL Branding Right-Aligned -->
      <text x="1040" y="17" text-anchor="end" fill="#cbd5e1" font-family="monospace" font-size="13" font-weight="700" letter-spacing="1">heliatech.online</text>
    </g>
  </g>

  <!-- Decorative Corner Brackets / HUD Elements -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.5">
    <!-- Top Left -->
    <path d="M 40,50 L 40,40 L 50,40" />
    <!-- Top Right -->
    <path d="M 1160,50 L 1160,40 L 1150,40" />
    <!-- Bottom Left -->
    <path d="M 40,580 L 40,590 L 50,590" />
    <!-- Bottom Right -->
    <path d="M 1160,580 L 1160,590 L 1150,590" />
  </g>
</svg>