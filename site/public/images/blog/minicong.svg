<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bg-radial" cx="70%" cy="30%" r="80%" fx="60%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="grid-fade" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </linearGradient>

    <!-- Neon & Glow Gradients -->
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="fuchsia-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="panel-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="panel-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.5" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern for Cyber Grid -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>
    <pattern id="dot-matrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8b5cf6" fill-opacity="0.2" />
    </pattern>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1200" height="630" fill="url(#bg-radial)" />
  <rect width="1200" height="630" fill="url(#cyber-grid)" />
  <rect width="1200" height="630" fill="url(#dot-matrix)" />

  <!-- AMBIENT LIGHTING ORBS -->
  <circle cx="950" cy="150" r="250" fill="#06b6d4" opacity="0.12" filter="url(#glow-heavy)" />
  <circle cx="800" cy="450" r="300" fill="#8b5cf6" opacity="0.15" filter="url(#glow-heavy)" />
  <circle cx="150" cy="500" r="200" fill="#d946ef" opacity="0.08" filter="url(#glow-heavy)" />

  <!-- TOP-RIGHT HOLOGRAPHIC AI VIDEO METAPHOR (VECTOR NEURAL TIMELINE & AUDIO WAVEFORMS) -->
  <g transform="translate(680, 80)">
    <!-- Main Floating Holographic Container -->
    <rect x="0" y="0" width="460" height="470" rx="24" fill="url(#panel-glass)" stroke="url(#panel-border)" stroke-width="1.5" filter="url(#glow-subtle)" backdrop-filter="blur(20px)" />
    
    <!-- Header of Hologram -->
    <path d="M 24 50 L 436 50" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
    <circle cx="44" cy="25" r="4" fill="#06b6d4" filter="url(#glow-subtle)" />
    <text x="60" y="29" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="2">NEURAL_RENDER_ENGINE // v4.8</text>
    <text x="390" y="29" fill="#d946ef" font-family="system-ui, sans-serif" font-size="11" font-weight="600">LIVE</text>

    <!-- 3D Vector Waveform Visualizer -->
    <g transform="translate(30, 80)">
      <rect x="0" y="0" width="400" height="110" rx="12" fill="#030712" fill-opacity="0.6" stroke="#06b6d4" stroke-opacity="0.2" />
      
      <!-- Grid lines inside visualizer -->
      <line x1="0" y1="55" x2="400" y2="55" stroke="#38bdf8" stroke-opacity="0.1" stroke-dasharray="4 4" />
      <line x1="100" y1="0" x2="100" y2="110" stroke="#38bdf8" stroke-opacity="0.1" />
      <line x1="200" y1="0" x2="200" y2="110" stroke="#38bdf8" stroke-opacity="0.1" />
      <line x1="300" y1="0" x2="300" y2="110" stroke="#38bdf8" stroke-opacity="0.1" />

      <!-- Glowing Audio / Video Frequency Curves -->
      <path d="M 10 55 Q 50 10, 90 55 T 170 55 T 250 55 T 330 55 T 390 55" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.4" />
      <path d="M 10 55 Q 40 90, 80 55 T 160 20 T 240 80 T 320 55 T 390 30" fill="none" stroke="url(#cyan-violet)" stroke-width="3" filter="url(#glow-subtle)" />
      
      <!-- Data points / Nodes -->
      <circle cx="160" cy="20" r="5" fill="#06b6d4" filter="url(#glow-subtle)" />
      <circle cx="240" cy="80" r="5" fill="#d946ef" filter="url(#glow-subtle)" />
      
      <text x="15" y="20" fill="#94a3b8" font-family="monospace" font-size="10">NODE_SYNC: 99.4%</text>
    </g>

    <!-- Timeline Tracks (Autonomous Localization Process) -->
    <g transform="translate(30, 210)">
      <!-- Track 1: Source Video Stream -->
      <text x="0" y="15" fill="#94a3b8" font-family="monospace" font-size="10">STREAM_01: EN_ORIGIN</text>
      <rect x="0" y="22" width="400" height="24" rx="6" fill="#090d16" stroke="#38bdf8" stroke-opacity="0.3" />
      <rect x="10" y="28" width="120" height="12" rx="3" fill="#38bdf8" fill-opacity="0.4" />
      <rect x="150" y="28" width="180" height="12" rx="3" fill="#38bdf8" fill-opacity="0.7" />

      <!-- Track 2: AI Neural Translation & Sync -->
      <text x="0" y="65" fill="#94a3b8" font-family="monospace" font-size="10">LOCALIZATION_BUFFER (15-MIN BLUEPRINT)</text>
      <rect x="0" y="72" width="400" height="28" rx="6" fill="#090d16" stroke="#d946ef" stroke-opacity="0.5" filter="url(#glow-subtle)" />
      
      <!-- Progress Segments -->
      <rect x="10" y="78" width="90" height="16" rx="4" fill="url(#cyan-violet)" />
      <rect x="105" y="78" width="140" height="16" rx="4" fill="url(#fuchsia-violet)" />
      <rect x="250" y="78" width="110" height="16" rx="4" fill="#06b6d4" fill-opacity="0.8" />
      
      <!-- Playhead / Cursor -->
      <line x1="250" y1="10" x2="250" y2="105" stroke="#ffffff" stroke-width="2" filter="url(#glow-heavy)" />
      <polygon points="245,10 255,10 250,16" fill="#ffffff" />
    </g>

    <!-- Bottom Metric Chips -->
    <g transform="translate(30, 340)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="120" height="60" rx="10" fill="#030712" stroke="#38bdf8" stroke-opacity="0.3" />
      <text x="12" y="22" fill="#94a3b8" font-family="system-ui" font-size="10">LATENCY</text>
      <text x="12" y="45" fill="#38bdf8" font-family="monospace" font-size="18" font-weight="bold">14.2ms</text>

      <!-- Metric 2 -->
      <rect x="140" y="0" width="120" height="60" rx="10" fill="#030712" stroke="#8b5cf6" stroke-opacity="0.3" />
      <text x="152" y="22" fill="#94a3b8" font-family="system-ui" font-size="10">ACCURACY</text>
      <text x="152" y="45" fill="#c084fc" font-family="monospace" font-size="18" font-weight="bold">99.9%</text>

      <!-- Metric 3 -->
      <rect x="280" y="0" width="120" height="60" rx="10" fill="#030712" stroke="#d946ef" stroke-opacity="0.3" />
      <text x="292" y="22" fill="#94a3b8" font-family="system-ui" font-size="10">SPEEDUP</text>
      <text x="292" y="45" fill="#e879f9" font-family="monospace" font-size="18" font-weight="bold">400x</text>
    </g>

    <!-- Floating Connection Nodes / Particles -->
    <circle cx="436" cy="120" r="6" fill="#06b6d4" filter="url(#glow-heavy)" />
    <circle cx="436" cy="240" r="4" fill="#d946ef" filter="url(#glow-heavy)" />
    <path d="M 436 120 L 460 120 L 480 140" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
  </g>

  <!-- LEFT CONTENT & TYPOGRAPHY -->
  <g transform="translate(80, 80)">
    
    <!-- TOP PILL BADGE: HELIATECH ARCHITECTURAL DOSSIER -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="#090d16" stroke="url(#cyan-violet)" stroke-width="1.5" filter="url(#glow-subtle)" />
      <circle cx="18" cy="16" r="5" fill="#06b6d4" filter="url(#glow-heavy)" />
      <text x="35" y="21" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- TOOL CATEGORY SUBTITLE -->
    <g transform="translate(0, 70)">
      <text x="0" y="0" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3">AI VIDEO // ENTERPRISE LOCALIZATION</text>
    </g>

    <!-- TOOL TITLE: 'MINICONG' -->
    <g transform="translate(0, 125)">
      <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1" filter="url(#glow-subtle)">MINICONG</text>
      <!-- Subtle offset glowing duplicate for high-end aesthetic -->
      <text x="0" y="0" fill="none" stroke="url(#cyan-violet)" stroke-width="1" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1" opacity="0.5">MINICONG</text>
    </g>

    <!-- INVESTIGATION TITLE -->
    <g transform="translate(0, 170)">
      <text x="0" y="0" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5">The Evolution of Autonomous AI Video</text>
      <text x="0" y="32" fill="url(#fuchsia-violet)" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5">and the 15-Minute Enterprise Localization Blueprint</text>
    </g>

    <!-- DESCRIPTIVE ABSTRACT -->
    <g transform="translate(0, 240)">
      <text x="0" y="0" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="400" line-height="1.5">
        <tspan x="0" dy="0">Deconstructing autonomous video generation pipelines, neural lip-sync,</tspan>
        <tspan x="0" dy="22">and scalable multi-language deployment architectures for global enterprise.</tspan>
      </text>
    </g>

    <!-- FOOTER METADATA / BRANDING -->
    <g transform="translate(0, 345)">
      <!-- Divider Line -->
      <line x1="0" y1="0" x2="520" y2="0" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1" />
      
      <!-- Brand Signature -->
      <text x="0" y="30" fill="#64748b" font-family="monospace" font-size="12" font-weight="600" letter-spacing="1.5">HELIATECH.ONLINE // FLAGSHIP RESEARCH</text>
      
      <!-- Security / Status Stamp -->
      <rect x="400" y="15" width="120" height="24" rx="4" fill="#090d16" stroke="#8b5cf6" stroke-opacity="0.4" />
      <circle cx="412" cy="27" r="3" fill="#10b981" />
      <text x="424" y="31" fill="#c084fc" font-family="monospace" font-size="10" font-weight="600">VERIFIED SPEC</text>
    </g>

  </g>

  <!-- DECORATIVE VECTOR ACCENTS (CYBER CORNERS & EDGES) -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6">
    <!-- Top Left Corner -->
    <path d="M 20 40 L 20 20 L 40 20" />
    <!-- Bottom Left Corner -->
    <path d="M 20 590 L 20 610 L 40 610" />
    <!-- Top Right Corner -->
    <path d="M 1180 40 L 1180 20 L 1160 20" />
    <!-- Bottom Right Corner -->
    <path d="M 1180 590 L 1180 610 L 1160 610" />
  </g>

  <!-- FLOATING DATA PARTICLES -->
  <g opacity="0.8">
    <circle cx="620" cy="180" r="2" fill="#38bdf8" filter="url(#glow-subtle)" />
    <circle cx="650" cy="320" r="3" fill="#8b5cf6" filter="url(#glow-subtle)" />
    <circle cx="600" cy="480" r="1.5" fill="#d946ef" filter="url(#glow-subtle)" />
    <circle cx="1160" cy="300" r="2" fill="#06b6d4" filter="url(#glow-subtle)" />
  </g>
</svg>