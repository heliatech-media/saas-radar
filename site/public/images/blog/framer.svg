<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>
    
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="blueCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="panelGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="codeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow & Lighting Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Geometric Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8b5cf6" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#dots)" />

  <!-- Ambient Lighting Orbs -->
  <circle cx="950" cy="150" r="220" fill="#8b5cf6" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="750" cy="450" r="280" fill="#06b6d4" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="200" cy="500" r="200" fill="#d946ef" opacity="0.08" filter="url(#softGlow)" />

  <!-- Abstract Vector Background Waves / Vector Curves -->
  <g opacity="0.3" filter="url(#glow)">
    <path d="M-100 200 C 300 100, 600 500, 1300 150" fill="none" stroke="url(#cyanPurple)" stroke-width="2" />
    <path d="M-100 350 C 400 600, 700 100, 1300 400" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 4" />
  </g>

  <!-- MAIN CONTAINER / CONTENT AREA -->
  
  <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
  <g transform="translate(80, 70)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="20" cy="17" r="4" fill="#06b6d4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- Article Category & Title -->
  <g transform="translate(80, 140)">
    <!-- Category Subtitle -->
    <text x="0" y="0" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="3" text-transform="uppercase">Design &amp; Web Development Investigation</text>
    
    <!-- Main Title Line 1 -->
    <text x="0" y="55" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
      FRAMER<tspan fill="#06b6d4">.</tspan>
    </text>
    
    <!-- Title Line 2 (Smaller Sub-heading) -->
    <text x="0" y="95" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" letter-spacing="-0.2">
      The Evolution of Visual React Development &amp; Enterprise Velocity
    </text>
  </g>

  <!-- Metadata Footer in Hero Area -->
  <g transform="translate(80, 535)">
    <line x1="0" y1="0" x2="520" y2="0" stroke="#334155" stroke-width="1" />
    <text x="0" y="25" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" letter-spacing="1">
      STATUS: DEPLOYED <tspan fill="#38bdf8">•</tspan> ENGINE: REACT/AST <tspan fill="#38bdf8">•</tspan> ACCELERATION: +340%
    </text>
  </g>

  <!-- RIGHT SIDE: 3D VECTOR IDE / REACT VISUAL DEVELOPMENT METAPHOR -->
  <g transform="translate(640, 95)" filter="url(#dropShadow)">
    
    <!-- Outer Glow Frame -->
    <rect x="0" y="0" width="480" height="440" rx="16" fill="none" stroke="url(#cyanPurple)" stroke-width="1.5" opacity="0.6" />

    <!-- IDE Window Background -->
    <rect x="0" y="0" width="480" height="440" rx="16" fill="url(#panelGlass)" stroke="#334155" stroke-width="1" />

    <!-- Window Header Bar -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 464 0 C 472.84 0 480 7.16 480 16 L 480 44 L 0 44 Z" fill="#090d16" />
    <circle cx="24" cy="22" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="44" cy="22" r="6" fill="#f59e0b" opacity="0.8" />
    <circle cx="64" cy="22" r="6" fill="#10b981" opacity="0.8" />
    
    <text x="240" y="27" fill="#64748b" font-family="monospace" font-size="12" text-anchor="middle">framer-enterprise-engine.tsx</text>

    <!-- Floating Component Node Tag -->
    <g transform="translate(330, 20)" filter="url(#glow)">
      <rect x="0" y="0" width="110" height="24" rx="12" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1" />
      <text x="55" y="16" fill="#c084fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">⚡ REACT NODE</text>
    </g>

    <!-- IDE Content Area: AST / Syntax & Visual Canvas Simulation -->
    <g transform="translate(24, 70)">
      
      <!-- Line Numbers -->
      <text x="0" y="20" fill="#475569" font-family="monospace" font-size="12">01</text>
      <text x="0" y="45" fill="#475569" font-family="monospace" font-size="12">02</text>
      <text x="0" y="70" fill="#475569" font-family="monospace" font-size="12">03</text>
      <text x="0" y="95" fill="#475569" font-family="monospace" font-size="12">04</text>
      <text x="0" y="120" fill="#475569" font-family="monospace" font-size="12">05</text>
      <text x="0" y="145" fill="#475569" font-family="monospace" font-size="12">06</text>
      <text x="0" y="170" fill="#475569" font-family="monospace" font-size="12">07</text>
      <text x="0" y="195" fill="#475569" font-family="monospace" font-size="12">08</text>

      <!-- Code Syntax Highlighting -->
      <text x="35" y="20" font-family="monospace" font-size="13">
        <tspan fill="#f43f5e">import</tspan> <tspan fill="#38bdf8">{</tspan> <tspan fill="#e2e8f0">Motion</tspan><tspan fill="#38bdf8">, </tspan><tspan fill="#e2e8f0">useCanvas</tspan> <tspan fill="#38bdf8">}</tspan> <tspan fill="#f43f5e">from</tspan> <tspan fill="#a3e635">'framer/core'</tspan><tspan fill="#38bdf8">;</tspan>
      </text>

      <text x="35" y="45" font-family="monospace" font-size="13">
        <tspan fill="#f43f5e">import</tspan> <tspan fill="#38bdf8">{</tspan> <tspan fill="#e2e8f0">VectorMesh</tspan> <tspan fill="#38bdf8">}</tspan> <tspan fill="#f43f5e">from</tspan> <tspan fill="#a3e635">'@heliatech/velocity'</tspan><tspan fill="#38bdf8">;</tspan>
      </text>

      <text x="35" y="70" font-family="monospace" font-size="13">
        <tspan fill="#c084fc">export</tspan> <tspan fill="#818cf8">function</tspan> <tspan fill="#facc15">EnterpriseVelocityCanvas</tspan><tspan fill="#38bdf8">() {</tspan>
      </text>

      <text x="55" y="95" font-family="monospace" font-size="13">
        <tspan fill="#818cf8">const</tspan> <tspan fill="#38bdf8">[</tspan><tspan fill="#e2e8f0">scale</tspan><tspan fill="#38bdf8">, </tspan><tspan fill="#facc15">setAccelerate</tspan><tspan fill="#38bdf8">]</tspan> <tspan fill="#f43f5e">=</tspan> <tspan fill="#60a5fa">useCanvas</tspan><tspan fill="#38bdf8">(</tspan><tspan fill="#f472b6">10.4</tspan><tspan fill="#38bdf8">);</tspan>
      </text>

      <text x="55" y="120" font-family="monospace" font-size="13">
        <tspan fill="#f43f5e">return</tspan> <tspan fill="#38bdf8">(</tspan>
      </text>

      <text x="75" y="145" font-family="monospace" font-size="13">
        <tspan fill="#38bdf8">&lt;</tspan><tspan fill="#34d399">Motion.div</tspan> <tspan fill="#a78bfa">velocity</tspan><tspan fill="#f43f5e">=</tspan><tspan fill="#38bdf8">{</tspan><tspan fill="#e2e8f0">scale</tspan><tspan fill="#38bdf8">}</tspan> <tspan fill="#a78bfa">render</tspan><tspan fill="#f43f5e">=</tspan><tspan fill="#a3e635">"vector"</tspan><tspan fill="#38bdf8">&gt;</tspan>
      </text>

      <text x="95" y="170" font-family="monospace" font-size="13">
        <tspan fill="#38bdf8">&lt;</tspan><tspan fill="#34d399">VectorMesh</tspan> <tspan fill="#a78bfa">sync</tspan><tspan fill="#f43f5e">=</tspan><tspan fill="#e2e8f0">true</tspan> <tspan fill="#38bdf8">/&gt;</tspan>
      </text>

      <text x="75" y="195" font-family="monospace" font-size="13">
        <tspan fill="#38bdf8">&lt;-- Automated Production Preview --&gt;</tspan>
      </text>
    </g>

    <!-- Integrated Vector Preview Card (Simulated UI inside IDE) -->
    <g transform="translate(24, 225)" filter="url(#dropShadow)">
      <rect x="0" y="0" width="432" height="185" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
      
      <!-- Glowing Vector Graphic Element inside Preview -->
      <g transform="translate(30, 20)">
        <!-- Connecting Circuit / AST Paths -->
        <path d="M 40 40 L 120 40 L 160 90 L 240 90" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
        <path d="M 120 40 L 160 10 L 240 10" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.6" />
        <path d="M 160 90 L 200 140 L 280 140" fill="none" stroke="#d946ef" stroke-width="2" opacity="0.6" />

        <!-- Nodes / Interactive Handles -->
        <g transform="translate(40, 40)">
          <circle cx="0" cy="0" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
          <circle cx="0" cy="0" r="3" fill="#38bdf8" />
        </g>

        <g transform="translate(120, 40)">
          <rect x="-8" y="-8" width="16" height="16" fill="#0f172a" stroke="#8b5cf6" stroke-width="3" rx="3" />
          <circle cx="0" cy="0" r="3" fill="#8b5cf6" />
        </g>

        <g transform="translate(160, 90)">
          <circle cx="0" cy="0" r="10" fill="#06b6d4" opacity="0.3" filter="url(#glow)" />
          <circle cx="0" cy="0" r="8" fill="#0f172a" stroke="#06b6d4" stroke-width="3" />
          <circle cx="0" cy="0" r="3" fill="#06b6d4" />
        </g>

        <g transform="translate(240, 90)">
          <rect x="-10" y="-10" width="20" height="20" fill="#0f172a" stroke="#d946ef" stroke-width="3" rx="4" />
          <circle cx="0" cy="0" r="4" fill="#d946ef" />
        </g>

        <!-- Floating Metric Badge -->
        <g transform="translate(260, 10)">
          <rect x="0" y="0" width="120" height="42" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
          <text x="12" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">FRAME VELOCITY</text>
          <text x="12" y="34" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700">60 FPS SYNC</text>
        </g>

        <!-- Secondary Metric Badge -->
        <g transform="translate(220, 115)">
          <rect x="0" y="0" width="140" height="32" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1" />
          <circle cx="14" cy="16" r="4" fill="#10b981" />
          <text x="28" y="21" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600">PRODUCTION READY</text>
        </g>

      </g>
    </g>

  </g>

  <!-- Decorative Corner Accent Marks (Technical Blueprint Feel) -->
  <path d="M 40 40 L 40 60 M 40 40 L 60 40" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
  <path d="M 1160 40 L 1160 60 M 1160 40 L 1440 40" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
  <path d="M 40 590 L 40 570 M 40 590 L 60 590" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
  <path d="M 1160 590 L 1160 570 M 1160 590 L 1140 590" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />

</svg>