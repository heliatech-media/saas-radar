<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#070b19"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="violetFuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="nodeActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Glow & Blur Filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="heavyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.2"/>
    </pattern>

    <!-- Dot Pattern -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64748b" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- 1. Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="100" r="220" fill="#06b6d4" opacity="0.12" filter="url(#heavyGlow)"/>
  <circle cx="1050" cy="500" r="280" fill="#8b5cf6" opacity="0.12" filter="url(#heavyGlow)"/>
  <circle cx="850" cy="120" r="180" fill="#d946ef" opacity="0.08" filter="url(#heavyGlow)"/>

  <!-- 2. Architectural Construct: Distributed Catalog & Digital Monetization Nodes (Right Side) -->
  <g transform="translate(680, 70)">
    <!-- Connection Lines / Data Streams -->
    <path d="M 80 180 L 220 100 L 360 180 L 220 260 Z" fill="none" stroke="url(#cyanBlue)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,4" filter="url(#glow-subtle)"/>
    <path d="M 80 320 L 220 240 L 360 320 L 220 400 Z" fill="none" stroke="url(#violetFuchsia)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,4"/>
    
    <line x1="220" y1="100" x2="220" y2="240" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
    <line x1="220" y1="260" x2="220" y2="400" stroke="#d946ef" stroke-width="1.5" stroke-opacity="0.3"/>
    <line x1="80" y1="180" x2="80" y2="320" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.3"/>
    <line x1="360" y1="180" x2="360" y2="320" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.3"/>

    <!-- Central Hub Hexagon / Platform Node -->
    <g transform="translate(220, 250)">
      <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#090d16" stroke="url(#cyanBlue)" stroke-width="2.5" filter="url(#glow)"/>
      <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
      <!-- Inner symbol: Digital Product Core -->
      <circle cx="0" cy="0" r="12" fill="url(#violetFuchsia)" filter="url(#glow-subtle)"/>
      <path d="M-5 -2 L0 -8 L5 -2 M0 -8 L0 8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Floating Node 1: Courses & Coaching -->
    <g transform="translate(80, 140)">
      <rect x="-55" y="-30" width="110" height="60" rx="12" fill="url(#cardGrad)" stroke="url(#glassBorder)" stroke-width="1.5" filter="url(#glow-subtle)"/>
      <circle cx="-30" cy="0" r="6" fill="#06b6d4"/>
      <text x="-14" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">COURSES</text>
    </g>

    <!-- Floating Node 2: Digital Downloads -->
    <g transform="translate(360, 140)">
      <rect x="-65" y="-30" width="130" height="60" rx="12" fill="url(#cardGrad)" stroke="url(#glassBorder)" stroke-width="1.5" filter="url(#glow-subtle)"/>
      <circle cx="-40" cy="0" r="6" fill="#38bdf8"/>
      <text x="-24" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">DOWNLOADS</text>
    </g>

    <!-- Floating Node 3: Community Hub -->
    <g transform="translate(80, 360)">
      <rect x="-55" y="-30" width="110" height="60" rx="12" fill="url(#cardGrad)" stroke="url(#glassBorder)" stroke-width="1.5" filter="url(#glow-subtle)"/>
      <circle cx="-30" cy="0" r="6" fill="#8b5cf6"/>
      <text x="-14" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">COMMUNITY</text>
    </g>

    <!-- Floating Node 4: Unified Checkout & Upsells -->
    <g transform="translate(360, 360)">
      <rect x="-55" y="-30" width="110" height="60" rx="12" fill="url(#cardGrad)" stroke="url(#glassBorder)" stroke-width="1.5" filter="url(#glow-subtle)"/>
      <circle cx="-30" cy="0" r="6" fill="#d946ef"/>
      <text x="-14" y="5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">CHECKOUT</text>
    </g>

    <!-- Orbiting Energy Particles -->
    <circle cx="150" cy="100" r="4" fill="#06b6d4" filter="url(#glow)"/>
    <circle cx="290" cy="120" r="3" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="140" cy="300" r="3" fill="#8b5cf6" filter="url(#glow)"/>
    <circle cx="310" cy="330" r="4" fill="#d946ef" filter="url(#glow)"/>
  </g>

  <!-- 3. Left Side: Typography, Dossier Badge, and Narrative -->
  <g transform="translate(80, 95)">
    <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <!-- Glowing status dot -->
      <circle cx="18" cy="17" r="5" fill="#06b6d4" filter="url(#glow)"/>
      <circle cx="18" cy="17" r="3" fill="#38bdf8"/>
      <text x="36" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Title: PODIA -->
    <text x="0" y="115" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" letter-spacing="4" filter="url(#glow-subtle)">PODIA</text>

    <!-- Category Subtitle -->
    <text x="0" y="155" fill="url(#cyanBlue)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="3">CREATOR ECONOMY &amp; DIGITAL PRODUCTS</text>

    <!-- Investigation Title -->
    <text x="0" y="210" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" letter-spacing="0.5">
      <tspan x="0" dy="0">The All-in-One Creator Economy Blueprint</tspan>
      <tspan x="0" dy="36">and the Hands-On Guide to Digital Monetization</tspan>
    </text>

    <!-- Decorative Underline Accent -->
    <rect x="0" y="285" width="460" height="2" fill="url(#cyanBlue)" opacity="0.6"/>
    <rect x="0" y="284" width="120" height="4" fill="#38bdf8" filter="url(#glow)"/>

    <!-- Metadata Footer inside text group -->
    <g transform="translate(0, 315)">
      <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="1">SYSTEM ANALYSIS // STACK v4.8 // SECURE DEPLOYMENT</text>
    </g>
  </g>

  <!-- 4. Frame & Technical Accents (Border Elements) -->
  <g stroke="#1e293b" stroke-width="1" fill="none" opacity="0.6">
    <!-- Top Left Corner Marker -->
    <path d="M 30 50 L 30 30 L 50 30"/>
    <!-- Top Right Corner Marker -->
    <path d="M 1170 50 L 1170 30 L 1150 30"/>
    <!-- Bottom Left Corner Marker -->
    <path d="M 30 580 L 30 600 L 50 600"/>
    <!-- Bottom Right Corner Marker -->
    <path d="M 1170 580 L 1170 600 L 1150 600"/>
  </g>

  <!-- Subtle Brand Signature at Bottom Right -->
  <text x="1170" y="605" text-anchor="end" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="2">HELIATECH.ONLINE</text>
</svg>