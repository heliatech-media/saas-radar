<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#030712" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- UI Window Glass Gradient -->
    <linearGradient id="glass-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Cyberpunk Gradients -->
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="fuchsia-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow & Blur Filters -->
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.5" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Dot Matrix Pattern -->
    <pattern id="dot-matrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#475569" fill-opacity="0.2" />
    </pattern>
  </defs>

  <!-- 1. Background Layer -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />
  <rect width="1200" height="630" fill="url(#cyber-grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="250" fill="#06b6d4" opacity="0.08" filter="url(#glow-heavy)" />
  <circle cx="950" cy="400" r="300" fill="#8b5cf6" opacity="0.1" filter="url(#glow-heavy)" />
  <circle cx="750" cy="150" r="180" fill="#d946ef" opacity="0.06" filter="url(#glow-heavy)" />

  <!-- 2. Neural Network Synapse Lines (Background) -->
  <g opacity="0.4" filter="url(#glow-subtle)">
    <path d="M 650,220 L 780,140 L 980,180" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 4" />
    <path d="M 720,380 L 850,450 L 1020,380" fill="none" stroke="#8b5cf6" stroke-width="1.5" />
    <path d="M 780,140 L 850,280 L 720,380" fill="none" stroke="#d946ef" stroke-width="1" opacity="0.6" />
    <path d="M 850,280 L 1020,250" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 3" />
    
    <!-- Nodes -->
    <circle cx="650" cy="220" r="4" fill="#38bdf8" />
    <circle cx="780" cy="140" r="5" fill="#06b6d4" />
    <circle cx="980" cy="180" r="4" fill="#d946ef" />
    <circle cx="720" cy="380" r="4" fill="#8b5cf6" />
    <circle cx="850" cy="450" r="6" fill="#38bdf8" />
    <circle cx="1020" cy="380" r="4" fill="#06b6d4" />
    <circle cx="850" cy="280" r="7" fill="#d946ef" />
    <circle cx="1020" cy="250" r="5" fill="#8b5cf6" />
  </g>

  <!-- 3. Isometric Code Window / AI IDE Representation -->
  <g filter="url(#drop-shadow)" transform="translate(560, 95)">
    <!-- Outer Glow Aura -->
    <rect x="-10" y="-10" width="600" height="440" rx="16" fill="url(#cyan-violet)" opacity="0.15" filter="url(#glow-heavy)" />

    <!-- Main Window Base -->
    <rect width="580" height="420" rx="12" fill="url(#glass-bg)" stroke="#334155" stroke-width="1.5" />

    <!-- Window Header -->
    <path d="M 0 12 C 0 5.37268 5.37258 0 12 0 L 568 0 C 574.627 0 580 5.37258 580 12 L 580 40 L 0 40 Z" fill="#090d16" />
    <line x1="0" y1="40" x2="580" y2="40" stroke="#1e293b" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="20" cy="20" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="40" cy="20" r="6" fill="#f59e0b" opacity="0.8" />
    <circle cx="60" cy="20" r="6" fill="#10b981" opacity="0.8" />

    <!-- Window Title -->
    <text x="290" y="25" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="1">cursor-ai-engine.tsx</text>

    <!-- AI Active Badge inside IDE -->
    <g transform="translate(435, 12)">
      <rect width="130" height="24" rx="12" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
      <circle cx="15" cy="12" r="4" fill="#06b6d4">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="16" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">AI Copilot Active</text>
    </g>

    <!-- Sidebar / File Tree -->
    <g transform="translate(20, 60)" opacity="0.7">
      <text x="10" y="15" fill="#64748b" font-family="monospace" font-size="10" letter-spacing="0.5">EXPLORER</text>
      <path d="M 10 30 L 18 36 L 10 42" fill="none" stroke="#64748b" stroke-width="1.5" />
      <text x="25" y="39" fill="#cbd5e1" font-family="monospace" font-size="11">src/</text>
      <text x="40" y="60" fill="#38bdf8" font-family="monospace" font-size="11">✦ ai-velocity.ts</text>
      <text x="40" y="85" fill="#94a3b8" font-family="monospace" font-size="11">neural-core.rs</text>
      <text x="40" y="110" fill="#94a3b8" font-family="monospace" font-size="11">index.tsx</text>
      <line x1="0" y1="130" x2="150" y2="130" stroke="#1e293b" stroke-width="1" />
    </g>

    <!-- Code Content & Syntax Highlighting -->
    <g transform="translate(180, 60)" font-family="monospace" font-size="13">
      <!-- Line Numbers -->
      <g fill="#475569" font-size="11" opacity="0.5">
        <text x="0" y="20">1</text>
        <text x="0" y="45">2</text>
        <text x="0" y="70">3</text>
        <text x="0" y="95">4</text>
        <text x="0" y="120">5</text>
        <text x="0" y="145">6</text>
        <text x="0" y="170">7</text>
        <text x="0" y="195">8</text>
        <text x="0" y="220">9</text>
        <text x="0" y="245">10</text>
        <text x="0" y="270">11</text>
        <text x="0" y="295">12</text>
        <text x="0" y="320">13</text>
      </g>

      <!-- Code Lines -->
      <g transform="translate(30, 0)">
        <text y="20"><tspan fill="#c084fc">import</tspan> { <tspan fill="#38bdf8">NeuralEngine</tspan>, <tspan fill="#38bdf8">Velocity</tspan> } <tspan fill="#c084fc">from</tspan> <tspan fill="#a3e635">'@cursor/core'</tspan>;</text>
        <text y="45"><tspan fill="#c084fc">import</tspan> { <tspan fill="#38bdf8">ContextManager</tspan> } <tspan fill="#c084fc">from</tspan> <tspan fill="#a3e635">'./ai-velocity'</tspan>;</text>
        <text y="70" fill="#64748b">// Initialize AI-first workspace with 10x multiplier</text>
        <text y="95"><tspan fill="#f43f5e">const</tspan> <tspan fill="#67e8f9">editor</tspan> = <tspan fill="#c084fc">new</tspan> <tspan fill="#38bdf8">NeuralEngine</tspan>({</text>
        <text y="120" x="20"><tspan fill="#cbd5e1">mode</tspan>: <tspan fill="#a3e635">'autonomous'</tspan>,</text>
        <text y="145" x="20"><tspan fill="#cbd5e1">predictiveEditing</tspan>: <tspan fill="#f43f5e">true</tspan>,</text>
        <text y="170" x="20"><tspan fill="#cbd5e1">codebaseContext</tspan>: <tspan fill="#f43f5e">true</tspan></text>
        <text y="195">});</text>
        <text y="220"></text>
        <text y="245"><tspan fill="#c084fc">async function</tspan> <tspan fill="#67e8f9">accelerateVelocity</tspan>() {</text>
        <text y="270" x="20"><tspan fill="#f43f5e">const</tspan> stream = <tspan fill="#c084fc">await</tspan> editor.<tspan fill="#67e8f9">generateFullStack</tspan>();</text>
        <text y="295" x="20"><tspan fill="#c084fc">return</tspan> stream.<tspan fill="#67e8f9">deploy</tspan>();</text>
        <text y="320">}</text>
      </g>
    </g>

    <!-- AI Floating Suggestion Box (Simulating Cursor's inline diff / tab-complete) -->
    <g transform="translate(180, 260)" filter="url(#glow-subtle)">
      <rect x="30" y="60" width="310" height="55" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1.5" />
      <path d="M 45 75 L 60 75" stroke="#38bdf8" stroke-width="2" />
      <text x="70" y="79" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">Cursor Tab Suggestion</text>
      <text x="45" y="100" fill="#94a3b8" font-family="monospace" font-size="11">Optimized via Claude 3.5 Sonnet</text>
      <!-- Glowing Tab Key Badge -->
      <rect x="280" y="70" width="45" height="20" rx="4" fill="#06b6d4" fill-opacity="0.3" stroke="#06b6d4" stroke-width="1" />
      <text x="302" y="84" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">TAB</text>
    </g>
  </g>

  <!-- 4. Typography & Branding (Left Side) -->
  <g transform="translate(80, 0)">
    
    <!-- Enterprise Badge -->
    <g transform="translate(0, 115)">
      <rect width="250" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <!-- Pulsing Dot -->
      <circle cx="20" cy="16" r="5" fill="#06b6d4" />
      <circle cx="20" cy="16" r="9" fill="#06b6d4" opacity="0.3">
        <animate attributeName="r" values="5;12;5" dur="3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite" />
      </circle>
      <text x="40" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2">HELIATECH INTELLIGENCE</text>
    </g>

    <!-- Main Title: CURSOR: THE AI IDE REVOLUTION -->
    <g transform="translate(0, 185)">
      <text x="0" y="0">
        <tspan x="0" dy="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">CURSOR</tspan>
        <tspan x="205" dy="0" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900">:</tspan>
      </text>
      <text x="0" y="62" fill="url(#text-grad)" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">THE AI IDE</text>
      <text x="0" y="118" fill="url(#text-grad)" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">REVOLUTION</text>
    </g>

    <!-- Subtitle / Value Prop -->
    <g transform="translate(0, 340)">
      <text x="0" y="0" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" line-height="1.5">
        <tspan x="0" dy="0">Reinventing software creation with an AI-first code</tspan>
        <tspan x="0" dy="28">editor built for maximum developer velocity.</tspan>
      </text>
    </g>

    <!-- Feature Pills / Tech Stack Tags -->
    <g transform="translate(0, 420)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="65" y="22" fill="#38bdf8" font-family="monospace" font-size="12" text-anchor="middle">Context Aware</text>

      <!-- Pill 2 -->
      <rect x="145" y="0" width="130" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="210" y="22" fill="#d946ef" font-family="monospace" font-size="12" text-anchor="middle">Multi-File AI</text>

      <!-- Pill 3 -->
      <rect x="290" y="0" width="135" height="34" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="357" y="22" fill="#10b981" font-family="monospace" font-size="12" text-anchor="middle">10x Velocity</text>
    </g>

  </g>

  <!-- 5. Futuristic UI Decorative Accents & Borders -->
  <!-- Top Left Corner Mark -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" />
  <!-- Bottom Right Corner Mark -->
  <path d="M 1180 590 L 1180 610 L 1160 610" fill="none" stroke="#d946ef" stroke-width="2" opacity="0.6" />
  
  <!-- Subtle Bottom Edge Glow Line -->
  <line x1="0" y1="628" x2="1200" y2="628" stroke="url(#cyan-violet)" stroke-width="3" filter="url(#glow-heavy)" opacity="0.8" />
</svg>