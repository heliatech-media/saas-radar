<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bgGlow" cx="60%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <linearGradient id="nodePulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowIntense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Patterns -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#334155" />
    </pattern>

    <pattern id="dotMatrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64748b" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#cyberGrid)" />
  <rect width="1200" height="630" fill="url(#dotMatrix)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="150" r="250" fill="#8b5cf6" opacity="0.15" filter="url(#glowIntense)" />
  <circle cx="850" cy="480" r="200" fill="#06b6d4" opacity="0.12" filter="url(#glowIntense)" />
  <circle cx="200" cy="500" r="180" fill="#d946ef" opacity="0.08" filter="url(#glowIntense)" />

  <!-- Abstract Vector Neural Paths (Background) -->
  <g opacity="0.4" fill="none">
    <path d="M50 150 C 250 150, 300 300, 450 250 S 650 100, 850 200" stroke="url(#cyanGrad)" stroke-width="1.5" />
    <path d="M100 450 C 300 450, 400 350, 550 400 S 750 500, 950 350" stroke="url(#primaryGrad)" stroke-width="1.5" />
    <path d="M300 100 L 450 250 L 550 400 L 800 150" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- RIGHT SIDE: 3D Isometric AI Code & AST Architecture Engine -->
  <g transform="translate(620, 70)">
    <!-- Main Floating IDE Hologram Frame -->
    <g filter="url(#glow)">
      <polygon points="0,80 260,0 520,80 520,420 260,500 0,420" fill="#090d16" stroke="#334155" stroke-width="1.5" opacity="0.9" />
    </g>
    
    <!-- Hologram Glass Surface -->
    <polygon points="10,90 260,15 510,90 510,410 260,485 10,410" fill="url(#glassGrad)" stroke="url(#primaryGrad)" stroke-width="2" />

    <!-- Isometric Grid Planes inside IDE -->
    <g opacity="0.2" stroke="#38bdf8" stroke-width="0.5">
      <line x1="260" y1="15" x2="260" y2="485" />
      <line x1="10" y1="250" x2="510" y2="250" />
      <line x1="80" y1="100" x2="440" y2="380" />
      <line x1="80" y1="380" x2="440" y2="100" />
    </g>

    <!-- Floating Neural Nodes & Code AST Elements -->
    <g transform="translate(60, 80)">
      <!-- Code Window Header Bar -->
      <rect x="0" y="0" width="390" height="30" rx="6" fill="#030712" stroke="#1e293b" />
      <circle cx="15" cy="15" r="4" fill="#ef4444" />
      <circle cx="30" cy="15" r="4" fill="#f59e0b" />
      <circle cx="45" cy="15" r="4" fill="#10b981" />
      <text x="70" y="20" fill="#94a3b8" font-family="monospace" font-size="10" letter-spacing="1">lovable.tsx — AI React Core</text>

      <!-- Syntax Glowing Code Lines -->
      <g font-family="monospace" font-size="12">
        <text x="20" y="60" fill="#f472b6">import <span style="fill:#38bdf8">React</span>, &#123; <span style="fill:#fb7185">useState</span> &#125; from <span style="fill:#a3e635">'react'</span>;</text>
        <text x="20" y="85" fill="#c084fc">const <span style="fill:#67e8f9">LovableEngine</span> = () =&gt; &#123;</text>
        <text x="40" y="110" fill="#f472b6">  const <span style="fill:#cbd5e1">[intent, setIntent]</span> = <span style="fill:#38bdf8">useState</span>(<span style="fill:#a3e635">'Enterprise'</span>);</text>
        <text x="40" y="135" fill="#f472b6">  const <span style="fill:#cbd5e1">[ast, renderNode]</span> = <span style="fill:#38bdf8">useNeuralMesh</span>(&#123; intent &#125;);</text>
        
        <!-- Highlight block -->
        <rect x="30" y="150" width="330" height="30" rx="4" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="0.8" />
        <text x="40" y="170" fill="#38bdf8">  &lt;<span style="fill:#f472b6">EnterpriseBlueprint</span> <span style="fill:#c084fc">velocity</span>=<span style="fill:#a3e635">"10x"</span>&gt;</text>
        
        <text x="60" y="195" fill="#cbd5e1">    &lt;<span style="fill:#f472b6">AutonomousDOM</span> tree=&#123;ast&#125; /&gt;</text>
        <text x="40" y="220" fill="#38bdf8">  &lt;/<span style="fill:#f472b6">EnterpriseBlueprint</span>&gt;</text>
        <text x="20" y="245" fill="#c084fc">&#125;;</text>
        <text x="20" y="270" fill="#f472b6">export default <span style="fill:#67e8f9">LovableEngine</span>;</text>
      </g>

      <!-- Floating Vector Embeddings / Connected Nodes -->
      <g transform="translate(290, 150)">
        <circle cx="0" cy="0" r="28" fill="url(#nodePulse)" filter="url(#glow)" />
        <circle cx="0" cy="0" r="15" fill="#090d16" stroke="#8b5cf6" stroke-width="2" />
        <path d="M-6 -2 L0 -10 L6 -2 M0 -10 L0 10" stroke="#38bdf8" stroke-width="2" fill="none" />
        <!-- Pulse rings -->
        <circle cx="0" cy="0" r="38" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3 3" opacity="0.6">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite" />
        </circle>
      </g>
    </g>

    <!-- Floating Connection Nodes to Outside World -->
    <g transform="translate(420, 390)">
      <line x1="0" y1="0" x2="80" y2="40" stroke="#d946ef" stroke-width="2" filter="url(#glow)" />
      <circle cx="80" cy="40" r="8" fill="#d946ef" filter="url(#glow)" />
      <circle cx="80" cy="40" r="14" fill="none" stroke="#d946ef" stroke-width="1" opacity="0.6" />
    </g>
    <g transform="translate(80, 50)">
      <line x1="0" y1="0" x2="-60" y2="-30" stroke="#06b6d4" stroke-width="2" filter="url(#glow)" />
      <circle cx="-60" cy="-30" r="6" fill="#06b6d4" filter="url(#glow)" />
    </g>
  </g>

  <!-- LEFT SIDE: Typography, Dossier Pill & Architectural Hierarchy -->
  <g transform="translate(80, 80)">
    
    <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <circle cx="20" cy="17" r="5" fill="#06b6d4" filter="url(#glow)" />
      <circle cx="20" cy="17" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="38" y="22" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Tool Title: LOVABLE -->
    <g transform="translate(0, 85)">
      <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" letter-spacing="4" filter="url(#glow)">LOVABLE</text>
      <!-- Gradient overlay text for high fidelity -->
      <text x="0" y="0" fill="url(#primaryGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="900" letter-spacing="4">LOVABLE</text>
    </g>

    <!-- Category Subtitle -->
    <g transform="translate(3, 125)">
      <text x="0" y="0" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" letter-spacing="3">AI DEVELOPMENT &amp; REACT ENGINEERING</text>
    </g>

    <!-- Headline Investigation Title -->
    <g transform="translate(3, 175)">
      <text x="0" y="0" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" letter-spacing="0.5">The Genesis of AI-Driven React Engineering</text>
      <text x="0" y="32" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">and the Enterprise Blueprint for Rapid Application Development</text>
    </g>

    <!-- Technical Specs / Metadata Footer -->
    <g transform="translate(0, 310)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#1e293b" stroke-width="2" />
      
      <!-- Meta Item 1 -->
      <g transform="translate(0, 20)">
        <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="10" letter-spacing="1">PARADIGM</text>
        <text x="0" y="18" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Autonomous AST Generation</text>
      </g>

      <!-- Meta Item 2 -->
      <g transform="translate(180, 20)">
        <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="10" letter-spacing="1">VELOCITY MULTIPLIER</text>
        <text x="0" y="18" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">10x Enterprise Delivery</text>
      </g>

      <!-- Meta Item 3 -->
      <g transform="translate(360, 20)">
        <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="10" letter-spacing="1">SECURITY</text>
        <text x="0" y="18" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="600">SOC2 Type II Ready</text>
      </g>
    </g>

  </g>

  <!-- Decorative Corner Framing Accents -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6">
    <!-- Top Left -->
    <path d="M 20 40 L 20 20 L 40 20" />
    <!-- Top Right -->
    <path d="M 1180 40 L 1180 20 L 1160 20" />
    <!-- Bottom Left -->
    <path d="M 20 590 L 20 610 L 40 610" />
    <!-- Bottom Right -->
    <path d="M 1180 590 L 1180 610 L 1160 610" />
  </g>

  <!-- Subtle Brand Signature at Bottom Edge -->
  <text x="600" y="605" fill="#475569" font-family="monospace" font-size="10" letter-spacing="3" text-anchor="middle">HELIATECH.ONLINE — ENTERPRISE SOFTWARE INVESTIGATION</text>
</svg>