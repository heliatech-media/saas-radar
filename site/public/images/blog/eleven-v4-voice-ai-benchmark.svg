<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#090d1a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <radialGradient id="ambient-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="magenta-orb" cx="80%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#ambient-glow)"/>
  <rect width="1200" height="630" fill="url(#magenta-orb)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Sound Waveform Graphic Representation -->
  <g transform="translate(680, 160)" opacity="0.85">
    <rect x="0" y="70" width="8" height="60" rx="4" fill="#06b6d4" opacity="0.4"/>
    <rect x="18" y="50" width="8" height="100" rx="4" fill="#06b6d4" opacity="0.6"/>
    <rect x="36" y="30" width="8" height="140" rx="4" fill="#38bdf8" opacity="0.8"/>
    <rect x="54" y="10" width="8" height="180" rx="4" fill="#38bdf8"/>
    <rect x="72" y="45" width="8" height="110" rx="4" fill="#60a5fa"/>
    <rect x="90" y="20" width="8" height="160" rx="4" fill="#818cf8"/>
    <rect x="108" y="0" width="8" height="200" rx="4" fill="#a78bfa" filter="url(#glow-blur)"/>
    <rect x="126" y="25" width="8" height="150" rx="4" fill="#818cf8"/>
    <rect x="144" y="60" width="8" height="80" rx="4" fill="#60a5fa"/>
    <rect x="162" y="15" width="8" height="170" rx="4" fill="#38bdf8"/>
    <rect x="180" y="40" width="8" height="120" rx="4" fill="#06b6d4"/>
    <rect x="198" y="65" width="8" height="70" rx="4" fill="#06b6d4" opacity="0.6"/>
    <rect x="216" y="80" width="8" height="40" rx="4" fill="#06b6d4" opacity="0.3"/>

    <!-- Glowing Latency Indicator Card -->
    <rect x="250" y="30" width="180" height="140" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="270" y="65" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1">STREAMING LATENCY</text>
    <text x="270" y="115" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="38" font-weight="900" fill="#10b981">85 ms</text>
    <text x="270" y="145" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8">SUB-100MS BREAKTHROUGH</text>
  </g>

  <!-- Left Content Block -->
  <g transform="translate(90, 100)">
    <!-- Top Meta Badges -->
    <g>
      <rect x="0" y="0" width="165" height="30" rx="15" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
      <text x="82" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#22d3ee" text-anchor="middle" letter-spacing="1">HELIATECH LABS</text>

      <rect x="175" y="0" width="190" height="30" rx="15" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <text x="270" y="19" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1">OFFICIAL BENCHMARK</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="-1">
      ELEVENLABS
    </text>
    <text x="0" y="145" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="900" fill="url(#cyber-cyan)" letter-spacing="-1.5">
      ELEVEN v4 DEEP DIVE
    </text>

    <!-- Subtitle -->
    <text x="0" y="200" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
      Real-Time Voice Architecture, Emotional Prosody &amp; Sub-100ms Latency
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 245)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="175" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#38bdf8">⚡ 85ms Latency</text>

      <!-- Pill 2 -->
      <rect x="185" y="0" width="185" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="205" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#10b981">🎭 Emotional Prosody</text>

      <!-- Pill 3 -->
      <rect x="380" y="0" width="175" height="42" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="400" y="26" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#ec4899">🌐 32 Languages</text>
    </g>

    <!-- Bottom Footer Credibility Line -->
    <g transform="translate(0, 360)">
      <line x1="0" y1="0" x2="1020" y2="0" stroke="#1e293b" stroke-width="1"/>
      <circle cx="8" cy="30" r="4" fill="#06b6d4"/>
      <text x="24" y="34" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#64748b" letter-spacing="1.5">
        HELIATECH.ONLINE • INDEPENDENT INVESTIGATION &amp; VERIFIED CAMPAIGN COMPLIANT
      </text>
      <text x="1020" y="34" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#10b981" text-anchor="end">
        SCORE: 9.9/10
      </text>
    </g>
  </g>
</svg>