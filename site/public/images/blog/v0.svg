<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bgGlow" cx="600" cy="315" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="1"/>
      <stop offset="50%" stop-color="#070b14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#020408" stop-opacity="1"/>
    </radialGradient>
    
    <linearGradient id="gridGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Neon & UI Gradients -->
    <linearGradient id="cyanViolet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="fuchsiaViolet" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="badgeFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-intense" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pattern for Grid Background -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="url(#gridGrad)" stroke-width="1"/>
    </pattern>

    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect width="1200" height="630" fill="url(#gridPattern)"/>
  <rect width="1200" height="630" fill="url(#dotPattern)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="150" r="250" fill="#8b5cf6" opacity="0.12" filter="url(#glow-intense)"/>
  <circle cx="800" cy="450" r="300" fill="#06b6d4" opacity="0.1" filter="url(#glow-intense)"/>
  <circle cx="200" cy="500" r="200" fill="#d946ef" opacity="0.08" filter="url(#glow-intense)"/>

  <!-- HELIA TECH Brand Watermark / Accent Lines -->
  <g opacity="0.4">
    <path d="M 60 80 L 120 80 L 140 100" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 1140 550 L 1080 550 L 1060 530" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="60" y="585" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="4">HELIATECH.ONLINE // 2025</text>
  </g>

  <!-- TOP PILL BADGE -->
  <g transform="translate(60, 55)">
    <rect x="0" y="0" width="310" height="32" rx="16" fill="url(#badgeFill)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="18" cy="16" r="4" fill="#06b6d4" filter="url(#glow-cyan)"/>
    <circle cx="18" cy="16" r="2" fill="#ffffff"/>
    <text x="36" y="21" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- MAIN TYPOGRAPHY SECTION -->
  <g transform="translate(60, 130)">
    <!-- Category Subtitle -->
    <text x="0" y="0" fill="url(#cyanViolet)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" letter-spacing="3">AI DEVELOPMENT &amp; FRONTEND GENERATION</text>
    
    <!-- Title: v0 -->
    <text x="0" y="65" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">v0</text>
    <circle cx="82" cy="30" r="6" fill="#d946ef" filter="url(#glow-cyan)"/>

    <!-- Main Investigation Title wrapped neatly -->
    <text x="0" y="110" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5">
      <tspan x="0" dy="0">The Evolution of Generative UIs</tspan>
      <tspan x="0" dy="36">and the 15-Minute Blueprint to Frontend Velocity</tspan>
    </text>

    <!-- Key Metrics / Metadata -->
    <g transform="translate(0, 185)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="130" height="65" rx="8" fill="#0b1329" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="15" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">15m</text>
      <text x="15" y="46" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">PROTOTYPE CYCLE</text>

      <!-- Metric 2 -->
      <rect x="145" y="0" width="130" height="65" rx="8" fill="#0b1329" stroke="#8b5cf6" stroke-opacity="0.3"/>
      <text x="160" y="26" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">AST+JSX</text>
      <text x="160" y="46" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">VECTOR PARSING</text>

      <!-- Metric 3 -->
      <rect x="290" y="0" width="130" height="65" rx="8" fill="#0b1329" stroke="#d946ef" stroke-opacity="0.3"/>
      <text x="305" y="26" fill="#ec4899" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">99.4%</text>
      <text x="305" y="46" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">RENDER FIDELITY</text>
    </g>
  </g>

  <!-- 3D VECTOR ILLUSTRATION: ISOMETRIC GENERATIVE IDE & UI MATRIX (Right Side) -->
  <g transform="translate(680, 70)">
    <!-- Connecting neural lines from text to IDE -->
    <path d="M -130 180 L -30 180" fill="none" stroke="url(#cyanViolet)" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="-30" cy="180" r="3" fill="#38bdf8"/>

    <!-- Main IDE Window Container -->
    <g filter="url(#glow-intense)">
      <!-- Outer holographic projection frame -->
      <polygon points="40,20 440,-40 480,380 80,440" fill="#030712" fill-opacity="0.4" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1"/>
    </g>

    <!-- Isometric IDE Shell -->
    <g transform="translate(60, 10) rotate(-4) skewX(12)">
      
      <!-- IDE Window Base -->
      <rect x="0" y="0" width="420" height="340" rx="12" fill="url(#glassFill)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>

      <!-- Window Title Bar -->
      <path d="M 0 12 C 0 5 5 0 12 0 L 408 0 C 415 0 420 5 420 12 L 420 40 L 0 40 Z" fill="#090d1a" stroke="#38bdf8" stroke-opacity="0.3"/>
      <circle cx="20" cy="20" r="5" fill="#ef4444" opacity="0.8"/>
      <circle cx="38" cy="20" r="5" fill="#f59e0b" opacity="0.8"/>
      <circle cx="56" cy="20" r="5" fill="#10b981" opacity="0.8"/>
      
      <!-- Window Title Text -->
      <text x="80" y="24" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">v0-generator.tsx — enterprise-cluster</text>

      <!-- IDE Code / AST Syntax Lines -->
      <g transform="translate(20, 60)" font-family="monospace" font-size="11">
        <!-- Line numbers -->
        <g fill="#334155">
          <text x="0" y="0">01</text>
          <text x="0" y="20">02</text>
          <text x="0" y="40">03</text>
          <text x="0" y="60">04</text>
          <text x="0" y="80">05</text>
          <text x="0" y="100">06</text>
          <text x="0" y="120">07</text>
          <text x="0" y="140">08</text>
          <text x="0" y="160">09</text>
          <text x="0" y="180">10</text>
          <text x="0" y="200">11</text>
          <text x="0" y="220">12</text>
        </g>

        <!-- Code Content -->
        <g transform="translate(35, 0)">
          <text x="0" y="0"><tspan fill="#c084fc">import</tspan> { <tspan fill="#38bdf8">NeuralMesh</tspan> } <tspan fill="#c084fc">from</tspan> <tspan fill="#34d399">'@helia/ai'</tspan>;</text>
          <text x="0" y="20"><tspan fill="#c084fc">import</tspan> { <tspan fill="#38bdf8">VelocityUI</tspan> } <tspan fill="#c084fc">from</tspan> <tspan fill="#34d399">'@v0/core'</tspan>;</text>
          <text x="0" y="40" fill="#64748b">// Synthesizing component vector embeddings</text>
          <text x="0" y="60"><tspan fill="#f472b6">export</tspan> <tspan fill="#c084fc">async function</tspan> <tspan fill="#60a5fa">EnterpriseDashboard</tspan>() {</text>
          <text x="0" y="80">  <tspan fill="#c084fc">const</tspan> stream = <tspan fill="#c084fc">await</tspan> <tspan fill="#38bdf8">VelocityUI</tspan>.<tspan fill="#60a5fa">generate</tspan>({</text>
            <text x="0" y="100">    prompt: <tspan fill="#34d399">"High-frequency data matrix"</tspan>,</text>
            <text x="0" y="120">    latencyTarget: <tspan fill="#fbbf24">15</tspan>, <tspan fill="#64748b">// minutes</tspan></text>
            <text x="0" y="140">    theme: <tspan fill="#34d399">"cyber-dark-luxury"</tspan></text>
          <text x="0" y="160">  });</text>
          <text x="0" y="180">  <tspan fill="#c084fc">return</tspan> &lt;<tspan fill="#38bdf8">NeuralMesh</tspan> data={stream} /&gt;;</text>
          <text x="0" y="200">}</text>
        </g>
      </g>

      <!-- Floating Holographic UI Preview Card (Overlay) -->
      <g transform="translate(180, 140)" filter="url(#glow-cyan)">
        <rect x="0" y="0" width="220" height="150" rx="8" fill="#030712" fill-opacity="0.95" stroke="url(#fuchsiaViolet)" stroke-width="2"/>
        <!-- Preview Header -->
        <rect x="12" y="12" width="60" height="10" rx="3" fill="#d946ef" opacity="0.8"/>
        <rect x="80" y="12" width="128" height="6" rx="2" fill="#334155"/>
        <rect x="80" y="22" width="90" height="6" rx="2" fill="#334155"/>
        
        <!-- Mini chart bars -->
        <g transform="translate(16, 45)">
          <rect x="0" y="30" width="24" height="40" rx="3" fill="url(#cyanViolet)"/>
          <rect x="34" y="15" width="24" height="55" rx="3" fill="url(#cyanViolet)"/>
          <rect x="68" y="5" width="24" height="65" rx="3" fill="url(#fuchsiaViolet)"/>
          <rect x="102" y="20" width="24" height="50" rx="3" fill="url(#cyanViolet)"/>
          <rect x="136" y="10" width="24" height="60" rx="3" fill="url(#fuchsiaViolet)"/>
          
          <!-- Waveform sparkline -->
          <path d="M 0 35 Q 40 5, 80 25 T 160 10" fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow-cyan)"/>
        </g>
      </g>
    </g>

    <!-- Floating Node / AST Vector Dots around IDE -->
    <g>
      <!-- Node 1 -->
      <g transform="translate(40, 100)">
        <circle cx="0" cy="0" r="6" fill="#06b6d4" filter="url(#glow-cyan)"/>
        <circle cx="0" cy="0" r="2" fill="#ffffff"/>
        <line x1="0" y1="0" x2="40" y2="-20" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
        <rect x="45" y="-32" width="70" height="20" rx="4" fill="#090d16" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5"/>
        <text x="53" y="-18" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">AST_PARSER</text>
      </g>

      <!-- Node 2 -->
      <g transform="translate(480, 280)">
        <circle cx="0" cy="0" r="6" fill="#d946ef" filter="url(#glow-cyan)"/>
        <circle cx="0" cy="0" r="2" fill="#ffffff"/>
        <line x1="0" y1="0" x2="-40" y2="30" stroke="#d946ef" stroke-width="1" opacity="0.5"/>
        <rect x="-115" y="20" width="70" height="20" rx="4" fill="#090d16" stroke="#d946ef" stroke-width="1" stroke-opacity="0.5"/>
        <text x="-107" y="34" fill="#f472b6" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">UI_SYNTHESIS</text>
      </g>
    </g>

  </g>
</svg>