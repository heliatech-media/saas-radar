<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background &amp; Base Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070913" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="fuchsiaViolet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowHeavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur1" />
      <feGaussianBlur stdDeviation="10" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8b5cf6" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />
  <rect width="1200" height="630" fill="url(#cyberGrid)" />
  <rect width="1200" height="630" fill="url(#dotGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="150" r="250" fill="#06b6d4" opacity="0.1" filter="url(#glowHeavy)" />
  <circle cx="800" cy="450" r="280" fill="#8b5cf6" opacity="0.12" filter="url(#glowHeavy)" />
  <circle cx="200" cy="500" r="200" fill="#d946ef" opacity="0.08" filter="url(#glowHeavy)" />

  <!-- ==================== 3D VECTOR GRAPH / CRM METAPHOR ==================== -->
  <g transform="translate(680, 80)">
    <!-- Connecting Infrastructure Web / Vectors -->
    <path d="M 60 220 L 180 120 L 320 180 L 240 340 Z" fill="none" stroke="url(#cyanPurple)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <path d="M 180 120 L 380 60 L 440 200 L 320 180" fill="none" stroke="url(#fuchsiaViolet)" stroke-width="1.5" stroke-opacity="0.3" />
    <path d="M 240 340 L 320 180 L 440 380 L 280 440 Z" fill="none" stroke="url(#cyanPurple)" stroke-width="1.5" stroke-opacity="0.25" />

    <!-- Isometric Data Node 1 (Enterprise Lead) -->
    <g transform="translate(140, 80)">
      <polygon points="0,30 50,0 100,30 50,60" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <polygon points="0,30 50,60 50,110 0,80" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" opacity="0.8" />
      <polygon points="100,30 50,60 50,110 100,80" fill="#070913" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
      <circle cx="50" cy="60" r="6" fill="#06b6d4" filter="url(#glow)" />
    </g>

    <!-- Isometric Data Node 2 (Verified Contact Intelligence) -->
    <g transform="translate(320, 30)">
      <polygon points="0,35 60,0 120,35 60,70" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" />
      <polygon points="0,35 60,70 60,130 0,95" fill="#090d16" stroke="#8b5cf6" stroke-width="1.5" />
      <polygon points="120,35 60,70 60,130 120,95" fill="#070913" stroke="#8b5cf6" stroke-width="1.5" />
      <!-- Glowing Core -->
      <circle cx="60" cy="70" r="8" fill="#d946ef" filter="url(#glow)" />
      <path d="M 50 70 L 57 77 L 70 63" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Isometric Data Node 3 (High-Velocity Revenue Node) -->
    <g transform="translate(200, 300)">
      <polygon points="0,30 55,0 110,30 55,60" fill="#0f172a" stroke="#d946ef" stroke-width="2" />
      <polygon points="0,30 55,60 55,120 0,90" fill="#090d16" stroke="#d946ef" stroke-width="1.5" />
      <polygon points="110,30 55,60 55,120 110,90" fill="#070913" stroke="#d946ef" stroke-width="1.5" />
      <circle cx="55" cy="60" r="6" fill="#38bdf8" filter="url(#glow)" />
    </g>

    <!-- Floating Holographic Analytics Card -->
    <g transform="translate(60, 200)" filter="url(#glow)">
      <rect width="180" height="90" rx="12" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1" />
      <!-- Mini Chart Bars -->
      <rect x="20" y="55" width="16" height="25" rx="3" fill="#06b6d4" opacity="0.8" />
      <rect x="46" y="35" width="16" height="45" rx="3" fill="#38bdf8" opacity="0.9" />
      <rect x="72" y="20" width="16" height="60" rx="3" fill="#8b5cf6" />
      <rect x="98" y="40" width="16" height="40" rx="3" fill="#d946ef" opacity="0.85" />
      <!-- Trend Line -->
      <path d="M 28 45 Q 55 15 80 30 T 130 15" fill="none" stroke="#ffffff" stroke-width="2" />
      <!-- Data Tag -->
      <text x="125" y="72" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">+99.4%</text>
    </g>

    <!-- Floating Target / Prospecting Ring -->
    <g transform="translate(365, 230)">
      <circle cx="40" cy="40" r="35" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6 4" opacity="0.6">
        <animateTransform attributeName="transform" type="rotate" from="0 40 40" to="360 40 40" dur="20s" repeatCount="indefinite" />
      </circle>
      <circle cx="40" cy="40" r="25" fill="none" stroke="#d946ef" stroke-width="1.5" opacity="0.8">
        <animateTransform attributeName="transform" type="rotate" from="360 40 40" to="0 40 40" dur="15s" repeatCount="indefinite" />
      </circle>
      <circle cx="40" cy="40" r="6" fill="url(#cyanPurple)" filter="url(#glow)" />
    </g>
  </g>

  <!-- ==================== TYPOGRAPHY &amp; BRANDING ==================== -->
  
  <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
  <g transform="translate(80, 80)">
    <rect width="310" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="20" cy="17" r="4" fill="#06b6d4" filter="url(#glow)" />
    <text x="36" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2">HELIATECH DOSSIER</text>
  </g>

  <!-- Main Title &amp; Category -->
  <g transform="translate(80, 160)">
    <!-- Category Subtitle -->
    <text x="0" y="0" fill="url(#cyanPurple)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="3.5">B2B SALES INTELLIGENCE</text>
    
    <!-- Tool Name: LUSHA -->
    <text x="0" y="75" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" letter-spacing="4">LUSHA</text>
    <circle cx="275" cy="52" r="8" fill="#d946ef" filter="url(#glow)" />

    <!-- Article Main Investigation Title -->
    <text x="0" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600">The Evolution of B2B Sales Intelligence and</text>
    <text x="0" y="155" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600">the Masterclass Guide to High-Velocity Prospecting</text>
  </g>

  <!-- ==================== FOOTER METADATA ==================== -->
  <g transform="translate(80, 530)">
    <!-- Divider Line -->
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#334155" stroke-width="1" stroke-opacity="0.5" />
    
    <!-- Left Metadata -->
    <text x="0" y="30" fill="#64748b" font-family="monospace" font-size="12" font-weight="600" letter-spacing="1">ARCHITECTURAL ANALYSIS // V4.8</text>
    
    <!-- Right Metadata / Brand Domain -->
    <text x="1040" y="30" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700" text-anchor="end" letter-spacing="1.5">HELIATECH.ONLINE</text>

    <!-- Pulsing Live Indicator -->
    <circle cx="895" cy="26" r="3" fill="#06b6d4" filter="url(#glow)" />
    <text x="910" y="30" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="1">VERIFIED SYSTEM</text>
  </g>
</svg>