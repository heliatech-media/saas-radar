<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#070b19"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <filter id="glow-fuchsia" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur"/>
    </filter>

    <!-- Ambient Radial Gradients -->
    <radialGradient id="amb-cyan" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="amb-fuchsia" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="amb-violet" cx="70%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Accents -->
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="fuchsia-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <!-- UI Glass Panel Gradient -->
    <linearGradient id="glass-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Ambient Lighting Orbs -->
  <rect width="1200" height="630" fill="url(#amb-cyan)"/>
  <rect width="1200" height="630" fill="url(#amb-fuchsia)"/>
  <rect width="1200" height="630" fill="url(#amb-violet)"/>

  <!-- Geometric Grid Overlay -->
  <rect width="1200" height="630" fill="url(#grid-pattern)"/>

  <!-- Subtle Horizon Glow Line -->
  <path d="M 0 315 L 1200 315" stroke="url(#cyan-violet)" stroke-width="1" stroke-opacity="0.15" filter="url(#soft-glow)"/>

  <!-- ==================== BACKGROUND DECORATIVE VECTOR FIELD ==================== -->
  <g opacity="0.35">
    <!-- Abstract neural connections / video timeline curves -->
    <path d="M 100,500 C 300,500 250,200 500,250 C 750,300 700,100 1100,150" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="6 6"/>
    <path d="M 50,150 C 350,100 450,450 750,400 C 1050,350 950,550 1150,500" fill="none" stroke="#d946ef" stroke-width="1.5"/>
    <path d="M 200,80 C 400,300 600,100 900,450" fill="none" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.6"/>
  </g>

  <!-- ==================== RIGHT SIDE: 3D AI MEDIA / VIDEO METAPHOR ==================== -->
  <g transform="translate(680, 80)">
    <!-- Holographic Platform Shadow -->
    <ellipse cx="220" cy="460" rx="180" ry="45" fill="#0284c7" fill-opacity="0.15" filter="url(#soft-glow)"/>

    <!-- 3D Isometric UI Frame (Klap AI Video Engine) -->
    <g transform="translate(0, 20)">
      <!-- Main Glass Box -->
      <path d="M 40,40 L 380,0 L 420,380 L 80,420 Z" fill="url(#glass-panel)" stroke="url(#glass-border)" stroke-width="2"/>
      
      <!-- Inner Grid / Content Plane -->
      <g transform="translate(60, 60)" opacity="0.85">
        <!-- AI Neural Render Timeline Tracks -->
        <rect x="0" y="0" width="320" height="300" fill="#030712" rx="12" stroke="#1e293b" stroke-width="1"/>
        
        <!-- Timeline Header -->
        <circle cx="20" cy="20" r="5" fill="#ef4444"/>
        <circle cx="38" cy="20" r="5" fill="#f59e0b"/>
        <circle cx="56" cy="20" r="5" fill="#10b981"/>
        <text x="80" y="24" fill="#94a3b8" font-family="monospace" font-size="11" letter-spacing="1">KLAP_NEURAL_RENDER.ai</text>
        <line x1="15" y1="35" x2="305" y2="35" stroke="#1e293b" stroke-width="1"/>

        <!-- Audio/Video Waveform Nodes -->
        <g transform="translate(20, 50)">
          <!-- Track 1: Original Long-form Video Stream -->
          <text x="0" y="15" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">SOURCE: 60M_LONGFORM.mp4</text>
          <rect x="0" y="25" width="260" height="24" rx="4" fill="#1e293b" fill-opacity="0.6"/>
          <path d="M 5,37 Q 30,25 55,37 T 105,37 T 155,37 T 205,37 T 255,37" fill="none" stroke="#38bdf8" stroke-width="2"/>

          <!-- AI Extraction Bracket (15-Minute Blueprint) -->
          <rect x="70" y="20" width="90" height="34" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 2"/>
          <text x="75" y="15" fill="#06b6d4" font-family="sans-serif" font-size="9" font-weight="bold">VIRAL CLIP #1</text>

          <!-- Track 2: AI Analyzed Vector Embeddings & Emotion Peaks -->
          <text x="0" y="75" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="600">AI VIRALITY SCORING (98.4%)</text>
          <g transform="translate(0, 85)">
            <rect x="0" y="0" width="260" height="40" rx="4" fill="#0f172a" stroke="#8b5cf6" stroke-width="0.75"/>
            <!-- Waveform spikes -->
            <path d="M 10,30 L 10,15 L 20,30 L 30,8 L 40,30 L 50,22 L 60,30 L 70,5 L 80,30 L 90,12 L 100,30 L 110,2 L 120,30 L 130,18 L 140,30 L 150,10 L 160,30 L 170,25 L 180,30 L 190,14 L 200,30 L 210,20 L 220,30 L 230,12 L 240,30 L 250,22" fill="none" stroke="#d946ef" stroke-width="1.5" filter="url(#glow-fuchsia)"/>
          </g>

          <!-- Output Shorts Grid Preview Inside UI -->
          <g transform="translate(0, 140)">
            <rect x="0" y="0" width="75" height="95" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
            <text x="12" y="52" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">9:16 SHRT</text>
            
            <rect x="85" y="0" width="75" height="95" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
            <text x="97" y="52" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="bold">AUTO-CAP</text>

            <rect x="170" y="0" width="90" height="95" rx="6" fill="url(#cyan-violet)" fill-opacity="0.2" stroke="#d946ef" stroke-width="1.5"/>
            <text x="185" y="45" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">15-MIN</text>
            <text x="182" y="62" fill="#f472b6" font-family="sans-serif" font-size="11" font-weight="bold">BLUEPRINT</text>
          </g>
        </g>
      </g>

      <!-- Floating 3D Nodes & Badges around UI -->
      <g transform="translate(320, -20)" filter="url(#glow-cyan)">
        <polygon points="30,0 60,20 60,60 30,80 0,60 0,20" fill="#06b6d4" fill-opacity="0.8" stroke="#38bdf8" stroke-width="2"/>
        <text x="18" y="45" fill="#030712" font-family="sans-serif" font-weight="900" font-size="18">AI</text>
      </g>

      <g transform="translate(-30, 280)" filter="url(#glow-fuchsia)">
        <circle cx="25" cy="25" r="25" fill="#d946ef" fill-opacity="0.85" stroke="#f472b6" stroke-width="2"/>
        <text x="13" y="31" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="14">9:16</text>
      </g>
    </g>
  </g>

  <!-- ==================== LEFT SIDE: TYPOGRAPHY & ARCHITECTURAL DOSSIER ==================== -->
  <g transform="translate(80, 80)">
    
    <!-- Top Pill Badge: HELIATECH ARCHITECTURAL DOSSIER -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="18" cy="17" r="4" fill="#06b6d4" filter="url(#glow-cyan)"/>
      <text x="35" y="22" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1.5">HELIATECH ARCHITECTURAL DOSSIER</text>
    </g>

    <!-- Main Title: KLAP -->
    <g transform="translate(0, 80)">
      <!-- Drop shadow / 3D extrusion effect for KLAP -->
      <text x="6" y="76" fill="#8b5cf6" fill-opacity="0.3" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="84" letter-spacing="8">KLAP</text>
      <text x="3" y="73" fill="#06b6d4" fill-opacity="0.4" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="84" letter-spacing="8">KLAP</text>
      <text x="0" y="70" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="84" letter-spacing="8" filter="url(#glow-cyan)">KLAP</text>
    </g>

    <!-- Category Subtitle -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="140" height="26" rx="6" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
      <text x="12" y="17" fill="#c084fc" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2">AI VIDEO</text>
    </g>

    <!-- Investigation Headline -->
    <g transform="translate(0, 205)">
      <text x="0" y="0" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="0.5">
        <tspan x="0" dy="0">The AI Video Revolution and the</tspan>
        <tspan x="0" dy="38" fill="url(#fuchsia-cyan)">15-Minute Blueprint to Scaling</tspan>
        <tspan x="0" dy="38">Viral Shorts</tspan>
      </text>
    </g>

    <!-- Metadata Footer / Author / Stats -->
    <g transform="translate(0, 360)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#1e293b" stroke-width="1.5"/>
      
      <!-- Stat 1 -->
      <g transform="translate(0, 20)">
        <text x="0" y="0" fill="#06b6d4" font-family="monospace" font-size="20" font-weight="bold">10x</text>
        <text x="0" y="18" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">OUTPUT VELOCITY</text>
      </g>

      <!-- Divider 1 -->
      <line x1="140" y1="10" x2="140" y2="30" stroke="#1e293b" stroke-width="1"/>

      <!-- Stat 2 -->
      <g transform="translate(170, 20)">
        <text x="0" y="0" fill="#d946ef" font-family="monospace" font-size="20" font-weight="bold">99.2%</text>
        <text x="0" y="18" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">VIRALITY PRECISION</text>
      </g>

      <!-- Divider 2 -->
      <line x1="310" y1="10" x2="310" y2="30" stroke="#1e293b" stroke-width="1"/>

      <!-- Domain Indicator -->
      <g transform="translate(340, 18)">
        <rect x="0" y="0" width="130" height="24" rx="12" fill="#06b6d4" fill-opacity="0.1" stroke="#06b6d4" stroke-width="0.75"/>
        <circle cx="12" cy="12" r="3" fill="#38bdf8"/>
        <text x="24" y="16" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">heliatech.online</text>
      </g>
    </g>

  </g>

  <!-- Corner Accents & Framing Details -->
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4">
    <!-- Top Left -->
    <path d="M 20 40 L 20 20 L 40 20"/>
    <!-- Top Right -->
    <path d="M 1180 40 L 1180 20 L 1160 20"/>
    <!-- Bottom Left -->
    <path d="M 20 590 L 20 610 L 40 610"/>
    <!-- Bottom Right -->
    <path d="M 1180 590 L 1180 610 L 1160 610"/>
  </g>
</svg>