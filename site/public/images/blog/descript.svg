        <rect x="456" y="10" width="4" height="60" rx="2"/>
        <rect x="464" y="25" width="4" height="30" rx="2"/>
        <rect x="472" y="15" width="4" height="50" rx="2"/>
      </g>

      <!-- Playhead Scrub Line -->
      <line x1="216" y1="10" x2="216" y2="135" stroke="#d946ef" stroke-width="2" filter="url(#glow-heavy)"/>
      <polygon points="211,10 221,10 216,16" fill="#d946ef"/>
    </g>

    <!-- Bottom Status Bar inside Panel -->
    <g transform="translate(30, 420)">
      <circle cx="8" cy="10" r="3" fill="#10b981"/>
      <text x="20" y="14" font-family="monospace" font-size="11" fill="#10b981">STUDIO SOUND ENHANCEMENT: ACTIVE</text>
      
      <text x="490" y="14" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="end">1080P // 60FPS // AI SYNC</text>
    </g>
