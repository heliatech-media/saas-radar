<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-gradient" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Ambient Glows -->
    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="violet-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="fuchsia-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for UI & Vectors -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="violet-fuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="panel-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="node-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow and Shadows -->
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg-gradient)" />
  <rect width="1200" height="630" fill="url(#cyber-grid)" />

  <!-- Ambient Lighting Orbs -->
  <circle cx="150" cy="150" r="300" fill="url(#cyan-glow)" />
  <circle cx="1050" cy="100" r="350" fill="url(#violet-glow)" />
  <circle cx="950" cy="500" r="280" fill="url(#fuchsia-glow)" />

  <!-- TOP PILL BADGE -->
  <g transform="translate(80, 60)" filter="url(#glow-subtle)">
    <rect width="320" height="32" rx="16" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#38bdf8">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- MAIN TITLE & CATEGORY -->
  <g transform="translate(80, 135)">
    <text x="0" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="url(#text-grad)" letter-spacing="-1" filter="url(#drop-shadow)">DESCRIPT</text>
    <text x="275" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="300" fill="#d946ef" letter-spacing="-0.5" filter="url(#glow-subtle)">:</text>
    <text x="295" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#94a3b8" letter-spacing="1">AUDIO &amp; PODCASTING REVOLUTION</text>
  </g>

  <!-- INVESTIGATION SUBTITLE -->
  <g transform="translate(80, 195)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#64748b" letter-spacing="0.5">The Text-Document Revolution in Media Editing and the Enterprise Blueprint for 2026</text>
  </g>

  <!-- TECHNICAL 3D VISUALIZATION ENGINE (RIGHT & CENTRAL COMPOSITION) -->
  <g transform="translate(620, 160)" filter="url(#drop-shadow)">
    
    <!-- Base Holographic Platform / Isometric Grid Plane -->
    <path d="M -80 320 L 260 410 L 520 230 L 180 140 Z" fill="#0f172a" fill-opacity="0.6" stroke="#1e293b" stroke-width="2" />
    <path d="M 40 350 L 380 270" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <path d="M 120 370 L 460 290" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3" />

    <!-- Connection Beams (Data Flow to UI) -->
    <path d="M 80 120 L 220 60" stroke="url(#cyan-blue)" stroke-width="3" filter="url(#glow-subtle)" />
    <path d="M 280 80 L 380 140" stroke="url(#violet-fuchsia)" stroke-width="3" filter="url(#glow-subtle)" />
    <path d="M 150 250 L 80 120" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.6" />

    <!-- 3D Holographic Audio Waveform / Vector Neural Nodes -->
    <g transform="translate(40, 220)">
      <!-- Waveform Bars projecting upwards in 3D perspective -->
      <g stroke-linecap="round" stroke-width="6">
        <line x1="0" y1="40" x2="0" y2="-10" stroke="#06b6d4" opacity="0.4"/>
        <line x1="20" y1="50" x2="20" y2="-40" stroke="#06b6d4" opacity="0.7"/>
        <line x1="40" y1="60" x2="40" y2="-90" stroke="url(#cyan-blue)" filter="url(#glow-subtle)"/>
        <line x1="60" y1="50" x2="60" y2="-120" stroke="url(#cyan-blue)" filter="url(#glow-heavy)"/>
        <line x1="80" y1="40" x2="80" y2="-70" stroke="#38bdf8"/>
        <line x1="100" y1="30" x2="100" y2="-140" stroke="url(#violet-fuchsia)" filter="url(#glow-heavy)"/>
        <line x1="120" y1="20" x2="120" y2="-100" stroke="#8b5cf6" filter="url(#glow-subtle)"/>
        <line x1="140" y1="10" x2="140" y2="-60" stroke="#d946ef"/>
        <line x1="160" y1="0" x2="160" y2="-30" stroke="#d946ef" opacity="0.5"/>
      </g>
      <!-- Connecting Energy Envelope Curve -->
      <path d="M 0 -10 Q 40 -130 100 -140 T 160 -30" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7" filter="url(#glow-subtle)" />
    </g>

    <!-- Floating Enterprise Blueprint Panel (The Text-Document Interface) -->
    <g transform="translate(130, -20)">
      <!-- Glassmorphism Panel Background -->
      <rect width="360" height="240" rx="16" fill="url(#panel-bg)" stroke="#334155" stroke-width="2" filter="url(#drop-shadow)" />
      
      <!-- Panel Header Bar -->
      <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 344 0 C 352.84 0 360 7.16 360 16 L 360 40 L 0 40 Z" fill="#090d16" />
      <circle cx="20" cy="20" r="5" fill="#ef4444" />
      <circle cx="38" cy="20" r="5" fill="#f59e0b" />
      <circle cx="56" cy="20" r="5" fill="#10b981" />
      
      <text x="80" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">DESCRIPT_CORE_ENGINE.tsx</text>
      
      <path d="M 0 40 L 360 40" stroke="#334155" stroke-width="1" />

      <!-- Document Text Editor Interface Mockup (Text-to-Edit Metaphor) -->
      <g transform="translate(24, 60)">
        <!-- Highlighted / Edited Text Row -->
        <rect x="-8" y="-4" width="220" height="22" rx="4" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4" />
        <text x="0" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">&gt; Overdub Neural Synthesis Active</text>

        <!-- Standard Document Lines -->
        <g transform="translate(0, 35)">
          <rect x="0" y="0" width="240" height="8" rx="4" fill="#334155" fill-opacity="0.8" />
          <rect x="0" y="18" width="180" height="8" rx="4" fill="#334155" fill-opacity="0.6" />
          <rect x="0" y="36" width="210" height="8" rx="4" fill="#334155" fill-opacity="0.7" />
        </g>

        <!-- Active Studio Timeline Marker -->
        <g transform="translate(0, 105)">
          <line x1="0" y1="0" x2="280" y2="0" stroke="#1e293b" stroke-width="2" />
          <line x1="95" y1="-8" x2="95" y2="8" stroke="#d946ef" stroke-width="2" filter="url(#glow-subtle)" />
          <circle cx="95" cy="0" r="4" fill="#d946ef" filter="url(#glow-heavy)" />
          
          <!-- Mini Waveform inside panel -->
          <path d="M 0 25 Q 25 15 50 25 T 100 25 T 150 25 T 200 25 T 250 25" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.8" />
        </g>
      </g>
    </g>

    <!-- Floating Holographic Data Node (Top Left) -->
    <g transform="translate(20, 20)" filter="url(#glow-subtle)">
      <polygon points="40,0 80,23 80,68 40,92 0,68 0,23" fill="#090d16" stroke="url(#cyan-blue)" stroke-width="2" fill-opacity="0.9"/>
      <circle cx="40" cy="46" r="12" fill="#06b6d4" fill-opacity="0.4" />
      <circle cx="40" cy="46" r="5" fill="#38bdf8" filter="url(#glow-heavy)" />
    </g>

    <!-- Floating Holographic Data Node (Bottom Right) -->
    <g transform="translate(380, 280)" filter="url(#glow-subtle)">
      <polygon points="30,0 60,17 60,52 30,69 0,52 0,17" fill="#090d16" stroke="url(#violet-fuchsia)" stroke-width="2" fill-opacity="0.9"/>
      <circle cx="30" cy="34" r="10" fill="#8b5cf6" fill-opacity="0.4" />
      <circle cx="30" cy="34" r="4" fill="#d946ef" filter="url(#glow-heavy)" />
    </g>

    <!-- Floating Connection Nodes / Sparkles -->
    <circle cx="210" cy="110" r="3" fill="#38bdf8" filter="url(#glow-heavy)" />
    <circle cx="320" cy="180" r="4" fill="#d946ef" filter="url(#glow-heavy)" />
    <circle cx="110" cy="270" r="3" fill="#06b6d4" filter="url(#glow-heavy)" />
  </g>

  <!-- BOTTOM ENTERPRISE METADATA BAR -->
  <g transform="translate(80, 550)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Stat Item 1 -->
    <g transform="translate(0, 20)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#38bdf8">10x</text>
      <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">EDITING VELOCITY</text>
    </g>

    <!-- Stat Item 2 -->
    <g transform="translate(180, 20)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#8b5cf6">AI</text>
      <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">NEURAL OVERDUB</text>
    </g>

    <!-- Stat Item 3 -->
    <g transform="translate(360, 20)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#d946ef">2026</text>
      <text x="0" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.5">ENTERPRISE READY</text>
    </g>

    <!-- Branding Signature / Domain Tag -->
    <g transform="translate(860, 15)">
      <rect width="180" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="90" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="1">HELIATECH.ONLINE</text>
    </g>
  </g>
</svg>