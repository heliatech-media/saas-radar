<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Neon & Metallic Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    
    <linearGradient id="fuchsiaViolet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Ambient Glow Filters -->
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur1"/>
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glass-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="matrixGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <rect width="1200" height="630" fill="url(#matrixGrid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="150" r="250" fill="#8b5cf6" opacity="0.12" filter="url(#glow-heavy)"/>
  <circle cx="750" cy="450" r="280" fill="#06b6d4" opacity="0.10" filter="url(#glow-heavy)"/>
  <circle cx="200" cy="500" r="200" fill="#d946ef" opacity="0.08" filter="url(#glow-heavy)"/>

  <!-- Geometric Accent Lines (Abstract Vector Network) -->
  <g opacity="0.3" stroke="url(#cyanPurple)" stroke-width="1.5" fill="none">
    <path d="M 0 100 L 350 100 L 450 180 L 1200 180" />
    <path d="M 150 0 L 150 250 L 250 350 L 250 630" stroke-opacity="0.15"/>
    <path d="M 850 630 L 850 480 L 950 380 L 1200 380" stroke-opacity="0.2"/>
  </g>

  <!-- ==================== LEFT COLUMN: TYPOGRAPHY & DOSSIER ==================== -->
  
  <!-- Top Pill Badge -->
  <g transform="translate(80, 70)" filter="url(#glow-subtle)">
    <rect x="0" y="0" width="310" height="32" rx="16" fill="#090d16" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="18" cy="16" r="4" fill="#06b6d4">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#38bdf8">
      HELIATECH ARCHITECTURAL DOSSIER
    </text>
  </g>

  <!-- Main Titles -->
  <g transform="translate(80, 140)">
    <!-- Category Subtitle -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#d946ef" filter="url(#glow-subtle)">
      AUDIO &amp; VIDEO PODCASTING REVOLUTION
    </text>

    <!-- Tool Title: DESCRIPT -->
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="1" fill="url(#textGrad)" filter="url(#glow-subtle)">
      DESCRIPT
    </text>

    <!-- Investigation Headline -->
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">
      The Word-Processor Video Revolution &amp; the
    </text>
    <text x="0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#38bdf8">
      15-Minute Enterprise Workflow Blueprint
    </text>

    <!-- Architectural Metadata / Stats -->
    <g transform="translate(0, 185)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="130" height="50" rx="8" fill="#0b1329" stroke="#38bdf8" stroke-opacity="0.3"/>
      <text x="15" y="20" font-family="monospace" font-size="10" fill="#94a3b8">LATENCY REDUCTION</text>
      <text x="15" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#06b6d4">-88% TIME</text>

      <!-- Metric 2 -->
      <rect x="145" y="0" width="130" height="50" rx="8" fill="#0b1329" stroke="#8b5cf6" stroke-opacity="0.3"/>
      <text x="160" y="20" font-family="monospace" font-size="10" fill="#94a3b8">PARADIGM SHIFT</text>
      <text x="160" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#d946ef">TEXT-TO-EDIT</text>

      <!-- Metric 3 -->
      <rect x="290" y="0" width="130" height="50" rx="8" fill="#0b1329" stroke="#d946ef" stroke-opacity="0.3"/>
      <text x="305" y="20" font-family="monospace" font-size="10" fill="#94a3b8">ENTERPRISE SCALE</text>
      <text x="305" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#38bdf8">15-MIN PIPELINE</text>
    </g>
  </g>


  <!-- ==================== RIGHT COLUMN: 3D VECTOR DOMAIN METAPHOR ==================== -->
  <!-- Holographic Audio Waveform / Word-Processor Timeline Interface -->
  <g transform="translate(560, 80)" filter="url(#glass-shadow)">
    
    <!-- Main Glass Container Panel -->
    <rect x="0" y="0" width="580" height="470" rx="16" fill="url(#glassGrad)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5"/>
    
    <!-- Window Header / Controls -->
    <path d="M 0 44 L 580 44" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1"/>
    <circle cx="24" cy="22" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="44" cy="22" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="64" cy="22" r="6" fill="#10b981" opacity="0.8"/>
    <text x="290" y="26" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="1">DESCRIPT_ENGINE_v4.8 // CORE_TIMELINE</text>

    <!-- INTERFACE CONTENT: Text Editing / Word Processor Track -->
    <g transform="translate(30, 75)">
      <!-- Row 1: Active Transcript Editing -->
      <rect x="0" y="0" width="520" height="44" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="16" cy="22" r="4" fill="#06b6d4" filter="url(#glow-subtle)"/>
      <text x="32" y="26" font-family="monospace" font-size="12" fill="#e2e8f0">
        <tspan fill="#38bdf8" font-weight="bold">00:01:24</tspan>  Welcome to the <tspan fill="#d946ef">word-processor</tspan> video revolution.
      </text>
      <!-- Edit cursor -->
      <rect x="365" y="14" width="2" height="16" fill="#06b6d4">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <g transform="translate(30, 130)">
      <!-- Row 2: Deleted Filler Word (Strikethrough / AI Cleaned) -->
      <rect x="0" y="0" width="520" height="36" rx="6" fill="#0b0f19" fill-opacity="0.5" stroke="#ffffff" stroke-opacity="0.05"/>
      <text x="32" y="22" font-family="monospace" font-size="12" fill="#64748b">
        <tspan fill="#64748b">00:01:31</tspan>  And <tspan text-decoration="line-through" fill="#ef4444">um, y'know,</tspan> we optimized the enterprise workflow...
      </text>
    </g>

    <g transform="translate(30, 178)">
      <!-- Row 3: Overdub / Voice Cloning Node -->
      <rect x="0" y="0" width="520" height="40" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1"/>
      <circle cx="16" cy="20" r="4" fill="#8b5cf6" filter="url(#glow-subtle)"/>
      <text x="32" y="25" font-family="monospace" font-size="12" fill="#e2e8f0">
        <tspan fill="#8b5cf6" font-weight="bold">[AI OVERDUB]</tspan> Q4 metrics scale instantly across all channels.
      </text>
    </g>

    <!-- 3D HOLOGRAPHIC AUDIO WAVEFORM ENVELOPE -->
    <g transform="translate(30, 245)">
      <!-- Waveform Background Box -->
      <rect x="0" y="0" width="520" height="150" rx="10" fill="#050811" fill-opacity="0.9" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1"/>
      <text x="16" y="24" font-family="monospace" font-size="10" fill="#38bdf8" letter-spacing="1">NEURAL_VOICE_ENVELOPE &amp; MULTITRACK VECTOR RENDER</text>

      <!-- Grid lines inside waveform -->
      <line x1="16" y1="50" x2="504" y2="50" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="4 4"/>
      <line x1="16" y1="85" x2="504" y2="85" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="4 4"/>
      <line x1="16" y1="120" x2="504" y2="120" stroke="#ffffff" stroke-opacity="0.05" stroke-dasharray="4 4"/>

      <!-- Dynamic Audio Waveform Bars (Complex SVG Path & Rectangles) -->
      <g transform="translate(16, 40)" fill="url(#cyanPurple)" filter="url(#glow-subtle)">
        <rect x="0" y="20" width="4" height="40" rx="2"/>
        <rect x="8" y="10" width="4" height="60" rx="2"/>
        <rect x="16" y="25" width="4" height="30" rx="2"/>
        <rect x="24" y="5" width="4" height="70" rx="2"/>
        <rect x="32" y="15" width="4" height="50" rx="2"/>
        <rect x="40" y="30" width="4" height="20" rx="2"/>
        <rect x="48" y="8" width="4" height="64" rx="2"/>
        <rect x="56" y="18" width="4" height="44" rx="2"/>
        <rect x="64" y="0" width="4" height="80" rx="2" fill="#d946ef"/>
        <rect x="72" y="12" width="4" height="56" rx="2" fill="#d946ef"/>
        <rect x="80" y="22" width="4" height="36" rx="2"/>
        <rect x="88" y="15" width="4" height="50" rx="2"/>
        <rect x="96" y="28" width="4" height="24" rx="2"/>
        <rect x="104" y="10" width="4" height="60" rx="2"/>
        <rect x="112" y="5" width="4" height="70" rx="2"/>
        <rect x="120" y="20" width="4" height="40" rx="2"/>
        <rect x="128" y="14" width="4" height="52" rx="2"/>
        <rect x="136" y="25" width="4" height="30" rx="2"/>
        <rect x="144" y="8" width="4" height="64" rx="2"/>
        <rect x="152" y="18" width="4" height="44" rx="2"/>
        <rect x="160" y="12" width="4" height="56" rx="2"/>
        <rect x="168" y="22" width="4" height="36" rx="2"/>
        <rect x="176" y="0" width="4" height="80" rx="2" fill="#38bdf8"/>
        <rect x="184" y="15" width="4" height="50" rx="2" fill="#38bdf8"/>
        <rect x="192" y="25" width="4" height="30" rx="2"/>
        <rect x="200" y="10" width="4" height="60" rx="2"/>
        <rect x="208" y="5" width="4" height="70" rx="2"/>
        <rect x="216" y="20" width="4" height="40" rx="2"/>
        <rect x="224" y="12" width="4" height="56" rx="2"/>
        <rect x="232" y="28" width="4" height="24" rx="2"/>
        <rect x="240" y="18" width="4" height="44" rx="2"/>
        <rect x="248" y="8" width="4" height="64" rx="2"/>
        <rect x="256" y="22" width="4" height="36" rx="2"/>
        <rect x="264" y="14" width="4" height="52" rx="2"/>
        <rect x="272" y="25" width="4" height="30" rx="2"/>
        <rect x="280" y="5" width="4" height="70" rx="2" fill="#d946ef"/>
        <rect x="288" y="15" width="4" height="50" rx="2" fill="#d946ef"/>
        <rect x="296" y="20" width="4" height="40" rx="2"/>
        <rect x="304" y="10" width="4" height="60" rx="2"/>
        <rect x="312" y="25" width="4" height="30" rx="2"/>
        <rect x="320" y="12" width="4" height="56" rx="2"/>
        <rect x="328" y="18" width="4" height="44" rx="2"/>
        <rect x="336" y="8" width="4" height="64" rx="2"/>
        <rect x="344" y="22" width="4" height="36" rx="2"/>
        <rect x="352" y="14" width="4" height="52" rx="2"/>
        <rect x="360" y="0" width="4" height="80" rx="2"/>
        <rect x="368" y="15" width="4" height="50" rx="2"/>
        <rect x="376" y="25" width="4" height="30" rx="2"/>
        <rect x="384" y="10" width="4" height="60" rx="2"/>
        <rect x="392" y="5" width="4" height="70" rx="2"/>
        <rect x="400" y="20" width="4" height="40" rx="2"/>
        <rect x="408" y="14" width="4" height="52" rx="2"/>
        <rect x="416" y="25" width="4" height="30" rx="2"/>
        <rect x="424" y="8" width="4" height="64" rx="2"/>
        <rect x="432" y="18" width="4" height="44" rx="2"/>
