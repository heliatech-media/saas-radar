<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background & Base Gradients -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="70%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="fuchsia-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow & Blur Filters -->
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>

    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#dots)" />

  <!-- Ambient Light Orbs -->
  <circle cx="950" cy="150" r="220" fill="#8b5cf6" opacity="0.12" filter="url(#glow-heavy)" />
  <circle cx="750" cy="450" r="280" fill="#06b6d4" opacity="0.10" filter="url(#glow-heavy)" />
  <circle cx="200" cy="500" r="200" fill="#d946ef" opacity="0.08" filter="url(#glow-heavy)" />

  <!-- Architectural Grid Perspective Plane (Bottom Right) -->
  <g opacity="0.25" transform="translate(600, 200)">
    <path d="M -100 350 L 500 150 M -100 380 L 500 180 M -100 410 L 500 210 M -100 440 L 500 240" stroke="#38bdf8" stroke-width="1" />
    <path d="M 0 100 L 0 450 M 100 120 L 150 420 M 200 140 L 300 390 M 300 160 L 450 360" stroke="#8b5cf6" stroke-width="1" />
  </g>

  <!-- ==================== LEFT COLUMN: TYPOGRAPHY & BRANDING ==================== -->
  
  <!-- Floating Top Pill Badge -->
  <g transform="translate(80, 75)" filter="url(#glow-subtle)">
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="20" cy="17" r="4" fill="#06b6d4">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2">HELIATECH ARCHITECTURAL DOSSIER</text>
  </g>

  <!-- Main Titles -->
  <g transform="translate(80, 150)">
    <!-- Category Subtitle -->
    <text x="0" y="0" fill="#d946ef" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="4">AUDIO / PODCASTING ECOSYSTEM</text>
    
    <!-- Tool Title: DESCRIPT -->
    <text x="0" y="65" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">DESCRIPT</text>
    <text x="352" y="65" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900">.</text>

    <!-- Investigation Headline -->
    <text x="0" y="115" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">The Text-Based Editing Revolution and the</text>
    <text x="0" y="145" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" letter-spacing="0.5">Hands-on Guide to Media Production Velocity</text>
  </g>

  <!-- Feature Metric Pills -->
  <g transform="translate(80, 335)">
    <!-- Metric 1 -->
    <g transform="translate(0, 0)">
      <rect width="135" height="70" rx="12" fill="url(#card-grad)" stroke="#1e293b" stroke-width="2" />
      <text x="16" y="28" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">10x</text>
      <text x="16" y="50" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Velocity Gain</text>
    </g>
    <!-- Metric 2 -->
    <g transform="translate(150, 0)">
      <rect width="135" height="70" rx="12" fill="url(#card-grad)" stroke="#1e293b" stroke-width="2" />
      <text x="16" y="28" fill="#d946ef" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">AI 2.0</text>
      <text x="16" y="50" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Voice Synthesis</text>
    </g>
    <!-- Metric 3 -->
    <g transform="translate(300, 0)">
      <rect width="135" height="70" rx="12" fill="url(#card-grad)" stroke="#1e293b" stroke-width="2" />
      <text x="16" y="28" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">DOM</text>
      <text x="16" y="50" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Text Editing</text>
    </g>
  </g>

  <!-- Author / System Meta Footer -->
  <g transform="translate(80, 545)">
    <line x1="0" y1="0" x2="435" y2="0" stroke="#1e293b" stroke-width="2" />
    <circle cx="8" cy="20" r="3" fill="#38bdf8" />
    <text x="20" y="24" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">VERIFIED ARCHITECTURAL BENCHMARK</text>
    <text x="360" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">HELIATECH.ONLINE</text>
  </g>


  <!-- ==================== RIGHT COLUMN: 3D VECTOR ILLUSTRATION ==================== -->
  <g transform="translate(580, 70)">

    <!-- Holographic 3D Audio Waveform Back-glow -->
    <path d="M 50 180 Q 150 80, 250 180 T 450 180" fill="none" stroke="#8b5cf6" stroke-width="6" opacity="0.3" filter="url(#glow-heavy)" />
    <path d="M 50 240 Q 150 340, 250 240 T 450 240" fill="none" stroke="#06b6d4" stroke-width="6" opacity="0.3" filter="url(#glow-heavy)" />

    <!-- Main Floating Holographic Container / IDE Window -->
    <g filter="url(#glow-heavy)">
      <rect x="30" y="40" width="500" height="420" rx="16" fill="#090d16" fill-opacity="0.9" stroke="url(#cyan-violet)" stroke-width="2" />
    </g>

    <!-- Window Header Bar -->
    <g transform="translate(30, 40)">
      <rect x="0" y="0" width="500" height="40" rx="16" fill="#0f172a" />
      <rect x="0" y="24" width="500" height="16" fill="#0f172a" />
      <!-- Window Controls -->
      <circle cx="24" cy="20" r="6" fill="#ef4444" opacity="0.8" />
      <circle cx="44" cy="20" r="6" fill="#f59e0b" opacity="0.8" />
      <circle cx="64" cy="20" r="6" fill="#10b981" opacity="0.8" />
      <!-- Title Badge in Window -->
      <text x="250" y="24" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1">descript_neural_render.engine</text>
    </g>

    <!-- IDE / Text-Based Editing Split Interface -->
    <g transform="translate(50, 110)">
      
      <!-- Left Panel: Text Stream (The Text-Based Editing Metaphor) -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="220" height="320" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1.5" />
        
        <!-- Text line highlights -->
        <rect x="15" y="20" width="140" height="10" rx="3" fill="#38bdf8" opacity="0.9" />
        <rect x="15" y="40" width="180" height="8" rx="2" fill="#64748b" opacity="0.5" />
        <rect x="15" y="58" width="110" height="8" rx="2" fill="#64748b" opacity="0.5" />
        
        <!-- Deleted / Strikethrough edit simulation -->
        <g transform="translate(15, 80)">
          <rect x="0" y="0" width="165" height="18" rx="4" fill="#d946ef" fill-opacity="0.2" />
          <line x1="10" y1="9" x2="155" y2="9" stroke="#d946ef" stroke-width="2" />
          <text x="10" y="13" fill="#d946ef" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">uhh, you know, basically...</text>
        </g>

        <!-- Inserted Active Text -->
        <g transform="translate(15, 110)">
          <rect x="0" y="0" width="190" height="22" rx="4" fill="#06b6d4" fill-opacity="0.25" stroke="#06b6d4" stroke-width="1" />
          <circle cx="10" cy="11" r="3" fill="#06b6d4" />
          <text x="22" y="15" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">Enterprise AI Synthesis</text>
        </g>

        <rect x="15" y="148" width="150" height="8" rx="2" fill="#64748b" opacity="0.5" />
        <rect x="15" y="166" width="130" height="8" rx="2" fill="#64748b" opacity="0.5" />

        <!-- Cursor Indicator -->
        <g transform="translate(15, 190)">
          <rect x="0" y="0" width="8" height="14" fill="#06b6d4">
            <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
          </rect>
          <text x="14" y="11" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Overdub active...</text>
        </g>

        <!-- Mini Node Connection in Text box -->
        <path d="M 200 240 L 235 240" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="3,3" />
      </g>

      <!-- Right Panel: Holographic 3D Audio Waveform & Neural Timeline -->
      <g transform="translate(240, 0)">
        <rect x="0" y="0" width="220" height="320" rx="8" fill="#030712" stroke="#1e293b" stroke-width="1.5" />

        <!-- Vector Neural Timeline Grid Lines -->
        <line x1="0" y1="80" x2="220" y2="80" stroke="#1e293b" stroke-width="1" />
        <line x1="0" y1="160" x2="220" y2="160" stroke="#1e293b" stroke-width="1" />
        <line x1="0" y1="240" x2="220" y2="240" stroke="#1e293b" stroke-width="1" />

        <!-- 3D Sound Energy Waveform Bars -->
        <g transform="translate(20, 160)">
          <!-- Dynamic Audio Bars -->
          <rect x="0" y="-40" width="6" height="80" rx="3" fill="url(#cyan-violet)" filter="url(#glow-subtle)" />
          <rect x="12" y="-70" width="6" height="140" rx="3" fill="url(#cyan-violet)" filter="url(#glow-subtle)" />
          <rect x="24" y="-30" width="6" height="60" rx="3" fill="#06b6d4" />
          <rect x="36" y="-90" width="6" height="180" rx="3" fill="url(#fuchsia-cyan)" filter="url(#glow-heavy)" />
          <rect x="48" y="-110" width="6" height="220" rx="3" fill="url(#cyan-violet)" filter="url(#glow-heavy)" />
          <rect x="60" y="-60" width="6" height="120" rx="3" fill="#38bdf8" />
          <rect x="72" y="-20" width="6" height="40" rx="3" fill="#64748b" />
          <rect x="84" y="-80" width="6" height="160" rx="3" fill="url(#cyan-violet)" />
          <rect x="96" y="-100" width="6" height="200" rx="3" fill="url(#fuchsia-cyan)" filter="url(#glow-heavy)" />
          <rect x="108" y="-50" width="6" height="100" rx="3" fill="#06b6d4" />
          <rect x="120" y="-30" width="6" height="60" rx="3" fill="#38bdf8" />
          <rect x="132" y="-75" width="6" height="150" rx="3" fill="url(#cyan-violet)" />
          <rect x="144" y="-40" width="6" height="80" rx="3" fill="#64748b" />
        </g>

        <!-- Playhead / Scrubber Line -->
        <g transform="translate(125, 0)">
          <line x1="0" y1="0" x2="0" y2="320" stroke="#d946ef" stroke-width="2" filter="url(#glow-subtle)" />
          <polygon points="-5,0 5,0 0,8" fill="#d946ef" />
        </g>

        <!-- Floating AI Vector Embedding Node -->
        <g transform="translate(140, 40)" filter="url(#glow-subtle)">
          <rect x="0" y="0" width="65" height="24" rx="6" fill="#8b5cf6" fill-opacity="0.8" />
          <text x="32.5" y="16" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">AI SYNC</text>
        </g>
      </g>
    </g>

    <!-- Floating Holographic Control Elements (Overlapping outside the window) -->
    <!-- Node Badge 1 -->
    <g transform="translate(10, 220)" filter="url(#glow-subtle)">
      <rect width="130" height="38" rx="8" fill="#090d16" fill-opacity="0.9" stroke="#06b6d4" stroke-width="1.5" />
      <circle cx="18" cy="19" r="5" fill="#06b6d4" />
      <text x="32" y="17" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">Studio Sound</text>
      <text x="32" y="30" fill="#06b6d4" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">99.8% Clarity</text>
    </g>

    <!-- Node Badge 2 -->
    <g transform="translate(420, 360)" filter="url(#glow-subtle)">
      <rect width="140" height="38" rx="8" fill="#090d16" fill-opacity="0.9" stroke="#d946ef" stroke-width="1.5" />
      <circle cx="18" cy="19" r="5" fill="#d946ef" />
      <text x="32" y="17" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">Voice Cloning</text>
      <text x="32" y="30" fill="#d946ef" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Neural Render</text>
    </g>

    <!-- Connecting Vector Paths / Flow Lines -->
    <path d="M 140 239 C 180 239, 190 200, 230 200" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7" />
    <path d="M 390 320 C 410 350, 400 360, 420 375" fill="none" stroke="#d946ef" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7" />

  </g>

</svg>