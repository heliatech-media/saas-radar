  <!-- Floating Vector Nodes / Badges connecting elements -->
  <g transform="translate(500, 260)" filter="url(#glow-subtle)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#090d16" stroke="#d946ef" stroke-width="1.5"/>
    <path d="M 14 22 L 22 30 L 30 14" fill="none" stroke="#d946ef" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Footer Branding -->
  <text x="80" y="590" font-family="monospace" font-size="11" fill="#64748b" letter-spacing="1.5">
    HELIATECH ENTERPRISE INTELLIGENCE // SECURE RESEARCH DIVISION
  </text>
  <text x="1120" y="590" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="end" letter-spacing="1">
